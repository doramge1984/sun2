hor=\"middle\" font-family=\"inherit\">지도</text><text x=\"750\" y=\"396\" font-size=\"26\" text-anchor=\"middle\">📷</text><text x=\"750\" y=\"422\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1f2937\" text-anchor=\"middle\" font-family=\"inherit\">렌즈</text><text x=\"830\" y=\"396\" font-size=\"26\" text-anchor=\"middle\">🌐</text><text x=\"830\" y=\"422\" font-size=\"11.5\" font-weight=\"700\" fill=\"#1f2937\" text-anchor=\"middle\" font-family=\"inherit\">번역</text><text x=\"450\" y=\"480\" font-size=\"12\" font-weight=\"500\" fill=\"#6b7280\" text-anchor=\"middle\" font-family=\"inherit\">※ 구글 AI 도구는 자주 바뀝니다. 오늘 수업에서는 Gemini · Deep Research · NotebookLM · 젬·스킬 중심으로 다룹니다.</text><text x=\"450\" y=\"505\" font-size=\"12\" font-weight=\"500\" fill=\"#6b7280\" text-anchor=\"middle\" font-family=\"inherit\">도구 이름과 구성은 시점에 따라 달라질 수 있습니다.</text></svg></div></details></div></div><div class=\"block open\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">준비</span><span class=\"block-t\">먼저 — 내 이메일 등록하기</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"padding:16px 22px 14px\"><p class=\"item-lead\">이후 실습에서 <b>내 메일로 보내 보고</b>, 나중에 <b>코덱스에 등록</b>할 때도 이 주소를 씁니다. 아래 시트에 <b>이름</b>과 <b>이메일(구글 계정으로 쓰는 주소)</b>을 한 줄에 적어 주세요.</p><ul class=\"block-ul\"><li>다른 사람 줄은 <b>고치거나 지우지 마세요.</b> 비어 있는 <b>다음 줄</b>에 적습니다.</li><li>주소를 <b>정확하게</b> 적어 주세요. 오타가 있으면 코덱스 등록이 안 됩니다.</li></ul><p style=\"margin:10px 0\"><a href=\"https://docs.google.com/spreadsheets/d/1QOYwGKB8Ojg5ML1yEvmeSykZ2ikEmdKB3BOKY9naklE/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;background:#15665D;color:#fff;text-decoration:none;border-radius:99px;padding:10px 22px;font-weight:700\">📝 이메일 등록 시트 새 창에서 열기 →</a></p><iframe src=\"https://docs.google.com/spreadsheets/d/1QOYwGKB8Ojg5ML1yEvmeSykZ2ikEmdKB3BOKY9naklE/edit?rm=minimal\" loading=\"lazy\" title=\"이메일 등록 시트\" style=\"display:block;width:100%;height:460px;border:1px solid var(--line);border-radius:14px;background:#fff\"></iframe><p style=\"font-size:13px;color:var(--muted);margin:6px 0 0\">시트가 안 보이거나 입력이 안 되면 위 버튼으로 새 창에서 여세요.</p></div></div></div><ul class=\"block-ul\" style=\"padding-left:0;padding-right:0;list-style:none\"><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① Gemini란 무엇인가 — ChatGPT와의 차이 &amp; 멀티모달<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">Gemini는 구글이 만든 대화형 AI 서비스로, ChatGPT와 비슷하지만 <b>구글 생태계와 긴밀하게 연동</b>되는 것이 핵심 차이입니다.</div><div style=\"border:2.5px dotted #C8A951;border-radius:14px;padding:16px 22px;background:rgba(200,169,81,.07);margin:10px 0 14px;line-height:1.7\">쉽게 말해 Gemini는 <b>“구글 워크스페이스 안에 들어와 있는 AI 비서”</b>입니다. 따로 창을 열지 않아도 Gmail, Docs, Sheets 안에서 바로 도움을 받을 수 있습니다.</div><h4>Gemini와 구글 앱의 관계</h4><p class=\"item-lead\">Gemini는 가운데에서 <b>메일·문서·표·발표자료·드라이브·회의</b>를 이어 주는 AI입니다.</p><svg viewBox=\"0 0 640 400\" role=\"img\" aria-label=\"Gemini를 가운데 두고 Gmail, Docs, Sheets, Slides, Drive, Meet이 연결된 그림\" style=\"width:100%;max-width:640px;display:block;margin:12px auto;background:#fff;border:1px solid var(--line);border-radius:14px\"><line x1=\"320\" y1=\"200\" x2=\"320\" y2=\"60\" stroke=\"#9aa7c7\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"320\" y1=\"200\" x2=\"506\" y2=\"130\" stroke=\"#9aa7c7\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"320\" y1=\"200\" x2=\"506\" y2=\"270\" stroke=\"#9aa7c7\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"320\" y1=\"200\" x2=\"320\" y2=\"340\" stroke=\"#9aa7c7\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"320\" y1=\"200\" x2=\"134\" y2=\"270\" stroke=\"#9aa7c7\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><line x1=\"320\" y1=\"200\" x2=\"134\" y2=\"130\" stroke=\"#9aa7c7\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/><circle cx=\"320\" cy=\"200\" r=\"62\" fill=\"#4f6df5\"/><text x=\"320\" y=\"194\" font-size=\"30\" text-anchor=\"midd t-anchor=\"middle\" font-family=\"inherit\">발표자료</text><rect x=\"68\" y=\"238\" width=\"130\" height=\"64\" rx=\"14\" fill=\"#e6e9ff\" stroke=\"#d5dbea\"/><text x=\"93\" y=\"278\" font-size=\"22\" text-anchor=\"middle\">📁</text><text x=\"145.80453818634567\" y=\"268.0\" font-size=\"15\" font-weight=\"800\" fill=\"#1f2937\" text-anchor=\"middle\" font-family=\"inherit\">Drive</text><text x=\"145.80453818634567\" y=\"287.0\" font-size=\"11\" font-weight=\"500\" fill=\"#4b5563\" text-anchor=\"middle\" font-family=\"inherit\">파일 저장·공유</text><rect x=\"68\" y=\"98\" width=\"130\" height=\"64\" rx=\"14\" fill=\"#d9f4ee\" stroke=\"#d5dbea\"/><text x=\"93\" y=\"138\" font-size=\"22\" text-anchor=\"middle\">🎥</text><text x=\"145.8045381863457\" y=\"128.0\" font-size=\"15\" font-weight=\"800\" fill=\"#1f2937\" text-anchor=\"middle\" font-family=\"inherit\">Meet</text><text x=\"145.8045381863457\" y=\"147.0\" font-size=\"11\" font-weight=\"500\" fill=\"#4b5563\" text-anchor=\"middle\" font-family=\"inherit\">회의 요약</text></svg><div class=\"as-wrap\"><table class=\"appstrip\"><thead><tr><th>Google Docs</th><th>Google Sheets</th><th>Google Slides</th><th>Gmail</th><th>Google Drive</th></tr></thead><tbody><tr><td><b>문서 작성</b><span>Word 대체</span></td><td><b>스프레드시트</b><span>Excel 대체</span></td><td><b>프레젠테이션</b><span>PPT 대체</span></td><td><b>이메일</b><span>메일 서비스</span></td><td><b>파일 저장·공유</b><span>내 컴퓨터 폴더 + 공유</span></td></tr></tbody></table></div><br><br><p class=\"item-lead\">크롬 첫 화면 오른쪽 위 <b>점 9개 아이콘(구글 앱)</b>을 누르면 구글 앱이 모여 있습니다. <span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span></p><img class=\"zoomimg\" src=\"images/gemini-apps-menu-2.png\" alt=\"크롬 첫 화면에서 구글 앱 아이콘을 누르면 내 즐겨찾기에 Calendar, Gemini, Notebook, Forms, Docs, Slides, 드라이브, Sheets, Keep 등이 모여 있는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:340px\"><br><br><h4>Gemini의 핵심 특징</h4><div class=\"as-wrap\"><table class=\"appstrip\"><thead><tr><th>멀티모달</th><th>워크스페이스 연동</th><th>Custom Gems</th></tr></thead><tbody><tr><td><b>텍스트 + 이미지 + 문서를 함께 이해</b><span>예시: PDF 업로드해서 분석 요청</span></td><td><b>Docs, Gmail, Sheets 등에서 바로 사용</b><span>예시: Gmail에서 이메일 초안 생성</span></td><td><b>나만의 AI 페르소나 설정</b><span>예시: “이메일 작성 전문가” Gem 만들기</span></td></tr></tbody></table></div><br><br><h4>Gemini가 이해하는 파일 형식</h4><div class=\"as-wrap\"><table class=\"appstrip\"><thead><tr><th>문서</th><th>이미지</th><th>스프레드시트</th><th>영상</th><th>오디오</th></tr></thead><tbody><tr><td><b>PDF, DOCX, TXT</b><span>보고서 요약, 계약서 분석</span></td><td><b>PNG, JPG, GIF</b><span>차트 해석, 손글씨 인식</span></td><td><b>CSV, XLSX</b><span>데이터 분석, 트렌드 파악</span></td><td><b>MP4, YouTube 링크</b><span>영상 요약, 특정 장면 찾기</span></td><td><b>MP3, WAV</b><span>회의 녹음 요약</span></td></tr></tbody></table></div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 접속 방법 &amp; 모드 선택 — 상황에 맞게 골라 쓰기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">Gemini 입력창 오른쪽의 <b>모델(모드) 선택 버튼</b>을 누르면 모드를 고를 수 있습니다. 질문의 성격에 맞게 고르면 속도와 답변의 깊이를 조절할 수 있습니다. <span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span></div><div class=\"warn\">⚠️ <b>Pro/Flash 모델 이용</b> — Flash 및 Pro 이상의 고성능·대규모 추론 모델은 <b>Google One AI 유료 요금제(Advanced 등)</b>를 통해서 이용할 수 있습니다.</div><h4>먼저 알아두기 — Gemini의 3가지 모드</h4><div class=\"xcards\"><div class=\"xc\"><span class=\"xc-n\">⚡ 빠른 모드 (Flash)</span><div class=\"xc-t\">빠른 응답, 간단한 작업</div><div class=\"fc-x\"><b class=\"l\">언제 사용?</b>번역, 간단 요약, 짧은 질문</div></div><div class=\"xc\"><span class=\"xc-n\">🧠 사고 모드 (Thinking)</span><div class=\"xc-t\">깊이 생각, 복잡한 추론</div><div class=\"fc-x\"><b class=\"l\">언제 사용?</b>분석, 계획 수립, 복잡한 문제</div></div><div class=\"xc\"><span class=\"xc-n\">💎 Pro 모드</span><div class=\"xc-t\">최고 성능, 대용량 처리</div><div class=\"fc-x\"><b class=\"l\">언제 사용?</b>긴 문서 분석, 코드 생성</div></div></div><p class=\"item-lead\" style=\"margin-top:14px\">아래 ①~③은 계정에 따라 실제 화면에서 이 모드를 어디서, 어떤 이름으로 고르는지 보여줍니다.</p><h4>① 개인 계정 무료 버전 — 자동 모드 + 깊이 3단계</h4><img class=\"zoomimg\" src=\"images/gemini-personal-free.png\" alt=\"Gemini 개인 계정 무료 버전의 모드 선택 화면 — 자동 모드(Gemini 3 모델)와 최저가, 보통, 최고가 깊이\" onclick=\"openLb(this)\" loading=\"lazy\"><div class=\"rl\"><div class=\"rl-sub\">▸ 모드</div><div class=\"rl-row\"><div class=\"rl-k\">자동 모드</div><div class=\"rl-v\">Gemini 3 모델 (기본 선택)</div></div><div class=\"rl-sub\">▸ 깊이</div><div class=\"rl-row\"><div class=\"rl-k\">최저가</div><div class=\"rl-v\">빠르고 효율적 (기본 선택)</div></div><div class=\"rl-row\"><div class=\"rl-k\">보통</div><div class=\"rl-v\">균형 잡힌 깊이</div></div><div class=\"rl-row\"><div class=\"rl-k\">최고가</div><div class=\"rl-v\">매우 철저함</div></div></div><p style=\"font-size:14px;line-height:1.7;color:#60736C;margin:8px 2px 0\">※ 최근 정책 변경으로 인해 무료 계정에서는 Flash(플래시) 및 Pro(프로) 모델 선택이 제한되며, Gemini 3.5 Flash-Lite 모델로 기본 제공됩니다.</p><br><br><br><h4>② 기관 계정(Google Workspace) 무료 티어 — 3.6 모델이 보이는 경우</h4><div class=\"concept\"><b>학교·기업 등 기관 계정(Google Workspace)</b>은 관리자 설정이나 라이선스 적용 방식이 달라, 아직 <b>모델 드롭다운 선택 메뉴(Flash, Pro 선택권)가 유지</b>됩니다.</div><img class=\"zoomimg\" src=\"images/gemini-free-modes.png\" alt=\"Gemini 기관 계정(Google Workspace) 무료 티어의 모드 선택 화면 — 3.6 Flash, 3.6 사고 모델, 3.1 Pro\" onclick=\"openLb(this)\" loading=\"lazy\"><div class=\"rl\"><div class=\"rl-row\"><div class=\"rl-k\">3.6 Flash</div><div class=\"rl-v\">무엇이든 도움을 받으세요<small><b>이럴 때</b>일반적인 질문, 번역, 간단 요약 (기본 선택)</small></div></div><div class=\"rl-row\"><div class=\"rl-k\">3.6 사고 모델</div><div class=\"rl-v\">복잡한 문제 해결<small><b>이럴 때</b>분석, 계획 수립 등 깊이 생각해야 할 때</small></div></div><div class=\"rl-row\"><div class=\"rl-k\">3.1 Pro</div><div class=\"rl-v\">고급 추론<small><b>이럴 때</b>복잡한 추론, 긴 문서 처리</small></div></div></div><br><br><br><h4>③ 개인 유료 계정 — 모델 3가지 + 깊이 3단계</h4><img class=\"zoomimg\" src=\"images/gemini-paid-modes.png\" alt=\"Gemini 개인 유료 계정의 모드 선택 화면 — 3.5 Flash-Lite, 3.8 Flash, 3.1 Pro 모델과 최저가, 보통, 최고가 깊이\" onclick=\"openLb(this)\" loading=\"lazy\"><div class=\"rl\"><div class=\"rl-sub\">▸ 모델</div><div class=\"rl-row\"><div class=\"rl-k\">3.5 Flash-Lite</div><div class=\"rl-v\">가장 빠른 답변 제공</div></div><div class=\"rl-row\"><div class=\"rl-k\">3.8 Flash</div><div class=\"rl-v\">무엇이든 도움을 받으세요</div></div><div class=\"rl-row\"><div class=\"rl-k\">3.1 Pro</div><div class=\"rl-v\">고급 추론</div></div><div class=\"rl-sub\">▸ 깊이</div><div class=\"rl-row\"><div class=\"rl-k\">최저가</div><div class=\"rl-v\">빠르고 효율적</div></div><div class=\"rl-row\"><div class=\"rl-k\">보통</div><div class=\"rl-v\">균형 잡힌 깊이</div></div><div class=\"rl-row\"><div class=\"rl-k\">최고가</div><div class=\"rl-v\">매우 철저함</div></div></div><br><br><h4>④ Gemini 개인 요금제별 상세 비교</h4><div class=\"pc\"><div class=\"pc-c\"><div class=\"pc-n\">Free (무료)</div><div class=\"pc-p\">0원</div><div class=\"pc-i\"><span>Google One 저장공간</span>15 GB</div><div class=\"pc-i\"><span>기본 AI 모델</span>Gemini Flash 계열</div><div class=\"pc-i\"><span>컨텍스트 창 (1회 읽는 양)</span>32K 토큰 (약 48쪽)</div></div><div class=\"pc-c\"><div class=\"pc-n\">Google AI Plus</div><div class=\"pc-p\">7,500원 / 월</div><div class=\"pc-i\"><span>Google One 저장공간</span>400 GB</div><div class=\"pc-i\"><span>기본 AI 모델</span>Gemini Flash 계열 (우선 배정)</div><div class=\"pc-i\"><span>컨텍스트 창 (1회 읽는 양)</span>128K 토큰 (약 190쪽)</div></div><div class=\"pc-c pc-hot\"><div class=\"pc-n\">Google AI Pro (기존 Advanced)</div><div class=\"pc-p\">29,000원 / 월</div><div class=\"pc-i\"><span>Google One 저장공간</span>5 TB</div><div class=\"pc-i\"><span>기본 AI 모델</span>Gemini Pro 계열 (드롭다운 선택)</div><div class=\"pc-i\"><span>컨텍스트 창 (1회 읽는 양)</span>100만 토큰 (약 1,500쪽)</div></div><div class=\"pc-c\"><div class=\"pc-n\">Google AI Ultra</div><div class=\"pc-p\">119,000원~ / 월</div><div class=\"pc-i\"><span>Google One 저장공간</span>20 TB+</div><div class=\"pc-i\"><span>기본 AI 모델</span>Gemini Pro / Ultra 최상위</div><div class=\"pc-i\"><span>컨텍스트 창 (1회 읽는 양)</span>100만 토큰+</div></div></div><br><br><h4>용어 풀이 — 토큰과 컨텍스트 창</h4><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">토큰(Token)이란? — AI가 글을 세는 단위<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"item-lead\">AI는 글을 글자나 단어 그대로 읽지 않고 <b>토큰</b>이라는 작은 조각으로 나누어 읽습니다. 위 표의 “32K 토큰”, “100만 토큰”이 바로 이 조각의 개수입니다.</div><div class=\"concept\">사람이 분량을 <b>“몇 쪽”</b>으로 세듯, AI는 분량을 <b>“몇 토큰”</b>으로 셉니다. K는 천(1,000)이라서 32K는 약 3만 2천 토큰, 100만 토큰은 1,000K입니다.</div><ul class=\"block-ul\"><li>내 질문, 올린 파일, 이전 대화, AI의 답변이 <b>모두 토큰으로 계산</b>됩니다.</li><li>같은 내용이라도 언어와 파일 종류에 따라 토큰 수가 달라집니다. 한글은 영어보다 같은 분량에 토큰이 더 많이 드는 경우가 많습니다.</li></ul></div></details><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">컨텍스트 창(컨텍스트 윈도우)이란? — AI의 작업 책상 크기<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"item-lead\">컨텍스트 창은 AI가 <b>한 번에 읽고 기억하면서 작업할 수 있는 분량</b>입니다. 크기는 토큰 개수로 표시합니다.</div><div class=\"concept\">AI의 <b>작업 책상</b>이라고 생각하면 쉽습니다. 책상이 클수록 많은 자료를 한꺼번에 펼쳐 놓고 볼 수 있고, 책상이 작으면 새 자료를 올릴 때 앞의 자료를 치워야 합니다.</div><ul class=\"block-ul\"><li><b>책상 위에 올라가는 것</b> — 내 질문, 첨부한 파일, 지금까지 나눈 대화, AI가 쓰는 답변</li><li><b>분량이 넘치면</b> — 앞쪽 내용을 놓치거나 답변이 흐려질 수 있고, 너무 큰 파일은 나누어 올려야 합니다.</li></ul><div class=\"rl\"><div class=\"rl-row\"><div class=\"rl-k\">Free (무료)</div><div class=\"rl-v\">32K 토큰<small><b>한 번에 읽는 양(표 기준)</b>약 48쪽</small></div></div><div class=\"rl-row\"><div class=\"rl-k\">Google AI Plus</div><div class=\"rl-v\">128K 토큰<small><b>한 번에 읽는 양(표 기준)</b>약 190쪽</small></div></div><div class=\"rl-row\"><div class=\"rl-k\">Google AI Pro</div><div class=\"rl-v\">100만 토큰<small><b>한 번에 읽는 양(표 기준)</b>약 1,500쪽</small></div></div></div></div></details><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">이렇게 활용하세요 — 컨텍스트 창 아껴 쓰기<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><ol class=\"steps\"><li><b>긴 문서</b>(수백 쪽)는 컨텍스트 창이 큰 요금제에서 한 번에 분석합니다.</li><li>대화가 길어져 답이 엉뚱해지면 <b>새 대화</b>를 열고 <b>인계 메모</b>로 이어갑니다. (바로 아래 토글 참고)</li><li><b>주제가 바뀌면 새 대화</b>로 시작합니다. 한 대화에는 한 가지 일만 맡깁니다.</li><li>파일이 크면 <b>필요한 부분만</b> 잘라서 올립니다.</li></ol></div></details><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">대화가 길어졌을 때 이어가는 법 — 인계 메모<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"item-lead\">요약도 대화창 안에서 하는 작업이라, <b>창이 꽉 차기 전에</b> 시켜야 합니다. 답이 엉뚱해지기 시작하거나 긴 파일을 여러 개 올린 직후가 요약을 시킬 때입니다.</div><ol class=\"steps\"><li>지금 대화창에서 아래 프롬프트로 <b>인계 메모</b>를 만들게 합니다.</li><li>나온 메모를 복사합니다.</li><li><b>새 대화</b>를 열고 메모를 첫 줄에 붙여넣은 뒤 이어서 요청합니다.</li><li>올렸던 파일은 새 대화에 <b>다시 올립니다</b>.</li></ol><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\">이 대화를 새 대화에서 이어가려고 해. 아래 항목으로 &#x27;인계 메모&#x27;를 만들어줘.<br><span class=\"hl-r\">① 목표<br>② 확정된 결정</span><br>③ 중요한 숫자·이름·용어<br><span class=\"hl-r\">④ 아직 안 끝난 일</span><br><span class=\"hl-b\">⑤ 내가 원하는 말투·형식</span><br>새 대화에 그대로 붙여넣을 수 있게 <span class=\"hl-b\">1페이지 이내</span>로 정리해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"warn\">⚠️ <b>이미 꽉 찬 뒤라면</b> — 모델은 창에 들어가는 만큼만 보기 때문에 앞부분이 빠질 수 있습니다. 전체를 Ctrl+A로 복사해 새 대화에 붙이는 방법도 같은 분량이 새 창에 들어가야 하므로, 넘친 분량이면 <b>반으로 나눠 각각 요약</b>한 뒤 요약문끼리 합쳐 한 번 더 정리하세요. Ctrl+A는 버튼 문구 같은 불필요한 글자까지 같이 복사됩니다.</div><div class=\"tip\"><b>➕ 처음부터 줄이기</b>한 대화에는 한 가지 일만 맡기고, 주제가 바뀌면 새 대화로 시작하세요. 매번 설명하던 배경은 <b>젬·스킬 지침</b>에 저장해 두면 새 대화에서 다시 설명하지 않아도 됩니다.</div></div></details><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">내 사용량 확인하는 곳 — 개인 계정·기관 계정<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"item-lead\">대화를 많이 하거나 고급 모델·기능을 쓰면 <b>사용량 한도</b>에 가까워질 수 있습니다. 내 사용량은 Gemini 화면에서 직접 확인합니다. <span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span></div><h4>개인 계정 — 사용량 한도 화면</h4><img class=\"zoomimg\" src=\"images/gemini-usage-limit.png\" alt=\"Gemini 사용량 한도 화면 — 현재 사용량, 주간 한도, 자동 모델 선택, 업그레이드 안내\" onclick=\"openLb(this)\" loading=\"lazy\"><ol class=\"steps\"><li>Gemini 왼쪽 메뉴에서 <b>사용량 한도</b>를 엽니다.</li><li><b>현재 사용량</b> — 지금 구간에서 얼마나 썼는지와 초기화되는 시각이 표시됩니다.</li><li><b>주간 한도</b> — 한 주 기준 사용량과 초기화 날짜가 표시됩니다.</li><li>요금제 한도에 따라 사용 가능한 시간이 정해지며, <b>고급 모델·기능일수록 사용량이 더 많이 듭니다</b>.</li><li><b>고급 설정 → 자동 모델 선택</b>을 켜면 Gemini가 요청에 맞는 모델을 골라 사용량을 아껴 줍니다.</li></ol><div class=\"tip\"><b>➕ 참고</b>화면 하단에 상위 요금제 업그레이드 안내가 함께 보입니다. 한도가 자주 부족하다면 요금제 비교표(④)를 참고하세요.</div><br><h4>기관 계정(Google Workspace) — 사용량은 어디서 보나요?</h4><p>기관·학교 계정에서는 일반 사용자가 <b>남은 사용량을 실시간 숫자로 직접 확인하는 기능이 지원되지 않습니다.</b> 개인 계정처럼 “사용량 N%”를 보여주는 막대나 그래프가 없습니다.</p><div class=\"rl\"><div class=\"rl-row\"><div class=\"rl-k\">일반 사용자 (내 화면)</div><div class=\"rl-v\">한도에 거의 도달하면 Gemini 화면에 <b>“사용량 한도에 도달했습니다”</b> 안내가 뜨고, 한도가 <b>초기화되는 시간</b>이 함께 표시됩니다.</div></div><div class=\"rl-row\"><div class=\"rl-k\">관리자 (Admin Console)</div><div class=\"rl-v\">Google 관리 콘솔(admin.google.com) → <b>생성형 AI → Gemini 보고서</b>에서 조직·사용자별 현황을 확인합니다.</div></div></div><ul class=\"block-ul\"><li><b>조직 수준</b> — 전체 활성 사용자 수, 라이선스 보유 현황, 지난 28일간 사용량 한도에 도달한 사용자 수</li><li><b>사용자 수준</b> — 구성원별 활성 일수, 서비스 이용 수준(상·중·하), 최근 28일 동안 한도에 도달한 일수</li></ul><div class=\"tip\"><b>➕ 한 줄 정리</b>일반 사용자는 한도 초과 시 뜨는 안내로만 상태를 알 수 있고, 세부 사용량 통계는 학교·회사 IT 관리자만 조회합니다. 화면과 정책은 시점·설정에 따라 달라질 수 있습니다.</div></div></details><div class=\"tip\"><b>➕ 참고</b>화면이 업데이트되면서 계정 종류(개인·기관, 무료·유료)와 시점에 따라 모델 이름과 선택지가 다르게 보일 수 있습니다. 이름보다 <b>“빠른 것 ↔ 깊이 생각하는 것”</b> 중 무엇을 고르는지를 기억하세요.</div></div></li><li style=\"list-style:none;height:96px\"></li><li class=\"grp\" style=\"list-style:none;margin:18px 0 6px;padding:8px 12px;border-left:4px solid #1a73e8;background:#eef4ff;border-radius:6px\"><b>실습 A. Gemini 앱에서 @로 부르기</b> <span style=\"color:#555;font-size:.92em\">채팅창에서 @로 내 메일·문서·파일을 불러옵니다</span></li><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 구글 드라이브에 파일 올리고, Gemini로 문서 다루기 (약 10분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">내 드라이브에 문서를 올린 뒤, Gemini에서 <b>@Google Drive</b>로 그 파일을 찾아 일을 시켜 봅니다.</div><div class=\"tip\"><b>📎 실습 자료 — 가상 작업표준서 (먼저 내려받으세요)</b>사출 성형기 운전과 점검 방법을 적은 <b>가상 작업표준서(PDF, 2쪽)</b>입니다. 실제 회사·설비와 관계없고, <b>기준이 애매하게 적힌 곳이 일부러 섞여 있습니다.</b><br><a href=\"samples/작업표준서_가상_사출성형.pdf\" download onclick=\"return window.dlSample?dlSample(event,this):dlStatic(event,this)\" style=\"display:inline-block;margin:4px 6px 4px 0;padding:9px 14px;border-radius:8px;background:#15665D;color:#fff;font-weight:700;text-decoration:none;font-size:14px\">PDF 내려받기</a></div><br><br><img class=\"zoomimg\" src=\"images/sop-preview.png\" alt=\"가상 작업표준서 PDF 2쪽 미리보기. 목적, 안전 수칙, 작업 순서, 일일 점검 항목 표, 이상 발생 시 조치가 담겨 있음\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">가상 작업표준서 (2쪽) — 눌러서 크게 볼 수 있습니다.</p><br><br><h4>1단계 — 구글 드라이브에 올리기</h4><ol class=\"steps\"><li>크롬에서 <b>drive.google.com</b>에 접속합니다. (Gemini와 <b>같은 구글 계정</b>)</li><li>왼쪽 위 <b>새로 만들기</b> → <b>파일 업로드</b>를 누릅니다.</li><li>내려받은 <b>작업표준서_가상_사출성형.pdf</b>를 선택합니다.</li><li>내 드라이브 목록에 파일이 보이면 <b>업로드 완료</b>입니다.</li></ol><br><br><img class=\"zoomimg\" src=\"images/drive-upload.png\" alt=\"구글 드라이브 새로 만들기 메뉴에서 파일 업로드를 누르고, 작업표준서 PDF 업로드가 완료된 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:820px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\"><b>파일 업로드</b>를 눌러 PDF를 고르면, 오른쪽 아래에 <b>업로드 완료</b>가 표시됩니다.</p><br><br><br><h4>2단계 — Gemini에서 파일에 일 시키기</h4><p class=\"item-lead\">Gemini 채팅창에서 <b>@Google Drive</b>를 고른 뒤 아래 프롬프트를 차례로 넣어 봅니다. <b>새 대화의 첫 질문</b>에 @로 서비스를 지정합니다.</p><br><br><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">4</span><span class=\"prompt-text\">@Google Drive 에서 <span class=\"hl-b\">&#x27;작업표준서&#x27;</span> 파일을 찾아서, <span class=\"hl-r\">점검 항목만</span> 표로 정리해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/drive-prompt-1.png\" alt=\"Gemini 입력창에 @Google Drive 작업표준서 파일을 찾아서 점검항목만 표로 정리해달라고 입력한 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:700px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">Gemini 입력창에서 <b>@Google Drive</b>를 고른 뒤 프롬프트를 입력하고 보냅니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/drive-prompt-2.png\" alt=\"Gemini가 드라이브의 작업표준서에서 일일 점검 항목을 표로 정리한 결과. 표 아래 점 세 개 메뉴에 Sheets로 내보내기가 보임\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">표가 나오면 아래 <b>⋯</b> → <b>Sheets로 내보내기</b>로 구글 시트에 옮길 수 있습니다.</p><br><br><div class=\"prompt-card\"><span class=\"prompt-num\">5</span><span class=\"prompt-text\">방금 표의 점검 항목을 <span class=\"hl-r\">매일 체크할 수 있는 점검표</span>로 바꿔 줘. <span class=\"hl-b\">체크 칸</span>을 넣고, <span class=\"hl-b\">주기별(매 작업 시작 전 / 매일 / 주 1회)</span>로 나눠 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/drive-prompt-3.png\" alt=\"Gemini가 점검 항목을 주기별 체크리스트로 바꾼 결과. 응답 메뉴에 Docs로 내보내기가 보임\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">답변 아래 <b>⋯</b> 메뉴의 <b>Docs로 내보내기</b>로 문서에 옮겨 인쇄할 수 있습니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/drive-prompt-4.png\" alt=\"Docs로 내보내기를 누르면 점검표가 구글 문서로 열린 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\"><b>Docs로 내보내기</b>를 누르면 점검표가 <b>구글 문서</b>로 열립니다. 고치고 인쇄해서 쓰면 됩니다.</p><br><br><div class=\"prompt-card\"><span class=\"prompt-num\">6</span><span class=\"prompt-text\">@Google Drive 에서 <span class=\"hl-b\">&#x27;작업표준서&#x27;</span> 파일을 찾아서, 현장에서 <span class=\"hl-r\">헷갈릴 만한 부분</span>(기준이 애매하거나 빠진 내용)을 <span class=\"hl-b\">3가지</span> 찾아 줘. 왜 헷갈리는지도 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/drive-prompt-5.png\" alt=\"Gemini가 작업표준서에서 현장에서 헷갈릴 만한 부분 3가지와 이유를 정리한 결과\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:700px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">AI가 <b>기준이 애매한 부분 3가지</b>와 <b>왜 헷갈리는지</b>를 정리해 줍니다.</p><br><br><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">🔍 6번에서 찾아야 할 “일부러 넣어 둔 애매한 부분” — 답 확인<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><ol class=\"steps\"><li><b>유압유 양</b> — “충분히 유지할 것” (얼마가 충분한지 기준이 없음)</li><li><b>냉각수 온도</b> — “적정 온도를 유지할 것” (몇 ℃인지 없음)</li><li><b>윤활 상태</b> — “필요 시 급유” (언제가 필요한 때인지 없음)</li><li><b>점검표 보관</b> — “별도 규정에 따라 보관” (몇 년인지, 어디서 보는지 없음)</li></ol><p>AI가 이 중 몇 개를 찾았는지 비교해 보세요. <b>못 찾은 것도, 없는 것을 지어낸 것도</b> 있을 수 있습니다.</p></div></details><div class=\"prompt-card\"><span class=\"prompt-num\">7</span><span class=\"prompt-text\">@Google Drive 에서 <span class=\"hl-b\">&#x27;작업표준서&#x27;</span> 파일을 찾아서, <span class=\"hl-r\">안전 수칙</span>만 신입 작업자가 이해하기 쉽게 <span class=\"hl-b\">5줄</span>로 요약해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/drive-prompt-6.png\" alt=\"Gemini가 작업표준서의 안전 수칙을 신입 작업자용 5줄로 요약한 결과\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:700px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">안전 수칙이 <b>신입 작업자용 5줄</b>로 요약됩니다.</p><br><br><div class=\"prompt-card\"><span class=\"prompt-num\">8</span><span class=\"prompt-text\">위 안전 수칙을 <span class=\"hl-b\">외국인 근로자</span>가 이해하기 쉬운 <span class=\"hl-r\">안내문</span>으로 만들어줘. <span class=\"hl-b\">한국어, 영어, 베트남어, 러시아어</span>로 써 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/drive-prompt-7.png\" alt=\"Gemini가 안전 수칙을 한국어, 영어, 베트남어, 러시아어 안내문으로 만든 결과\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:700px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">안전 수칙이 <b>4개 언어 안내문</b>으로 정리됩니다.</p><br><br><div class=\"prompt-card\"><span class=\"prompt-num\">9</span><span class=\"prompt-text\">위 내용을 <span class=\"hl-b\">이미지로만</span> 이루어진 <span class=\"hl-r\">안내문 세로 포스터</span>로 만들어 줄 수 있어? <span class=\"hl-b\">한국어와 영어로만.</span></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/drive-poster.png\" alt=\"Gemini가 만든 한국어·영어 세로 안전 수칙 포스터. 아래쪽 로고 글자는 이상하게 나옴\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:360px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">안전 수칙이 <b>그림 중심의 세로 포스터</b>로 만들어집니다.</p><br><br><div class=\"tip\"><b>🎨 아래쪽 로고나 글자가 이상하게 나오면</b>AI가 만든 이미지는 로고·작은 글자가 깨질 수 있습니다. 이미지를 내려받아 <b>캔바(Canva)</b>에 가져가면 그 부분을 <b>고치거나 지울 수 있습니다.</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">10</span><span class=\"prompt-text\">위 내용을 <span class=\"hl-b\">베트남어와 한국어</span> 포스터로 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">11</span><span class=\"prompt-text\">위 내용을 <span class=\"hl-b\">러시아어와 한국어</span> 포스터로 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><div style=\"display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:flex-start\"><div style=\"flex:1 1 300px;max-width:440px\"><img class=\"zoomimg\" src=\"images/drive-poster-2.png\" alt=\"Gemini가 만든 베트남어·한국어 안전 수칙 포스터\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"width:100%;max-width:none;margin:0\"></div><div style=\"flex:1 1 300px;max-width:440px\"><img class=\"zoomimg\" src=\"images/drive-poster-3.png\" alt=\"Gemini가 만든 러시아어·한국어 안전 수칙 포스터\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"width:100%;max-width:none;margin:0\"></div></div><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">왼쪽은 <b>베트남어</b>, 오른쪽은 <b>러시아어</b> 포스터입니다.</p><br><br></div></li><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">📧 실습 준비 — 실습용 메일 받아 두기 (약 3분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">다음 ④ 실습은 <b>내 받은편지함에 메일이 있어야</b> 할 수 있습니다. 먼저 아래 메일을 준비합니다.</div><p class=\"item-lead\">아래 메일은 <b>가상의 협력사가 보낸 납기 변경 안내</b>입니다. <b>강사가 참석자 주소로 보내 드립니다.</b> 받은편지함(또는 스팸함)에 없으면 <b>내 메일 주소로 직접 보내서</b> 실습하세요.</p><div class=\"prompt-card\"><span class=\"prompt-num\">A</span><span class=\"prompt-text\">[납기 안내] 부품 납품 일정 변경 요청드립니다</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">B</span><span class=\"prompt-text\">안녕하세요, 담당자님.<br>플로우디엑스 영업팀 김나나입니다.<br><br>지난번 주문하신 사출 부품(품번 A-100)의 납품 일정과 관련해 안내드립니다.<br><br>1. 원래 납기: 이번 주 금요일<br>2. 변경 사유: 금형 점검으로 생산 일정이 하루 이틀 밀렸습니다.<br>3. 변경 제안: 다음 주 화요일 오전 납품<br>4. 요청 사항: 변경이 가능한지, 어려우시면 가능한 날짜를 이번 주 목요일까지 회신해 주시면 감사하겠습니다.<br><br>불편을 드려 죄송합니다.<br>감사합니다.<br><br>플로우디엑스 영업팀 김나나 드림</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><ul class=\"block-ul\"><li><b>직접 보낼 때</b> — Gmail <b>새 메일 쓰기</b> → 받는 사람에 <b>내 이메일 주소</b> → 위 제목과 본문을 복사해 붙여넣고 보냅니다.</li><li>보낸 메일이 받은편지함에 보이면 <b>준비 끝</b>입니다. 메일은 <b>가상의 내용</b>이며 실제 거래와 관계없습니다.</li></ul><div class=\"tip\"><b>👩‍🏫 강사 안내</b>실습 <b>10분 전</b>에 등록 시트의 주소 전체에 보냅니다. 참석자끼리 주소가 보이지 않도록 <b>숨은참조(BCC)</b>로 한 통에 보내세요. 회사 계정은 외부 메일이 막힐 수 있어 <b>개인 구글 계정</b>으로 안내합니다.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ Gemini 채팅창에서 @로 내 메일·문서 불러오기 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">Gemini 채팅창에서 <b>@</b>를 누르고 서비스를 고르면, 내 Gmail·드라이브·Docs에서 내용을 찾아 정리해 줍니다.</div><div class=\"tip\"><b>⚠️ @를 눌러도 Gmail·Drive·Docs가 안 나오면</b>Gemini의 <b>개인 인텔리전스(Personal Intelligence)</b> 설정에서 <b>연결된 앱</b>을 켜야 합니다. Gmail·Google Drive·Google Docs를 <b>활성화</b>한 뒤 다시 <b>@</b>를 눌러 보세요. <span class=\"game-hint\">(화면에 따라 메뉴 이름이 조금 다를 수 있습니다)</span></div><ol class=\"steps\"><li><b>gemini.google.com</b>에 구글 계정으로 로그인합니다. (메일·드라이브와 <b>같은 계정</b>)</li><li>입력창에 <b>@</b>를 입력하고 <b>Gmail</b>, <b>Google Drive</b>, <b>Google Docs</b> 중 하나를 고릅니다.</li><li>아래 예시처럼 요청합니다. <b>링크를 붙여넣지 말고</b> 파일 이름이나 키워드로 말합니다.</li></ol><p class=\"item-lead\">@를 입력하면 연결할 수 있는 서비스 목록이 뜹니다. <span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span></p><img class=\"zoomimg\" src=\"images/gemini-at-menu.png\" alt=\"Gemini 입력창에 @를 입력하면 Google Calendar, Keep, Tasks, Docs, Drive, Gmail 등 서비스 목록이 나타나는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:520px\"><br><br><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\">@Gmail 에서 <span class=\"hl-b\">협력사</span>가 보낸 <span class=\"hl-b\">납기 관련 메일</span>을 찾아서 <span class=\"hl-r\">3줄로 요약</span>해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><p class=\"item-lead\">Gmail 요약 결과는 이렇게 나옵니다. 답변 옆에 <b>근거가 된 메일 제목</b>이 함께 표시됩니다. <span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span></p><img class=\"zoomimg\" src=\"images/gemini-at-gmail-result.png\" alt=\"Gemini에 @Gmail로 협력사 납기 메일 요약을 요청한 결과 — 답변과 근거 메일 제목이 함께 표시됨\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:720px\"><div class=\"tip\"><b>📌 알아 두기</b>① <b>새 대화의 첫 질문</b>에 @로 서비스를 지정합니다. 같은 대화의 다음 질문에는 다시 안 써도 됩니다 ② 메일·문서 안의 <b>댓글이나 이미지는 읽지 못합니다</b> ③ 연결이 안 되면 <b>Keep 활동</b>이 켜져 있는지, Gmail의 <b>스마트 기능</b>이 켜져 있는지 확인합니다.</div><div class=\"warn\"><b>⚠️ 결과는 확인하세요</b>잘못 찾거나 오래된 내용을 가져올 수 있습니다. 답변에 나온 <b>메일·파일을 열어 실제 내용과 맞는지</b> 확인합니다.</div><br><h4>Gemini 앱에서 답장 초안 만들기</h4><p class=\"item-lead\">Gemini 앱에서는 메일 맥락이 따로 없으므로 <b>@Gmail</b>을 지정하고 <b>내 역할과 상대</b>를 적습니다.</p><div class=\"prompt-card\"><span class=\"prompt-num\">앱</span><span class=\"prompt-text\">@Gmail 에서 협력사가 보낸 납기 메일을 찾아서 답장 초안 써 줘.<br>나는 <span class=\"hl-b\">부품을 주문한 회사 담당자</span>고, 메일을 보낸 사람은 <span class=\"hl-b\">납품 협력사</span>임.<br>가능 여부는 <span class=\"hl-r\">[확인 필요]</span>, <span class=\"hl-b\">이번 주 목요일까지</span> 회신.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/gemini-reply-draft.png\" alt=\"Gemini가 협력사 메일에 대한 답장 초안을 Gmail 작성창 형태로 만들어 둔 화면. Gmail에서 수정과 보내기 버튼이 표시됨\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:640px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">빨간 네모 <b>“Gmail에서 수정”</b>을 누르면 초안이 <b>임시보관함</b>에 저장됩니다. (파란 네모 “보내기”는 바로 발송됩니다.)</p><br><br><br><br><img class=\"zoomimg\" src=\"images/gmail-draft-folder.png\" alt=\"Gmail 임시보관함에 Gemini가 만든 답장 초안이 저장된 화면. 왼쪽 임시보관함 메뉴와 초안 한 줄이 표시됨\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:860px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">Gmail 왼쪽 메뉴의 <b>임시보관함</b>에서 확인합니다. 안 보이면 <b>새로고침</b>하세요.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/gmail-draft-edit.png\" alt=\"Gmail 작성창에서 답장 초안을 열어 고칠 수 있는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:860px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">초안을 열어 <b>읽고 고친 뒤</b> <b>보내기</b>를 누릅니다.</p><br><br></div></li><li style=\"list-style:none;height:96px\"></li><li class=\"grp\" style=\"list-style:none;margin:18px 0 6px;padding:8px 12px;border-left:4px solid #1a73e8;background:#eef4ff;border-radius:6px\"><b>실습 B. 구글 앱 안에서 쓰기</b> <span style=\"color:#555;font-size:.92em\">Gmail·Docs 같은 앱 안의 Gemini 버튼으로 씁니다</span></li><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ Gmail에서 받은 메일에 답장하며 초안 쓰기 (약 7분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><br><br><img class=\"zoomimg\" src=\"images/gmail-inbox-reply.png\" alt=\"Gmail 받은편지함에서 납기 안내 메일을 열고 아래 답장 버튼을 누르는 화면. 받은편지함과 답장 버튼이 표시됨\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:820px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">① 받은편지함에서 메일을 열고 아래 <b>답장</b>을 누릅니다.</p><br><br><br><br><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">2</span><span class=\"prompt-text\"><span class=\"hl-b\">내가 주문한 회사 담당자</span>, 가능 여부는 <span class=\"hl-r\">확인 필요</span>. <span class=\"hl-b\">이번 주 목요일까지</span> 회신</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/gmail-helpwrite-1.png\" alt=\"답장 작성창에서 Help me write 아이콘을 눌러 프롬프트를 입력하는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">② 작성창의 <b>마법 지팡이(Help me write)</b> 아이콘을 누르고 프롬프트를 입력합니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/gmail-helpwrite-2.png\" alt=\"Help me write가 만든 답장 초안이 작성창에 채워진 화면. 아래에 다듬기 버튼이 있음\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">③ 초안이 채워지면 <b>읽고 고친 뒤</b> <b>보내기</b>를 누릅니다.</p><br><br><div class=\"tip\"><b>💡 답장이 어색하게 나오면</b>AI는 메일 내용은 잘 읽어도 <b>“누가 누구에게 쓰는지”</b>를 헷갈릴 수 있습니다. 예를 들어 <b>사과해야 할 쪽과 받는 쪽이 뒤바뀌기도</b> 합니다. 이럴 땐 <b>내 입장(받는 쪽인지 보내는 쪽인지)</b>과 <b>꼭 넣을 말·뺄 말</b>을 적어 다시 요청하세요.</div><br><h4>새 메일 쓰기도 해 보기 (선택)</h4><div class=\"prompt-card\"><span class=\"prompt-num\">3</span><span class=\"prompt-text\"><span class=\"hl-b\">협력사 담당자</span>에게 <span class=\"hl-b\">다음 주 월요일까지 납품이 가능한지</span> 정중하게 묻는 메일을 써 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/gmail-newmail-1.png\" alt=\"Gmail 새 메일 작성창에서 Help me write 아이콘을 눌러 프롬프트를 입력한 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">① <b>편지쓰기</b>로 새 메일을 열고, 받는 사람에 <b>내 이메일 주소</b>를 넣은 뒤 <b>마법 지팡이</b> 아이콘으로 프롬프트를 입력합니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/gmail-newmail-2.png\" alt=\"Help me write가 만든 새 메일 초안이 작성창에 채워진 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">② 초안이 채워지면 <b>읽고 고친 뒤</b> 보내고, 받은편지함에 도착했는지 확인합니다.</p><br><br><div class=\"prompt-card\"><span class=\"prompt-num\">3-2</span><span class=\"prompt-text\">위 내용을 영어로 작성해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/gmail-newmail-3.png\" alt=\"한국어 초안 아래 입력창에 영어로 작성해 달라고 요청하고, 영어 초안이 채워진 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">③ 같은 창에서 <b>“위 내용을 영어로 작성해줘.”</b>라고 입력하면(왼쪽) 영어 초안으로 바뀝니다(오른쪽).</p><br><br><div class=\"tip\"><b>🌐 해외 거래처·외국인 근로자</b>영어나 다른 언어로 바꿔 달라고 요청할 수도 있습니다. 다만 번역은 틀릴 수 있어서, <b>중요한 내용은 그 언어를 아는 분께 한 번 확인</b>하세요.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑥ 문서·슬라이드·폼·시트·캘린더·Meet 속 Gemini<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\"><b>계정 요금제에 따라 안 보일 수 있습니다.</b> 아래 항목을 눌러 펼쳐 보세요.</div><div class=\"xcards\"><div class=\"xc\"><span class=\"xc-n\">Docs</span><div class=\"xc-t\">문서 오른쪽 위 Gemini/글쓰기 도움 메뉴</div><div class=\"fc-x\"><b class=\"l\">예</b>보고서 초안, 문서 요약</div></div><div class=\"xc\"><span class=\"xc-n\">Sheets</span><div class=\"xc-t\">시트의 Gemini 기능(표 만들기·요약·인사이트), AI 함수. 요금제에 따라 다름</div><div class=\"fc-x\"><b class=\"l\">예</b>데이터 요약, 이상치 찾기. 함수가 막히면 <b>Gemini 앱에 “이런 표에서 이걸 구하는 함수 알려줘”</b>라고 물어도 됨</div></div><div class=\"xc\"><span class=\"xc-n\">Forms</span><div class=\"xc-t\">Gemini 앱에 질문 목록을 만들게 한 뒤 폼에 붙여넣기</div><div class=\"fc-x\"><b class=\"l\">예</b>작업일보 입력 폼 (맞춤 실습 탭)</div></div><div class=\"xc\"><span class=\"xc-n\">Meet</span><div class=\"xc-t\">회의 중 기록 기능</div><div class=\"fc-x\"><b class=\"l\">예</b>회의록 정리 (회사 계정·요금제 확인 필요)</div></div></div><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">📄 Docs — 문서 초안 만들기<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><br><br><p class=\"item-lead\">Gemini 채팅창에서 <b>@Google Docs</b>를 고른 뒤, 아래 글을 써 봅니다.</p><div class=\"prompt-card\"><span class=\"prompt-num\">Docs</span><span class=\"prompt-text\">@Google Docs 우리 회사(사출 성형 부품 제조업체)가 새로 개발한 <span class=\"hl-b\">경량 내장 부품</span>을 신규 거래처에 소개하는 <span class=\"hl-r\">영업 론칭 플랜</span>을 작성해 줘. 제품의 핵심 가치를 담은 <span class=\"hl-b\">3문장 이내의 엘리베이터 피치</span>, <span class=\"hl-b\">타깃 거래처 담당자 페르소나 3가지</span>(글머리 기호 사용), 그리고 제안 전후 30일간의 영업 타임라인을 <span class=\"hl-r\">&#x27;일정, 주요 채널, 활동 내용&#x27; 컬럼을 가진 표(Table)</span> 형태로 포함해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/docs-prompt-1.png\" alt=\"Gemini가 @Google Docs로 영업 론칭 플랜을 구글 문서로 만들어 준 화면. 열기 버튼이 보임\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:700px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">답변에 만들어진 <b>구글 문서</b>가 나타납니다. <b>열기</b>를 누르면 문서가 열립니다.</p><br><br><img class=\"zoomimg\" src=\"images/docs-prompt-2.png\" alt=\"열린 구글 문서에 엘리베이터 피치, 타깃 페르소나 3가지, 30일 영업 타임라인 표가 만들어진 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:800px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">열린 문서에 <b>엘리베이터 피치·페르소나·30일 타임라인 표</b>가 만들어져 있습니다.</p><br><br></div></details><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">📽️ 슬라이드 (Gemini Notebook) — 문서를 발표자료로<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><h4>만든 문서를 슬라이드로 바꾸기</h4><br><br><img class=\"zoomimg\" src=\"images/slides-attach-1.png\" alt=\"Gemini 입력창의 더하기 메뉴에서 Drive에서 파일 추가를 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:600px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">① 입력창의 <b>＋</b>를 누르고 <b>Drive에서 파일 추가</b>를 고릅니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/slides-attach-2.png\" alt=\"Drive 파일 선택 창에서 방금 만든 문서를 고르고 삽입을 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:800px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">② 방금 만든 문서를 고르고 <b>삽입</b>을 누릅니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/slides-attach-3.png\" alt=\"Gemini 입력창에 문서가 첨부된 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:600px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">③ 입력창에 문서가 붙으면 아래 프롬프트를 입력합니다.</p><br><br><div class=\"prompt-card\"><span class=\"prompt-num\">슬라이드</span><span class=\"prompt-text\">이 내용으로 <span class=\"hl-r\">슬라이드</span> 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/slides-result-1.png\" alt=\"Gemini가 문서 내용으로 슬라이드를 만들어 보여주는 화면. 오른쪽 위에 내보내기 버튼이 있음\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:800px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">채팅 화면 안에 <b>슬라이드</b>가 만들어집니다. 오른쪽 위 <b>내보내기</b>로 내보낼 수 있습니다.</p><br><br><div class=\"tip\"><b>💡 슬라이드가 아주 예쁘지는 않아요</b>Gemini 채팅에서 만든 슬라이드는 <b>디자인이 단순한 편</b>입니다. 발표용으로 <b>예쁘게 만들려면 Gemini Notebook(노트북LM)에서 슬라이드를 만드세요.</b><br><a class=\"link-btn\" href=\"https://notebook.google.com\" target=\"_blank\" rel=\"noopener\">📚 Gemini Notebook 열기 — notebook.google.com</a></div><br><br><img class=\"zoomimg\" src=\"images/nlm-slides-1.png\" alt=\"Gemini Notebook 새 노트북에서 소스 추가 창의 Drive 버튼을 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">① 새 노트북에서 소스로 <b>Drive</b>를 고르고, 방금 만든 문서를 선택합니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/nlm-slides-2.png\" alt=\"문서가 소스로 들어온 노트북에서 오른쪽 스튜디오의 슬라이드 자료 버튼을 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">② 문서가 소스로 들어오면 오른쪽 <b>스튜디오</b>의 <b>슬라이드 자료</b>를 누릅니다.</p><br><br><p class=\"item-lead\">③ 설정 창이 열리면 <b>설명란</b>에 <b>디자인 프롬프트</b>와 <b>내용 프롬프트</b>를 함께 적을 수 있습니다.</p><div class=\"prompt-card\"><span class=\"prompt-num\">디자인</span><span class=\"prompt-text\"><span class=\"hl-b\">디자인</span>은 화이트 바탕에 3D 디자인으로 해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">내용</span><span class=\"prompt-text\">우리 회사 이름은 <span class=\"hl-r\">○○○</span>야. 회사 이름을 넣어서 <span class=\"hl-b\">신규영업론칭플랜</span>으로 슬라이드 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/nlm-slides-3.png\" alt=\"슬라이드 자료 맞춤설정 창. 설명란에 디자인과 내용을 적고 지금 생성을 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:800px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">설명란에 <b>디자인</b>과 <b>내용</b>을 적고 <b>지금 생성</b>을 누릅니다.</p><br><br><p class=\"item-lead\" style=\"text-align:center\">Gemini Notebook이 만든 <b>슬라이드 예시</b>입니다.<br><a class=\"link-btn\" href=\"https://notebook.google.com/notebook/463faa19-c518-42a5-94df-6398f5c3da05/artifact/b2be3ece-8d46-46b4-9162-1b7c524a0f7c?utm_source=nlm_web_share&amp;utm_medium=google_oo&amp;utm_campaign=art_share_1&amp;utm_content=&amp;utm_smc=nlm_web_share_google_oo_art_share_1_\" target=\"_blank\" rel=\"noopener\">👀 슬라이드 예시 보기</a></p><p class=\"item-lead\">④ 슬라이드를 만드는 동안 <b>인포그래픽</b>도 함께 만들 수 있습니다. 스튜디오에서 <b>인포그래픽</b>을 누릅니다.</p><div class=\"prompt-card\"><span class=\"prompt-num\">인포</span><span class=\"prompt-text\"><span class=\"hl-r\">3D디자인</span>으로 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/nlm-infographic-1.png\" alt=\"인포그래픽 맞춤설정 창. 방향을 세로로 고르고 설명란에 3D디자인으로 만들어 달라고 적은 화면. 오른쪽에는 슬라이드 자료가 생성 중\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\"><b>방향(세로)</b>을 고르고 설명란에 적은 뒤 <b>지금 생성</b>을 누릅니다. 슬라이드는 오른쪽에서 만들어지는 중입니다.</p><br><br><img class=\"zoomimg\" src=\"images/nlm-infographic-2.png\" alt=\"Gemini Notebook이 만든 신규 경량 내장 부품 영업 론칭 전략 인포그래픽 예시\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:420px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">Gemini Notebook이 만든 <b>인포그래픽 예시</b>입니다. (이미지를 누르면 크게 보입니다)</p><br><br></div></details><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">📝 구글 폼 — 설문 1분 완성 · 시트 연동 · QR 배포<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><ul class=\"block-ul\"><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① AI로 손쉽게 구글폼 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>주소창에 <kbd>form.new</kbd> 입력 → 새 구글폼 바로 열기</li><li><b>AI 모드</b>가 보이나요? 프롬프트 한 줄로 폼을 자동 생성</li><li>안 보이면 워크스페이스 랩스 가입(개인계정만 가능) — 무료 계정도 AI 기능 사용 가능<br><a class=\"link-btn\" href=\"https://workspace.google.com/experiments/\" target=\"_blank\" rel=\"noopener\">🔗 워크스페이스 랩스 가입하기</a><details class=\"cap-help\" style=\"margin-top:10px;\"><summary>🎬 워크스페이스 랩스 가입 방법 (이미지로 따라하기)</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"images/wslabs-1.png\" alt=\"워크스페이스 랩스 가입 단계\" loading=\"lazy\" style=\"margin:6px 0 4px;\"><img class=\"doc-img\" src=\"images/wslabs-2.png\" alt=\"워크스페이스 랩스 가입 단계\" loading=\"lazy\" style=\"margin:6px 0 4px;\"></div></details></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 간단한 폼 만들고 응답 받아보기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">제미나이로 문항을 설계한 뒤 폼으로 옮기는 방법이에요. 아래 프롬프트를 <b>복사해서 바로</b> 써 보세요(상황에 맞게 바꿔도 좋아요).<div class=\"prompt-card\" style=\"margin-top:12px\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">이수증 취합 설문을 만들거야. 이름, 소속, 이수증 업로드로 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"item-lead\">의견 수합·등록증(사진) 수합, 어떻게 하세요? 이메일로 받으면 시간이 많이 걸려요.</div><ol class=\"steps\"><li><b>이름 · 소속 · 파일 첨부</b>로 아주 간단한 폼 먼저 만들어 보기 <i>(예시: 이수증취합)</i><img class=\"doc-img\" src=\"images/form-simple.png\" alt=\"구글폼 예시 — 이름·소속·파일 업로드 문항\" loading=\"lazy\"></li><li><b>구글시트 연동</b> — ‘응답’ 탭 → 구글시트로 연결하면 응답이 실시간으로 시트에 쌓이고 자동 집계</li><li><b>응답 폼 공유·확인</b> — ‘보내기’로 링크 공유 후, 시크릿 모드에서 응답자 화면 그대로 확인</li><li><span style=\"color:#C0392B\"><b>응답 모드로 확인</b> — 실제 응답이 어떻게 들어오는지 보기</span></li><li><b>취합 정보 확인</b> — 파일 업로드 응답은 <b>구글드라이브에 폴더가 자동 생성</b>돼 사진이 착착 정리 <i>(※ 응답자도 구글 로그인 필요)</i></li></ol></div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" style=\"background:#C0392B!important;color:#fff!important;border-color:#C0392B!important\" onclick=\"toggleItem(this)\">③ 그대로 쓰는 설문 프롬프트 — 공통 + 내 직무<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"hook\">🏭 <b>생산·품질 담당자께!</b> <b>불량·이상 신고, 설비 점검 서류 수합</b>, 📦 <b>구매·자재 담당자께!</b> <b>구매 요청·납기 확인</b> — 종이와 메신저로 걷는 일 이제 끝.</div><div class=\"item-lead\">카드의 <b>［복사］</b>를 누르고 제미나이(또는 구글폼 AI 모드)에 붙여넣으면 문항이 바로 나와요. <b>공통</b>에서 하나, <b>내 직무</b>에서 하나 골라 보세요.</div><div class=\"survey-cat\"><div class=\"survey-cat-title\">👥 공통 — 누구나 <span class=\"survey-cat-desc\">(직무 상관없이 사내에서 자주 하는 설문)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“전 직원 법정 의무교육(산업안전보건교육 등) 이수증 제출”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“사내 워크숍(또는 체육대회) 참석 여부 및 점심 메뉴 조사”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“명절·휴가철 근무 일정 및 비상 연락망 업데이트”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-ex-head\" style=\"margin:26px 0 12px;font-weight:800;font-size:17px;color:#172C2B\">🧩 직무별 예시 — 내 직무 카드를 찾아 복사하세요</div><div class=\"survey-cat\"><div class=\"survey-cat-title\">🏭 생산·제조 <span class=\"survey-cat-desc\">(생산관리·작업반장·현장 작업자)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“작업 중 불량·이상 발생 신고(사진 첨부)”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“교대 근무 변경 및 특근 희망 신청”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“라인별 작업 지시 확인 및 인수인계 사항 기록”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">🔍 품질관리 <span class=\"survey-cat-desc\">(검사·품질보증·고객 클레임 대응)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“부적합품(불량) 접수 및 원인 기록(사진 첨부)”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“협력업체 입고 검사 성적서 제출 수합”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“고객 클레임 접수 및 처리 현황 조사”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">🛠️ 설비·안전 <span class=\"survey-cat-desc\">(설비 보전·안전보건 담당)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“설비 고장·이상 신고(설비명·위치·사진 첨부)”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“월간 설비 점검 체크리스트 제출”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“아차사고(위험 상황) 현장 제보 접수”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">📦 구매·자재 <span class=\"survey-cat-desc\">(구매·자재·물류·재고)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“부서별 필요 자재·소모품 구매 요청”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“협력사 납기 가능 여부 및 견적 수합”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“분기 재고 실사 결과 취합”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">💼 영업·고객지원 <span class=\"survey-cat-desc\">(영업·영업관리·고객 응대)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“고객사 방문·미팅 일정 및 결과 보고”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“신규 거래처 정보 수집(사업자등록증 사진 첨부)”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“고객 만족도 조사”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">👥 인사·총무 <span class=\"survey-cat-desc\">(인사·총무·교육 담당)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“신규 입사자 제출 서류 수합(개인정보 최소)”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“복지(건강검진 예약·동호회) 신청 접수”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“직무 교육 수요조사”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"warn\" style=\"margin-top:6px\">⚠️ <b>급여·건강 정보·개인 사정은 구글폼으로 받지 마세요.</b> 폼은 <b>신청·예약</b>까지만, 민감한 내용은 대면이나 별도 절차로.</div></div><div class=\"survey-cat\"><div class=\"survey-cat-title\">✏️ 내 것으로 바꿔 쓰기 <span class=\"survey-cat-desc\">(○○○ 자리에 내 설문 주제를 넣으세요)</span></div><div class=\"prompt-card\"><span class=\"prompt-num\">✎</span><span class=\"prompt-text\">“○○○”한 내용의 설문을 구글폼으로 만들려고 해. 문항을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><div class=\"tip\"><b>➕ 결과가 밋밋하면 한 줄 더 붙이세요</b>“사진 첨부 문항을 넣어줘” · “라인·공정은 드롭다운으로, 수량은 숫자만 받게 해줘” · “이름은 필수로, 나머지는 선택으로 해줘” · “응답자가 3분 안에 끝낼 수 있게 문항을 8개 이내로 줄여줘”</div><div class=\"warn\">⚠️ <b>개인정보는 꼭 필요한 것만.</b> 주민등록번호·계좌번호는 구글폼으로 받지 마세요. 직원·협력사 담당자 정보(이름·연락처 등)는 <b>업무에 필요한 만큼만</b> 받고, 설문 맨 앞에 <b>수집 목적과 보관 기간</b>을 한 줄 적어 두세요. 응답 시트는 <b>공유 범위</b>도 꼭 확인하세요.</div><details class=\"cap-help\" style=\"margin-top:18px;\"><summary>🤖 더 꼼꼼하게 — 사양까지 적어 주는 예시 (설비 이상 신고서)</summary><div class=\"cap-help-body\"><div class=\"item-lead\" style=\"margin-top:6px\">원하는 문항·형식·설정을 <b>한 번에 적어 주면</b> 제미나이가 그대로 폼을 설계해요. 제목·문항만 내 업무로 바꿔 쓰세요.</div><div class=\"prompt-card\"><span class=\"prompt-num\">📋</span><span class=\"prompt-text\">너는 제조 현장 업무를 돕는 도우미야. 아래 사양 그대로 \"설비 이상 신고서\" 구글 설문지를 만들어 줘.<br>[폼 제목] 설비 이상 신고서<br>[폼 설명] 설비 이상을 빠르게 접수하기 위한 신고서입니다. 수집한 정보는 설비 점검·조치에만 사용합니다.<br>[섹션 1 · 신고자]<br>1) 신고자 이름 — 단답형, 필수<br>2) 소속 라인 — 드롭다운(1라인 / 2라인 / 3라인 / 포장 / 품질 / 기타), 필수<br>[섹션 2 · 이상 내용]<br>3) 설비명 — 단답형, 필수<br>4) 발생 일시 — 단답형(예: 10월 16일 14시)<br>5) 이상 유형 — 객관식(소음·진동 / 온도 이상 / 오작동 / 누유·누수 / 기타)<br>6) 긴급도 — 객관식(즉시 정지 필요 / 오늘 중 점검 / 일정 조율 가능), 필수<br>7) 현장 사진 — 파일 업로드(이미지, 최대 3장), 선택<br>[섹션 3 · 추가 확인]<br>8) 추가 설명 — 장문형, 선택<br>9) 개인정보 수집·이용 동의 — 객관식(동의함), 필수<br>[설정] 응답을 새 스프레드시트(설비 이상 신고 대장)로 연결. 완성 후 편집 링크와 응답 링크를 알려줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></details></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ ＋더 나아가 심화 기능<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>① 응답 검증</b> — 전화번호는 숫자만·이메일은 형식 맞게·금액은 숫자만 → 잘못 적어낸 자료 다시 받는 스트레스를 원천 차단</li><li><b>② 조건부 이동(섹션 분기)</b> — 답에 따라 다음 질문이 달라지게 (예: ‘이상 유형 → 누유·누수’면 사진 첨부·긴급도 질문이 뜨게)</li><li><b>③ 새로 들어온 최신 기능</b> — 구글폼 <b>응답 기한 설정</b> · 응답자 설정</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 재사용 · 함께 관리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>잘 만든 폼은 <b>복사해서 매년 재사용</b></li><li><b>공동 편집자</b>를 추가해 같은 업무 동료와 함께 관리 (다시 안 만들어도 돼요)</li></ol></div></li></ul><div class=\"practice\"><b>💻 실습</b><b>내 업무에서 실제로 쓸 설문 1개</b>를 만들어 보기 — ③에서 카드 하나 골라 문항 만들기 → 구글폼에 옮기기 → 구글시트 연동까지. 사진이 필요하면 <b>파일 업로드</b> 문항도 넣어 보세요.</div><div class=\"tip\"><b>➕ 한 걸음 더</b>완성한 폼은 <b>QR코드로 배포</b>해 보세요 — 응답 링크를 크롬으로 열고 우클릭 → ‘이 페이지의 QR 코드 만들기’ (크롬·구글 꿀팁 ④). 현장 게시판·작업 표준서에 붙이면 휴대폰으로 바로 응답해요.</div></div></details><details class=\"petog \"><summary class=\"a3-blocktt pet e\"><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\">A열부터 C열까지 열 전체를 삭제해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">2</span><span class=\"prompt-text\">머리글에 '코드'가 들어간 열을 모두 삭제해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">3</span><span class=\"prompt-text\">값이 전부 0인 열을 모두 삭제해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">4</span><span class=\"prompt-text\">모든 금액 열에 천 단위 구분 쉼표를 적용해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">5</span><span class=\"prompt-text\">머리글 행에 필터를 걸어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">6</span><span class=\"prompt-text\">발주금액 열을 기준으로 오름차순으로 정렬해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">7</span><span class=\"prompt-text\">'발주 불용예상액' 열에서 예산이 많이 남은(금액이 큰) 항목과 마이너스(초과 집행)인 항목을 프로젝트별로 정리하고, 각 부서에 보낼 예산 사용 안내 문구 초안을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div><span class=\"game-hint\">1~3=열 정리 · 4=천원 표시 · 5=필터 · 6=정렬(핵심!) · 7=분석·공지</span></li><li>제미나이가 <b>삭제·정렬을 바로 못 하면</b>: 지울 열은 “열 이름을 알려줘”로 찾아 우클릭 → 삭제, 정렬은 데이터 선택 후 <b>데이터 → 범위 정렬</b>로 직접 하면 돼요</li><li>결과가 어색하면 “고쳐줘” 한마디면 다시 고쳐줘요 (오류 걱정 없이)</li></ol><div class=\"item-note\">이어서 해 볼 <b>예산집행현황</b> 실습(프롬프트 7개)은 맨 아래 ‘📁 참고용 실습’에서 볼 수 있어요</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 한 걸음 더 — 부서 예산요구 양식 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">정리한 표(A~G)를 <b>부서가 직접 채우는 예산 요구 양 rd\"><span class=\"prompt-num\">3</span><span class=\"prompt-text\">B열에 부서별로 색상을 달리해서 드롭다운을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">4</span><span class=\"prompt-text\">똑같은 내용이 두 번 들어간 행 중 하나는 삭제해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">5</span><span class=\"prompt-text\">H열에 집행률(집행액÷예산액, %), I열에 잔액(예산액−집행액) 수식을 만들어줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">6</span><span class=\"prompt-text\">집행률(H열)이 30% 미만인 항목을 빨간색으로 표시하고, '저조 원인' 메모 열을 추가해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">7</span><span class=\"prompt-text\">E열(올해 집행액)과 F열(전년도 집행액)의 증감률을 구해서 K열에 정리해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></li><li>결과가 어색하면 “고쳐줘” 한마디면 다시 고쳐줘요 (오류 걱정 없이)</li><li>마지막에 “부서별 집행액을 막대그래프로 그려줘”로 마무리</li></ol></div></li></ul></div></details><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">📅 구글 캘린더 — 말로 일정 등록<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><p class=\"item-lead\">Gemini 채팅창에서 <b>말로</b> 일정을 등록해 봅니다. 날짜·시간·내용만 말하면 됩니다.</p><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\">내일 <span class=\"hl-b\">오후 3시</span>에 <span class=\"hl-r\">사출 3호기 금형 교체 작업 점검 회의</span> 일정 <span class=\"hl-b\">1시간</span> 추가해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">2</span><span class=\"prompt-text\">이번 주 금요일 <span class=\"hl-b\">오전 10시부터 11시 반까지</span> <span class=\"hl-r\">월간 품질 개선 회의</span> 캘린더에 등록해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">3</span><span class=\"prompt-text\">다음 주 월요일 <span class=\"hl-b\">오전 9시</span>, <span class=\"hl-r\">협력사와 진행하는 납품 일정 확인 미팅</span> 일정 추가해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">4</span><span class=\"prompt-text\"><span class=\"hl-b\">@Google Calendar</span> 내일 <span class=\"hl-r\">협력사 대표님</span>과 <span class=\"hl-b\">오후 12시부터 2시까지</span> 점심 일정 추가해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>💡 등록한 뒤에는</b>Google 캘린더에서 날짜와 시간이 맞게 들어갔는지 <b>한 번 확인</b>하세요. 틀리면 “시간을 오후 4시로 바꿔 줘”처럼 말로 고칠 수 있습니다.</div></div></details><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">🎥 Meet — 회의 자동 기록<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"tip\"><b>✅ 핵심</b>Google Meet는 <b>회의 녹화·전사 기능</b>을 내장하고 있어, 회의 종료 후 <b>Drive에 회의록 파일이 자동으로 생성</b>됩니다. 이를 <b>Gemini Notebook(노트북LM)</b>에 업로드하면 <b>출처 기반 요약</b>과 <b>액션 아이템 자동 추출</b>이 가능합니다.</div><div class=\"tip\"><b>✅ 적용 예시</b>월간 생산 회의 녹화본 → Meet로 <b>자동 전사</b> → 노트북LM에 업로드 → <b>3분 안에 회의록 요약</b> 완성. (프롬프트는 아래 “회의록으로 Gemini에게 시켜 보기”)</div><br><br><h4>📹 Google Meet 회의 대화 텍스트 변환 및 다운로드 사용법</h4><p class=\"item-lead\"><b>① 로그인 → 새 회의 → 회의 선택 → 회의 시작</b><br>구글에서 “구글밋”을 검색해 Google Meet를 열고 로그인합니다. <b>새 회의</b>에서 <b>즉석 회의</b> 또는 <b>나중에 진행할 회의</b>를 고른 뒤 회의를 시작합니다.</p><br><br><img class=\"zoomimg\" src=\"images/meet-1.png\" alt=\"구글에서 구글밋을 검색하는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">구글에서 “구글밋”을 검색해 Meet를 엽니다.</p><br><br><p class=\"item-lead\"><b>② 설정 → 기록 기능 활성화</b><br>회의 화면 아래 <b>⋮(더보기)</b>를 눌러 <b>설정 → 회의 기록</b>에서 <b>Gemini로 회의록 작성하기</b>와 <b>회의 스크립트 작성</b>을 켭니다.</p><br><br><img class=\"zoomimg\" src=\"images/meet-2.png\" alt=\"회의 화면 아래 더보기 버튼\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:420px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">빨간 테두리의 ⋮(더보기)를 누릅니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/meet-3.png\" alt=\"설정 창의 회의 기록 탭\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:560px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">설정 → 회의 기록 탭에서 두 항목에 체크합니다.</p><br><br><p class=\"item-lead\"><b>③ 회의 중 기록 상태 확인</b><br>켜면 “Gemini가 자동 회의록을 작성 중입니다”가 보입니다. 끝내려면 <b>회의록 작성 중지</b>를 누릅니다.</p><br><br><img class=\"zoomimg\" src=\"images/meet-4.png\" alt=\"자동 회의록 작성 중 화면과 중지 확인 창\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">작성 중 안내(왼쪽)와 중지 확인 창(오른쪽)</p><br><br><p class=\"item-lead\"><b>④ 회의 종료 후 결과 확인</b><br>Google Drive에 <b>Meet Recordings</b> 폴더가 생기고 그 안에 <b>회의록 파일</b>이 만들어집니다. (약 5~10분 걸립니다)</p><br><br><img class=\"zoomimg\" src=\"images/meet-5.png\" alt=\"Drive의 Meet Recordings 폴더\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:560px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">Drive 첫 화면의 Meet Recordings 폴더</p><br><br><br><br><img class=\"zoomimg\" src=\"images/meet-6.png\" alt=\"Meet Recordings 폴더 안의 회의록 파일\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">폴더 안에 Gemini가 작성한 회의록 파일이 생깁니다.</p><br><br><br><br><h4>📄 회의록 저장 위치와 내려받기</h4><ul><li>회의록은 <b>회의 주최자 계정</b>에 저장됩니다.</li><li><b>문서(Docs) 형태</b>로 만들어집니다.</li></ul><br><br><img class=\"zoomimg\" src=\"images/meet-7.png\" alt=\"Drive에서 연 회의록 문서\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">회의록은 요약·세부정보로 정리된 문서로 열립니다. (내용은 가렸습니다)</p><br><br><ol class=\"steps\"><li><b>Google Drive</b>에 접속합니다.</li><li>해당 <b>회의 기록 문서</b>를 엽니다.</li><li><b>파일</b> 메뉴를 누릅니다.</li><li><b>다운로드</b>를 고릅니다.</li><li>원하는 형식을 골라 받습니다. <b>PDF · Word · 텍스트 파일</b></li></ol><br><br><h4>🤖 회의록으로 Gemini에게 시켜 보기</h4><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\">이 회의록의 <span class=\"hl-r\">핵심</span>을 요약해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">2</span><span class=\"prompt-text\"><span class=\"hl-b\">의사결정 사항</span>만 정리해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">3</span><span class=\"prompt-text\"><span class=\"hl-r\">액션 아이템</span>만 추출해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">4</span><span class=\"prompt-text\"><span class=\"hl-b\">협력사 요구사항</span>을 정리해줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>💡 기록하기 전에</b>회의를 기록한다는 사실을 <b>참석자에게 먼저 알리세요.</b> 외부 협력사와 하는 회의는 특히 더 그렇습니다. 이 기능이 보이지 않으면 회사 관리자 설정이나 요금제를 확인해야 합니다.</div></div></details><div class=\"tip\"><b>💡 작업일보 이력관리</b>Sheets는 <b>“맞춤 실습” 탭</b>에서 <b>구글 폼 → 구글 시트</b>로 이어서 직접 해 봅니다. 폼에 입력하면 시트에 자동으로 쌓이고, 시트에서 설비별로 골라 볼 수 있습니다.</div></div></li><li style=\"list-style:none;height:96px\"></li><li class=\"grp\" style=\"list-style:none;margin:18px 0 6px;padding:8px 12px;border-left:4px solid #1a73e8;background:#eef4ff;border-radius:6px\"><b>참고</b> <span style=\"color:#555;font-size:.92em\">도입 전에 알아 둘 내용</span></li><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">📚 참고 — 개인 계정과 회사(기관) 계정, 무엇이 다른가요? (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">나중에 회사에서 도입을 검토할 때를 위해, <b>개인 계정과 회사 계정의 차이</b>를 먼저 알아 둡니다.</div><div class=\"cmp\"><div class=\"cmp-h\"><div class=\"a\">👤 개인 계정 (이번 수강생)</div><div class=\"b\">🏢 회사(기관) 계정 — Google Workspace</div></div><div class=\"cmp-row\"><div class=\"cmp-l\">누가 관리하나</div><div class=\"cmp-r2\"><div class=\"a\">본인</div><div class=\"b\"><b>회사 관리자</b>가 서비스를 켜고 끔</div></div></div><div class=\"cmp-row\"><div class=\"cmp-l\">데이터</div><div class=\"cmp-r2\"><div class=\"a\">내 계정의 <b>활동·개인정보 설정</b>을 직접 확인</div><div class=\"b\">구글은 비즈니스·엔터프라이즈 에디션의 입력·결과가 <b>조직 안에 머물고, 허락 없이 도메인 밖 모델 학습에 쓰이지 않는다</b>고 안내</div></div></div><div class=\"cmp-row\"><div class=\"cmp-l\">Gmail·Docs·Sheets 속 Gemini</div><div class=\"cmp-r2\"><div class=\"a\">요금제에 따라 기능이 다름 (아래 요금제 비교)</div><div class=\"b\">에디션에 따라 다름. 관리자가 허용해야 함</div></div></div><div class=\"cmp-row\"><div class=\"cmp-l\">Gemini 앱에서 메일·드라이브 연결(@)</div><div class=\"cmp-r2\"><div class=\"a\"><b>Keep 활동(활동 저장)</b>이 켜져 있어야 함</div><div class=\"b\">관리자가 앱 연결을 먼저 허용해야 함</div></div></div><div class=\"cmp-row\"><div class=\"cmp-l\">Gemini Enterprise</div><div class=\"cmp-r2\"><div class=\"a\">—</div><div class=\"b\"><b>Workspace 구독에 포함되지 않고 별도 라이선스 구매</b>가 필요한 상품</div></div></div></div><div class=\"tip\"><b>📌 요금제별 차이 (구글 도움말 기준)</b>개인 계정은 <b>무료일 때 Gmail의 일부 기능</b>(Help me write 등)만, <b>Google AI Pro 이상</b>에서 Docs·Sheets·Slides 기능이 더해지는 것으로 안내됩니다. 회사 계정은 <b>Business Standard 이상</b>에서 Docs·Sheets·Slides 기능이 제공됩니다. 지역·시점에 따라 달라질 수 있으니 <b>내 화면에서 직접 확인</b>하세요.</div><h4>도입 전에 확인할 질문 5가지</h4><ol class=\"steps\"><li>우리 데이터가 <b>AI 모델 학습에 쓰이는지</b> (계약·정책 문서로 확인)</li><li><b>누가 어떤 파일까지</b> 접근할 수 있는지 (권한 설정)</li><li>관리자가 <b>사용 현황</b>을 볼 수 있는지</li><li>어떤 에디션·라이선스가 필요하고 <b>비용은 얼마</b>인지</li><li>회사 <b>보안 정책</b>(외부 AI 사용 가능 범위)과 맞는지</li></ol><div class=\"tip\"><b>💡 정리</b>도입은 <b>회사 관리자·담당자와 상의</b>해서 결정합니다. 오늘은 “무엇을 확인해야 하는지”만 알아 두세요.</div></div></li></ul>", "m5": "<h2 class=\"s-title\">📚 NotebookLM로 영상·인포그래픽 만들기</h2><p class=\"s-sub\">내 문서만 보고 답하는 AI — 읽고 · 확인하고 · 그림·영상으로 바꾸기</p><div class=\"tools\"><span>NotebookLM</span><span>Gemini</span></div><div class=\"concept\"><b>이 시간의 목표</b> — 내가 올린 문서만 근거로 답하는 NotebookLM으로 <b>내 업무 문서를 정리</b>하고, <b>출처를 눌러 맞는지 확인</b>하는 습관을 익힙니다. 계약서 검토(맞춤사례 4)로 연습합니다. <span class=\"game-hint\">(약 40분)</span><div class=\"goalref\">(수업 목표 4)</div></div><div class=\"block open\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">실습</span><span class=\"block-t\">NotebookLM 따라 하기</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① NotebookLM이란? — 내 문서만 보고 답하는 AI (약 3분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">쉽게 말해, <b>내가 올린 문서만 읽고 답하는 AI</b>입니다. 답마다 “문서 어디에서 나온 말인지” <b>출처 번호</b>가 붙습니다.</div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th></th><th>일반 Gemini</th><th>NotebookLM</th></tr></thead><tbody><tr><td class=\"pt-cat\">답의 근거</td><td>인터넷과 AI가 아는 지식</td><td><b>내가 올린 문서</b></td></tr><tr><td class=\"pt-cat\">출처</td><td>확인하기 어려움</td><td><b>출처 번호를 누르면 원문이 열림</b></td></tr><tr><td class=\"pt-cat\">잘 맞는 일</td><td>아이디어, 초안, 일반 질문</td><td><b>계약서·작업일보·매뉴얼 같은 내 문서 정리</b></td></tr></tbody></table></div><div class=\"tip\"><b>💡 그래도 확인은 내 몫</b>NotebookLM도 틀릴 수 있습니다. 하지만 출처 번호를 눌러 <b>원문과 바로 비교</b>할 수 있어서 확인이 쉽습니다. 오늘 실습의 핵심입니다.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 노트북 만들고 자료 올리기 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">내 문서를 담는 <b>나만의 노트북</b>을 만듭니다.</div><ol class=\"steps\"><li><b>notebooklm.google.com</b>에 접속해 구글 계정으로 로그인합니다.</li><li><b>새 노트북</b>을 만듭니다.</li><li><b>소스 추가 → 파일 업로드</b>를 누르고 실습 자료를 올립니다. (PDF·Word·구글 문서 등. 웹 주소나 유튜브 링크도 넣을 수 있습니다.)</li><li>올리면 화면에 <b>요약</b>이 나옵니다. 문서가 제대로 읽혔는지 훑어봅니다.</li></ol><div class=\"tip\"><b>📌 화면 안내</b>NotebookLM 화면의 메뉴 이름은 업데이트로 바뀔 수 있습니다. 이름이 다르면 화면의 안내를 따라가세요.</div><div class=\"warn\"><b>⚠️ 실제 문서는 이렇게</b>실제 업무 문서는 <b>회사명·금액·이름을 가리고</b> 올립니다. 내 계정의 데이터 사용·학습 설정도 먼저 확인하세요.</div></div></li><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 맞춤사례 4 — 같은 계약서를 NotebookLM으로 확인하기 (약 15분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">나만의 AI 비서 탭에서 쓴 <b>같은 가상 계약서</b>로 해 봅니다. 앞의 세 도구와 <b>무엇이 다른지</b>, 특히 <b>출처 번호로 근거를 확인</b>하는 점에 주목하세요.</div><div class=\"tip\"><b>📎 실습 자료</b>앞의 <b>나만의 AI 비서 탭에서 내려받은 같은 가상 계약서</b>(Word 또는 PDF)를 씁니다. 같은 계약서로 <b>도구마다 무엇이 다른지</b> 비교하는 시간입니다.</div><h4>① 계약서를 소스로 올리기</h4><ol class=\"steps\"><li>notebooklm.google.com에서 <b>새 노트북</b>을 만들고 <b>소스 추가</b>로 계약서(Word 또는 PDF)를 올립니다.</li><li>소스 목록에 계약서가 보이면 준비가 끝납니다. <b>이 노트북은 이 계약서만 보고 답합니다.</b></li></ol><h4>② 근거를 눌러 확인하며 묻기</h4><p class=\"item-lead\">앞에서 한 것처럼 “위험한 조항을 모두 찾아 줘”도 되지만, NotebookLM은 <b>답마다 붙는 출처 번호</b>가 강점이라 <b>근거를 확인하는 질문</b>으로 해 봅니다.</p><div class=\"prompt-card\"><span class=\"prompt-num\">31</span><span class=\"prompt-text\"><span class=\"hl-b\">제7조 지체상금</span>은 어떤 경우에 얼마를 내야 하는지 설명해 줘. <span class=\"hl-r\">원문을 그대로 인용하고 조항 번호를 붙여 줘.</span></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"prompt-card\"><span class=\"prompt-num\">32</span><span class=\"prompt-text\">이 계약서에서 <span class=\"hl-r\">을(협력사)에게만 의무가 있고 갑에게는 같은 의무가 없는 조항</span>을 모두 찾아 줘. 조항 번호와 원문을 함께 보여 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>✅ 이렇게 확인하세요</b>① 답 끝의 <b>출처 번호를 눌러</b> 오른쪽에 열리는 <b>원문과 같은지</b> 봅니다 ② 크롬 사이드바·젬·스킬에서 받은 답과 <b>같은 조항을 짚었는지</b> 비교합니다 ③ 수정 제안은 <b>초안</b>일 뿐이라 실제 계약은 <b>전문가 확인</b>이 필요합니다.</div><h4>③ 한 장으로 정리하기 — 브리핑 문서</h4><p class=\"item-lead\">화면 오른쪽 <b>Studio</b>에서 <b>브리핑 문서</b>(또는 비슷한 이름)를 만들면 계약서의 핵심이 한 장으로 정리됩니다. 팀장에게 보고할 때 바로 쓸 수 있습니다. 만들기 전에 아래처럼 <b>강조할 점</b>을 적어 주면 좋습니다.</p><div class=\"prompt-card\"><span class=\"prompt-num\">33</span><span class=\"prompt-text\"><span class=\"hl-b\">협력사(을) 입장에서 위험한 조항 5가지</span>를 중심으로 팀장에게 보고할 수 있게 정리해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><hr style=\"border:0;border-top:1px dashed #cbd5d1;margin:16px 0\"><div class=\"tip\"><b>📊 같은 계약서, 네 가지 도구 — 무엇이 다른가</b><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th></th><th>제미나이 인 크롬</th><th>젬</th><th>스킬</th><th>NotebookLM</th></tr></thead><tbody><tr><td class=\"pt-cat\">올리는 방식</td><td>열어 둔 탭을 읽음</td><td>파일 첨부</td><td>파일 첨부</td><td><b>소스로 올려 보관</b></td></tr><tr><td class=\"pt-cat\">답의 근거</td><td>AI가 읽은 내용</td><td>AI가 읽은 내용</td><td>AI가 읽은 내용</td><td><b>올린 문서 안에서만, 출처 번호로 확인</b></td></tr><tr><td class=\"pt-cat\">외부 정보</td><td>섞일 수 있음</td><td>섞일 수 있음</td><td>섞일 수 있음</td><td><b>섞이지 않음</b></td></tr><tr><td class=\"pt-cat\">이럴 때</td><td>급할 때 한 번</td><td>같은 검토를 반복</td><td>여러 대화에서 같은 기준</td><td><b>중요한 문서의 근거 확인</b></td></tr></tbody></table></div></div><div class=\"tip\"><b>🔒 중요한 계약서는 NotebookLM에서</b>NotebookLM은 <b>올린 자료로 AI 모델을 학습시키지 않는다</b>고 구글이 안내하고(계정 종류별 최신 안내는 <b>공식 도움말에서 확인</b>), 답이 <b>내가 올린 문서 안에서만</b> 나와 외부 데이터가 섞이지 않습니다. 그래도 <b>회사명·금액·연락처는 가리고</b> 올리는 습관은 유지하세요.</div><p class=\"item-lead\"><b>내 계약서에 쓰려면</b> — 앞의 <b>파란 글씨</b>(우리 회사 입장, 걱정되는 항목)만 내 계약에 맞게 바꾸고, 계약서만 내 사본으로 바꿔 올립니다.</p><div class=\"tip\"><b>➡️ 검토가 끝나면 — 다음 단계</b>AI 검토는 <b>출발점</b>입니다. ① 위험 조항 중 <b>꼭 고쳐야 할 것 3~5개</b>를 사람이 고릅니다 ② 조항마다 <b>수정안과 이유</b>(예: 지체상금 상한 설정)를 정리합니다 ③ 이를 근거로 <b>상대방에게 “수정 요청” 메일</b>을 씁니다 (이 단계는 AI에게 초안을 맡겨도 됩니다) ④ 중요한 계약은 <b>법무·변호사 또는 관련 지원기관</b>에서 확인받고 서명합니다. 협상이 안 되면 <b>서명하지 않거나 조건을 받아들일 수 있는지</b>는 사람이 결정합니다.</div><div class=\"tip\"><b>🧩 “여러 곳에서 온 엑셀 파일을 하나로 합치기”는 오후에</b>양식이 제각각인 엑셀을 합치는 일은 <b>오후 코덱스 시간</b>에 폴더의 파일을 한꺼번에 읽어 정리하는 방식으로 합니다.</div><details class=\"petog dotted\"><summary class=\"a3-blocktt petog-sum\">왜 NotebookLM인가요? — 인터넷 검색과 다른 점 (강사 설명)<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><p class=\"item-lead\">Deep Research는 <b>웹</b>에서 자료를 찾고, NotebookLM은 <b>내가 올린 자료 안에서만</b> 답합니다. 내 문서를 근거로 하는 일에 알맞고, 답마다 <b>어디서 나온 말인지</b> 바로 확인할 수 있습니다.</p></div></details></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ 영상·인포그래픽·슬라이드 만들기 (약 10분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">같은 자료를 <b>보여 주는 형태</b>로 바꿉니다. <b>생성에 시간이 걸리니, 시작해 두고 ③을 이어서 하세요.</b></div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>기능</th><th>만들어지는 것</th><th>이럴 때</th></tr></thead><tbody><tr><td class=\"pt-cat\">오디오 개요</td><td>문서 내용을 팟캐스트 대화로</td><td>이동 중에 들으며 문서 파악</td></tr><tr><td class=\"pt-cat\">슬라이드</td><td>10장 내외 요약 슬라이드</td><td>보고·발표 자료 초안</td></tr><tr><td class=\"pt-cat\">마인드맵</td><td>주제와 아이디어를 가지 구조로</td><td>자료의 큰 그림 파악</td></tr><tr><td class=\"pt-cat\">동영상 개요</td><td>이미지·숫자·인용을 쓴 영상형 요약</td><td>내용을 영상으로 공유</td></tr><tr><td class=\"pt-cat\">인포그래픽</td><td>핵심을 한 장의 그림으로</td><td>회의에서 한눈에 설명</td></tr><tr><td class=\"pt-cat\">브리핑 문서</td><td>자료를 1페이지로 요약</td><td>회의 전 빠른 확인</td></tr><tr><td class=\"pt-cat\">FAQ</td><td>예상 질문과 답</td><td>신입 설명·문의 대응 자료</td></tr><tr><td class=\"pt-cat\">타임라인</td><td>시간순 정리</td><td>일의 경과 파악</td></tr></tbody></table></div><ol class=\"steps\"><li>화면 오른쪽 <b>Studio</b> 영역(또는 비슷한 이름의 메뉴)을 엽니다.</li><li><b>인포그래픽</b>, <b>동영상 개요</b>, <b>슬라이드</b> 중 하나를 고릅니다. 마인드맵은 빨리 만들어집니다.</li><li>완성되면 내용이 원문과 맞는지 <b>한 번 훑어봅니다</b>.</li></ol><p class=\"item-lead\">만들기 전에 <b>무엇을 강조할지</b> 적어 주면 결과가 좋아집니다. 내가 고른 실습에 맞게 바꿔 붙여 보세요.</p><div class=\"prompt-card\"><span class=\"prompt-num\">3</span><span class=\"prompt-text\"><span class=\"hl-b\">가장 중요한 5가지</span>를 중심으로, 팀장에게 설명할 수 있게 정리해 줘. <span class=\"hl-b\">(예: 계약서라면 대금 지급과 지체상금을 먼저 / 매뉴얼이라면 안전 주의사항을 먼저)</span></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>📌 화면 안내</b>어떤 기능이 보이는지는 계정과 시점에 따라 다를 수 있습니다. 보이는 것 하나만 해도 충분합니다.</div><div class=\"warn\"><b>⚠️ 그대로 쓰기 전에</b>그림·영상 안의 <b>숫자와 문구</b>가 원문과 같은지 확인합니다. 보기 좋아도 틀릴 수 있습니다.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ (선택) 슬라이드를 고치고 싶다면 — Canvas로 편집 가능하게 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">NotebookLM 슬라이드는 <b>이미지로 나와서 글자를 고치기 어렵습니다.</b> 내용을 복사해 Gemini <b>Canvas</b>에서 고칠 수 있는 슬라이드로 다시 만들 수 있습니다.</div><ol class=\"steps\"><li>NotebookLM 채팅 답변(표)을 <b>복사</b>합니다.</li><li>Gemini 새 대화에서 <b>도구(또는 + 버튼) → Canvas</b>를 켭니다.</li><li>아래 프롬프트와 복사한 내용을 함께 붙여넣습니다.</li><li>결과를 확인하고, 마음에 들면 <b>Slides로 내보냅니다</b>.</li></ol><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">4</span><span class=\"prompt-text\">아래 내용을 바탕으로 <span class=\"hl-b\">팀장 보고용 슬라이드 5장</span>을 만들어 줘.<br><span class=\"hl-r\">숫자와 날짜는 아래 내용에 있는 것만 쓰고, 임의로 만들지 마.</span><br><br>[여기에 복사한 내용을 붙여넣기]</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>📌 화면 안내</b>Canvas 메뉴 위치는 업데이트로 바뀔 수 있습니다. 보이지 않으면 새로고침하거나 모델을 바꿔 보세요.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑥ 내 업무에 적용하고 제출하기 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">오늘 한 흐름을 <b>내 문서</b>로 바꿔 봅니다.</div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>내 업무</th><th>올릴 문서</th><th>시킬 일</th></tr></thead><tbody><tr><td class=\"pt-cat\">작업일보·설비 이력</td><td>작업일보, 점검 기록</td><td>반복 이상·미조치 항목 정리</td></tr><tr><td class=\"pt-cat\">품질·검사</td><td>검사 기준서, 불량 보고서(가린 것)</td><td>반복 불량 원인 정리</td></tr><tr><td class=\"pt-cat\">구매·협력사</td><td>협력사 제안서, 계약서(가린 것)</td><td>업체별 조건 비교, 위험 조항 찾기</td></tr><tr><td class=\"pt-cat\">영업</td><td>제품 자료, 고객 피드백</td><td>고객 요구 정리</td></tr><tr><td class=\"pt-cat\">환경·측정</td><td>측정 결과표, 기준 문서</td><td>기준 초과 항목 정리</td></tr></tbody></table></div><div class=\"tip\"><b>🔒 넣지 마세요</b>고객사 기밀, 개인정보, 계약 금액은 가리고 올립니다. 가릴 수 없는 문서는 올리지 않습니다.</div><p class=\"item-lead\"><b>패들렛 제출</b> — 만든 인포그래픽(또는 영상·슬라이드) <b>한 가지</b>를 패들렛에 올려 주세요.</p></div></li></ul></div></div>", "m6": "<h2 class=\"s-title\">🛠️ 맞춤 실습</h2><p class=\"s-sub\">사전설문에서 나온 요청으로 만든 사례입니다 — <b>내 업무에 가까운 하나</b>를 골라 해 보세요 (구글 폼 + 구글 시트 + 웹 화면)</p><style>.cs-flow{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0 14px;font-weight:700;font-size:14px}.cs-flow span{background:#fff;border:1px solid #dadce0;border-radius:20px;padding:6px 14px}.cs-flow i{font-style:normal;color:#9aa0a6}.cs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin:0 0 14px}.cs-card{background:#fff;border:1px solid #dadce0;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;color:#202124}.cs-card:hover{box-shadow:0 3px 10px rgba(0,0,0,.18)}.cs-top{padding:12px 14px;color:#fff;display:flex;gap:10px;align-items:center}.cs-n{font-size:30px;font-weight:800;line-height:1}.cs-t{font-size:15px;font-weight:800;line-height:1.25}.cs-mock{height:74px;margin:12px 14px 4px;border-radius:8px;background:#f1f3f4;padding:8px;display:flex;flex-direction:column;gap:5px;justify-content:center}.cs-body{padding:6px 14px 14px;font-size:13px;line-height:1.5;flex:1}.cs-body b{display:block;font-size:11px;color:#5f6368;margin-top:7px}.cs-q{font-style:italic;color:#3c4043;margin-top:6px}.cs-go{padding:9px 14px;font-size:13px;font-weight:800;border-top:1px solid #eee;text-align:right}.cs-r{display:flex;gap:5px;align-items:center}.cs-r u{display:block;height:8px;border-radius:4px;background:#c4c7c5;text-decoration:none}.cs-r s{display:block;width:34px;height:12px;border-radius:6px;text-decoration:none}.cs-bars .cs-r{gap:6px}.cs-bars em{display:block;height:11px;border-radius:6px;font-style:normal}.cs-k{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;height:100%}.cs-k div{background:#e3e5e8;border-radius:4px;padding:3px;display:flex;flex-direction:column;gap:3px}.cs-k i{display:block;height:9px;border-radius:3px;background:#fff}</style><div class=\"cs-flow\"><span>① 폼에 입력</span><i>→</i><span>② 시트에 한 줄씩 쌓임</span><i>→</i><span>③ 웹 화면에서 한눈에</span></div><div class=\"cs-grid\"><div class=\"cs-card\" onclick=\"openCase(1)\"><div class=\"cs-top\" style=\"background:#1a73e8\"><div class=\"cs-n\">1</div><div class=\"cs-t\">작업일보 이력관리</div></div><div class=\"cs-mock\"><div class=\"cs-r\"><u style=\"width:46px\"></u><u style=\"flex:1\"></u><s style=\"background:#a8c7fa\"></s></div><div class=\"cs-r\"><u style=\"width:46px\"></u><u style=\"flex:1\"></u><s style=\"background:#c4eed0\"></s></div><div class=\"cs-r\"><u style=\"width:46px\"></u><u style=\"flex:1\"></u><s style=\"background:#fad2cf\"></s></div></div><div class=\"cs-body\"><b>한 줄이 뜻하는 것</b>한 번의 작업<b>화면이 하는 일</b>설비별·분류별로 <b style=\"display:inline;font-size:13px;color:inherit;margin:0\">거르고 검색</b><div class=\"cs-q\">“그 설비 지난달에 무슨 일 있었지?”</div></div><div class=\"cs-go\" style=\"color:#1a73e8\">자세히 보기 ▸</div></div><div class=\"cs-card\" onclick=\"openCase(2)\"><div class=\"cs-top\" style=\"background:#188038\"><div class=\"cs-n\">2</div><div class=\"cs-t\">원부자재 재고 파악</div></div><div class=\"cs-mock\"><div class=\"cs-bars\"><div class=\"cs-r\"><u style=\"width:46px\"></u><em style=\"width:80%;background:#34a853\"></em></div><div class=\"cs-r\"><u style=\"width:46px\"></u><em style=\"width:42%;background:#f9ab00\"></em></div><div class=\"cs-r\"><u style=\"width:46px\"></u><em style=\"width:14%;background:#d93025\"></em></div></div></div><div class=\"cs-body\"><b>한 줄이 뜻하는 것</b>한 번의 입고·출고<b>화면이 하는 일</b>입고 − 출고를 <b style=\"display:inline;font-size:13px;color:inherit;margin:0\">합산</b>, 부족하면 경고<div class=\"cs-q\">“지금 얼마 남았지?”</div></div><div class=\"cs-go\" style=\"color:#188038\">자세히 보기 ▸</div></div><div class=\"cs-card\" onclick=\"openCase(3)\"><div class=\"cs-top\" style=\"background:#e37400\"><div class=\"cs-n\">3</div><div class=\"cs-t\">접수·진행 현황판</div></div><div class=\"cs-mock\"><div class=\"cs-k\"><div><i></i><i style=\"border-left:4px solid #d93025\"></i></div><div><i></i></div><div><i style=\"border-left:4px solid #f9ab00\"></i></div><div><i></i><i></i></div></div></div><div class=\"cs-body\"><b>한 줄이 뜻하는 것</b>한 건의 한 순간 상태<b>화면이 하는 일</b>번호마다 <b style=\"dis
