<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gemini 생태계 활용</title>
<style>
 :root{--blue:#BFA05F;--blue-d:#8A6D2E;--green:#BFA05F;--ink:#172C2B;--line:#D8DFD7;--bg:#F5F5ED;--muted:#60736C;}
 *{box-sizing:border-box}
 body{margin:0;font-family:'Malgun Gothic','맑은 고딕',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);font-size:20px;line-height:1.95;}
 .wrap{max-width:1080px;margin:0 auto;padding:0 16px 60px;}
 header.top{position:relative;overflow:hidden;background:linear-gradient(120deg,#142C27 0%,#1F3F39 55%,#28524A 100%);color:#EFF8F3;padding:32px 24px;border-radius:0 0 18px 18px;border-bottom:2px solid rgba(201,168,76,.55);box-shadow:0 6px 22px rgba(10,18,40,.32);}
 header.top::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 45%);pointer-events:none;}
 header.top>*{position:relative;z-index:1;}
 header.top .kicker{font-size:15px;letter-spacing:.10em;color:#CDB478;margin:0 0 9px;font-weight:700;}
 header.top h1{margin:0;font-size:31px;font-weight:800;letter-spacing:-.01em;color:#E4C778;text-shadow:0 1px 10px rgba(201,168,76,.18);}
 header.top .sub{margin:11px 0 0;font-size:17px;color:#C5DED2;}
 .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 18px;}
 .tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:13px 18px;font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s;}
 .tab:hover:not(.active){border-color:#9CB3A8;}
 .tab.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 12px rgba(30,50,90,.18);}
 .tab.active[data-tab="home"]{background:#1F3F39;border-color:#1F3F39;}
 .tab.active[data-tab="1"]{background:#509688;border-color:#509688;}
 .tab.active[data-tab="2"]{background:#8A6D2E;border-color:#8A6D2E;}
 .tab.active[data-tab="3"]{background:#61978C;border-color:#61978C;}
 .tab.active[data-tab="4"]{background:#A8842F;border-color:#A8842F;}
 .tab.active[data-tab="5"]{background:#9C5F74;border-color:#9C5F74;}
 .tab.active[data-tab="gift"]{background:linear-gradient(135deg,#C9A84C,#A8842F);border-color:#A8842F;color:#fff;}
 .tab .tab-date{font-size:13px;font-weight:600;opacity:.75;margin-left:3px;}
 .panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:36px 34px;box-shadow:0 2px 10px rgba(20,40,90,.05);min-height:340px;}
 .s-title{font-size:33px;margin:2px 0 6px;color:var(--blue-d);font-weight:800;line-height:1.35;}
 .s-sub{margin:0 0 16px;color:var(--muted);font-size:20.5px;}
 .s-meta{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:18px;color:#3E504D;background:#F9F8F1;border:1px solid var(--line);border-radius:10px;padding:15px 18px;margin-bottom:8px;}
 h3.blk{font-size:23px;margin:52px 0 18px;padding-left:13px;border-left:5px solid var(--green);}
 .block{border:1px solid var(--line);border-radius:12px;margin-bottom:64px;overflow:hidden;}
 .block-head{display:flex;align-items:center;gap:12px;background:#FAF7EF;padding:16px 18px;cursor:pointer;user-select:none;transition:background .15s;}
 .block-head:hover{background:#E5F7EE;}
 .block.open .block-head{background:#E3F7ED;border-bottom:1px solid #D0F2E1;}
 .block-n{background:var(--blue);color:#fff;font-size:16px;font-weight:800;border-radius:6px;padding:5px 12px;white-space:nowrap;}
 .block-t{font-weight:800;font-size:21px;color:var(--blue-d);flex:1;line-height:1.4;}
 .block-h{font-size:14px;color:var(--muted);font-weight:700;}
 .chev{font-size:20px;color:var(--blue);font-weight:900;transition:transform .2s;line-height:1;}
 .block.open .chev{transform:rotate(180deg);}
 .block-body{display:none;}
 .block.open .block-body{display:block;}
 .block-ul{margin:0;padding:20px 22px 8px 40px;} .block-ul li{margin:16px 0;font-size:19px;line-height:1.75;}
 .item-detail{margin:26px 0;} .item-label{font-weight:800;color:var(--ink);}
 .item-detail.coll{margin:46px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 14px rgba(40,60,100,.09);}
 .item-detail.coll:first-child{margin-top:20px;}
 .item-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:15px 16px;background:#F9F8F1;font-size:19.5px;}
 .item-toggle:hover{background:#FAF7EF;}
 .item-detail.coll.open .item-toggle{background:#FAF7EF;border-bottom:1px solid var(--line);}
 .item-toggle .ichev{margin-left:auto;color:var(--blue);font-size:18px;transition:transform .2s;}
 .item-detail.coll.open .ichev{transform:rotate(180deg);}
 .item-detail.coll .item-body{display:none;padding:6px 14px 10px;}
 .item-detail.coll.open .item-body{display:block;}
 .item-detail.coll-green{border-color:#E4D9B8;}
 .item-detail.coll-green .item-toggle{background:#F7F2E7;}
 .item-detail.coll-green .item-toggle:hover{background:#DFF3E8;}
 .item-detail.coll-green.open .item-toggle{background:#DFF3E8;border-bottom-color:#E4D9B8;}
 .item-detail.coll-green .item-body{background:#F6FCF9;}
 .item-detail.coll-red{border-color:#F3C4C0;}
 .item-detail.coll-red .item-toggle{background:#FDECEC;}
 .item-detail.coll-red .item-toggle:hover{background:#FBDEDD;}
 .item-detail.coll-red.open .item-toggle{background:#FBDEDD;border-bottom-color:#F3C4C0;}
 .item-detail.coll-red .item-body{background:#FFFAFA;}
 .steps{margin:12px 0 6px;padding-left:26px;counter-reset:st;}
 .steps li{margin:12px 0;font-size:18px;line-height:1.75;color:#354D48;}
 .item-note{margin:8px 0 2px;font-size:16px;color:#8CA297;}
 .item-lead{margin:4px 0 10px;font-size:18px;line-height:1.75;color:#354D48;}
 /* roomy: 특정 차시만 간격 넓게 — 내용 바뀔때 2줄+, 큰주제 바뀔때 5줄+ */
 .block.roomy .steps li{margin:46px 0;}
 .block.roomy .steps{margin:26px 0 14px;}
 .block.roomy .item-lead{margin:8px 0 32px;}
 .block.roomy .item-note{margin:40px 0 6px;}
 .block.roomy .item-body{padding:20px 16px 28px;}
 .block.roomy .item-detail.coll{margin:58px 0;}
 .block.roomy .item-detail.coll:first-child{margin-top:22px;}
 .block.roomy .item-detail.coll.open{margin-bottom:120px;}
 .img-slot{border:2px dashed #BCDBCC;border-radius:12px;background:#FDFDF7;padding:26px 16px;text-align:center;color:#8CA297;font-size:14.5px;margin:10px 0;}
 .img-slot b{display:block;color:#5D706C;font-size:16px;margin-bottom:4px;}
 .doc-img{display:block;max-width:100%;height:auto;margin:14px 0 60px;border:1px solid #D8DFD7;border-radius:12px;box-shadow:0 3px 12px rgba(40,60,100,.10);}
 .setup{margin:8px 0 40px;border:1px solid #D9C9A0;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(40,60,100,.08);}
 .setup-head{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1F3F39,#2E5C53);color:#E4C778;padding:17px 20px;font-size:20px;font-weight:800;cursor:pointer;user-select:none;flex-wrap:wrap;}
 .setup-head .setup-sub{font-size:14.5px;font-weight:600;color:#B9D4C6;}
 .setup-head .chev{margin-left:auto;color:#E4C778;transition:transform .2s;}
 .setup.open .setup-head .chev{transform:rotate(180deg);}
 .setup-body{display:none;padding:20px 22px;background:#FBFEFC;}
 .setup.open .setup-body{display:block;}
 .setup-intro{margin:0 0 18px;font-size:17.5px;line-height:1.7;color:#354D48;background:#F7F2E7;border:1px solid #DDF5E9;border-radius:10px;padding:14px 16px;}
 .step{border:1px solid #E6DDC3;border-left:4px solid #C9A84C;border-radius:10px;padding:16px 18px 18px;margin:46px 0;background:#fff;}
 .step.step-red{background:#FFF5F5;border-color:#F3C4C0;border-left-color:#E05A4A;}
 .step-badge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,#C9A84C,#A8842F);padding:4px 12px;border-radius:20px;margin-bottom:10px;}
 .step-title{font-size:19px;font-weight:800;color:#172C2B;margin-bottom:12px;line-height:1.4;}
 .step-lead{margin:0 0 12px;font-size:16.5px;line-height:1.7;color:#3C4E4B;}
 .click-here{font-size:15px;font-weight:800;color:#C0392B;}
 .mini-toggle{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:#F3FAF6;border:1px solid #DDEFE6;color:#3C4E4B;border-radius:8px;padding:9px 15px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
 .mini-toggle:hover{border-color:#C9A84C;}
 .mini-toggle .mchev{color:#A8842F;font-size:14px;}
 .mini-body{display:none;margin-top:12px;font-size:16px;line-height:1.75;color:#3C4E4B;}
 .mini-body.show{display:block;}
 .mini-body ul{margin:8px 0 0;padding-left:22px;} .mini-body li{margin:6px 0;} .mini-body p{margin:0 0 8px;}
 .warn{background:#FFF5F5;border:1px solid #F3C4C0;border-radius:8px;padding:11px 14px;color:#A5372F;font-size:15.5px;line-height:1.7;margin-top:12px;}
 .game-flip{margin:36px 0 90px;perspective:1000px;}
 .game-cover{cursor:pointer;border-radius:18px;padding:44px 24px;text-align:center;color:#fff;box-shadow:0 8px 26px rgba(40,60,100,.2);transition:transform .2s;position:relative;overflow:hidden;}
 .game-cover:hover{transform:translateY(-4px);}
 .game-cover::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.16),rgba(255,255,255,0) 60%);pointer-events:none;}
 .game-cover.cov1{background:linear-gradient(140deg,#4FCC8E,#75D7A6);}
 .game-cover.cov2{background:linear-gradient(140deg,#F0902A,#E0542A);}
 .cover-badge{display:inline-block;font-size:14px;font-weight:900;letter-spacing:.08em;background:rgba(255,255,255,.22);padding:5px 15px;border-radius:20px;margin-bottom:12px;}
 .cover-emoji{font-size:66px;line-height:1;margin:6px 0;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18));}
 .cover-title{font-size:27px;font-weight:900;margin-bottom:12px;}
 .cover-hint{font-size:16.5px;font-weight:800;opacity:.96;}
 .game-content{display:none;}
 .game-flip.flipped .game-cover{display:none;}
 .game-flip.flipped .game-content{display:block;animation:flipin .5s ease;}
 .game-content .game.arcade{margin:0;}
 @keyframes flipin{0%{transform:perspective(900px) rotateY(-90deg);opacity:0}100%{transform:perspective(900px) rotateY(0);opacity:1}}
 .level-row{display:flex;gap:10px;margin:2px 0 16px;flex-wrap:wrap;}
 .level-btn{background:#EDF1EA;border:2px solid transparent;color:#3C4E4B;border-radius:12px;padding:10px 18px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
 .level-btn:hover{background:#E5F2EC;}
 .level-btn.active{background:linear-gradient(135deg,#4FCC8E,#75D7A6);color:#fff;box-shadow:0 3px 10px rgba(90,92,240,.28);}
 .g1-src{display:none;width:100%;min-height:110px;padding:14px 16px;border:2px solid #D1E4DB;border-radius:12px;font-size:16.5px;font-family:inherit;line-height:1.7;margin-bottom:14px;resize:vertical;background:#FDFDF7;}
 .g1-src:focus{outline:none;border-color:#F59E0B;box-shadow:0 0 0 4px rgba(245,158,11,.14);}
 .g1-inst{font-size:18px !important;background:linear-gradient(135deg,#F7F2E7,#E6F8EF) !important;border-color:#BDEBD4 !important;color:#246356 !important;}
 .cap-emoji-only{justify-content:center;}
 .cap-emoji-only .cap-emoji{font-size:96px;}
 .game.arcade{position:relative;border:0;border-radius:18px;padding:26px 24px;margin:24px 0;background:linear-gradient(160deg,#FFFFFF,#F6FCF9);box-shadow:0 8px 26px rgba(40,60,100,.13);overflow:hidden;}
 .game.arcade::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#60D199,#7AD8A9,#EC4899,#F59E0B,#BFA05F);}
 .arcade-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 6px;}
 .arcade-badge{font-size:13px;font-weight:900;letter-spacing:.05em;color:#fff;background:linear-gradient(135deg,#1F3F39,#407369);padding:5px 13px;border-radius:8px;box-shadow:0 2px 6px rgba(28,40,66,.25);}
 .arcade-title{font-size:23px;font-weight:900;color:#172C2B;}
 .arcade-keys{margin-left:auto;}
 .game-desc{margin:2px 0 18px;font-size:16.5px;line-height:1.75;color:#3C4E4B;}
 .game-hint{font-size:14.5px;font-weight:600;color:#60736C;}
 .mode-row{display:flex;gap:8px;margin:2px 0 18px;}
 .mode-btn{background:#EDF1EA;border:2px solid transparent;color:#3C4E4B;border-radius:24px;padding:9px 22px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s;}
 .mode-btn:hover{background:#E5F2EC;}
 .mode-btn.active{background:linear-gradient(135deg,#F59E0B,#E0724A);color:#fff;box-shadow:0 3px 10px rgba(224,114,74,.3);}
 .stage-row{display:flex;align-items:center;gap:12px;margin:10px 0 20px;}
 .dots{display:inline-flex;gap:8px;}
 .dot{width:15px;height:15px;border-radius:50%;background:#E0EDE6;box-shadow:inset 0 1px 2px rgba(0,0,0,.08);transition:.2s;}
 .dot.done{background:linear-gradient(135deg,#BFA05F,#BFA05F);}
 .dot.cur{background:#F59E0B;box-shadow:0 0 0 5px rgba(245,158,11,.18);animation:dotpulse 1.1s infinite;}
 @keyframes dotpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
 .stage-label{font-size:14px;font-weight:900;color:#A8842F;letter-spacing:.03em;}
 .g1-target{background:linear-gradient(135deg,#FFFDF3,#FFF4D0);border:2px dashed #E0C86A;border-radius:16px;padding:24px 18px;font-size:24px;font-weight:800;color:#2A2A2A;text-align:center;margin-bottom:14px;user-select:all;box-shadow:inset 0 2px 10px rgba(224,200,106,.18);}
 .game-start{background:linear-gradient(135deg,#F59E0B,#E0724A);color:#fff;border:0;border-radius:24px;padding:13px 26px;font-size:16.5px;font-weight:900;cursor:pointer;font-family:inherit;margin-bottom:12px;box-shadow:0 4px 12px rgba(224,114,74,.32);}
 .game-start:hover{filter:brightness(1.05);}
 .game-start.hidden{display:none;}
 .game-input{width:100%;padding:15px 16px;border:2px solid #D1E4DB;border-radius:12px;font-size:17px;font-family:inherit;transition:.15s;}
 .game-input:focus{outline:none;border-color:#F59E0B;box-shadow:0 0 0 4px rgba(245,158,11,.14);}
 .paste-zone{min-height:130px;border:2px dashed #BCDBCC;border-radius:14px;background:#FDFDF7;display:flex;align-items:center;justify-content:center;text-align:center;color:#8CA297;font-size:16px;padding:16px;cursor:text;transition:.15s;}
 .paste-zone:focus{outline:none;border-color:#F59E0B;background:#FFFDF3;}
 .paste-zone img{max-width:100%;max-height:320px;border-radius:10px;box-shadow:0 3px 12px rgba(0,0,0,.15);}
 .game-result{margin-top:20px;font-size:18px;font-weight:800;min-height:26px;}
 .game-result.big{font-size:23px;}
 .game-result.ok{color:#BFA05F;} .game-result.bad{color:#E0524A;}
 .best{margin-top:8px;font-size:15.5px;font-weight:800;color:#A8842F;}
 .game-intro{background:linear-gradient(135deg,#FFF6E6,#FFECCF);border:1px solid #F2D9A8;border-radius:12px;padding:14px 18px;font-size:16.5px;color:#7A5B12;margin:4px 0 18px;font-weight:600;}
 .cap-card{display:flex;align-items:center;gap:18px;background:linear-gradient(135deg,#F7F2E7,#E8F8F0);border:2px solid #BDEBD4;border-radius:16px;padding:22px;margin-bottom:10px;box-shadow:0 4px 14px rgba(60,90,160,.12);}
 .cap-emoji{font-size:62px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12));}
 .cap-lines{font-size:19px;line-height:1.6;color:#2A2A2A;font-weight:700;}
 .cap-lines .cap-ar{font-size:21px;}
 .cap-note{margin:2px 0 12px;font-size:14.5px;color:#3C4E4B;background:#F7F2E7;border:1px solid #DDF5E9;border-radius:8px;padding:10px 13px;line-height:1.6;}
 .sheet-embed{width:100%;height:440px;border:1px solid #D8DFD7;border-radius:12px;margin-top:14px;background:#fff;}
 .doc-embed{width:100%;height:520px;border:1px solid #D8DFD7;border-radius:12px;margin-top:8px;background:#fff;}
 .padlet-embed{width:100%;height:520px;border:1px solid #D8DFD7;border-radius:12px;margin-top:12px;background:#fff;}
 .embed-note{margin:10px 0 2px;font-size:14.5px;color:#60736C;line-height:1.6;}
 @media(max-width:560px){.cap-card{flex-direction:column;text-align:center;}.sheet-embed{height:360px;}.doc-embed{height:440px;}.arcade-keys{margin-left:0;width:100%;}}
 .gkeys{margin:6px 0 16px !important;max-width:540px;}
 .faces-btn{margin-top:-44px !important;margin-bottom:52px !important;}
 .check-list{margin:8px 0 4px;display:flex;flex-direction:column;gap:9px;}
 .check-item{background:#F7F2E7;border:1px solid #E4D9B8;border-radius:10px;padding:12px 15px;font-size:16.5px;color:#166B47;font-weight:600;}
 .setup-intro{margin:0 0 18px;font-size:17.5px;line-height:1.7;color:#354D48;background:#F7F2E7;border:1px solid #DDF5E9;border-radius:10px;padding:14px 16px;}
 .tab.active[data-tab="setup"]{background:linear-gradient(135deg,#2E5C53,#1F3F39);border-color:#1F3F39;color:#E4C778;}
 .tab.active[data-tab="warmup"]{background:linear-gradient(135deg,#E0724A,#D1522A);border-color:#D1522A;color:#fff;}
 .block-body a:not(.copy-btn){color:var(--blue);font-weight:700;word-break:break-all;}
 .copy-btn{display:inline-flex;align-items:center;gap:8px;margin:48px 0 22px;background:#BFA05F;color:#fff !important;text-decoration:none;font-weight:800;font-size:18px;padding:14px 24px;border-radius:10px;box-shadow:0 2px 8px rgba(26,158,106,.25);}
 .copy-btn:hover{background:#8A6D2E;}
 .cta-desc{margin:0 0 12px;font-size:16px;line-height:1.7;color:#4A5D59;background:#F9F8F1;border:1px solid var(--line);border-radius:10px;padding:13px 16px;}
 .link-btn{display:inline-flex;align-items:center;gap:8px;margin:10px 0 4px;background:var(--blue);color:#fff !important;text-decoration:none;font-weight:800;font-size:17.5px;padding:12px 20px;border-radius:10px;box-shadow:0 2px 8px rgba(26,79,180,.22);}
 .link-btn:hover{background:var(--blue-d);}
 .prompt-wrap{margin:22px 0 6px;border:1px solid #DDEFE6;border-radius:10px;overflow:hidden;}
 .prompt-head{font-weight:800;color:var(--blue-d);font-size:18px;padding:14px 16px;background:#FAF7EF;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;}
 .prompt-head:hover{background:#E5F7EE;}
 .pchev{margin-left:auto;font-size:18px;color:var(--blue);transition:transform .2s;}
 .prompt-wrap.open .pchev{transform:rotate(180deg);}
 .prompt-body{display:none;padding:8px 14px 14px;}
 .prompt-wrap.open .prompt-body{display:block;}
 .prompt-inline{margin:12px 0 4px;}
 .tip-wrap{padding:0 !important;overflow:hidden;}
 .tip-head{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;padding:14px 18px;font-weight:800;}
 .tip-head:hover{filter:brightness(.98);}
 .tip-wrap .pchev{margin-left:auto;color:#D98A12;}
 .tip-body{display:none;padding:0 18px 16px;}
 .tip-wrap.open .tip-body{display:block;}
 .prompt-card{display:flex;align-items:center;gap:12px;background:#F9F8F1;border:1px solid #D8DFD7;border-radius:10px;padding:13px 15px;margin:12px 0;}
 .prompt-num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;}
 .prompt-text{flex:1;font-size:18px;line-height:1.6;color:var(--ink);}
 .pcopy{flex:none;background:#fff;border:1.5px solid var(--blue);color:var(--blue);font-weight:800;font-size:16px;padding:10px 18px;border-radius:8px;cursor:pointer;white-space:nowrap;}
 .pcopy:hover{background:var(--blue);color:#fff;}
 .pcopy.done{background:var(--green);border-color:var(--green);color:#fff;}
 @media(max-width:560px){.prompt-card{flex-wrap:wrap}.pcopy{width:100%}}
 .concept{background:#F2FBF6;border:1px solid #DAF4E7;border-radius:12px;padding:18px 22px;margin:8px 0 30px;font-size:18.5px;line-height:1.85;}
 .practice{margin:44px 22px 6px;padding:14px 18px;background:#F7F2E7;border-left:5px solid #BFA05F;border-radius:8px;font-size:18px;line-height:1.75;}
 .tip{margin:36px 22px 20px;padding:13px 18px;background:#FFF5E9;border-left:5px solid #D98A12;border-radius:8px;font-size:17px;color:#7A5B12;line-height:1.7;}
 .practice b,.tip b{margin-right:6px;}

 .day-card{position:relative;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;background:#fff;transition:.18s ease;box-shadow:0 2px 10px rgba(40,60,100,.07),inset 0 1px 0 rgba(255,255,255,.65);overflow:hidden;}
 .day-card::after{content:"";position:absolute;top:-40%;left:-30%;width:60%;height:180%;background:linear-gradient(115deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);transform:skewX(-18deg);opacity:0;transition:.5s ease;pointer-events:none;}

 .dc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
 .dc-no{font-size:16.5px;font-weight:800;color:var(--blue);}
 .dc-date{font-size:15px;color:var(--muted);}
 .dc-title{font-size:21px;font-weight:800;color:var(--ink);margin:4px 0 6px;line-height:1.4;}
 .dc-sub{font-size:16.5px;color:var(--muted);line-height:1.55;min-height:44px;}
 .dc-badge{margin-top:14px;display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:700;padding:6px 14px;border-radius:20px;}
 .badge-open{background:#E7F7EE;color:#8A6D2E;border:1px solid #E4D9B8;}
 .badge-lock{background:#F1F7F4;color:#8CA297;border:1px solid #E1EDE7;}
 .day-card.locked .dc-title{color:#5D706C;}
 .day-card.d1{background:linear-gradient(135deg,#EDF1EA 0%,#DCEEE5 60%,#C8E4D6 100%);border-color:#B0D1C0;border-left:5px solid #509688;}
 .day-card.d1 .dc-no{color:#448376;}
 .day-card.d2{background:linear-gradient(135deg,#EEF4EF 0%,#DAE7DE 60%,#C4D8CA 100%);border-color:#AAC2B3;border-left:5px solid #8A6D2E;}
 .day-card.d2 .dc-no{color:#8A6D2E;}
 .day-card.d3{background:linear-gradient(135deg,#EFF6F2 0%,#DCEDE4 60%,#C6E0D3 100%);border-color:#B3D3C3;border-left:5px solid #61978C;}
 .day-card.d3 .dc-no{color:#52857B;}
 .day-card.d4{background:linear-gradient(135deg,#F6F0E4 0%,#ECE0C7 60%,#DDCCA6 100%);border-color:#CBB890;border-left:5px solid #A8842F;}
 .day-card.d4 .dc-no{color:#8A6A25;}
 .day-card.d5{background:linear-gradient(135deg,#F5EEF1 0%,#E9DAE0 60%,#D8BFC9 100%);border-color:#CBAFBA;border-left:5px solid #9C5F74;}
 .day-card.d5 .dc-no{color:#844F63;}
 .day-card.dgift{background:linear-gradient(135deg,#EFE4C2 0%,#DCC689 50%,#C9A84C 100%);border-color:#B8912F;border-left:5px solid #A8842F;}
 .day-card.dgift .dc-no{color:#6E5518;}
 .day-card.dgift .dc-title,.day-card.dgift .dc-sub,.day-card.dgift .dc-date{color:#54410F;}
 .lock-screen{text-align:center;padding:44px 16px;}
 .lock-screen .big{font-size:60px;margin-bottom:10px;}
 .lock-screen h2{font-size:27px;margin:0 0 8px;color:var(--blue-d);line-height:1.4;}
 .lock-screen p{color:var(--muted);font-size:18.5px;margin:0 0 24px;}
 .pw-row{display:flex;gap:10px;justify-content:center;max-width:400px;margin:0 auto;}
 .pw-row input{flex:1;padding:15px 16px;border:1.5px solid var(--line);border-radius:10px;font-size:18px;}
 .pw-row input:focus{outline:none;border-color:var(--blue);}
 .pw-row button{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:15px 26px;font-size:18px;font-weight:700;cursor:pointer;}
 .pw-row button:hover{background:var(--blue-d);}
 .pw-err{color:#C0392B;font-size:16px;margin-top:14px;min-height:20px;}
 .backhome{display:inline-block;margin-bottom:18px;font-size:17px;color:var(--blue);cursor:pointer;font-weight:700;}
 footer{margin-top:34px;text-align:center;color:var(--muted);font-size:14px;}
 .admin-hint{margin-top:10px;font-size:14px;color:#9CB4A8;}
 .gift-table{width:100%;border-collapse:collapse;font-size:18px;margin:6px 0 10px;}
 .gift-table th,.gift-table td{border:1px solid var(--line);padding:12px 14px;text-align:left;vertical-align:top;}
 .gift-table th{background:#FAF7EF;font-weight:800;color:var(--blue-d);}
 .gift-table td:first-child{white-space:nowrap;}
 kbd{display:inline-block;background:#172C2B;color:#fff;border-radius:6px;padding:5px 11px;font-size:16px;font-weight:700;font-family:inherit;white-space:nowrap;}
 .gift-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:6px 0 10px;}
 .gift-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;background:#fff;transition:.15s;}
 .gift-card:hover{border-color:var(--blue);box-shadow:0 4px 12px rgba(20,50,120,.08);}
 .gc-emoji{font-size:24px;flex:none;}
 .gc-body{display:flex;flex-direction:column;flex:1;min-width:0;}
 .gc-title{font-weight:800;color:var(--ink);font-size:17.5px;line-height:1.35;}
 .gc-url{color:var(--muted);font-size:15px;word-break:break-all;}
 .gc-ext{color:var(--blue);font-size:18px;flex:none;font-weight:800;}
 .gem-intro{background:#F2FBF6;border:1px solid #DAF4E7;border-radius:10px;padding:14px 16px;font-size:17.5px;line-height:1.75;margin:6px 0 14px;}
 .gem-step{display:flex;gap:14px;align-items:flex-start;margin:14px 0;font-size:18px;line-height:1.7;}
 .gem-n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;}
 .gem-note{margin-top:16px;background:#FFF8E8;border:1px solid #F0DFAE;border-radius:10px;padding:14px 16px;font-size:17px;color:#7A5B12;line-height:1.75;}
 h3.gift-blk{margin-top:96px;}
 h3.gift-blk:first-of-type{margin-top:48px;}
 .gift-closing{margin-top:96px;text-align:center;background:#F7F2E7;border:1px solid #E4D9B8;border-radius:14px;padding:28px 20px;font-size:18.5px;line-height:1.85;color:#166B47;}
 .gift-closing .gc-icon{font-size:42px;margin-bottom:6px;}
 .instructor{margin:2px 0 96px;}
 .ins-banner{position:relative;overflow:hidden;background:linear-gradient(135deg,#16312B 0%,#21473F 60%,#2A584F 100%);border:1px solid #37665D;border-top:3px solid #C9A84C;border-radius:16px;padding:26px 28px;box-shadow:0 10px 30px rgba(12,20,44,.22);}
 .ins-banner::after{content:"";position:absolute;top:-40%;right:-4%;width:36%;height:180%;background:linear-gradient(115deg,rgba(255,255,255,0),rgba(201,168,76,.16) 50%,rgba(255,255,255,0));transform:skewX(-16deg);pointer-events:none;}
 .ins-kicker{position:relative;z-index:1;font-size:13px;letter-spacing:.14em;color:#CDB478;font-weight:800;margin-bottom:8px;}
 .ins-name{position:relative;z-index:1;font-size:28px;font-weight:800;color:#E4C778;line-height:1.15;}
 .ins-name span{font-size:17px;color:#B0CDBE;font-weight:600;margin-left:9px;font-style:italic;}
 .ins-chips{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;}
 .ins-chip{background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.4);color:#DEEFE6;border-radius:22px;padding:8px 15px;font-size:14.5px;font-weight:600;}
 .ins-chip b{color:#E4C778;}
 .ins-div{position:relative;z-index:1;height:1px;background:linear-gradient(90deg,rgba(201,168,76,.5),rgba(201,168,76,0));margin:18px 0;}
 .ins-contact{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:10px;}
 .ins-pill{background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.4);color:#E4C778 !important;border-radius:22px;padding:9px 16px;font-size:15px;font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
 .ins-pill:hover{background:rgba(201,168,76,.16);}
 .ins-cta{background:linear-gradient(135deg,#E0C375,#C9A84C);border-color:#C9A84C;color:#1F3F39 !important;}
 .ins-cta:hover{filter:brightness(1.05);background:linear-gradient(135deg,#E7CE86,#D0AF52);}
 .ins-toggle{margin-top:12px;width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E6DDC3;border-radius:12px;padding:15px 20px;font-size:16.5px;font-weight:800;color:#3C4E4B;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(40,60,100,.06);transition:.15s;}
 .ins-toggle:hover{border-color:#C9A84C;}
 .ins-plus{color:#C9A84C;font-size:22px;font-weight:800;line-height:1;transition:transform .2s;}
 .instructor.open .ins-plus{transform:rotate(45deg);}
 .ins-tag{margin-left:auto;font-size:13px;font-weight:800;color:#A8842F;background:#F7EDCF;border:1px solid #EADDB0;border-radius:16px;padding:5px 12px;}
 .ins-more{display:none;}
 .instructor.open .ins-more{display:block;}
 .ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 34px;margin-top:12px;background:linear-gradient(140deg,#16312B,#21473F 60%,#28524A);border:1px solid #37665D;border-radius:14px;padding:24px 26px;}
 .ins-col.ins-wide{grid-column:1 / -1;}
 .ins-col h4{margin:0 0 10px;font-size:16px;color:#E4C778;border-bottom:1px solid #3E6C63;padding-bottom:7px;font-weight:800;}
 .ins-col ul{margin:0;padding-left:18px;}
 .ins-col li{margin:7px 0;font-size:15.5px;line-height:1.6;color:#CEE4D9;}
 .ins-col li b{color:#ECD693;font-weight:700;}
 @media(max-width:560px){.ins-grid{grid-template-columns:1fr;}.ins-col.ins-wide{grid-column:auto;}}
 @media(max-width:560px){header.top h1{font-size:26px}.panel{padding:22px 16px}.s-title{font-size:28px}.block-t{font-size:19px}.block-ul li{font-size:18px}.item-toggle{font-size:18px}.steps li{font-size:17px}.gift-table{font-size:16px}.gift-cards{grid-template-columns:1fr}}

/* ===== 골드 프리미엄 테마 (내용·토글 그대로, 외형만) ===== */
.block{border-color:#E8DFC4;border-radius:16px;box-shadow:0 4px 18px rgba(30,58,95,.08);}

.block.open .block-head{background:#F1E7CC;border-bottom-color:#E5D6A8;}
.block-n{background:linear-gradient(135deg,#B8901F,#E8CE7A,#C8A951);color:#172C2B;box-shadow:0 2px 8px rgba(200,169,81,.55);}
.block-t{color:#172C2B;}
.chev,.block.open .chev{color:#B8901F;}
.item-detail.coll{border-color:#E8DFC4;border-top:4px solid #C8A951;box-shadow:0 3px 14px rgba(30,58,95,.10);}
.item-toggle{background:#FCFAF3;}

.steps{list-style:none;padding-left:0;}

.block.roomy .steps li{margin:46px 0;}

.foot-inq{display:inline-block;margin-top:8px;font-size:14.5px;font-weight:800;color:#172C2B;background:#F7F1E1;border:1.4px solid #D8C48F;border-radius:999px;padding:6px 16px;}

.tabs{position:sticky;top:0;z-index:60;background:linear-gradient(180deg,#C9AC66,#BFA05F);width:100vw;margin:0 calc(50% - 50vw) 16px;padding:11px 18px 9px max(14px,calc(50vw - 526px));box-shadow:0 6px 14px -8px rgba(10,18,40,.30);flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;gap:7px;}

.tab{flex:0 0 auto;white-space:nowrap;padding:9px 11px;font-size:15px;gap:5px;border-radius:11px;}
.tab[data-tab="c1"]{background:#FFF1F0;border:1.6px solid #E5484D;color:#C0303A;font-weight:800;}
.tab[data-tab="c1"].active{background:#E5484D;border-color:#E5484D;color:#fff;}

.pc-label.pcl-hot{color:#C0303A;font-weight:800;}
header.top.hero-big{position:relative;overflow:hidden;padding:60px 44px 56px;border-radius:0 0 22px 22px;
  background:radial-gradient(ellipse at 78% 16%, #30554D 0%, #1E3430 56%, #142623 100%);border-bottom:3px solid #BFA05F;}
header.top.hero-big::before{display:none;}
.hero-orb{position:absolute;border-radius:50%;pointer-events:none;z-index:0;}
.hero-orb.a{width:360px;height:360px;right:-70px;top:-130px;background:#2F544C;opacity:.6;}
.hero-orb.b{width:190px;height:190px;left:-60px;bottom:-90px;background:#2A4842;opacity:.55;}
.hero-ico{width:82px;height:82px;border-radius:50%;background:linear-gradient(135deg,#E0C778,#BFA05F);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(191,160,95,.42);margin-bottom:24px;}
.hero-ico svg{width:42px;height:42px;fill:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
.hero-tag{display:inline-block;border:1px solid rgba(217,199,155,.5);color:#ECDCB2;background:rgba(255,255,255,.06);
  padding:8px 20px;border-radius:999px;font-size:18px;font-weight:700;letter-spacing:.02em;margin-bottom:20px;}
header.top .hero-h1{margin:0;font-size:clamp(30px, 5vw, 64px);white-space:nowrap;line-height:1.1;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(180deg,#FBEEC2 0%,#ECD396 40%,#C8A865 70%,#A07F3D 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  filter:drop-shadow(0 2px 16px rgba(191,160,95,.4));}
.hero-sub{margin:24px 0 0;font-size:21px;color:#CFE0D8;}
.hero-sub b{color:#ECDCB2;font-weight:700;}

x 22px;background:rgba(200,169,81,.07);margin:6px 0 10px\"><div class=\"item-lead\">Deep Research는 Gemini가 단순히 질문에 답하는 것이 아니라, <b>웹 전체를 탐색하며 수십 개의 출처를 종합</b>해 전문가 수준의 리서치 보고서를 자동으로 생성하는 기능입니다.</div></div><br><br><br><h4>Deep Research, 언제 쓰고 언제 안 쓸까요?</h4><div class=\"vs\"><div class=\"vs-c vs-yes\"><div class=\"vs-h\">✅ 이럴 때 Deep Research</div><div class=\"vs-i\">밖에서 정보를 모아 <b>근거</b>를 만들 때 — 지원사업·시장·규정·사례 조사</div><div class=\"vs-i\">결과가 <b>출처 있는 보고서</b>로 나와야 할 때</div></div><div class=\"vs-c vs-no\"><div class=\"vs-h\">➡️ 이럴 때는 다른 도구</div><div class=\"vs-i\">우리 회사 파일을 다룰 때 — 엑셀 합치기, 계약서 검토 → <b>파일 업로드(Gemini)·NotebookLM</b></div><div class=\"vs-i\">화면·앱을 만들 때 → <b>Canvas·AI Studio</b></div></div></div><div class=\"warn\">⚠️ <b>Deep Research는 이 수업에서 딱 한 번만 실행합니다.</b> 사용량이 많이 들기 때문입니다. 자세한 내용은 맨 아래 <b>사용량 주의</b>를 보세요.</div><br><br><br><br><br><h4>Deep Research, 이럴 때 쓰세요</h4><div class=\"xcards\"><div class=\"xc\"><span class=\"xc-n\">예시 1</span><div class=\"xc-t\">국가지원사업 기획서·제안서의 근거 자료 만들기</div><div class=\"xc-d\"><b class=\"l\">조사</b>지원사업 공고 요건, 유사 선정 사례, 업계 통계·시장 규모, 정책 방향</div></div><div class=\"xc\"><span class=\"xc-n\">예시 2</span><div class=\"xc-t\">스마트공장·MES 도입 사례와 솔루션 비교</div><div class=\"xc-d\"><b class=\"l\">조사</b>중소 제조기업 도입 사례, 비용 수준, 정부 지원, 도입 시 주의점</div></div><div class=\"xc\"><span class=\"xc-n\">예시 3</span><div class=\"xc-t\">외국인 근로자 관련 규정과 안전 의무 확인</div><div class=\"xc-d\"><b class=\"l\">조사</b>고용·안전교육 의무, 다국어 안내 기준, 최근 개정 사항</div></div><div class=\"xc\"><span class=\"xc-n\">예시 4</span><div class=\"xc-t\">원청·자재 환경 변화 파악</div><div class=\"xc-d\"><b class=\"l\">조사</b>원자재 가격 동향, 원청의 ESG·탄소 규제 요구, 대체 공급처 후보</div></div><div class=\"xc\"><span class=\"xc-n\">예시 5</span><div class=\"xc-t\">환경 측정 기준·환경 법규 개정 확인</div><div class=\"xc-d\"><b class=\"l\">조사</b>대기·수질 측정 기준, 환경 법규의 최근 개정 사항, 적용 시 유의점</div></div></div><br><br><br><br><br><div style=\"margin-top:20px\"><div class=\"block open\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">1단계</span><span class=\"block-t\">모드·소스 선택 — Deep Research 켜기</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"padding:20px 26px 14px\"><h4>Part A. Deep Research 실습</h4><img class=\"zoomimg\" src=\"images/gemini-deep-research-menu.png\" alt=\"Gemini 입력창 왼쪽 + 버튼 메뉴에서 Deep Research를 선택하는 화면 — 심층 보고서 받기\" onclick=\"openLb(this)\" loading=\"lazy\"><ol class=\"steps\"><li>Gemini 입력창에서 <b>Deep Research</b> 모드 선택</li><li>리서치 프롬프트 입력 — <b>아래에서 내 업무에 맞는 프롬프트를 골라</b> 붙여넣기</li></ol><br><p class=\"item-lead\">입력창 아래의 <b>“소스”</b> 버튼을 누르면 조사에 쓸 자료를 고를 수 있습니다. <span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span></p><img class=\"zoomimg\" src=\"images/gemini-deep-research-sources-menu.png\" alt=\"소스 메뉴 — Google 검색, Gmail, Drive, 채팅 중 하나 이상 선택\" onclick=\"openLb(this)\" loading=\"lazy\"><div style=\"border:2.5px dotted #C8A951;border-radius:14px;padding:6px 18px;background:rgba(200,169,81,.07);margin:10px 0\"><ul class=\"block-ul\" style=\"padding:10px 6px 4px 22px\"><li><b>Google 검색</b> — 기본으로 켜져 있습니다. 웹에서 조사합니다. 이 수업에서는 이것만으로 충분합니다.</li><li><b>Drive</b> — <b>내 드라이브에 조사에 쓸 자료</b>(회사 소개서, 제품 설명서, 기존 보고서 등)가 있으면 함께 켜 두면 좋습니다. 내 자료와 웹 정보를 같이 참고해 조사합니다.</li><li><b>Gmail·채팅</b> — 업무 메일과 대화가 섞일 수 있으니, <b>꼭 필요할 때만</b> 켭니다.</li></ul></div><div class=\"tip\"><b>⚠️ 켠 소스의 내용은 보고서에 섞일 수 있습니다</b>Drive나 Gmail을 켰다면, 보고서를 <b>다른 사람과 공유하거나 패들렛에 올리기 전에</b> 내부 자료나 개인정보가 들어 있지 않은지 확인하세요. 맨 아래 <b>“연결된 앱 사용 설정”</b>은 이 수업에서는 건드리지 않아도 됩니다.</div></div></div></div></div><div style=\"margin-top:20px\"><div class=\"block open\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">2단계</span><span class=\"block-t\">프롬프트 고르기 — 내 업무에 맞는 예시</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"padding:20px 26px 14px\"><h4>프롬프트를 고르기 전에</h4><div class=\"warn\">⚠️ <b>Deep Research는 이 수업에서 한 번만 실행합니다.</b> 아래 예시 1·2와 “우리 회사 업종별 예시” 중 <b>내 업무에 가장 맞는 하나</b>를 골라 실행하세요. (사용량이 많이 듭니다)</div><br><br><br><br><div style=\"border:2.5px dotted #C8A951;border-radius:14px;padding:14px 18px;background:rgba(200,169,81,.07)\"><div class=\"bizbar\"><div class=\"bizt\">🏭 내 업종 고르기 <span class=\"bizs\">— 누르면 아래 프롬프트의 <b>[우리 업종]</b>이 바뀝니다 (다시 누르면 해제)</span></div><button type=\"button\" class=\"bizbtn\" data-v=\"금속·기계 부품 가공\" onclick=\"pickBiz(this)\">금속·기계 부품 가공</button><button type=\"button\" class=\"bizbtn\" data-v=\"철강 후공정·표면처리\" onclick=\"pickBiz(this)\">철강 후공정·표면처리</button><button type=\"button\" class=\"bizbtn\" data-v=\"플라스틱·합성수지 제조·성형\" onclick=\"pickBiz(this)\">플라스틱·합성수지 제조·성형</button><button type=\"button\" class=\"bizbtn\" data-v=\"화학·소재\" onclick=\"pickBiz(this)\">화학·소재</button><button type=\"button\" class=\"bizbtn\" data-v=\"식품 가공\" onclick=\"pickBiz(this)\">식품 가공</button><button type=\"button\" class=\"bizbtn\" data-v=\"전기·전자·통신장비 제조\" onclick=\"pickBiz(this)\">전기·전자·통신장비 제조</button><button type=\"button\" class=\"bizbtn\" data-v=\"포장재·인쇄\" onclick=\"pickBiz(this)\">포장재·인쇄</button><button type=\"button\" class=\"bizbtn\" data-v=\"자동차 부품\" onclick=\"pickBiz(this)\">자동차 부품</button><button type=\"button\" class=\"bizbtn\" data-v=\"환경 측정·엔지니어링 서비스\" onclick=\"pickBiz(this)\">환경 측정·엔지니어링 서비스</button><input type=\"text\" class=\"bizin\" placeholder=\"✏️ 직접 입력\" maxlength=\"40\" oninput=\"typeBiz(this)\"></div></div><br><br><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><br><br><details class=\"petog gold\" open><summary class=\"a3-blocktt petog-sum\">예시 1 국가지원사업 기획서의 트렌드·우수 사례 조사<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\"># 역할<br>너는 <span class=\"hl-r\">정부지원사업 평가위원</span>이자 <span class=\"hl-b bizv\">[우리 업종]</span> 분야 DX(디지털 전환) <span class=\"hl-r\">전문 기획가야</span>.<br><br># 과업<br><span class=\"hl-b\">&#x27;스마트공장 보급·확산 지원사업&#x27;과 &#x27;제조 데이터 활용 지원사업&#x27;</span>의 <span class=\"hl-b\">최근 1년간</span> <span class=\"hl-r\">트렌드와 선정 사례</span>를 조사해 줘.<br><br># 조사 항목<br>1. <span class=\"hl-r\">최근 정부 제조업 지원 정책의 핵심 키워드</span><br>2. <span class=\"hl-b\">중소 제조 현장에서 MES(생산관리시스템)나 공정 데이터 자동화</span>로 <span class=\"hl-r\">성과를 낸 도입 사례</span> <span class=\"hl-b\">3가지</span> 이상<br>3. <span class=\"hl-r\">제안서 도입부(배경·필요성)에 쓸 수 있는 최신 시장 동향 데이터와 시사점</span><br><br># 출력 형식<br>- [정책·트렌드 키워드 요약]<br>- [유사 업종 도입 사례와 성과]<br>- [제안서용 핵심 논리(스토리라인) 제안]<br><br># 주의<br><span class=\"hl-r\">모든 사례와 수치에는 출처 링크를 달고, 확인되지 않는 내용은 &#x27;확인 필요&#x27;로 표시해 줘.</span></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><details class=\"petog dotted\"><summary class=\"a3-blocktt petog-sum\">➕ 지원사업 공고가 궁금하다면 — 따로 물어보세요<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><p class=\"item-lead\">공고 일정·지원 한도까지 한 번에 조사시키면 <b>Deep Research가 훨씬 오래 걸립니다.</b> 위 조사가 끝난 뒤, <b>Deep Research를 끄고 일반 대화</b>로 아래처럼 짧게 따로 물어보세요.</p><div class=\"prompt-card\"><span class=\"prompt-num\">2</span><span class=\"prompt-text\">지금 <span class=\"hl-b\">접수 중이거나 최근 공고된 스마트공장·제조 데이터 관련 지원사업</span>을 알려 줘. <span class=\"hl-r\">사업명, 접수 기간, 지원 한도, 공고문 링크</span>를 표로 정리하고, 확인되지 않는 항목은 &#x27;확인 필요&#x27;로 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>✅ 꼭 확인하세요</b>지원 한도·접수 기간은 AI 답변을 그대로 믿지 말고 <b>공고문 링크로 들어가 원문</b>에서 확인합니다.</div></div></details></div></details><div class=\"tip\"><b>🔗 강사 예시 보고서</b>📄 보고서(예시 1, 플라스틱·합성수지): <a href=\"https://share.gemini.google/1iO9AlOjYW4B\" target=\"_blank\" rel=\"noopener\">https://share.gemini.google/1iO9AlOjYW4B</a><br>🏭 이 보고서로 만든 웹사이트: <a href=\"https://share.gemini.google/KpZlibb6vePt\" target=\"_blank\" rel=\"noopener\">https://share.gemini.google/KpZlibb6vePt</a></div><details class=\"petog dotted\"><summary class=\"a3-blocktt petog-sum\">보고서를 제안서에 쓰기 전 확인할 것 (강사 설명)<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><p class=\"item-lead\">보고서가 나오면, 제안서에 옮기기 전에 아래 네 가지를 확인합니다.</p><ol class=\"steps\"><li><b>계산을 다시 해 봅니다.</b> 표의 “단축률·감소율”이 사례의 전후 숫자와 맞는지 계산기로 확인합니다. (예: 15초 → 12.48초는 17.8%가 아니라 약 16.8% 단축)</li><li><b>근거로 붙은 숫자가 사례 본문에 있는지</b> 봅니다. 표에는 있는데 사례 설명에는 없는 숫자는 쓰지 않습니다.</li><li><b>도입 전(As-Is) 숫자는 AI가 가정한 예시값</b>입니다. 제안서에는 <b>우리 회사의 실제 수치</b>를 넣습니다.</li><li><b>사업명·지원 한도·접수 기간</b>은 해마다 바뀝니다. 보고서에 달린 공고문 링크로 가서 <b>현재 공고문</b>에서 다시 확인합니다.</li></ol><div class=\"tip\"><b>➕ 사례 출처도 보세요</b>사례의 출처가 신문·업체 홍보 자료일 수 있습니다. “공인 출처”라고 적혀 있어도 직접 눌러서 어떤 사이트인지 확인합니다.</div></div></details><br><br><details class=\"petog gold\" open><summary class=\"a3-blocktt petog-sum\">예시 2 스마트공장·MES 도입 사례와 지원 알아보기<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\"># 역할<br>너는 <span class=\"hl-b bizv\">[우리 업종]</span> <span class=\"hl-r\">중소 제조기업의 스마트공장 컨설턴트</span>야.<br><br># 과업<br>직원 <span class=\"hl-b\">[N]명</span> 규모의 우리 회사가 <span class=\"hl-b\">작업일보·점검표를 디지털로 바꾸고 이력을 관리</span>하려고 해. <span class=\"hl-b\">최근 1년간</span> 중소 제조기업의 MES·스마트공장 도입 사례와 정부 지원을 <span class=\"hl-r\">조사해 줘</span>.<br><br># 출력 형식<br>- 핵심 사례 <span class=\"hl-b\">5가지</span>: <span class=\"hl-r\">[사실 → 임팩트 → 출처]</span><br>- 우리 회사에 적용할 때의 주의점<br>- 활용 가능한 정부 지원 제도<br><br># 주의<br><span class=\"hl-r\">모든 사례와 수치에는 출처 링크를 달고, 확인되지 않는 내용은 &#x27;확인 필요&#x27;로 표시해 줘.</span></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>➕ 파란 글씨, 이렇게 바꿔 보세요</b>“작업일보·점검표를 디지털로 바꾸고 이력을 관리” 부분을 내 업무로 바꿉니다.<ul class=\"block-ul\"><li><b>설비·생산 현장</b> — 설비 점검·작업일보 이력 관리</li><li><b>환경 측정·시험 업무</b> — 시료 채취·점검 이력과 장비·소모품 재고 관리</li><li><b>입고·검사 업무</b> — 자재 입고·검사 이력과 재고 관리</li></ul></div><div class=\"tip\"><b>➕ 이어서</b>예시 2의 결과는 뒤의 <b>AI Studio·Canvas</b> 모듈에서 작업일보·점검표·시료 채취 이력을 입력하고 조회하는 간이 관리 화면(MES 맛보기)을 만들 때 그대로 참고합니다.</div></div></details><br><br><details class=\"petog gold\"><summary class=\"a3-blocktt petog-sum\">예시 3 외국인 근로자 규정 조사 — 출처를 꼭 눌러보세요<span class=\"petog-chev\">▾</spa llet-source.png\" alt=\"출처 원문 — ABS 수지 시트 시장 조사 보고서 요약에서 아시아 태평양 점유율 약 64%\" onclick=\"openLb(this)\" loading=\"lazy\"><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th></th><th>내용</th></tr></thead><tbody><tr><td class=\"pt-cat\">출처 원문</td><td><b>ABS 수지 시트</b> 시장에서 아시아 태평양의 점유율 약 64%</td></tr><tr><td class=\"pt-cat\">보고서 문장</td><td><b>ABS 수지의 생산·소비</b>의 약 64%가 아시아</td></tr></tbody></table></div><div class=\"tip\"><b>✅ 정리</b>숫자(64%)는 출처와 같습니다. 하지만 원문은 <b>시트 시장</b>, 보고서는 <b>수지 생산·소비</b>를 말합니다. 출처가 달려 있어도 <b>숫자의 뜻이 바뀔 수 있으니</b>, 보고서에 쓸 숫자는 원문의 앞뒤 문장까지 확인합니다.</div><h4>그럼 Deep Research는 왜 쓰나요?</h4><p class=\"item-lead\">Deep Research는 <b>정답을 주는 도구가 아니라, 수십 개 자료를 찾아 정리한 “조사 초안과 출처 지도”를 주는 도구</b>입니다. 처음부터 검색하는 시간을 줄이고, 그 시간에 <b>중요한 숫자만 골라 확인</b>합니다.</p><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th></th><th>직접 조사</th><th>Deep Research + 확인</th></tr></thead><tbody><tr><td class=\"pt-cat\">자료 찾기</td><td>검색·읽기에 몇 시간</td><td>수 분~수십 분에 초안과 출처 후보를 받음</td></tr><tr><td class=\"pt-cat\">정리</td><td>내가 직접 표·요약 작성</td><td>구조화된 보고서를 받음</td></tr><tr><td class=\"pt-cat\">정확성 확인</td><td>내가 확인</td><td><b>내가 확인 (이 단계는 그대로)</b> — 단, 확인할 숫자와 출처가 이미 골라져 있음</td></tr></tbody></table></div><div class=\"tip\"><b>📌 확인은 전부가 아니라 핵심만</b>보고서에 실제로 쓸 <b>핵심 숫자 3개</b>만 골라 출처 원문과 대조해도 충분합니다. 이 3개가 맞으면 나머지도 믿을 만한지 가늠할 수 있습니다.</div></div></details><br><br><details class=\"petog gold\"><summary class=\"a3-blocktt petog-sum\">예시 5 환경 측정 기준·환경 법규 개정 확인<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\"># 역할<br>너는 <span class=\"hl-r\">환경 규제·측정 기준 전문가</span>야.<br><br># 과업<br><span class=\"hl-b\">대기·수질</span> 측정 기준과 환경 법규의 <span class=\"hl-b\">최근 1년간</span> 개정 사항을 <span class=\"hl-r\">조사해 줘</span>.<br><br># 조사 항목<br>1. 개정된 법규·기준과 시행 시점<br>2. 사업장과 측정 업체에 달라지는 점<br>3. 우리가 준비할 체크리스트<br><br># 출력 형식<br>- <span class=\"hl-r\">[사실 → 임팩트 → 출처]</span><br><br># 주의<br><span class=\"hl-r\">법규는 니다.</div><br><p class=\"item-lead\">아래 링크에서 <b>강사가 만든 웹페이지·인포그래픽·웹사이트를 직접 열어볼 수 있습니다.</b></p><div class=\"rescards-head\">🔗 강사 결과물 보기 <span>카드를 눌러 직접 열어 보세요</span></div><div class=\"rescards\"><a class=\"rescard\" href=\"https://share.gemini.google/UPq14vfnLs4Y\" target=\"_blank\" rel=\"noopener\"><span class=\"rc-ic\">🌐</span><span class=\"rc-t\">웹페이지</span><span class=\"rc-d\">Deep Research 보고서를 눈에 보이는 대시보드로 만든 화면</span><span class=\"rc-go\">열어보기 →</span></a><a class=\"rescard\" href=\"https://share.gemini.google/PNM1ZEjCyHb8\" target=\"_blank\" rel=\"noopener\"><span class=\"rc-ic\">📊</span><span class=\"rc-t\">인포그래픽</span><span class=\"rc-d\">보고서의 핵심을 한 장의 그림으로 정리한 화면</span><span class=\"rc-go\">열어보기 →</span></a><a class=\"rescard\" href=\"https://share.gemini.google/KpZlibb6vePt\" target=\"_blank\" rel=\"noopener\"><span class=\"rc-ic\">🏭</span><span class=\"rc-t\">예시 1 결과 웹사이트</span><span class=\"rc-d\">플라스틱·합성수지 정부지원사업 평가 기획보고서</span><span class=\"rc-go\">열어보기 →</span></a></div><br><br><br><h4>📌 내가 만든 결과물, 패들렛에 올리기</h4><p class=\"item-lead\">실습이 끝나면 아래 <b>두 가지</b>를 <b>패들렛</b>에 올려 서로 구경합니다. (패들렛 주소는 수업 중에 안내합니다.)</p><ul class=\"block-ul\"><li><b>구글 문서</b> — 보고서를 <b>Docs로 내보내기</b>한 문서의 공유 링크 (<b>링크가 있는 사람은 볼 수 있음</b>으로 설정)</li><li><b>웹페이지</b> — <b>만들기 → 웹페이지</b>로 만든 결과의 공유 링크</li></ul><div class=\"tip\"><b>⚠️ 올리기 전에 확인하세요</b>패들렛은 다른 수강생에게 모두 보입니다. <b>회사 내부 자료, 고객·거래처 이름, 개인정보</b>가 들어가 있으면 지우거나 가린 뒤에 올립니다.</div><div class=\"tip\"><b>➕ 이어서</b>웹페이지 만들기는 뒤의 <b>AI Studio·Canvas</b> 모듈에서, 인포그래픽·오디오는 <b>NotebookLM</b> 모듈에서 더 자세히 다룹니다.</div></div></div></div></div><div style=\"margin-top:20px\"><div class=\"block open\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">주의</span><span class=\"block-t\">⚠️ 사용량 주의 — 딱 한 번만</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"padding:20px 26px 14px\"><p class=\"item-lead\">일반 대화와 달리 Deep Research는 한 번 돌릴 때마다 <b>사용량이 눈에 띄게 올라갑니다.</b> 아래는 한 번 조사를 돌린 직후의 사용량 화면 예시입니다. <span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span></p><img class=\"zoomimg\" src=\"images/gemini-usage-after-dr.png\" alt=\"Deep Research 한 번 실행 후 사용량 한도 화면 — 현재 사용량이 크게 올라간 예시\" onclick=\"openLb(this)\" loading=\"lazy\"><ul class=\"block-ul\"><li><b>이 수업에서 Deep Research는 딱 한 번만 실행합니다.</b> 예시 1·2나 업종별 예시 중 <b>내 업무에 가장 맞는 하나</b>만 고르세요. 나머지 프롬프트는 복사해 두었다가 수업 후에 사용합니다.</li><li>리서치 플랜을 확인하고 고친 뒤 <b>한 번에</b> 시작합니다.</li><li>실습 전에 <b>사용량 한도</b>(왼쪽 메뉴)에서 남은 사용량을 확인합니다. 기관 계정은 숫자로 보이지 않으니 더 아껴 씁니다.</li><li>한도에 도달하면 화면에 <b>초기화되는 시간</b>이 표시됩니다. 그때까지는 일반 대화로 실습을 이어갑니다.</li></ul></div></div></div></div>", "m1g": "<h2 class=\"s-title\">💎 나만의 AI 비서</h2><p class=\"s-sub\">같은 가상 계약서로 <b>4가지 방법</b>을 차례로 써 봅니다</p><div style=\"display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px\"><div style=\"flex:1 1 150px;min-width:150px;background:#fff;border:2px solid #E5D6A8;border-radius:14px;padding:14px 12px;text-align:center\"><div style=\"font-size:26px;line-height:1\">🧭</div><div style=\"font-weight:800;font-size:17px;margin:6px 0 4px;color:#1F3A33\">크롬 속 Gemini</div><div style=\"font-size:14.5px;color:#4F625B;line-height:1.5\">열어 둔 탭에 바로 묻기</div></div><div style=\"align-self:center;font-size:22px;color:#B8923A;font-weight:800\">→</div><div style=\"flex:1 1 150px;min-width:150px;background:#fff;border:2px solid #E5D6A8;border-radius:14px;padding:14px 12px;text-align:center\"><div style=\"font-size:26px;line-height:1\">🤖</div><div style=\"font-weight:800;font-size:17px;margin:6px 0 4px;color:#1F3A33\">젬</div><div style=\"font-size:14.5px;color:#4F625B;line-height:1.5\">계약서 검토 챗봇 만들기</div></div><div style=\"align-self:center;font-size:22px;color:#B8923A;font-weight:800\">→</div><div style=\"flex:1 1 150px;min-width:150px;background:#fff;border:2px solid #E5D6A8;border-radius:14px;padding:14px 12px;text-align:center\"><div style=\"font-size:26px;line-height:1\">⚡</div><div style=\"font-weight:800;font-size:17px;margin:6px 0 4px;color:#1F3A33\">스킬</div><div style=\"font-size:14.5px;color:#4F625B;line-height:1.5\">/ 한 번으로 실행</div></div><div style=\"align-self:center;font-size:22px;color:#B8923A;font-weight:800\">→</div><div style=\"flex:1 1 150px;min-width:150px;background:#fff;border:2px solid #E5D6A8;border-radius:14px;padding:14px 12px;text-align:center\"><div style=\"font-size:26px;line-height:1\">📚</div><div style=\"font-weight:800;font-size:17px;margin:6px 0 4px;color:#1F3A33\">NotebookLM</div><div style=\"font-size:14.5px;color:#4F625B;line-height:1.5\">근거를 눌러 확인</div></div></div><br><br><br><div class=\"tip\"><b>📎 먼저 내려받기</b><div style=\"margin:8px 0 2px\"><b>① 가상 원청 계약서</b> <span style=\"font-size:13px;opacity:.8\">(6쪽 · 불리한 조항이 일부러 섞여 있습니다)</span><br><a href=\"samples/가상_부품공급계약서_NotebookLM실습용.pdf\" download onclick=\"return window.dlSample?dlSample(event,this):dlStatic(event,this)\" style=\"display:inline-block;margin:4px 6px 4px 0;padding:9px 14px;border-radius:8px;background:#d93025;color:#fff;font-weight:700;text-decoration:none;font-size:14px\">PDF 내려받기</a><a href=\"samples/가상_부품공급계약서_NotebookLM실습용.docx\" download onclick=\"return window.dlSample?dlSample(event,this):dlStatic(event,this)\" style=\"display:inline-block;margin:4px 6px 4px 0;padding:9px 14px;border-radius:8px;background:#1a73e8;color:#fff;font-weight:700;text-decoration:none;font-size:14px\">Word 내려받기</a></div><div style=\"margin:8px 0 2px\"><b>② 하도급법 주요 조문 15개</b> <span style=\"font-size:13px;opacity:.8\">(연습용 발췌)</span><br><a href=\"samples/하도급법_주요조문_발췌.pdf\" download onclick=\"return window.dlSample?dlSample(event,this):dlStatic(event,this)\" style=\"display:inline-block;margin:4px 6px 4px 0;padding:9px 14px;border-radius:8px;background:#188038;color:#fff;font-weight:700;text-decoration:none;font-size:14px\">발췌 PDF 내려받기</a><a href=\"https://www.law.go.kr/법령/하도급거래공정화에관한법률\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin:4px 6px 4px 0;padding:9px 14px;border-radius:8px;background:#fff;border:2px solid #188038;color:#188038;font-weight:700;text-decoration:none;font-size:14px\">법제처 원문 열기 ↗</a></div><span style=\"font-size:13px;opacity:.8\">프롬프트는 하나이고 쓰는 자리만 다릅니다. 결과는 원문과 직접 대조하세요. 실제 검토에는 법제처 최신 전문을 확인하세요.</span></div><br><br><br><div style=\"margin-top:20px\"><div class=\"block open\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">실습</span><span class=\"block-t\">1. 제미나이 인 크롬 — 계약서를 왼쪽에 두고 옆에서 바로 묻기 (약 15분)</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"padding:20px 26px 14px\"><div class=\"tip\"><b>📌 이런 때 좋습니다</b>크롬 브라우저 <b>오른쪽 사이드바의 Gemini</b>는 <b>지금 열어 둔 탭의 내용을 보고</b> 답합니다. <b>계약서는 왼쪽에 그대로 보면서</b>, 오른쪽에서 물어보고 바로 대조할 수 있어 <b>급할 때</b> 가장 빠릅니다. 파일을 올릴 필요가 없습니다.</div><h4>① 계약서 PDF를 크롬으로 열기</h4><ol class=\"steps\"><li>위에서 내려받은 <b>PDF</b>를 크롬 창으로 끌어다 놓거나, 크롬에서 <b>Ctrl+O</b>로 파일을 엽니다.</li><li>계약서가 크롬 탭에 보이는지 확인합니다. (이 탭이 Gemini가 읽을 대상입니다)</li></ol><details class=\"petog dotted\"><summary class=\"a3-blocktt petog-sum\">🖱️ 화면으로 보기 — 마우스로 PDF를 크롬에서 열기<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><img class=\"zoomimg\" src=\"images/chrome-gemini-0.png\" alt=\"PDF 파일을 오른쪽 클릭해 연결 프로그램에서 Google Chrome을 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:520px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">PDF를 오른쪽 클릭 → 연결 프로그램 → Google Chrome</p></div></details><br><br><h4>② 사이드바 Gemini에게 물어보기</h4><ol class=\"steps\"><li>크롬 오른쪽 위의 <b>Gemini</b> 버튼(또는 주소창 옆의 Gemini 아이콘)을 눌러 <b>사이드바를 엽니다.</b></li><li>입력창에 아래 프롬프트를 붙여넣고 보냅니다. 파란 글씨는 내 상황에 맞게 바꿉니다.</li></ol><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">21</span><span class=\"prompt-text\"># 역할<br>너는 국내 중소 제조업의 계약 검토를 돕는 리스크 관리 전문가야.<br><br># 과업<br><span class=\"hl-r\">지금 보고 있는 이 계약서(현재 탭)</span>를 읽고, <span class=\"hl-b\">을(납품하는 협력사)</span> 입장에서 불리하거나 위험한 조항을 찾아 줘.<br><br># 분석 기준<br><span class=\"hl-b\">1. 대금 지급 시기와 방식, 지체상금 요율과 상한<br>2. 단가 인하·원재료 가격 반영, 발주 변경 시 비용 부담<br>3. 검사 기간, 하자보증 기간과 책임 범위, 손해배상 한도<br>4. 지식재산권 귀속, 비밀유지 의무가 한쪽에만 있는지<br>5. 일방적 해지·해석 조항, 분쟁 해결(관할)</span><br><br># 출력 형식<br>먼저 “가장 위험한 3가지”를 한 줄씩 요약하고,<br>이어서 표로 정리해 줘: 조항 번호 / 원문 인용 / 왜 위험한가 / 위험도(상·중·하) / 수정 제안(초안)<br><br># 주의<br><span class=\"hl-r\">조항 번호와 원문을 반드시 인용하고, 이 계약서에 없는 내용은 만들지 마.</span><br>읽지 못한 부분(별표 등)이 있으면 “확인하지 못함”이라고 말해 줘.<br>법적 판단이 필요한 부분은 “전문가 확인 필요”로 표시해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-1.png\" alt=\"크롬에서 계약서 PDF를 열고 오른쪽 Gemini 사이드바에 프롬프트를 입력한 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">계약서 PDF가 열린 탭에서 오른쪽 사이드바를 열고, 프롬프트를 입력합니다.</p><br><br><div class=\"tip\"><b>✅ 이렇게 확인하세요</b>① <b>별표(단가표·지급 일정)까지 읽었는지</b> 봅니다. 읽지 못했다고 답하면 정상입니다 ② 표의 <b>조항 번호와 원문</b>이 왼쪽 계약서와 같은지 직접 대조합니다 ③ “제7조 지체상금을 업계에서 흔한 수준으로 고치려면?”처럼 <b>한 조항씩 이어서 질문</b>합니다.</div><br><br><h4>💾 답변을 문서로 저장하기</h4><p class=\"item-lead\">답변 아래 <b>⋯(더보기)</b>를 누르고 <b>Docs에서 초안 작성</b>을 고르면 구글 문서로 이어집니다.</p><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-2.png\" alt=\"사이드바 답변 아래 더보기 메뉴에서 Docs에서 초안 작성을 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:640px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">⋯ 메뉴 → Docs에서 초안 작성</p><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-3.png\" alt=\"Docs에서 초안 작성으로 만들어진 구글 문서 — 가장 위험한 3가지 요약과 분석 표\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">답변이 구글 문서로 만들어집니다.</p><br><br><br><h4>③ 계약서와 법령을 함께 열어 교차 검토하기</h4><p class=\"item-lead\">크롬에는 <b>여러 탭을 열어 둘 수 있습니다.</b> 계약서 PDF 옆에 <b>하도급법 발췌 PDF</b>를 새 탭으로 열고, 두 탭을 함께 보고 답하게 해 봅니다.</p><ol class=\"steps\"><li>위에서 내려받은 <b>하도급법 발췌 PDF</b>를 크롬의 새 탭으로 엽니다. (계약서 탭은 그대로 둡니다)</li><li>사이드바에서 <b>두 탭을 함께 참고</b>하도록 탭을 추가하거나 선택합니다. 방법과 메뉴 이름은 버전에 따라 다르니 화면의 안내를 따릅니다.</li><li>아래 프롬프트를 보냅니다.</li></ol><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-4.png\" alt=\"사이드바에서 계약서 탭과 하도급법 발췌 탭을 함께 선택한 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:640px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">빨간 테두리의 두 탭에 체크(✓)가 보이면 함께 참고합니다.</p><br><br><div class=\"prompt-card\"><span class=\"prompt-num\">24</span><span class=\"prompt-text\">지금 열어 둔 <span class=\"hl-r\">두 문서</span>를 함께 보고 답해 줘. 하나는 <span class=\"hl-b\">부품 공급 계약서</span>, 다른 하나는 <span class=\"hl-b\">하도급법 주요 조문 발췌</span>야.<br><br># 과업<br>계약서 조항 중 하도급법 조문과 <span class=\"hl-r\">충돌할 가능성이 있는 것</span>을 찾아 줘.<br><br># 출력 형식<br>표: 계약서 조항 / 관련 법 조문 번호 / 충돌 가능성(상·중·하) / 이유 / 확인할 점<br><br># 주의<br><span class=\"hl-r\">계약서 조항과 법 조문은 번호와 원문을 함께 인용하고, 두 문서에 없는 내용은 만들지 마.</span> 위반 여부를 단정하지 말고 “가능성”으로 표현하고, 최종 판단은 “전문가 확인 필요”로 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-5.png\" alt=\"두 탭을 공유한 사이드바에 프롬프트를 입력한 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">두 탭이 공유된 상태에서 프롬프트를 입력합니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-6.png\" alt=\"계약서와 법령을 비교한 Gemini 답변\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:560px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">답변이 표로 정리됩니다. 필요하면 ⋯ 메뉴에서 Docs로 저장합니다.</p><br><br><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-7.png\" alt=\"답변을 저장한 구글 문서\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">Docs로 저장한 결과 — 충돌 가능성 표</p><br><br><div class=\"tip\"><b>✅ 이렇게 확인하세요</b>① 예: 계약서 <b>제6조(90일 후 지급)</b>와 법령 <b>제13조(수령일부터 60일 이내)</b>를 AI가 짚었는지 ② 짚은 법 조문의 <b>원문이 PDF와 같은지</b> 직접 대조 ③ “위반이다”라고 단정하지 않았는지. 이 단계는 <b>출발점</b>이며, 적용 여부와 위반 판단은 전문가 몫입니다.</div><br><br><br><h4>④ 자주 쓰는 프롬프트를 ‘/’ 스킬로 저장하기 — 급할 때 쓰는 장치</h4><p class=\"item-lead\">방금 쓴 프롬프트가 마음에 들면 저장해 둡니다. 다음에는 <b>계약서만 열고 입력창에 <b>/</b>를 눌러 이름을 고르면</b> 같은 검토가 바로 실행됩니다.</p><p class=\"item-lead\" style=\"margin-top:14px\"><b>저장해 둘 프롬프트 2가지</b> — 이름은 아래 제안 중에서 고르거나 직접 지어도 됩니다.</p><br><br><h4 style=\"margin:10px 0 4px\">A. 계약서 하나만 볼 때 <small style=\"font-weight:400;color:#777\">(이름 예: 계약서 위험 조항)</small></h4><div class=\"prompt-card\"><span class=\"prompt-num\">26</span><span class=\"prompt-text\"># 역할<br>너는 국내 중소 제조업의 계약 검토를 돕는 리스크 관리 전문가야.<br><br># 과업<br><span class=\"hl-r\">지금 보고 있는 이 계약서(현재 탭)</span>를 읽고, <span class=\"hl-b\">을(납품하는 협력사)</span> 입장에서 불리하거나 위험한 조항을 찾아 줘.<br><br># 분석 기준<br><span class=\"hl-b\">1. 대금 지급 시기와 방식, 지체상금 요율과 상한<br>2. 단가 인하·원재료 가격 반영, 발주 변경 시 비용 부담<br>3. 검사 기간, 하자보증 기간과 책임 범위, 손해배상 한도<br>4. 지식재산권 귀속, 비밀유지 의무가 한쪽에만 있는지<br>5. 일방적 해지·해석 조항, 분쟁 해결(관할)</span><br><br># 출력 형식<br>먼저 “가장 위험한 3가지”를 한 줄씩 요약하고,<br>이어서 표로 정리해 줘: 조항 번호 / 원문 인용 / 왜 위험한가 / 위험도(상·중·하) / 수정 제안(초안)<br><br># 주의<br><span class=\"hl-r\">조항 번호와 원문을 반드시 인용하고, 이 계약서에 없는 내용은 만들지 마.</span><br>읽지 못한 부분(별표 등)이 있으면 “확인하지 못함”이라고 말해 줘.<br>법적 판단이 필요한 부분은 “전문가 확인 필요”로 표시해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><h4 style=\"margin:10px 0 4px\">B. 계약서와 법령을 함께 볼 때 <small style=\"font-weight:400;color:#777\">(이름 예: 계약서 법령 충돌)</small></h4><div class=\"prompt-card\"><span class=\"prompt-num\">27</span><span class=\"prompt-text\">지금 열어 둔 <span class=\"hl-r\">두 문서</span>를 함께 보고 답해 줘. 하나는 <span class=\"hl-b\">부품 공급 계약서</span>, 다른 하나는 <span class=\"hl-b\">하도급법 주요 조문 발췌</span>야.<br><br># 과업<br>계약서 조항 중 하도급법 조문과 <span class=\"hl-r\">충돌할 가능성이 있는 것</span>을 찾아 줘.<br><br># 출력 형식<br>표: 계약서 조항 / 관련 법 조문 번호 / 충돌 가능성(상·중·하) / 이유 / 확인할 점<br><br># 주의<br><span class=\"hl-r\">계약서 조항과 법 조문은 번호와 원문을 함께 인용하고, 두 문서에 없는 내용은 만들지 마.</span> 위반 여부를 단정하지 말고 “가능성”으로 표현하고, 최종 판단은 “전문가 확인 필요”로 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><h4 style=\"margin:14px 0 4px\">방법 1. 보낸 프롬프트에서 바로 저장</h4><ol class=\"steps\"><li>사이드바에 보낸 <b>내 프롬프트 말풍선 아래</b>에 마우스를 올리면 아이콘이 나타납니다.</li><li>그중 <b>스킬로 저장</b> 아이콘을 누르고, 이름을 정해 저장합니다. (예: 계약서 법령 충돌)</li></ol><details class=\"petog dotted\"><summary class=\"a3-blocktt petog-sum\">🖱️ 화면으로 보기 — 스킬로 저장<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:center\"><div style=\"flex:1 1 300px;min-width:0;text-align:center\"><img class=\"zoomimg\" src=\"images/chrome-gemini-8.png\" alt=\"보낸 프롬프트 아래의 스킬로 저장 아이콘\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><p class=\"item-lead\" style=\"margin:6px 0 0\">① 보낸 프롬프트 아래 아이콘 중 ‘스킬로 저장’</p></div><div style=\"flex:1 1 300px;min-width:0;text-align:center\"><img class=\"zoomimg\" src=\"images/chrome-gemini-9.png\" alt=\"스킬 추가 창에서 이름을 입력하고 저장\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><p class=\"item-lead\" style=\"margin:6px 0 0\">② 이름을 입력하고 [저장]. 요청 사항에는 보낸 프롬프트가 들어 있습니다.</p></div></div></div></details><br><br><h4 style=\"margin:18px 0 4px\">방법 2. 입력창의 ‘/’에서 직접 추가</h4><ol class=\"steps\"><li>입력창에 <b>/</b>를 입력하면 저장된 스킬 목록이 뜹니다. 맨 아래 <b>기능 추가</b>를 누릅니다.</li><li><b>이름</b>을 적고, <b>요청 사항</b>에 저장할 프롬프트를 붙여 넣은 뒤 <b>저장</b>합니다.</li></ol><details class=\"petog dotted\"><summary class=\"a3-blocktt petog-sum\">🖱️ 화면으로 보기 — / 에서 기능 추가<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:center\"><div style=\"flex:1 1 300px;min-width:0;text-align:center\"><img class=\"zoomimg\" src=\"images/chrome-gemini-10.png\" alt=\"입력창에 슬래시를 눌러 기능 추가를 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><p class=\"item-lead\" style=\"margin:6px 0 0\">① 입력창에 <b>/</b> → 목록 아래 ‘기능 추가’</p></div><div style=\"flex:1 1 300px;min-width:0;text-align:center\"><img class=\"zoomimg\" src=\"images/chrome-gemini-11.png\" alt=\"스킬 추가 창에서 이름과 프롬프트를 입력\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><p class=\"item-lead\" style=\"margin:6px 0 0\">② 이름과 요청 사항(프롬프트)을 직접 넣고 [저장]</p></div></div></div></details><br><br><h4 style=\"margin:18px 0 4px\">방법 3. 스킬 관리 화면에서 추가</h4><ol class=\"steps\"><li>입력창 왼쪽의 <b>+</b>를 누르고 <b>스킬</b>을 고릅니다.</li><li>목록 맨 아래 <b>기능 관리</b>를 누르면 <b>내 역량</b> 화면이 열립니다.</li><li>오른쪽 위 <b>+ 추가</b>를 누르고 이름과 프롬프트를 넣어 저장합니다. (저장한 스킬은 여기서 <b>수정</b>할 수도 있습니다)</li></ol><details class=\"petog dotted\"><summary class=\"a3-blocktt petog-sum\">🖱️ 화면으로 보기 — 스킬 관리 화면<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div style=\"display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;justify-content:center\"><div style=\"flex:0.6 1 300px;min-width:0;text-align:center\"><img class=\"zoomimg\" src=\"images/chrome-gemini-12.png\" alt=\"+ 메뉴에서 스킬을 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><p class=\"item-lead\" style=\"margin:6px 0 0\">① 입력창의 <b>+</b> → <b>스킬</b></p></div><div style=\"flex:1 1 300px;min-width:0;text-align:center\"><img class=\"zoomimg\" src=\"images/chrome-gemini-13.png\" alt=\"기능 관리에서 역량 화면을 열어 추가를 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:100%;height:auto\"><p class=\"item-lead\" style=\"margin:6px 0 0\">② 목록 맨 아래 <b>기능 관리</b> → ‘내 역량’ 화면에서 <b>+ 추가</b></p></div></div></div></details><br><br><br><h4 style=\"margin:18px 0 4px\">저장한 스킬 사용하기</h4><ol class=\"steps\"><li>다른 계약서 탭을 연 뒤 입력창에 <b>/</b>를 입력합니다.</li><li>저장해 둔 <b>스킬 이름</b>을 골라 실행합니다.</li></ol><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-14.png\" alt=\"입력창에 슬래시를 누르면 저장한 스킬 목록이 나오는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:560px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">입력창에 <b>/</b>를 누르면 저장한 스킬이 목록에 나옵니다.</p><br><br><div class=\"tip\"><b>⚠️ 화면 안내</b>크롬의 Gemini는 <b>업데이트로 메뉴 이름과 위치가 자주 바뀝니다.</b> 지역·계정에 따라 보이지 않을 수 있으니 수업 전에 한 번 직접 확인해 안내합니다. 저장 메뉴가 안 보이면 <b>프롬프트를 메모에 복사해 두는 것</b>으로 대신합니다.</div><div class=\"tip\"><b>🧩 여러 문서를 함께 볼 수도 있습니다</b>계약서 여러 개를 <b>교차 검토</b>하거나, 여러 탭을 열어 두고 <b>동시에 분석</b>하는 것도 가능합니다. (이 수업에서는 소개만 합니다)</div><div class=\"tip\"><b>🔒 올리기 전에</b>실제 계약서는 <b>회사명·금액·연락처</b>를 가린 사본으로 쓰고, 계정의 대화 학습 설정을 확인하세요.</div></div></div></div></div><div style=\"margin-top:20px\"><div class=\"block open\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">실습</span><span class=\"block-t\">2. 젬 — 같은 프롬프트로 “계약서 검토 챗봇” 만들기 (약 15분)</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"padding:20px 26px 14px\"><p class=\"item-lead\">프롬프트를 매번 붙여넣는 대신, <b>지침으로 한 번 저장</b>해 두면 계약서만 올려도 같은 검토를 해 주는 <b>나만의 챗봇</b>이 됩니다. 크롬 안에서 하는 것과 달리 <b>Gemini 앱에서 파일을 첨부</b>해 씁니다.</p><div class=\"tip\"><b>📌 화면 안내</b>Gemini 화면의 메뉴 이름은 업데이트로 바뀔 수 있습니다. 아래는 기본 흐름이며, 메뉴 이름이 다르면 화면의 안내를 따라가세요.</div><br><br><br><h4>① 지침 준비하기</h4><p class=\"item-lead\">앞의 프롬프트를 “올려 준 계약서를 검토하라”는 <b>지침 형태</b>로 바꾼 것입니다. 파란 글씨만 내 회사에 맞게 바꿉니다.</p><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">22</span><span class=\"prompt-text\">[역할] 너는 국내 중소 제조 협력사(을)의 <span class=\"hl-b\">계약 리스크 검토 비서</span>다.<br>[작동] 사용자가 <span class=\"hl-b\">계약서를 첨부하거나 붙여넣으면</span> 을(납품하는 협력사) 입장에서 불리하거나 위험한 조항을 찾아 정리한다. 계약서가 없으면 먼저 계약서를 올려 달라고 말한다.<br><br>[확인 항목]<br><span class=\"hl-b\">1. 대금 지급 시기·방식, 지체상금 요율과 상한<br>2. 단가 인하·원재료 가격 반영, 발주 변경 시 비용 부담<br>3. 검사 기간, 하자보증 기간과 책임 범위, 손해배상 한도<br>4. 지식재산권 귀속, 비밀유지 의무가 한쪽에만 있는지<br>5. 일방적 해지·해석 조항, 분쟁 해결(관할)</span><br><br>[출력 형식]<br>· 맨 위: 가장 위험한 3가지를 한 줄씩<br>· 표: 조항 번호 / 원문 인용 / 왜 위험한가 / 위험도(상·중·하) / 수정 제안(초안)<br><br>[판단]<br><span class=\"hl-r\">조항 번호와 원문을 반드시 인용하고, 계약서에 없는 내용은 만들지 않는다. 읽지 못한 부분은 ‘확인하지 못함’이라고 말한다. 법적 판단이 필요한 부분은 ‘전문가 확인 필요’로 표시한다.</span> <span class=\"hl-b\">존댓말, 짧은 문장.</span><br><br>[법령] 지식 파일의 <span class=\"hl-b\">하도급법 발췌</span>를 참고해, 계약서 조항이 관련 법 조문과 충돌할 가능성이 있으면 <span class=\"hl-r\">법 조문 번호와 원문을 함께 인용</span>한다. 지식 파일에 없는 법령은 만들지 않고 ‘법령 확인 필요’로 표시한다. 위반 여부는 단정하지 않는다.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><details class=\"petog dotted\"><summary class=\"a3-blocktt petog-sum\">📄 법령 PDF를 넣지 않을 때 — 법령 줄이 없는 지침<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"prompt-card\"><span class=\"prompt-num\">29</span><span class=\"prompt-text\">[역할] 너는 국내 중소 제조 협력사(을)의 <span class=\"hl-b\">계약 리스크 검토 비서</span>다.<br>[작동] 사용자가 <span class=\"hl-b\">계약서를 첨부하거나 붙여넣으면</span> 을(납품하는 협력사) 입장에서 불리하거나 위험한 조항을 찾아 정리한다. 계약서가 없으면 먼저 계약서를 올려 달라고 말한다.<br><br>[확인 항목]<br><span class=\"hl-b\">1. 대금 지급 시기·방식, 지체상금 요율과 상한<br>2. 단가 인하·원재료 가격 반영, 발주 변경 시 비용 부담<br>3. 검사 기간, 하자보증 기간과 책임 범위, 손해배상 한도<br>4. 지식재산권 귀속, 비밀유지 의무가 한쪽에만 있는지<br>5. 일방적 해지·해석 조항, 분쟁 해결(관할)</span><br><br>[출력 형식]<br>· 맨 위: 가장 위험한 3가지를 한 줄씩<br>· 표: 조항 번호 / 원문 인용 / 왜 위험한가 / 위험도(상·중·하) / 수정 제안(초안)<br><br>[판단]<br><span class=\"hl-r\">조항 번호와 원문을 반드시 인용하고, 계약서에 없는 내용은 만들지 않는다. 읽지 못한 부분은 ‘확인하지 못함’이라고 말한다. 법적 판단이 필요한 부분은 ‘전문가 확인 필요’로 표시한다.</span> <span class=\"hl-b\">존댓말, 짧은 문장.</span></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div></div></details><h4>② 젬 만들기</h4><ol class=\"steps\"><li>gemini.google.com 왼쪽 메뉴에서 <b>Gem</b>(젬 관리자)을 엽니다.</li><li><b>+ 새 Gem</b>을 누르고 이름을 <b>계약 리스크 검토 비서</b>로 합니다.</li><li><b>지침</b> 칸에 위 지침을 붙여넣습니다.</li><li><b>지식 파일</b> 칸에 위에서 내려받은 <b>하도급법 발췌 PDF</b>를 추가합니다. (표준 계약서나 사내 검토 기준이 있으면 함께 넣습니다) 법령은 <b>개정될 수 있으니</b> 실제로 쓸 때는 법제처의 최신 원문으로 교체하고 날짜를 적어 둡니다.</li><li>저장합니다.</li></ol><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-15.png\" alt=\"젬 만들기 화면 — 이름·설명·요청 사항(지침)·지식 파일 칸과 저장 버튼\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">이름·지침·지식 파일(PDF)을 채우고 오른쪽 위 <b>저장</b>을 누릅니다.</p><br><br><h4>③ 잘 돌아가는지 확인하기</h4><ol class=\"steps\"><li>새 대화에서 <b>계약 리스크 검토 비서</b> 젬을 선택합니다.</li><li>위에서 내려받은 <b>PDF 또는 Word 계약서를 첨부</b>하고 “검토해 줘”라고만 입력합니다.</li><li>결과가 <b>크롬 사이드바에서 받은 답과 비슷한지</b> 비교합니다. 빠지거나 다르면 지침의 <b>확인 항목·출력 형식</b>을 고쳐 다시 저장합니다.</li></ol><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-16.png\" alt=\"젬을 선택하고 계약서 PDF를 첨부한 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:640px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">젬을 선택하고 계약서 PDF를 첨부한 뒤 “검토해 줘”라고 보냅니다.</p><br><br><img class=\"zoomimg\" src=\"images/chrome-gemini-17.png\" alt=\"젬이 계약서를 검토해 위험 조항을 정리한 답변 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">젬이 위험한 조항을 요약하고, 표로 원문·이유·위험도·수정 제안을 정리합니다.</p><br><br><br><br><br><h4>④ 위험 조항을 찾은 다음 — 원청에 어떻게 말할까</h4><p class=\"item-lead\">조항을 찾는 것에서 끝나지 않고, <b>무엇부터, 어떤 말투로</b> 요청할지까지 같은 대화에서 이어 갑니다. 젬이 만든 위험 조항 표가 위에 있는 상태에서 순서대로 보냅니다.</p><p style=\"margin:10px 0 4px\"><a href=\"https://share.gemini.google/vLmsOphrsSsa\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;padding:10px 16px;border-radius:8px;background:#1a73e8;color:#fff;font-weight:700;text-decoration:none;font-size:14px\">👀 실제로 돌려 본 대화 보기 ↗</a> <span style=\"font-size:13px;color:#666\">젬이 위험 조항을 찾고, 아래 프롬프트에 답한 전체 과정입니다.</span></p><h4 style=\"margin:10px 0 4px\">1. 무엇부터 요청할지 정하기</h4><div class=\"prompt-card\"><span class=\"prompt-num\">30</span><span class=\"prompt-text\">방금 검토한 <span class=\"hl-b\">계약서 위험 조항 표</span>를 바탕으로, 원청과 협의할 <span class=\"hl-r\">우선순위</span>를 정해 줘.<br><br># 분류<br>① 반드시 고쳐야 함 / ② 협의로 조정 가능 / ③ 수용 가능<br><br># 출력 형식<br>표: 조항 번호 / 분류 / 분류 이유 / 원청에 요구할 내용 한 줄<br>맨 아래에 “먼저 요청할 3가지”를 순서대로 적어 줘.<br><br># 주의<br>우리는 납품하는 협력사(을)이고, 원청과의 관계를 유지하면서 협의하려 해. 위 표에 없는 조항은 만들지 마. 법적 판단이 필요한 부분은 “전문가 확인 필요”로 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><h4 style=\"margin:14px 0 4px\">2. 고쳐 쓸 문구 정하기 — 개정안</h4><div class=\"prompt-card\"><span class=\"prompt-num\">31</span><span class=\"prompt-text\">위에서 정리한 위험 조항 중 <span class=\"hl-b\">① 반드시 고쳐야 함</span>으로 분류한 조항만 골라 <span class=\"hl-r\">개정안</span>을 써 줘.<br><br># 출력 형식<br>표: 조항 번호 / 현행 문구(원문 그대로) / 개정안 문구 / 바꾼 이유 한 줄<br><br># 원칙<br>- 우리는 납품하는 협력사(을)야. 원청이 받아들일 수 있는 수준의 균형 잡힌 문구로 써 줘.<br>- <span class=\"hl-r\">분류에 없는 조항은 건드리지 마.</span> 원문에 없는 내용은 만들지 마.<br>- 법적 판단이 필요한 부분은 “전문가 확인 필요”로 표시해 줘.<br><br># 마지막에<br>원청이 반대할 가능성이 큰 조항과 대안 문구를 한 줄씩 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><h4 style=\"margin:14px 0 4px\">3. 원청에 보낼 메일 초안 — 두 가지 강도</h4><p class=\"item-lead\">관계가 중요한 거래처라면 <b>부드럽게</b>, 이미 한 번 요청했거나 기한이 급하면 <b>단호하게</b>. 두 초안을 비교해 상황에 맞는 것을 고릅니다.</p><h4 style=\"margin:10px 0 4px\">A. 부드럽게 (관계 유지 우선)</h4><div class=\"prompt-card\"><span class=\"prompt-num\">32</span><span class=\"prompt-text\"><span class=\"hl-b\">①분류의 조항</span>을 고쳐 달라고 원청 담당자에게 보낼 <span class=\"hl-r\">정중한 요청 메일 초안</span>을 써 줘.<br><br># 톤<br>부드럽고 협조적으로. 관계 유지가 우선이야. “부탁드립니다”, “검토해 주시면 감사하겠습니다” 같은 표현을 쓰고 비난하는 말은 쓰지 마.<br><br># 구성<br>인사 → 계약 검토에 대한 감사 → 조항별 요청(조항 번호, 현재 내용, 요청 내용, 이유 한 줄) → 협의 요청 일정 제안 → 마무리<br><br># 개정안<br>위에서 만든 <span class=\"hl-b\">개정안 표</span>를 메일 아래에 첨부 형태로 넣어 줘.<br><br># 주의<br>법 위반이라고 단정하지 말고 “관련 규정과 맞는지 함께 확인해 주시면 좋겠다”처럼 써 줘. 없는 사실은 만들지 마. 마지막에 보내기 전에 확인할 점을 3가지 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><h4 style=\"margin:10px 0 4px\">B. 단호하게 (요청과 기한 분명히)</h4><div class=\"prompt-card\"><span class=\"prompt-num\">33</span><span class=\"prompt-text\"><span class=\"hl-b\">①분류의 조항</span>을 고쳐 달라고 원청 담당자에게 보낼 <span class=\"hl-r\">단호한 요청 메일 초안</span>을 써 줘.<br><br># 톤<br>정중하되 분명하게. “수정이 필요합니다”, “이 조항은 수용하기 어렵습니다”, “회신 기한: ○월 ○일” 같은 표현으로 요청과 기한을 명확히 써 줘. 감정적인 표현과 위협은 쓰지 마.<br><br># 구성<br>요청 요약 → 조항별 수정 요청(조항 번호, 현재 내용, 수정안, 이유) → 회신 기한 → 협의가 안 될 경우의 다음 단계(“전문가 상담 후 다시 말씀드리겠습니다” 수준)<br><br># 개정안<br>위에서 만든 <span class=\"hl-b\">개정안 표</span>를 메일 아래에 첨부 형태로 넣어 줘.<br><br># 주의<br>법 위반이라고 단정하지 말고 “관련 규정 위반 소지가 있어 확인이 필요합니다”처럼 써 줘. 없는 사실은 만들지 마. 마지막에 보내기 전에 확인할 점을 3가지 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><h4 style=\"margin:14px 0 4px\">4. 원청이 거절할 때 — 예상 반론과 답변 정리</h4><div class=\"prompt-card\"><span class=\"prompt-num\">34</span><span class=\"prompt-text\">원청 담당자가 아래처럼 나올 때의 <span class=\"hl-r\">예상 반론과 답변</span>을 정리해 줘.<br>- “다른 협력사도 다 이렇게 계약한다”<br>- “이 조항은 본사 표준이라 수정할 수 없다”<br>- “그럼 이번 발주는 다른 업체와 하겠다”<br><br># 출력 형식<br>표: 원청의 말 / 속뜻 / 정중한 답변 예시 / 절대 하면 안 되는 답변<br><br># 주의<br>협박이나 감정적인 말은 쓰지 마. 법적 판단이 필요한 내용은 “전문가 확인 필요”로 적어 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>⚠️ 보내기 전에</b>메일은 <b>초안</b>입니다. 사람이 읽고 고친 뒤 보냅니다. AI가 법 위반을 단정한 문장이 있으면 지우고, 법적 판단이 필요한 조항은 <b>변호사나 하도급분쟁조정협의회</b> 같은 전문가에게 확인하세요. 이 수업은 AI로 검토하는 연습이며 법률 자문이 아닙니다.</div><div class=\"tip\"><b>🧠 지침을 AI에게 만들어 달라고 해도 됩니다 (메타프롬프트)</b>“계약 리스크 검토 비서 젬의 지침을 한글 텍스트로 써 줘. 계약서를 올리면 우리 회사(중소 제조 협력사) 입장에서 불리한 조항을 표로 정리하는 기능이야. 문서에 없는 내용은 만들지 않게 해 줘.”처럼 요청해 보세요.</div><div class=\"tip\"><b>📌 개인 계정에서는</b>젬 공유가 제한될 수 있어 <b>만든 사람 혼자 쓰는 용도</b>로 안내합니다. 젬은 근거 표시가 약할 수 있어 <b>원문과 직접 대조</b>하세요.</div></div></div></div></div><div style=\"margin-top:20px\"><div class=\"block open\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">실습</span><span class=\"block-t\">3. 스킬 — 같은 지침을 스킬로 만들기 (약 10분)</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"padding:20px 26px 14px\"><p class=\"item-lead\">젬은 앞으로 <b>스킬</b>로 바뀌어 갑니다. <b>지침의 내용은 같고</b> 만드는 화면과 이름만 다릅니다. 이미 만든 젬은 스킬로 자동 전환됩니다. 스킬은 <b>Gemini가 관련 상황에서 자동으로 쓰거나, 입력창에서 <b>@</b>로 직접 불러</b> 쓸 수 있습니다.</p><br><br><h4>🎁 먼저, 구글이 만든 스킬을 구경해 봅시다</h4><p class=\"item-lead\">크롬의 Gemini에는 <b>구글이 미리 만들어 둔 스킬</b>이 있습니다. 아래 주소를 크롬 <b>주소창에 붙여넣고 Enter</b>를 누르세요. (링크로는 열리지 않아 복사해서 붙여넣습니다)</p><div class=\"prompt-card\"><span class=\"prompt-num\">주소</span><span class=\"prompt-text\">chrome://skills/browse</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><br><br><img class=\"zoomimg\" src=\"images/chrome-skills-browse.png\" alt=\"크롬 역량 둘러보기 화면 — 친근한 어조로 재작성, 동의어 찾기, 문법 오류 수정, 업무용 이메일 초안 작성 등 제작자 Chrome의 스킬 카드와 추가 버튼\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:900px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">마음에 드는 스킬의 <b>+ 추가</b>를 누르면 <b>내 역량</b>에 저장됩니다. (예: 업무용 이메일 초안 작성)</p><br><br><img class=\"zoomimg\" src=\"images/gemini-skills-page.png\" alt=\"Gemini 스킬 화면 — Gemini로 만들기, 수동으로 만들기, 업로드 버튼과 활성 스킬 목록\" onclick=\"openLb(this)\" loading=\"lazy\"><h4>① 스킬 만들기</h4><ol class=\"steps\"><li>Gemini 화면 왼쪽 아래 <b>설정(⚙️)</b>을 누르고 <b>스킬</b>을 고릅니다.</li><li>오른쪽 위 <b>만들기 ▾</b>를 누르면 <b>Gemini로 만들기</b>(AI에게 설명해서 만들기), <b>수동으로 만들기</b>(직접 입력), <b>업로드하기</b>(만들어 둔 스킬 파일 올리기)가 나옵니다. 이 수업은 <b>수동으로 만들기</b>로 합니다.</li><li>아래처럼 <b>이름 · 설명 · 지침</b>을 채웁니다. <b>설명</b>은 “언제 이 스킬을 쓰는지”를 적는 칸이라 중요합니다.</li></ol><br><br><img class=\"zoomimg\" src=\"images/gemini-skill-menu.png\" alt=\"설정 메뉴에서 스킬을 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:360px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\">왼쪽 아래 설정(⚙️) → <b>스킬</b></p><br><br><img class=\"zoomimg\" src=\"images/gemini-skill-create.png\" alt=\"스킬 화면에서 만들기를 눌러 수동으로 만들기를 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:760px\"><p class=\"item-lead\" style=\"text-align:center;margin:6px 0 0\"><b>만들기 ▾</b> → <b>수동으로 만들기</b></p><br><br><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">23</span><span class=\"prompt-text\">이름: <span class=\"hl-b\">계약서 위험 조항 검토</span><br>설명: <span class=\"hl-r\">계약서를 올리거나 붙여넣고 불리한 조항·위험 조항 검토를 요청할 때 사용한다.</span><br><br>지침:<br>[역할] 너는 국내 중소 제조 협력사(을)의 <span class=\"hl-b\">계약 리스크 검토 비서</span>다 인 필요 항목</span><br>[판단]<br><span class=\"hl-r\">기준값은 사용자가 준 값만 쓴다. 법적 기준은 직접 만들어 쓰지 않고 ‘법령 원문 확인 필요’로 표시한다.</span> <span class=\"hl-b\">계산은 계산식을 함께 적는다.</span></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><p class=\"item-lead\">테스트 입력 (가상 예시 — 내 실제 내용으로 바꿔도 됩니다)</p><div class=\"prompt-card\"><span class=\"prompt-num\">11</span><span class=\"prompt-text\">배출구 먼지 측정값 12.4mg/Sm3, 기준 15mg/Sm3. 질소산화물 측정값 168ppm, 기준 150ppm. 황산화물은 아직 결과 안 나옴.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>✅ 이렇게 확인하세요</b>① 초과 여부를 <b>직접 비교</b>해 보세요(168 > 150 → 초과) ② 결과 안 나온 항목을 <b>[확인 필요]</b>로 남겼는지 ③ 기준값은 <b>내가 준 값이 맞는지</b> 법령 원문으로 확인합니다. (예시 숫자는 연습용 가상 값)</div></div></details><details class=\"petog gold\"><summary class=\"a3-blocktt petog-sum\">실습 ④ 외국인 근로자 안내문 번역 비서<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">12</span><span class=\"prompt-text\">[역할] 너는 <span class=\"hl-b\">[회사·부서명]</span>의 <span class=\"hl-b\">외국인 근로자 안내 도우미</span>다.<br>[작동] 사용자가 <span class=\"hl-b\">작업지시·안전 안내문</span>을 한국어로 붙여넣으면:<br>1) 어려운 말과 줄임말을 쉬운 한국어로 바꾸고<br>2) <span class=\"hl-b\">[번역할 언어]</span>로 번역한다.<br><br>[출력 형식]<br><span class=\"hl-b\">· 쉬운 한국어<br>· [번역할 언어] 번역<br>· 번역문을 다시 한국어로 옮긴 확인용 문장</span><br>[판단]<br><span class=\"hl-r\">금지·경고 문구는 하나도 빠뜨리지 않는다. 불확실한 단어는 [확인 필요]로 표시한다.</span> <span class=\"hl-b\">짧고 명령형으로 쓴다.</span></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><p class=\"item-lead\">테스트 입력 (가상 예시 — 내 실제 안내문으로 바꿔도 됩니다)</p><div class=\"prompt-card\"><span class=\"prompt-num\">13</span><span class=\"prompt-text\">프레스 작동 중에는 손을 넣지 마세요. 이상 소음이 나면 즉시 비상정지 버튼을 누르고 반장에게 알리세요. 보호 안경과 장갑을 반드시 착용하세요.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>✅ 이렇게 확인하세요</b>① <b>“다시 한국어로 옮긴 문장”</b>이 원문과 같은 뜻인지 봅니다 ② <b>금지·경고 문구가 빠지지 않았는지</b> 봅니다 ③ 번역은 틀릴 수 있으니 <b>현장에 붙이기 전에 그 나라 말을 아는 근로자나 통역에게 한 번 확인</b>합니다. 안전 문구의 오역은 사고로 이어질 수 있습니다.</div><div class=\"tip\"><b>➕ [번역할 언어]</b>회사에서 함께 일하는 분들의 언어로 바꿔 쓰세요. 예: 베트남어, 네팔어, 태국어, 우즈베크어, 영어</div></div></details><details class=\"petog gold\"><summary class=\"a3-blocktt petog-sum\">실습 ⑤ 현장 보고 정리 비서 (작업일보·점검 메모)<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"hl-legend\"><span class=\"hl-b\">파란 글씨</span> = 내 상황에 맞게 <b>바꾸는 부분</b> &nbsp;·&nbsp; <span class=\"hl-r\">빨간 글씨</span> = <b>꼭 남겨야 하는 문구</b></div><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\">[역할] 너는 <span class=\"hl-b\">[회사·부서명]</span>의 <span class=\"hl-b\">현장 보고 정리 비서</span>다.<br>[작동] 사용자가 <span class=\"hl-b\">작업일보·점검·불량 메모</span>를 그대로 붙여넣으면:<br>1) 내용을 읽고 빠진 항목을 찾고<br>2) 팀장·임원에게 바로 보고할 수 있는 형태로 정리한다.<br><br>[출력 형식]<br><span class=\"hl-b\">· 맨 위: 오늘의 핵심 1~2줄<br>· 본문: 표 (일시 / 설비·품목 / 내용 / 조치 / 담당)<br>· 이상·불량 사항: 원인 추정과 후속 조치 (없으면 &#x27;없음&#x27;)<br>· 맨 아래: 확인 필요 항목</span><br>[판단]<br><span class=\"hl-r\">메모에 없는 숫자·원인은 지어내지 않고 &#x27;확인 필요&#x27;로 표시한다.</span> <span class=\"hl-b\">존댓말, 짧은 문장, 보고체.</span></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><p class=\"item-lead\">테스트 입력 (가상 예시 — 내 실제 내용으로 바꿔도 됩니다)</p><div class=\"prompt-card\"><span class=\"prompt-num\">3</span><span class=\"prompt-text\">오늘 2호기 사출 오전에 금형 교체함. 교체 후 첫 샷 불량 좀 나와서 온도 조정. 오후엔 3호기 점검, 히터 하나 상태 이상한 것 같음. 자재 입고 늦어져서 라인 1시간 정도 멈췄음. 담당 김OO</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>✅ 이렇게 확인하세요</b>① 메모에 없는 숫자(불량률, 정지 시간의 정확한 값 등)를 <b>지어내지 않고 “확인 필요”로 표시</b>했는지 ② 표의 항목이 내 보고 양식과 맞는지. 맞지 않으면 <b>지침의 출력 형식을 고쳐서 다시 저장</b>합니다.</div></div></details><details class=\"petog dotted\"><summary class=\"a3-blocktt petog-sum\">고쳐 쓰기 — 결과가 마음에 안 들 때<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><ol class=\"steps\"><li>결과에서 <b>바꾸고 싶은 점</b>을 대화로 말합니다. 예: “표 말고 불릿으로”, “더 짧게”, “원인은 3개까지만”</li><li>원하는 결과가 나오면, 그 요구를 <b>지침에 한 줄 추가</b>합니다. 예: “원인 추정은 최대 3개까지 쓴다.”</li><li>젬·스킬의 <b>지침을 수정하고 저장</b>한 뒤, 같은 테스트 입력으로 다시 확인합니다.</li></ol><div class=\"tip\"><b>➕ 활용 팁</b>젬과 스킬은 <b>“자주 반복하는 사고방식”</b>을 저장하는 도구입니다. 단순한 프롬프트 저장함이 아니라, 내가 자주 하는 <b>업무 판단 방식</b>을 저장한다고 생각하면 좋습니다.</div></div></details></div></div></div></div><div class=\"block\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">활용</span><span class=\"block-t\">이렇게 사용해보세요 — 직무별 젬·스킬 활용</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"padding:16px 22px 14px\"><div class=\"xcards\"><div class=\"xc\"><span class=\"xc-n\">생산/공정</span><div class=\"xc-d\" style=\"margin-top:2px;color:#2B3B36\">공정 매뉴얼과 장애 대응 절차를 저장한 ‘공정 트러블슈팅 비서’로 이상 현상별 확인 항목·조치 순서 안내</div></div><div class=\"xc\"><span class=\"xc-n\">품질(QA)</span><div class=\"xc-d\" style=\"margin-top:2px;color:#2B3B36\">품질 기준서와 과거 불량 사례를 저장한 ‘불량 보고 정리 비서’로 불량 유형 분류, 원인 가설, 재발 방지 체크리스트 생성</div></div><div class=\"xc\"><span class=\"xc-n\">구매</span><div class=\"xc-d\" style=\"margin-top:2px;color:#2B3B36\">구매 기준과 협력사 평가 항목을 저장한 ‘협력사 문의·평가 비서’로 문의 메일, 견적 비교 질문, 평가 의견 초안 작성</div></div><div class=\"xc\"><span class=\"xc-n\">설비/공무</span><div class=\"xc-d\" style=\"margin-top:2px;color:#2B3B36\">작업일보·점검 메모를 이력 표로 정리하고 빠진 항목을 되묻는 ‘작업일보 정리 비서’</div></div><div class=\"xc\"><span class=\"xc-n\">환경·안전</span><div class=\"xc-d\" style=\"margin-top:2px;color:#2B3B36\">측정 결과를 기준과 비교해 초과 여부와 확인 필요 항목을 정리하는 ‘측정 결과 요약 비서’</div></div><div class=\"xc\"><span class=\"xc-n\">경영지원/임원</span><div class=\"xc-d\" style=\"margin-top:2px;color:#2B3B36\">내부 보고서 형식을 저장한 ‘보고 정리 비서’로 회의자료 요약, 의사결정 안건, 예상 질문 정리</div></div></div></div></div></div>", "m2": "<h2 class=\"s-title\">🧩 구글 생태계의 Gemini 활용법</h2><p class=\"s-sub\">개인·회사 계정의 차이를 알고 · 메일과 문서 안에서 Gemini 쓰기</p><div class=\"tools\"><span>Gemini</span><span>Workspace</span
