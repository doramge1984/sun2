play:inline;font-size:13px;color:inherit;margin:0\">맨 아래 줄</b>을 현재 상태로, 납기는 색으로<div class=\"cs-q\">“그 건 어디까지 갔지?”</div></div><div class=\"cs-go\" style=\"color:#e37400\">자세히 보기 ▸</div></div><div class=\"cs-card\" onclick=\"openCase(4)\"><div class=\"cs-top\" style=\"background:#7b1fa2\"><div class=\"cs-n\">4</div><div class=\"cs-t\">계약서 위험 조항 찾기</div></div><div class=\"cs-mock\"><div class=\"cs-r\"><u style=\"flex:1\"></u></div><div class=\"cs-r\"><u style=\"flex:1;background:#f3c8c5\"></u></div><div class=\"cs-r\"><u style=\"flex:1\"></u></div><div class=\"cs-r\"><u style=\"width:60%;background:#f3c8c5\"></u></div></div><div class=\"cs-body\"><b>한 줄이 뜻하는 것</b>계약서의 한 조항<b>화면이 하는 일</b>올린 계약서만 보고 <b style=\"display:inline;font-size:13px;color:inherit;margin:0\">불리한 조항과 근거</b>를 표로<div class=\"cs-q\">“이 계약서에서 놓친 위험이 없을까?”</div></div><div class=\"cs-go\" style=\"color:#7b1fa2\">NotebookLM 탭에서 보기 ▸</div></div></div><div class=\"tip\">사례 1~3은 <b>폼 → 시트 → 앱스 스크립트 배포</b> 순서가 같고, 달라지는 것은 <b>“한 줄의 뜻”과 “화면이 하는 계산”</b>뿐입니다. 하나를 해 보면 나머지는 <b>폼 질문과 코드만 달라지는</b> 같은 방법이라, 필요할 때 이어서 해 볼 수 있습니다. <b>사례 4는 NotebookLM 탭</b>에서 이어집니다.</div><div class=\"tools\"><span>구글 폼</span><span>구글 시트</span><span>앱스 스크립트</span><span>Gemini</span></div><div class=\"concept\"><b>이 시간의 목표</b> — 엑셀에 날짜별로 적던 작업일보를 <b>폼으로 입력하면 시트에 자동으로 쌓이고</b>, <b>설비별 이력을 웹 화면으로 한눈에</b> 볼 수 있게 만듭니다. <span class=\"game-hint\">(사전설문 응답을 반영한 맞춤 실습)</span></div><div class=\"block\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">맞춤사례 1</span><span class=\"block-t\">작업일보 이력관리 — 구글 폼 + 시트로 설비별 이력 보기</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div style=\"padding:18px 22px 0\"><div class=\"tip\" style=\"display:flex;gap:18px;align-items:center;flex-wrap:wrap\"><div style=\"flex:1;min-width:230px\"><b>👀 맞춤사례 1 · 완성본을 먼저 열어 보세요</b>오늘 만들 <b>“작업일보 이력 조회 화면”</b>의 완성본입니다. 설비와 분류를 골라 이력이 걸러지는 것을 확인해 보세요. <b>휴대폰에서도 열립니다.</b><br><a href=\"https://script.google.com/macros/s/AKfycbxgeJOpdeAZ11tfjJyJfixn96rYM7UbdToCkT3RqwnmS9O3W3muc87vLMzjrhJkfVY/exec\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:8px;padding:8px 14px;border-radius:8px;background:#1a73e8;color:#fff;font-weight:700;text-decoration:none\">완성된 이력 조회 화면 열기 ↗</a><br><span style=\"font-size:12px;opacity:.75\">가상 데이터입니다. 열리지 않으면 강사에게 알려 주세요.</span></div></div><div class=\"tip\" style=\"display:flex;gap:18px;align-items:center;flex-wrap:wrap\"><div style=\"flex:1;min-width:230px\"><b>✍️ 맞춤사례 1 · 이력은 이 폼에 입력만 하면 쌓입니다</b>위 조회 화면의 데이터는 <b>구글 폼 한 장</b>에서 들어옵니다. 이 링크(또는 QR)만 가지고 있다가 작업이 끝날 때 <b>입력만 하면</b> 이력 관리가 끝납니다. 입력한 내용은 시트에 쌓이고, 조회 화면에 바로 나타납니다.<br><a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdSuBKpk9WmSqlZ0O7CnquCfSJGN6ZvT_fD4QKUW15Opno18g/viewform\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:8px;padding:8px 14px;border-radius:8px;background:#188038;color:#fff;font-weight:700;text-decoration:none\">작업일보 입력 폼 열기 ↗</a><br><span style=\"font-size:12px;opacity:.75\">연습용 폼입니다. 입력한 내용은 가상 데이터로 보이니 업무 정보는 넣지 마세요.</span></div><div style=\"text-align:center\"><img src=\"images/qr-worklog-form.png\" alt=\"작업일보 입력 폼으로 연결되는 QR 코드\" style=\"width:150px;height:150px;border-radius:8px;background:#fff;padding:4px;cursor:zoom-in\" onclick=\"openLb(this)\"><div style=\"font-size:12px;opacity:.75;margin-top:4px\">휴대폰 카메라로 비추세요</div></div></div><div class=\"tip\"><b>📊 맞춤사례 1 · 응답이 쌓이는 구글 시트 보기</b>위 입력 폼과 <b>연결된 구글 시트</b>입니다. 폼에 입력한 내용이 이 시트에 한 줄씩 쌓이고, 완성된 이력 조회 화면은 이 시트를 읽어서 보여 줍니다.<br><a href=\"https://docs.google.com/spreadsheets/d/1AUR4eo55QiuXCxZjTNDs4ihHnnDwwkyTQxVOeTj685c/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;margin-top:8px;padding:8px 14px;border-radius:8px;background:#0b8043;color:#fff;font-weight:700;text-decoration:none\">연결된 구글 시트 열기 ↗</a></div></div><ul class=\"block-ul\"><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 무엇이 달라지나요? (약 2분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">쉬운 말로 풀면, <b>작업일보</b>는 하루 동안 한 일(점검·수리·교체)을 적은 일지이고, <b>이력관리</b>는 설비마다 “언제 무슨 일이 있었는지”를 이어서 보는 것입니다.</div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th></th><th>지금 (엑셀)</th><th>바꾼 뒤 (폼 + 시트)</th></tr></thead><tbody><tr><td class=\"pt-cat\">입력</td><td>엑셀 파일을 열어서 날짜별로 적음</td><td>휴대폰·PC에서 <b>폼에 선택·입력</b></td></tr><tr><td class=\"pt-cat\">모으기</td><td>파일이 쌓이고 일일이 찾음</td><td><b>제출하면 시트에 자동으로 한 줄씩 쌓임</b></td></tr><tr><td class=\"pt-cat\">찾기</td><td>“3호기 지난달에 몇 번 고장 났지?”를 직접 찾음</td><td><b>웹 화면에서 설비별 이력이 바로 나옴</b></td></tr></tbody></table></div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 구글 폼으로 입력 창구 만들기 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">폼의 질문은 아래 표처럼 만듭니다. <b>설비명은 목록에서 고르게</b> 해야 이름이 통일되어 나중에 찾기 쉽습니다.</div><ol class=\"steps\"><li><b>forms.google.com</b>에서 <b>새 양식</b>을 만들고 제목을 “공무팀 작업일보”로 정합니다.</li><li>아래 표의 질문을 차례로 추가합니다.</li><li>맨 위의 <b>응답</b> 탭에서 <b>Sheets에 연결</b>을 눌러 새 시트를 만듭니다. (아래 그림 참고)</li></ol><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>질문</th><th>질문 유형</th><th>입력 예</th></tr></thead><tbody><tr><td class=\"pt-cat\">작업일자</td><td>날짜</td><td>2026-10-13</td></tr><tr><td class=\"pt-cat\">담당자</td><td>단답형 (또는 드롭다운)</td><td>김공무</td></tr><tr><td class=\"pt-cat\">설비명</td><td><b>드롭다운</b></td><td>3호기 사출기, 2호기 사출기, 냉각수 배관, 자재 창고 …</td></tr><tr><td class=\"pt-cat\">작업분류</td><td>객관식</td><td>정기점검 / 예방정비 / 돌발수리 / 개선공사</td></tr><tr><td class=\"pt-cat\">작업내용</td><td>장문형</td><td>히터 밴드 온도 편차 확인</td></tr><tr><td class=\"pt-cat\">특이사항 및 조치 결과</td><td>장문형</td><td>교체 부품 발주 요청 (진행 중)</td></tr></tbody></table></div><div class=\"tip\"><b>📌 사진 첨부는 일단 빼세요</b>폼에 파일 업로드 질문을 넣으면 <b>응답하는 사람이 구글에 로그인해야</b> 할 수 있습니다. 처음에는 빼고 시작하는 것을 권합니다. (수업 전에 직접 확인해 보세요)</div><p class=\"item-lead\">질문 구성을 Gemini에게 맡겨도 됩니다.</p><div class=\"prompt-card\"><span class=\"prompt-num\">1</span><span class=\"prompt-text\">우리 회사 <span class=\"hl-b\">공무팀 작업일보</span>를 구글 폼으로 만들려고 해. 질문 구성안을 표로 만들어 줘.<br><span class=\"hl-r\">질문 / 질문 유형 / 입력 예</span> 순서로 하고, 설비명은 드롭다운, 작업분류는 객관식으로 해 줘. 사진 첨부는 넣지 마.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><h4>폼을 통째로 만들어 주는 프롬프트 (Forms의 Gemini)</h4><p class=\"item-lead\">구글 폼 화면에 <b>Gemini(✦) 버튼 또는 “양식 만들기 도움” 입력창</b>이 보이면, 아래 프롬프트를 붙여넣어 <b>질문까지 한 번에</b> 만들 수 있습니다. 파란 글씨는 내 회사에 맞게 바꾸세요.</p><div class=\"prompt-card\"><span class=\"prompt-num\">61</span><span class=\"prompt-text\"><span class=\"hl-b\">공무팀 작업일보</span> 구글 폼을 만들어 줘. 현장에서 하루 작업을 입력하는 용도야.<br>아래 질문을 이 순서로 만들어 줘.<br>1. 작업일자 — 날짜, 필수<br>2. 담당자 — 단답형, 필수<br>3. 설비명 — <span class=\"hl-r\">드롭다운</span>, 필수. 선택지: <span class=\"hl-b\">3호기 사출기, 2호기 사출기, 냉각수 배관, 자재 창고, 기타</span><br>4. 작업분류 — <span class=\"hl-r\">객관식</span>, 필수. 선택지: <span class=\"hl-b\">정기점검, 예방정비, 돌발수리, 개선공사</span><br>5. 작업내용 — 장문형, 필수<br>6. 특이사항 및 조치 결과 — 장문형, 선택<br><span class=\"hl-r\">사진·파일 첨부 질문은 넣지 마.</span> 설명 문구는 짧게 써 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><p class=\"item-lead\"><span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span></p><img class=\"zoomimg\" src=\"images/gemini-forms-create.png\" alt=\"구글 폼 Gemini 입력창에 프롬프트를 넣어 공무팀 작업일보 양식이 만들어진 미리보기 화면\" onclick=\"openLb(this)\" loading=\"lazy\"><p class=\"item-lead\">프롬프트를 넣으면 이렇게 <b>양식 미리보기</b>가 나옵니다. 마음에 들면 아래 <b>[양식 만들기]</b>를 누릅니다.</p><div class=\"tip\"><b>✅ 만든 뒤 꼭 확인하세요</b>① 설비명이 <b>드롭다운</b>, 작업분류가 <b>객관식</b>으로 되었는지 ② 질문 순서와 <b>필수</b> 표시 ③ 파일 업로드 질문이 끼어 있지 않은지. 다르면 해당 질문의 유형을 직접 바꾸면 됩니다.</div><div class=\"tip\"><b>📌 화면에 Gemini 버튼이 없다면</b>폼 안의 Gemini는 <b>요금제·계정에 따라 안 보일 수 있습니다.</b> 그럴 때는 위의 표를 보고 질문을 직접 추가하거나, Gemini 앱에서 만든 구성안을 보고 따라 만드세요.</div><div class=\"tip\"><b>🧷 만들기 어려우면 — 강사가 만든 폼 사본 쓰기</b>아래 버튼을 누르면 <b>내 구글 드라이브에 같은 폼이 복사</b>됩니다. (구글 로그인이 필요합니다.)<br><a href=\"https://docs.google.com/forms/d/1MekqYRdH1knmXEkIEgnVX3aJCIAR2n14dFemtxq3eRU/copy\" target=\"_blank\" rel=\"noopener\" style=\"display:block;margin:12px 0 8px;padding:16px 20px;border-radius:12px;background:#1a73e8;color:#fff;font-size:18px;font-weight:800;text-align:center;text-decoration:none;box-shadow:0 3px 10px rgba(26,115,232,.35)\">🧷 공무팀 작업일보 폼 사본 만들기 ↗</a>복사한 폼에서 <b>응답 탭 → Sheets에 연결</b>부터 이어서 하세요.</div><h4>폼과 시트 연결하기</h4><p class=\"item-lead\">폼 위쪽의 <b>응답</b> 탭을 누르고, <b>Sheets에 연결</b>을 누릅니다. <b>새 스프레드시트 만들기</b>를 고르면 응답이 쌓일 시트가 생깁니다. <span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span></p><img class=\"zoomimg\" src=\"images/gemini-forms-link-sheets.png\" alt=\"구글 폼의 응답 탭에서 Sheets에 연결 버튼을 누르는 위치\" onclick=\"openLb(this)\" loading=\"lazy\"></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 응답이 시트에 쌓이는 것 확인하기 (약 3분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">폼에 <b>응답 3건</b>을 직접 넣어 보고, 연결한 시트에 한 줄씩 쌓이는지 봅니다.</div><img class=\"zoomimg\" src=\"images/gemini-forms-respond.png\" alt=\"응답자가 보는 공무팀 작업일보 입력 화면 — 작업일자, 담당자, 설비명 드롭다운, 작업분류 객관식, 작업내용, 특이사항\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:380px\"><p class=\"item-lead\">이것이 <b>현장 직원이 휴대폰으로 보게 될 화면</b>입니다. <b>내 폼 링크</b>로 열어서 응답해야 내 시트에 쌓입니다.</p><ol class=\"steps\"><li><b>내 폼</b>의 응답자 링크를 엽니다. (폼 오른쪽 위 <b>보내기 → 링크 아이콘 → 복사</b>한 주소를 새 탭에 붙여넣기) 아래 그림 같은 입력 화면이 나옵니다.</li><li>가상 내용으로 <b>응답 3건</b>을 제출합니다. 설비명은 드롭다운에서, 작업분류는 하나를 골라 주세요.</li><li>연결한 구글 시트를 열면 <b>A열 타임스탬프</b> 뒤로 <b>작업일자·담당자·설비명·작업분류·작업내용·특이사항</b>이 한 줄씩 쌓여 있습니다.</li><li>화면 아래 <b>시트 탭 이름</b>(예: 설문지 응답 시트1)을 기억해 둡니다. 다음 단계 ④(앱스 스크립트)에서 쓰입니다.</li></ol><h4>이렇게 쌓이면 성공입니다</h4><img class=\"zoomimg\" src=\"images/gemini-forms-sheet-result.png\" alt=\"폼 응답이 구글 시트에 한 줄로 쌓인 화면 — 타임스탬프, 작업일자, 담당자, 설비명, 작업분류, 작업내용, 특이사항\" onclick=\"openLb(this)\" loading=\"lazy\"><p class=\"item-lead\">연결한 시트를 열면 <b>제출한 응답이 한 줄</b>로 보입니다. 맨 앞 <b>타임스탬프</b>는 자동으로 들어가고, 그 뒤로 폼의 질문 순서대로 칸이 이어집니다. 3건을 제출했다면 3줄이 보여야 합니다.</p><div class=\"tip\"><b>⚠️ 시트 탭 이름을 꼭 확인하세요</b>화면 위쪽의 <b>Form_Responses</b>는 표 이름입니다. 시트 탭 이름은 <b>화면 맨 아래 탭</b>에 적힌 이름(예: 설문지 응답 시트1)입니다. 다음 단계 ④에서 이 이름을 씁니다.</div><div class=\"tip\"><b>📱 응답하는 사람 화면 먼저 체험해 보기</b>현장 직원이 보게 될 화면입니다. <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSdSuBKpk9WmSqlZ0O7CnquCfSJGN6ZvT_fD4QKUW15Opno18g/viewform?usp=header\" target=\"_blank\" rel=\"noopener\">공무팀 작업일보 응답 화면 열기</a> — 가상 내용으로 한 건 입력해 보세요. 이 링크의 응답은 <b>강사의 폼</b>에 쌓이므로 <b>실명·연락처 같은 개인정보는 넣지 않습니다.</b> <b>내 시트에 쌓이는 것</b>은 위에서 만든 <b>내 폼</b>의 응답입니다. 내 폼 오른쪽 위 <b>보내기(또는 링크 아이콘)</b>에서 응답자 링크를 복사해 열고 3건을 넣어 보세요.</div><h4>시트의 Gemini로 연습 데이터 더 쌓기</h4><p class=\"item-lead\">응답 3건만으로는 이력이 부족하니, <b>구글 시트 안의 Gemini</b>(위 메뉴의 <b>Gemini</b> 또는 오른쪽 위 ✦ 버튼)에게 <b>가상 작업일보를 같은 시트에 추가</b>하게 합니다. 파란 글씨는 내 설비 이름으로 바꾸세요.</p><div class=\"prompt-card\"><span class=\"prompt-num\">62</span><span class=\"prompt-text\">왼쪽 표에 <span class=\"hl-b\">가상 데이터 15건</span>을 채워 줘. <span class=\"hl-r\">기존 응답은 그대로 두고</span> 바로 아래 행부터. 작업일자는 2026-10-01 ~ 10-13 사이로 해 줘.<br><br><span class=\"hl-r\">D열 설비명</span>에는 아래 중 하나만 들어가야 해.<br><span class=\"hl-b\">1 3호기 사출기<br>2 2호기 사출기<br>3 냉각수 배관<br>4 자재 창고<br>5 기타</span><br><br><span class=\"hl-r\">E열 작업분류</span>에는 <span class=\"hl-b\">정기점검, 예방정비, 돌발수리, 개선공사</span> 중 하나만 들어가야 해.<br><br><span class=\"hl-r\">C열 담당자</span>는 <span class=\"hl-b\">김공무, 이정비, 박설비</span> 중에서 써 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><span class=\"game-hint\">(이미지를 누르면 크게 보입니다)</span><img class=\"zoomimg\" src=\"images/gemini-sheets-panel.png\" alt=\"구글 시트 오른쪽 Gemini 패널에 프롬프트를 붙여넣는 화면\" onclick=\"openLb(this)\" loading=\"lazy\"><p class=\"item-lead\">시트 오른쪽 위 <b>Gemini 패널</b>의 입력창(빨간 상자)에 붙여넣고 <b>↑ 보내기</b>를 누릅니다. 목록(D열·E열)을 <b>번호와 함께 정확히 알려 주는 것</b>이 핵심입니다. 이름이 다르게 들어가면 필터로 걸러 볼 때 따로 갈라집니다.</p><h4>이렇게 채워집니다</h4><img class=\"zoomimg\" src=\"images/gemini-sheets-filled.png\" alt=\"시트의 Gemini가 가상 작업일보 데이터를 기존 응답 아래 행에 채운 결과 화면\" onclick=\"openLb(this)\" loading=\"lazy\"><p class=\"item-lead\">기존 응답(2행) 아래로 <b>가상 데이터가 한 번에 채워집니다.</b> 처리 중이라는 안내가 나오면 잠시 기다린 뒤 다시 확인하세요.</p><div class=\"warn\"><b>⚠️ 채워진 뒤 꼭 확인하세요 — AI는 시킨 대로, 그리고 틀리게도 합니다</b>① <b>프롬프트의 오타가 데이터에 그대로 들어갑니다.</b> (예: “개선공사”가 아닌 “개설공사”로 쓰면 E열에 “개설공사”가 그대로 채워집니다.) 프롬프트를 보내기 전에 목록 이름을 확인하세요. ② 날짜가 <b>요청한 범위를 벗어나거나</b>(미래 날짜 등) 건수가 <b>요청과 다를 수</b> 있습니다. ③ 설비명·작업분류가 목록에 있는 이름 그대로인지 D열·E열을 훑어봅니다. ④ 기존 응답이 그대로 남았는지 봅니다. 틀린 칸은 직접 고치거나 Gemini에게 “E열의 개설공사를 개선공사로 바꿔 줘”라고 다시 시키면 됩니다.</div><div class=\"tip\"><b>📌 시트에 Gemini가 안 보이거나 직접 못 쓸 때</b>Gemini 앱에 같은 프롬프트로 <b>표를 만들게 한 뒤 복사</b>해서 시트의 빈 행에 붙여넣으면 됩니다. 시트 안 Gemini는 <b>요금제에 따라 안 보일 수 있습니다.</b></div><div class=\"tip\"><b>💡 보조 연습 파일</b>강사가 준비한 가상 연습 파일(10건)을 시트로 가져와 쓸 수도 있습니다. 이 경우 <b>패들렛으로 나눠 드립니다.</b></div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ 앱스 스크립트로 “이력 조회 웹 화면” 만들기 (약 15분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">시트를 <b>웹 주소(링크) 화면</b>으로 바꿉니다. 폼으로 쌓은 데이터를 <b>설비·분류별로 걸러 보는 화면</b>이 휴대폰에서도 열립니다. 코드는 <b>복사해 붙여넣기</b>만 하면 됩니다. (오후 코덱스 시간에는 이런 화면을 말로 시켜서 만드는 방법도 배웁니다.)</div><ol class=\"steps\"><li>응답이 쌓인 <b>구글 시트 안에서</b> <b>확장 프로그램 → Apps Script</b>를 엽니다. (이 시트 안에서 열어야 시트와 연결됩니다.)</li><li>기본 파일의 내용을 모두 지우고 아래 <b>코드 ①</b>을 붙여넣습니다. 맨 위 <b>SHEET_NAME</b>을 <b>내 시트 아래 탭 이름</b>으로 바꿉니다.</li><li>왼쪽 파일 옆 <b>＋ → HTML</b>을 눌러 이름을 <b>Index</b>로 만들고(대소문자 정확히), 기본 내용을 지운 뒤 <b>코드 ②</b>를 붙여넣습니다.</li><li>저장(💾)한 뒤 오른쪽 위 <b>배포 → 새 배포</b>, 톱니바퀴(유형 선택) → <b>웹 앱</b>을 고릅니다.</li><li><b>실행 사용자: 나</b>, <b>액세스 권한: 나만</b>(가상 데이터로 다른 사람과 공유할 때만 모든 사용자)으로 배포합니다. 권한 허용 화면이 나오면 내가 만든 앱이므로 허용합니다.</li><li>발급된 <b>웹 앱 URL</b>을 열어, 설비·분류를 고르면 이력이 걸러지는지 확인합니다.</li></ol><img class=\"zoomimg\" src=\"images/gemini-sheets-appsscript-menu.png\" alt=\"구글 시트 위쪽 메뉴에서 확장 프로그램을 눌러 Apps Script를 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:520px\"><p class=\"item-lead\">위 그림처럼 <b>확장 프로그램 → Apps Script</b>를 누르면 새 탭에서 편집기가 열립니다.</p><p class=\"item-lead\"><b>코드 ①</b> — 시트에서 데이터를 읽어 오는 부분</p><div class=\"prompt-card\"><span class=\"prompt-num\">63</span><span class=\"prompt-text\">const SHEET_NAME = &#x27;설문지 응답 시트1&#x27;;<br><br>function doGet() {<br>  return HtmlService.createHtmlOutputFromFile(&#x27;Index&#x27;)<br>    .setTitle(&#x27;공무팀 작업일보 이력 조회&#x27;)<br>    .addMetaTag(&#x27;viewport&#x27;, &#x27;width=device-width, initial-scale=1&#x27;);<br>}<br><br>function getWorkLogs() {<br>  const ss = SpreadsheetApp.getActiveSpreadsheet();<br>  const sheet = ss.getSheetByName(SHEET_NAME);<br>  if (!sheet) throw new Error(&#x27;시트 탭 이름을 확인하세요: &#x27; + SHEET_NAME);<br>  const tz = ss.getSpreadsheetTimeZone();<br>  const data = sheet.getDataRange().getValues();<br>  const rows = [];<br>  for (let i = 1; i &lt; data.length; i++) {<br>    const r = data[i];<br>    if (!r[1] &amp;&amp; !r[3]) continue;<br>    rows.push({<br>      date: r[1] instanceof Date ? Utilities.formatDate(r[1], tz, &#x27;yyyy-MM-dd&#x27;) : String(r[1]),<br>      manager: String(r[2]),<br>      facility: String(r[3]),<br>      category: String(r[4]),<br>      content: String(r[5]),<br>      note: String(r[6])<br>    });<br>  }<br>  rows.sort(function (a, b) { return b.date.localeCompare(a.date); });<br>  return rows;<br>}</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><img class=\"zoomimg\" src=\"images/gemini-appsscript-code-pasted.png\" alt=\"Apps Script Code.gs에 코드 ①을 붙여넣은 화면\" onclick=\"openLb(this)\" loading=\"lazy\"><p class=\"item-lead\">Code.gs에 붙여넣으면 위 그림처럼 보입니다. <b>1행의 SHEET_NAME</b>이 내 시트 탭 이름과 같은지 확인합니다.</p><img class=\"zoomimg\" src=\"images/gemini-appsscript-add-html.png\" alt=\"Apps Script 편집기에서 파일 옆 더하기 버튼을 누르고 HTML을 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:380px\"><p class=\"item-lead\">코드 ①을 붙여넣은 뒤, 왼쪽 <b>파일 옆 ＋ → HTML</b>을 눌러 이름을 <b>Index</b>로 만듭니다. 새 파일에는 기본 내용이 들어 있으니 <b>모두 지우고</b> 아래 코드 ②를 붙여넣으세요.</p><img class=\"zoomimg\" src=\"images/gemini-appsscript-files.png\" alt=\"Apps Script 파일 목록에 Code.gs와 제목 없음.html이 보이는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:300px\"><div class=\"warn\"><b>⚠️ 파일 이름을 꼭 <u>Index</u>로 바꾸세요 (I는 대문자)</b>새 HTML 파일은 위 그림처럼 <b>“제목 없음.html”</b>로 만들어질 수 있습니다. 코드 ①이 <b>Index</b>라는 이름의 파일을 찾으므로, 이름이 다르면 웹 화면에 <b>“Index(이)라는 이름의 HTML 파일을 찾을 수 없습니다”</b> 오류가 나옵니다. <b>대소문자도 구분</b>합니다. (.html은 자동으로 붙습니다.)</div><p class=\"item-lead\">아래 그림처럼 파일 이름 오른쪽 <b>⋮ → 이름 변경하기</b>를 눌러 <b>Index</b>로 바꿉니다. 바꾸면 목록에 <b>Index.html</b>로 보입니다.</p><img class=\"zoomimg\" src=\"images/gemini-appsscript-rename.png\" alt=\"Apps Script 파일 이름 옆 점 세 개 메뉴에서 이름 변경하기를 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:340px\"><p class=\"item-lead\"><b>코드 ②</b> — 화면(Index)</p><div class=\"prompt-card\"><span class=\"prompt-num\">64</span><span class=\"prompt-text\">&lt;!DOCTYPE html&gt;<br>&lt;html lang=&quot;ko&quot;&gt;<br>&lt;head&gt;<br>&lt;meta charset=&quot;utf-8&quot;&gt;<br>&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;<br>&lt;style&gt;<br>body{font-family:sans-serif;margin:0;padding:16px;background:#f5f6f8;color:#222}<br>h1{font-size:20px;margin:0 0 4px}<br>.box{background:#fff;border-radius:10px;padding:12px;margin:12px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}<br>input,select{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px}<br>table{width:100%;border-collapse:collapse;background:#fff;font-size:14px}<br>th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}<br>th{background:#eef1f6}<br>.tag{padding:2px 8px;border-radius:10px;font-size:12px;white-space:nowrap}<br>@media (max-width:640px){<br>  thead{display:none}<br>  table,tbody,tr,td{display:block;width:100%;box-sizing:border-box}<br>  tr{background:#fff;border-radius:10px;margin:0 0 10px;padding:6px 4px}<br>  td{border:none;padding:4px 10px}<br>  td[data-l]:before{content:attr(data-l);display:inline-block;width:5em;color:#667;font-size:12px}<br>}<br>&lt;/style&gt;<br>&lt;/head&gt;<br>&lt;body&gt;<br>&lt;h1&gt;🛠️ 공무팀 작업일보 이력 조회&lt;/h1&gt;<br>&lt;div class=&quot;box&quot;&gt;<br>  &lt;select id=&quot;fac&quot; onchange=&quot;render()&quot;&gt;&lt;option value=&quot;&quot;&gt;전체 설비&lt;/option&gt;&lt;/select&gt;<br>  &lt;select id=&quot;cat&quot; onchange=&quot;render()&quot;&gt;<br>    &lt;option value=&quot;&quot;&gt;전체 분류&lt;/option&gt;<br>    &lt;option&gt;정기점검&lt;/option&gt;&lt;option&gt;예방정비&lt;/option&gt;&lt;option&gt;돌발수리&lt;/option&gt;&lt;option&gt;개선공사&lt;/option&gt;<br>  &lt;/select&gt;<br>  &lt;input id=&quot;kw&quot; oninput=&quot;render()&quot; placeholder=&quot;내용 검색 (예: 히터, 누유)&quot;&gt;<br>  &lt;span id=&quot;count&quot;&gt;불러오는 중...&lt;/span&gt;<br>&lt;/div&gt;<br>&lt;table&gt;<br>  &lt;thead&gt;&lt;tr&gt;&lt;th&gt;작업일자&lt;/th&gt;&lt;th&gt;담당자&lt;/th&gt;&lt;th&gt;설비명&lt;/th&gt;&lt;th&gt;분류&lt;/th&gt;&lt;th&gt;작업내용&lt;/th&gt;&lt;th&gt;특이사항 및 조치&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;<br>  &lt;tbody id=&quot;body&quot;&gt;&lt;/tbody&gt;<br>&lt;/table&gt;<br>&lt;script&gt;<br>var all = [];<br>var COLOR = {&#x27;돌발수리&#x27;:&#x27;#fde2e2&#x27;,&#x27;정기점검&#x27;:&#x27;#dbeafe&#x27;,&#x27;예방정비&#x27;:&#x27;#dcfce7&#x27;,&#x27;개선공사&#x27;:&#x27;#ede9fe&#x27;};<br>function esc(s){return String(s).replace(/&amp;/g,&#x27;&amp;amp;&#x27;).replace(/&lt;/g,&#x27;&amp;lt;&#x27;).replace(/&gt;/g,&#x27;&amp;gt;&#x27;);}<br>google.script.run<br>  .withSuccessHandler(function(d){<br>    all = d;<br>    var names = [];<br>    d.forEach(function(r){ if(r.facility &amp;&amp; names.indexOf(r.facility)&lt;0) names.push(r.facility); });<br>    var sel = document.getElementById(&#x27;fac&#x27;);<br>    names.forEach(function(n){ var o=document.createElement(&#x27;option&#x27;); o.textContent=n; sel.appendChild(o); });<br>    render();<br>  })<br>  .withFailureHandler(function(e){ document.getElementById(&#x27;count&#x27;).textContent = &#x27;불러오기 실패: &#x27; + e.message; })<br>  .getWorkLogs();<br>function render(){<br>  var f=document.getElementById(&#x27;fac&#x27;).value, c=document.getElementById(&#x27;cat&#x27;).value;<br>  var k=document.getElementById(&#x27;kw&#x27;).value.toLowerCase();<br>  var list = all.filter(function(r){<br>    return (!f||r.facility===f) &amp;&amp; (!c||r.category===c) &amp;&amp;<br>      (!k||(r.content+&#x27; &#x27;+r.note+&#x27; &#x27;+r.manager).toLowerCase().indexOf(k)&gt;=0);<br>  });<br>  document.getElementById(&#x27;count&#x27;).textContent = &#x27;총 &#x27; + list.length + &#x27;건&#x27;;<br>  document.getElementById(&#x27;body&#x27;).innerHTML = list.map(function(r){<br>    return &#x27;&lt;tr&gt;&lt;td data-l=&quot;작업일자&quot;&gt;&#x27;+esc(r.date)+&#x27;&lt;/td&gt;&lt;td data-l=&quot;담당자&quot;&gt;&#x27;+esc(r.manager)+&#x27;&lt;/td&gt;&lt;td data-l=&quot;설비명&quot;&gt;&lt;b&gt;&#x27;+esc(r.facility)+&#x27;&lt;/b&gt;&lt;/td&gt;&#x27;<br>      +&#x27;&lt;td data-l=&quot;분류&quot;&gt;&lt;span class=&quot;tag&quot; style=&quot;background:&#x27;+(COLOR[r.category]||&#x27;#eee&#x27;)+&#x27;&quot;&gt;&#x27;+esc(r.category)+&#x27;&lt;/span&gt;&lt;/td&gt;&#x27;<br>      +&#x27;&lt;td data-l=&quot;작업내용&quot;&gt;&#x27;+esc(r.content)+&#x27;&lt;/td&gt;&lt;td data-l=&quot;특이사항&quot;&gt;&#x27;+esc(r.note)+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;<br>  }).join(&#x27;&#x27;) || &#x27;&lt;tr&gt;&lt;td colspan=&quot;6&quot;&gt;검색된 이력이 없습니다.&lt;/td&gt;&lt;/tr&gt;&#x27;;<br>}<br>&lt;/script&gt;<br>&lt;/body&gt;<br>&lt;/html&gt;</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><img class=\"zoomimg\" src=\"images/gemini-appsscript-index-pasted.png\" alt=\"Apps Script Index.html에 코드 ②를 붙여넣고 저장 버튼을 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\"><p class=\"item-lead\">Index.html에 붙여넣은 모습입니다. 두 파일 모두 <b>저장(빨간 상자의 💾)</b>을 눌러야 합니다. 위쪽에 <b>“저장되지 않은 변경사항”</b>이 보이면 아직 저장 전입니다.</p><img class=\"zoomimg\" src=\"images/gemini-appsscript-deploy-menu.png\" alt=\"Apps Script 오른쪽 위 배포 버튼에서 새 배포를 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:240px\"><p class=\"item-lead\">오른쪽 위 <b>배포 → 새 배포</b>를 누릅니다. (저장하지 않은 변경이 있으면 먼저 💾 저장)</p><img class=\"zoomimg\" src=\"images/gemini-appsscript-deploy-webapp.png\" alt=\"새 배포 창에서 유형 선택 톱니바퀴를 누르고 웹 앱을 고르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:460px\"><p class=\"item-lead\"><b>새 배포</b> 창에서 <b>유형 선택 톱니바퀴 → 웹 앱</b>을 고릅니다. 그다음 화면에서 아래처럼 설정합니다.</p><img class=\"zoomimg\" src=\"images/gemini-appsscript-deploy-config.png\" alt=\"새 배포 설정 화면 — 설명, 실행 사용자, 액세스 권한, 배포 버튼\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:460px\"><p class=\"item-lead\"><b>설명</b>에 이름(예: 공무팀 작업일보 v1)을 적고, <b>실행 사용자는 ‘나’</b>로 둡니다. <b>액세스 권한</b>을 고른 뒤 <b>배포</b>를 누릅니다. 위 그림은 <b>‘모든 사용자’</b>로 한 예입니다. 내 계정으로만 열어 볼 때는 <b>‘나만’</b>이면 충분하고, <b>‘모든 사용자’</b>는 다른 사람 휴대폰에서도 열어 볼 때 <b>가상 데이터에 한해</b> 씁니다.</p><h4>처음 배포하면 나오는 권한 확인</h4><p class=\"item-lead\">처음 배포하면 <b>“액세스 승인”</b> 창이 나옵니다. 누르면 <b>내 구글 계정을 고르는 창</b>이 뜨고, 이어서 아래처럼 <b>“Google에서 확인하지 않은 앱”</b> 경고가 나옵니다. 이 경고는 <b>내가 직접 만든 앱이라 구글이 따로 검토하지 않았기 때문에</b> 나옵니다.</p><img class=\"zoomimg\" src=\"images/gemini-appsscript-authorize.png\" alt=\"배포 창에서 액세스 승인 버튼을 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:420px\"><img class=\"zoomimg\" src=\"images/gemini-appsscript-unverified.png\" alt=\"Google에서 확인하지 않은 앱 경고에서 Advanced(고급)를 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:420px\"><img class=\"zoomimg\" src=\"images/gemini-appsscript-unsafe.png\" alt=\"고급을 펼친 뒤 아래의 앱 이름 이동(unsafe) 링크를 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:420px\"><p class=\"item-lead\">① <b>액세스 승인</b> → ② 계정 선택 → ③ 경고 창에서 <b>Advanced(고급)</b> → ④ 아래 <b>Go to 공무팀 작업일보 (unsafe)</b> → ⑤ 다음 창에서 요청 내용을 읽고 <b>Continue(계속)</b>을 누릅니다. 화면이 영어로 나와도 위치는 같습니다.</p><img class=\"zoomimg\" src=\"images/gemini-appsscript-consent.png\" alt=\"접근 권한 요청 내용을 확인하고 Continue를 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:420px\"><p class=\"item-lead\">이 창에는 <b>“내 구글 시트 전체를 보고·고치고·만들고·지울 수 있다”</b>고 적혀 있습니다. 그만큼 강한 권한이므로 <b>내가 만든 앱일 때만</b> 허용합니다.</p><h4>배포가 끝나면 웹 앱 주소가 나옵니다</h4><img class=\"zoomimg\" src=\"images/gemini-appsscript-deployed.png\" alt=\"배포 완료 후 웹 앱 URL과 복사 버튼이 보이는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:460px\"><p class=\"item-lead\">빨간 상자의 <b>웹 앱 URL 복사</b>를 눌러 <b>새 탭</b>에 붙여넣으면 이력 조회 화면이 열립니다. (그림의 배포 ID와 주소는 가렸습니다.) <b>이 주소를 아는 사람은 누구나</b> 열 수 있게 설정했다면 열 수 있으니, 가상 데이터일 때만 공유하세요.</p><div class=\"warn\"><b>🔒 내가 만든 앱일 때만 승인하세요</b>이 경고는 <b>내가 직접 만든 코드</b>를 처음 실행할 때만 이렇게 넘어갑니다. <b>모르는 사람이 보낸 링크나 코드</b>에서 같은 경고가 나오면 승인하지 말고 <b>BACK TO SAFETY</b>를 누르세요. 그 앱은 내 시트·메일·드라이브에 접근할 수 있습니다.</div><h4>이렇게 나오면 성공입니다</h4><img class=\"zoomimg\" src=\"images/gemini-appsscript-result.png\" alt=\"앱스 스크립트 웹 앱에 작업일보 이력이 최신순으로 표시된 완성 화면\" onclick=\"openLb(this)\" loading=\"lazy\"><p class=\"item-lead\">폼과 시트에 쌓인 작업일보가 <b>최신순 표</b>로 나옵니다. 위쪽에서 <b>설비</b>, <b>분류</b>를 고르거나 <b>내용 검색</b>에 낱말을 넣어 걸러 보세요. 세 가지를 <b>함께</b> 쓸 수 있고, 새 응답이 쌓이면 <b>새로고침</b>할 때 반영됩니다.</p><div class=\"tip\"><b>🔍 회색 배지를 찾아보세요</b>분류 배지는 <b>정기점검(파랑)·예방정비(초록)·돌발수리(빨강)·개선공사(보라)</b>로 색이 정해져 있습니다. 위 그림의 <b>회색 “개설공사”</b>는 목록에 없는 이름, 즉 <b>오타</b>입니다. 이렇게 화면에서 오타가 눈에 띕니다. 시트에서 고치고 새로고침하면 보라색으로 바뀝니다.</div><h4>웹 화면에 오류 문구가 뜰 때</h4><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>화면에 뜨는 문구</th><th>원인</th><th>해결</th></tr></thead><tbody><tr><td class=\"pt-cat\">Index(이)라는 이름의 HTML 파일을 찾을 수 없습니다</td><td>HTML 파일 이름이 <b>Index</b>가 아님 (예: 제목 없음.html)</td><td>파일 이름을 <b>Index</b>(I는 대문자)로 바꾸고 저장 → <b>새 버전으로 다시 배포</b></td></tr><tr><td class=\"pt-cat\">시트 탭 이름을 확인하세요: …</td><td>코드 ① 맨 위 <b>SHEET_NAME</b>이 내 시트 탭 이름과 다름</td><td>시트 맨 아래 탭 이름을 그대로 넣고 저장 → <b>새 버전으로 다시 배포</b></td></tr><tr><td class=\"pt-cat\">불러오기 실패 / 빈 화면</td><td>코드를 덜 붙여넣었거나, 원본 AI 코드를 그대로 씀</td><td>코드 ①②를 <b>전체 지우고 다시 붙여넣기</b> → 저장 → 새 버전 배포</td></tr><tr><td class=\"pt-cat\">휴대폰·다른 컴퓨터에서 <b>“현재 파일을 열 수 없습니다 (Google Drive 화면)”</b></td><td>휴대폰 브라우저에 <b>구글 계정이 여러 개</b> 로그인되어 있어 계정이 꼬임 (시크릿 탭에서 열리면 이 경우). 드물게 배포의 액세스 권한이 ‘나만’</td><td><b>시크릿(비공개) 탭</b>에서 열기 또는 여분 계정 로그아웃. 시크릿에서도 안 되면 배포 관리 → 연필 → <b>액세스 권한: 모든 사용자</b> → 새 버전 배포</td></tr><tr><td class=\"pt-cat\">시트에는 데이터가 있는데 <b>“총 0건 / 검색된 작업 이력이 없습니다”</b></td><td>화면이 시트 데이터를 <b>가져오지 못함</b> (원본 AI 코드의 날짜 변환·탭 이름 오류 등)</td><td>코드 ①②로 교체 → 새 버전 배포. 원인 확인은 Apps Script 위쪽에서 함수 <b>getWorkLogs</b>를 고르고 <b>실행</b> → 아래 <b>실행 로그</b>의 오류 문구를 읽습니다.</td></tr></tbody></table></div><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">코드를 고쳤다면 — 새 버전으로 다시 배포하기 (수정하는 사람만)<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><p class=\"item-lead\">코드나 파일 이름을 바꿔도 <b>이미 배포된 주소는 옛 상태 그대로</b>입니다. <b>새 버전</b>으로 다시 배포해야 반영되고, <b>주소는 그대로 유지</b>됩니다. (“새 배포”를 누르면 주소가 새로 생깁니다.)</p><ol class=\"steps\"><li>고친 파일을 <b>저장(💾)</b>합니다.</li><li>오른쪽 위 <b>배포 → 배포 관리</b>를 엽니다.</li><li>가운데 위의 <b>연필 아이콘</b>을 누르고, <b>버전</b>을 <b>새 버전</b>으로 고른 뒤 <b>배포</b>를 누릅니다.</li><li><b>“배포가 업데이트되었습니다”</b>가 나오면 <b>완료</b>를 누르고, 웹 앱 주소를 <b>새로고침</b>합니다.</li></ol><img class=\"zoomimg\" src=\"images/gemini-appsscript-manage-deploy.png\" alt=\"배포 관리 창에서 연필 아이콘을 누르고 버전을 새 버전으로 고른 뒤 배포를 누르는 화면\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:460px\"><img class=\"zoomimg\" src=\"images/gemini-appsscript-updated.png\" alt=\"배포가 업데이트되었습니다 화면 — 버전 번호가 올라가고 웹 앱 주소는 그대로\" onclick=\"openLb(this)\" loading=\"lazy\" style=\"max-width:460px\"><p class=\"item-lead\">두 번째 그림처럼 <b>버전 번호가 올라가면</b> 성공입니다. (그림의 배포 ID와 주소는 가렸습니다.)</p></div></details><div class=\"warn\"><b>⚠️ 액세스 권한을 함부로 열지 마세요</b>“모든 사용자”로 배포하면 <b>링크를 아는 누구나</b> 설비 이력을 볼 수 있습니다. 이번 실습은 가상 데이터라 괜찮지만, <b>실제 업무 일보는 공개하지 않습니다.</b> 현장에서 공유하려면 회사 관리자와 먼저 상의하세요.</div><div class=\"tip\"><b>🔍 AI가 준 코드를 그대로 쓰면 안 되는 이유</b>이 코드는 AI가 만든 초안을 <b>점검해 고친 것</b>입니다. 초안에는 ① 시간대를 따옴표 안에 문자열로 넣어 <b>날짜 변환이 실패</b>하는 부분, ② 날짜 객체를 화면으로 그대로 넘겨 <b>데이터가 비어 도착할 수 있는</b> 부분, ③ 시트 탭 이름을 고정해 <b>내 시트에서는 오류가 나는</b> 부분, ④ 입력된 글자를 걸러 내지 않고 화면에 넣는 부분이 있었습니다. <b>코드도 “실행해 보고 결과를 확인”</b>해야 합니다.</div><div class=\"tip\"><b>💡 코드를 고친 뒤에는 새 버전으로 배포</b>수정 후에는 <b>배포 → 배포 관리 → 연필 아이콘 → 버전: 새 버전 → 배포</b>를 해야 웹 주소에 반영됩니다.</div><p class=\"item-lead\">화면에 <b>“불러오기 실패”</b>가 나오면 오류 메시지를 Gemini에게 보여 주세요.</p><div class=\"prompt-card\"><span class=\"prompt-num\">65</span><span class=\"prompt-text\">구글 시트에 연결한 앱스 스크립트 웹앱을 만들었는데 화면에 <span class=\"hl-r\">&#x27;불러오기 실패&#x27;</span>가 나와.<br>오류 메시지: <span class=\"hl-b\">[여기에 오류 메시지 붙여넣기]</span><br>내 시트 아래 탭 이름: <span class=\"hl-b\">[탭 이름]</span><br>원인을 쉬운 말로 설명하고, 고쳐야 할 부분만 알려 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>📌 계정에 따라 다를 수 있어요</b>앱스 스크립트는 개인 계정에서 쓸 수 있습니다. 회사(Workspace) 계정은 <b>관리자 정책</b>에 따라 막혀 있을 수 있습니다.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 코드가 어려울 때 — 필터·시트 Gemini로 보기 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">웹 화면이 잘 안 되면 이렇게 해도 <b>설비 하나의 이력만</b> 볼 수 있습니다. <b>수식은 쓰지 않습니다.</b></div><h4>방법 ① 필터로 보기 — 가장 간단합니다</h4><ol class=\"steps\"><li>응답 시트에서 <b>설비명</b> 머리글의 필터 버튼(▾)을 누릅니다. 안 보이면 <b>데이터 → 필터 만들기</b>를 누릅니다.</li><li><b>값별 필터</b>에서 <b>모두 지우기</b>를 누르고 <b>3호기 사출기</b>만 체크한 뒤 확인합니다.</li><li>같은 방법으로 <b>작업분류</b>에서 <b>돌발수리</b>만 고르면 “3호기 사출기의 돌발수리”만 남습니다.</li><li>다 본 뒤에는 필터를 <b>해제</b>해서 전체가 보이게 합니다.</li></ol><h4>방법 ② 시트의 Gemini에게 설비별 시트로 나누게 하기</h4><p class=\"item-lead\">필터 대신 <b>설비마다 시트(탭)를 따로</b> 갖고 싶다면, 시트 오른쪽 Gemini 패널에 말로 시킵니다.</p><div class=\"prompt-card\"><span class=\"prompt-num\">4</span><span class=\"prompt-text\">왼쪽 표(Form_Responses)의 데이터를 <span class=\"hl-r\">D열 설비명별로 나눠서</span>, 설비마다 새 시트(탭)를 만들어 줘.<br>- 새 시트 이름은 설비명으로 해 줘. (예: 3호기 사출기)<br>- 각 시트에는 해당 설비의 행만 넣고, 작업일자가 <span class=\"hl-b\">최신순</span>이 되게 정렬해 줘.<br>- <span class=\"hl-r\">원본 시트는 그대로</span> 두고 지우거나 바꾸지 마.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"warn\"><b>✅ 나눈 뒤 꼭 확인하세요</b>① 설비 수만큼 시트(탭)가 생겼는지 ② <b>각 시트의 행 수를 더하면 원본 전체 행 수와 같은지</b> ③ 원본 시트가 그대로인지. 숫자가 맞지 않으면 Gemini에게 “빠진 행이 있어. 다시 나눠 줘”라고 말합니다.</div><div class=\"tip\"><b>📌 알아 두세요</b>나눠 만든 시트는 <b>그때의 데이터</b>입니다. 새 응답이 쌓여도 자동으로 따라오지 않을 수 있으니, 필요하면 다시 시키거나 필터를 쓰세요. 시트 안 Gemini가 안 보이는 계정이면 방법 ①만 하면 됩니다.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑥ 이어서 — 쌓인 데이터와 옛 엑셀은 이렇게<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">한 번 만들어 두면 <b>한 달 치가 쌓인 뒤</b> 이어서 활용할 수 있습니다.</div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>하고 싶은 일</th><th>쓰는 도구</th></tr></thead><tbody><tr><td class=\"pt-cat\">쌓인 일보에서 반복되는 이상 찾기</td><td>NotebookLM에 일보 파일을 올려 질문하기 (NotebookLM 탭)</td></tr><tr><td class=\"pt-cat\">매일 메모를 정리된 한 줄로 바꾸기</td><td>젬·스킬 “현장 보고 정리 비서”</td></tr><tr><td class=\"pt-cat\">이미 쌓인 옛 엑셀 여러 개를 한 번에 정리</td><td>오후 코덱스 시간</td></tr></tbody></table></div></div></li></ul></div></div><div class=\"block\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">맞춤사례 2</span><span class=\"block-t\">원부자재 재고 파악 — 입출고만 기록하면 현재고가 계산돼요</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div class=\"concept\"><b>이 시간의 목표</b> — <b>입고·출고를 폼에 기록</b>하면 <b>품목별 현재고와 부족 경고</b>가 웹 화면에 자동으로 나오게 만듭니다. <span class=\"game-hint\">(사전설문 응답을 반영한 사례)</span></div><ul class=\"block-ul\"><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 무엇이 달라지나요? (약 2분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">재고는 엑셀에 <b>“남은 수량”을 고쳐 적는 숫자</b>가 아니라, <b>입고·출고를 한 줄씩 기록</b>해 두고 <b>계산해서 보는 숫자</b>로 바꾸면 훨씬 덜 틀립니다. <b>현재고 = 입고 합계 − 출고 합계</b>입니다. <br><b>원부자재</b>는 원자재(제품의 주재료)와 부자재(포장재·소모품 등 보조 재료)를 합쳐 부르는 말입니다. 아래 품목 이름은 <b>예시</b>이니 내 회사 재료로 바꿔 쓰세요.</div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th></th><th>지금 (엑셀 수기)</th><th>바꾼 뒤 (폼 + 시트 + 웹 화면)</th></tr></thead><tbody><tr><td class=\"pt-cat\">입력</td><td>남은 수량을 찾아서 고쳐 적음</td><td><b>입고 / 출고만 폼에 기록</b> (품목은 목록에서 선택)</td></tr><tr><td class=\"pt-cat\">계산</td><td>직접 더하고 빼서 틀리기 쉬움</td><td><b>웹 화면이 자동으로 현재고 계산</b></td></tr><tr><td class=\"pt-cat\">확인</td><td>“지금 얼마 남았지?” 파일을 열어서 찾음</td><td><b>휴대폰 화면에서 부족한 품목에 색 경고</b></td></tr></tbody></table></div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 구글 폼으로 입출고 입력 창구 만들기 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">품목은 <b>드롭다운으로 고르게</b> 해야 “주원료 A / 원료A”처럼 이름이 갈라지지 않습니다. 직접 만들거나, 아래 프롬프트를 폼의 Gemini에게 주세요.</div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>질문</th><th>질문 유형</th><th>입력 예</th></tr></thead><tbody><tr><td class=\"pt-cat\">입출고일자</td><td>날짜</td><td>2026-10-13</td></tr><tr><td class=\"pt-cat\">구분</td><td>객관식</td><td>입고 / 출고</td></tr><tr><td class=\"pt-cat\">품목명</td><td><b>드롭다운</b></td><td>주원료 A, 주원료 B, 첨가제, 포장 포대, 라벨</td></tr><tr><td class=\"pt-cat\">수량</td><td>숫자 (0보다 큰 값)</td><td>120</td></tr><tr><td class=\"pt-cat\">담당자</td><td>단답형</td><td>김자재</td></tr><tr><td class=\"pt-cat\">비고</td><td>장문형 (선택)</td><td>거래처, LOT 번호 등</td></tr></tbody></table></div><p class=\"item-lead\"><b>폼의 Gemini에게 주는 프롬프트</b> (폼 만들기 화면의 Gemini 입력창에 붙여넣기)</p><div class=\"prompt-card\"><span class=\"prompt-num\">71</span><span class=\"prompt-text\">원부자재 입출고 기록 구글 폼을 만들어 줘. 제목은 <span class=\"hl-b\">“원부자재 입출고 기록”</span>.<br>질문은 ① 입출고일자(날짜) ② 구분(객관식: 입고, 출고) ③ 품목명(드롭다운: 주원료 A, 주원료 B, 첨가제, 포장 포대, 라벨) ④ 수량(숫자, 0보다 큰 값만) ⑤ 담당자(단답형) ⑥ 비고(장문형, 선택)이야.<br>①~⑤는 필수로 해 줘. 사진 첨부는 넣지 마.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><ol class=\"steps\"><li>폼이 만들어지면 맨 위 <b>응답</b> 탭에서 <b>Sheets에 연결</b>을 눌러 새 시트를 만듭니다. (작업일보 ②와 같은 방법)</li><li>시트의 열 순서는 <b>A 타임스탬프 · B 입출고일자 · C 구분 · D 품목명 · E 수량 · F 담당자 · G 비고</b>가 되어야 아래 코드가 맞게 읽습니다. 질문 순서를 바꿨다면 이 순서로 맞춰 주세요.</li></ol></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 연습 데이터 쌓기 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">먼저 <b>폼에 직접 3건</b>(입고 2건, 출고 1건)을 입력해 시트에 한 줄씩 쌓이는지 봅니다. 그다음 시트의 Gemini로 연습 데이터를 더 채웁니다.</div><div class=\"tip\"><b>💡 처음 재고는 “입고”로 기록하세요</b>지금 창고에 있는 수량도 <b>입고 1건</b>(비고에 “기초재고”)으로 넣으면 계산이 맞습니다.</div><p class=\"item-lead\"><b>시트의 Gemini에게 주는 프롬프트</b> (시트 오른쪽 위 Gemini 버튼)</p><div class=\"prompt-card\"><span class=\"prompt-num\">72</span><span class=\"prompt-text\">왼쪽 표에 가상 데이터 20건을 채워 줘. 기존 응답은 그대로 두고 바로 아래 행부터.<br>입출고일자는 2026-10-01 ~ 10-13 사이로 해 줘.<br>C열 구분은 입고, 출고 중 하나만.<br>D열 품목명에는 아래 중 하나만 들어가야 해. 1 주원료 A / 2 주원료 B / 3 첨가제 / 4 포장 포대 / 5 라벨.<br>E열 수량은 양의 정수로, 주원료 A·B는 50~300, 첨가제는 10~80, 포장 포대는 50~400, 라벨은 100~1000.<br>F열 담당자는 김자재, 이구매, 박창고 중에서 써 줘.<br>품목마다 입고를 먼저 넣고, 출고 합계가 입고 합계를 넘지 않게 해 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"warn\"><b>⚠️ 채운 뒤 꼭 확인하세요</b>① 구분에 입고·출고 외의 글자가 없는지 ② 품목명이 5개 중 하나인지 ③ 수량이 숫자인지 ④ 날짜 범위가 맞는지 확인합니다. AI는 <b>철자를 바꾸거나 범위를 어길 수 있어서</b>, 틀린 글자가 있으면 재고 계산에서 빠집니다.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ 재고 현황 웹 화면 만들기 (약 15분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">작업일보와 <b>같은 방법</b>입니다. 시트에서 <b>확장 프로그램 → Apps Script</b>를 열고, 아래 코드를 붙여넣어 웹 앱으로 배포합니다. 화면에는 <b>품목별 현재고 · 안전재고 대비 막대 · 부족/긴급 표시 · 최근 입출고 기록</b>이 나옵니다.</div><ol class=\"steps\"><li>응답 시트에서 <b>확장 프로그램 → Apps Script</b>를 엽니다.</li><li>기본 내용을 지우고 <b>코드 ①</b>을 붙여넣습니다. 맨 위 <b>SHEET_NAME</b>을 내 시트 아래 탭 이름으로 바꿉니다.</li><li><b>＋ → HTML</b>로 파일을 만들어 이름을 <b>Index</b>(I 대문자)로 바꾸고, 기본 내용을 지운 뒤 <b>코드 ②</b>를 붙여넣습니다.</li><li><b>배포 → 새 배포 → 웹 앱</b>을 고르고 실행 사용자 <b>나</b>, 액세스 권한 <b>나만</b>(연습용)으로 배포합니다. 권한 확인 화면은 작업일보 ④와 같습니다.</li><li>웹 앱 주소를 열어 품목 카드가 나오는지 봅니다. 폼에서 <b>첨가제를 큰 수량으로 출고</b>로 입력하고 새로고침하면 그 품목이 <b>부족/긴급</b>으로 바뀝니다.</li></ol><p class=\"item-lead\"><b>코드 ①</b> — 입고·출고를 합산해 현재고를 계산하는 부분</p><div class=\"prompt-card\"><span class=\"prompt-num\">73</span><span class=\"prompt-text\">const SHEET_NAME = &#x27;설문지 응답 시트1&#x27;;<br><br>// 품목별 단위와 안전재고(이 수량보다 적으면 부족 표시). 내 회사 품목 이름으로 바꿔 쓰세요.<br>const ITEMS = {<br>  &#x27;주원료 A&#x27;: { unit: &#x27;kg&#x27;, safe: 200 },<br>  &#x27;주원료 B&#x27;: { unit: &#x27;kg&#x27;, safe: 100 },<br>  &#x27;첨가제&#x27;: { unit: &#x27;kg&#x27;, safe: 50 },<br>  &#x27;포장 포대&#x27;: { unit: &#x27;개&#x27;, safe: 300 },<br>  &#x27;라벨&#x27;: { unit: &#x27;장&#x27;, safe: 1000 }<br>};<br><br>function doGet() {<br>  return HtmlService.createHtmlOutputFromFile(&#x27;Index&#x27;)<br>    .setTitle(&#x27;원부자재 재고 현황&#x27;)<br>    .addMetaTag(&#x27;viewport&#x27;, &#x27;width=device-width, initial-scale=1&#x27;);<br>}<br><br>function getStock() {<br>  const ss = SpreadsheetApp.getActiveSpreadsheet();<br>  const sheet = ss.getSheetByName(SHEET_NAME);<br>  if (!sheet) throw new Error(&#x27;시트 탭 이름을 확인하세요: &#x27; + SHEET_NAME);<br>  const tz = ss.getSpreadsheetTimeZone();<br>  const data = sheet.getDataRange().getValues();<br><br>  const sum = {};<br>  Object.keys(ITEMS).forEach(function (k) { sum[k] = { inQty: 0, outQty: 0 }; });<br>  const logs = [];<br><br>  for (let i = 1; i &lt; data.length; i++) {<br>    const r = data[i];<br>    const kind = String(r[2]).trim();<br>    const name = String(r[3]).trim();<br>    const qty = Number(r[4]);<br>    if (!name || !(qty &gt; 0)) continue;<br>    if (kind !== &#x27;입고&#x27; &amp;&amp; kind !== &#x27;출고&#x27;) continue;<br>    if (!sum[name]) sum[name] = { inQty: 0, outQty: 0 };<br>    if (kind === &#x27;입고&#x27;) sum[name].inQty += qty; else sum[name].outQty += qty;<br>    logs.push({<br>      date: r[1] instanceof Date ? Utilities.formatDate(r[1], tz, &#x27;yyyy-MM-dd&#x27;) : String(r[1]),<br>      kind: kind, name: name, qty: qty,<br>      manager: String(r[5]), note: String(r[6])<br>    });<br>  }<br><br>  const items = Object.keys(sum).map(function (name) {<br>    const meta = ITEMS[name] || { unit: &#x27;&#x27;, safe: 0 };<br>    const now = sum[name].inQty - sum[name].outQty;<br>    let status = &#x27;정상&#x27;;<br>    if (meta.safe &gt; 0 &amp;&amp; now &lt; meta.safe) status = now &lt; meta.safe / 2 ? &#x27;긴급&#x27; : &#x27;부족&#x27;;<br>    return { name: name, unit: meta.unit, safe: meta.safe, now: now,<br>             inQty: sum[name].inQty, outQty: sum[name].outQty, status: status };<br>  });<br>  logs.sort(function (a, b) { return b.date.localeCompare(a.date); });<br>  return { items: items, logs: logs.slice(0, 30) };<br>}<br></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><p class=\"item-lead\"><b>코드 ②</b> — 재고 카드와 입출고 기록을 보여 주는 화면 (파일 이름 <b>Index</b>)</p><div class=\"prompt-card\"><span class=\"prompt-num\">74</span><span class=\"prompt-text\">&lt;!DOCTYPE html&gt;<br>&lt;html lang=&quot;ko&quot;&gt;<br>&lt;head&gt;<br>&lt;meta charset=&quot;utf-8&quot;&gt;<br>&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;<br>&lt;style&gt;<br>body{font-family:sans-serif;margin:0;padding:16px;background:#f5f6f8;color:#222}<br>h1{font-size:20px;margin:0 0 4px}<br>.sub{font-size:13px;color:#666;margin-bottom:12px}<br>.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}<br>.bar a{background:#1a73e8;color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:13px;font-weight:bold}<br>.bar label{font-size:13px}<br>.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}<br>.card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.12);border-left:6px solid #34a853}<br>.card.low{border-left-color:#f9ab00}<br>.card.crit{border-left-color:#d93025}<br>.nm{font-weight:bold;font-size:15px}<br>.now{font-size:26px;font-weight:bold;margin:4px 0}<br>.now small{font-size:13px;font-weight:normal;color:#666}<br>.meter{height:8px;background:#e8eaed;border-radius:4px;overflow:hidden;margin:6px 0}<br>.meter i{display:block;height:100%;background:#34a853}<br>.low .meter i{background:#f9ab00}<br>.crit .meter i{background:#d93025}<br>.meta{font-size:12px;color:#666}<br>.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:bold;background:#e6f4ea;color:#137333}<br>.low .badge{background:#fef7e0;color:#b06000}<br>.crit .badge{background:#fce8e6;color:#c5221f}<br>h2{font-size:16px;margin:20px 0 8px}<br>table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;font-size:13px}<br>th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}<br>th{background:#f1f3f4}<br>.in{color:#137333;font-weight:bold}.out{color:#c5221f;font-weight:bold}<br>@media (max-width:600px){<br> thead{display:none}<br> tr{display:block;border-bottom:8px solid #f5f6f8;padding:6px 0}<br> td{display:flex;gap:8px;border:0;padding:3px 10px}<br> td:before{content:attr(data-l);min-width:56px;color:#888;font-size:12px}<br>}<br>&lt;/style&gt;<br>&lt;/head&gt;<br>&lt;body&gt;<br>&lt;h1&gt;📦 원부자재 재고 현황&lt;/h1&gt;<br>&lt;div class=&quot;sub&quot; id=&quot;sum&quot;&gt;불러오는 중…&lt;/div&gt;<br>&lt;div class=&quot;bar&quot;&gt;<br>  &lt;a id=&quot;formLink&quot; href=&quot;#&quot; target=&quot;_blank&quot; style=&quot;display:none&quot;&gt;+ 입출고 입력하기&lt;/a&gt;<br>  &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;onlyLow&quot;&gt; 부족한 품목만 보기&lt;/label&gt;<br>&lt;/div&gt;<br>&lt;div class=&quot;grid&quot; id=&quot;cards&quot;&gt;&lt;/div&gt;<br>&lt;h2&gt;최근 입출고 기록 (최근 30건)&lt;/h2&gt;<br>&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;일자&lt;/th&gt;&lt;th&gt;구분&lt;/th&gt;&lt;th&gt;품목&lt;/th&gt;&lt;th&gt;수량&lt;/th&gt;&lt;th&gt;담당자&lt;/th&gt;&lt;th&gt;비고&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody id=&quot;logs&quot;&gt;&lt;/tbody&gt;&lt;/table&gt;<br><br>&lt;script&gt;<br>// 입력 폼 주소를 넣으면 위쪽에 &#x27;입출고 입력하기&#x27; 버튼이 나타납니다. (비워 두면 숨김)<br>var FORM_URL = &#x27;&#x27;;<br>var DATA = null;<br><br>function esc(s){ return String(s == null ? &#x27;&#x27; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function(c){<br>  return {&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]; }); }<br>function num(n){ return Number(n).toLocaleString(&#x27;ko-KR&#x27;); }<br><br>if (FORM_URL) { var a = document.getElementById(&#x27;formLink&#x27;); a.href = FORM_URL; a.style.display = &#x27;inline-block&#x27;; }<br>document.getElementById(&#x27;onlyLow&#x27;).onchange = draw;<br><br>google.script.run<br>  .withSuccessHandler(function(d){ DATA = d; draw(); })<br>  .withFailureHandler(function(e){ document.getElementById(&#x27;sum&#x27;).textContent = &#x27;불러오기 실패: &#x27; + e.message; })<br>  .getStock();<br><br>function draw(){<br>  if (!DATA) return;<br>  var only = document.getElementById(&#x27;onlyLow&#x27;).checked;<br>  var low = DATA.items.filter(function(x){ return x.status !== &#x27;정상&#x27;; }).length;<br>  document.getElementById(&#x27;sum&#x27;).innerHTML = &#x27;품목 &#x27; + DATA.items.length + &#x27;개 · &lt;b style=&quot;color:&#x27; + (low ? &#x27;#c5221f&#x27; : &#x27;#137333&#x27;) + &#x27;&quot;&gt;부족 &#x27; + low + &#x27;개&lt;/b&gt;&#x27;;<br>  var h = &#x27;&#x27;;<br>  DATA.items.forEach(function(x){<br>    if (only &amp;&amp; x.status === &#x27;정상&#x27;) return;<br>    var cls = x.status === &#x27;긴급&#x27; ? &#x27;crit&#x27; : (x.status === &#x27;부족&#x27; ? &#x27;low&#x27; : &#x27;&#x27;);<br>    var pct = x.safe &gt; 0 ? Math.max(0, Math.min(100, Math.round(x.now / (x.safe * 2) * 100))) : 100;<br>    h += &#x27;&lt;div class=&quot;card &#x27; + cls + &#x27;&quot;&gt;&lt;div class=&quot;nm&quot;&gt;&#x27; + esc(x.name) + &#x27;&lt;/div&gt;&#x27;<br>      + &#x27;&lt;div class=&quot;now&quot;&gt;&#x27; + num(x.now) + &#x27; &lt;small&gt;&#x27; + esc(x.unit) + &#x27;&lt;/small&gt;&lt;/div&gt;&#x27;<br>      + &#x27;&lt;div class=&quot;meter&quot;&gt;&lt;i style=&quot;width:&#x27; + pct + &#x27;%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&#x27;<br>      + &#x27;&lt;span class=&quot;badge&quot;&gt;&#x27; + esc(x.status) + &#x27;&lt;/span&gt; &#x27;<br>      + &#x27;&lt;div class=&quot;meta&quot;&gt;안전재고 &#x27; + num(x.safe) + esc(x.unit) + &#x27; · 입고 &#x27; + num(x.inQty) + &#x27; · 출고 &#x27; + num(x.outQty) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27;;<br>  });<br>  document.getElementById(&#x27;cards&#x27;).innerHTML = h || &#x27;&lt;div class=&quot;meta&quot;&gt;표시할 품목이 없습니다.&lt;/div&gt;&#x27;;<br>  var t = &#x27;&#x27;;<br>  DATA.logs.forEach(function(l){<br>    t += &#x27;&lt;tr&gt;&lt;td data-l=&quot;일자&quot;&gt;&#x27; + esc(l.date) + &#x27;&lt;/td&gt;&lt;td data-l=&quot;구분&quot; class=&quot;&#x27; + (l.kind === &#x27;입고&#x27; ? &#x27;in&#x27; : &#x27;out&#x27;) + &#x27;&quot;&gt;&#x27; + esc(l.kind)<br>      + &#x27;&lt;/td&gt;&lt;td data-l=&quot;품목&quot;&gt;&#x27; + esc(l.name) + &#x27;&lt;/td&gt;&lt;td data-l=&quot;수량&quot;&gt;&#x27; + num(l.qty)<br>      + &#x27;&lt;/td&gt;&lt;td data-l=&quot;담당자&quot;&gt;&#x27; + esc(l.manager) + &#x27;&lt;/td&gt;&lt;td data-l=&quot;비고&quot;&gt;&#x27; + esc(l.note) + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;<br>  });<br>  document.getElementById(&#x27;logs&#x27;).innerHTML = t || &#x27;&lt;tr&gt;&lt;td colspan=&quot;6&quot;&gt;기록이 없습니다.&lt;/td&gt;&lt;/tr&gt;&#x27;;<br>}<br>&lt;/script&gt;<br>&lt;/body&gt;<br>&lt;/html&gt;<br></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>🔎 코드 ①의 ITEMS가 핵심입니다</b>품목 이름은 <b>폼의 드롭다운과 글자까지 똑같아야</b> 안전재고가 적용됩니다. 목록에 없는 품목은 안전재고 0으로 표시됩니다.</div><details class=\"petog \"><summary class=\"a3-blocktt petog-sum\">플라스틱·화학 업종이라면 — 품목 예시 (선택)<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><p class=\"item-lead\">업종에 따라 원부자재가 다릅니다. 합성수지·플라스틱 제조라면 아래처럼 잡아 볼 수 있습니다. 이 이름을 <b>폼의 드롭다운과 코드의 ITEMS에 똑같이</b> 넣으세요.</p><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>구분</th><th>품목 예시</th><th>단위</th></tr></thead><tbody><tr><td class=\"pt-cat\">원자재</td><td>PP·PE·ABS 레진 펠릿, 재생 펠릿(분쇄품)</td><td>kg</td></tr><tr><td class=\"pt-cat\">첨가제</td><td>색을 내는 마스터배치, 난연제, 유리섬유, 안정제</td><td>kg</td></tr><tr><td class=\"pt-cat\">포장재</td><td>25kg 포대, 점보백, 팔레트, 스트레치 필름, 라벨</td><td>개 / 장</td></tr><tr><td class=\"pt-cat\">설비 소모품</td><td>필터망, 윤활유, 퍼징 컴파운드</td><td>개 / L / kg</td></tr></tbody></table></div><p class=\"item-lead\">업종이 달라도 <b>품목 이름·단위·안전재고</b>만 바꾸면 같은 방법으로 쓸 수 있습니다. 위 “내 회사 품목으로 바꾸는 프롬프트”에 이 표를 붙여넣어도 됩니다.</p></div></details><p class=\"item-lead\">내 회사 품목으로 바꾸려면 아래 프롬프트로 ITEMS 목록을 만들어 코드 ①의 ITEMS 부분만 교체하세요.</p><div class=\"prompt-card\"><span class=\"prompt-num\">75</span><span class=\"prompt-text\">아래 형식 그대로, 내 회사 품목으로 ITEMS 목록을 만들어 줘.<br>형식: &#x27;품목명&#x27;: { unit: &#x27;단위&#x27;, safe: 안전재고 숫자 },<br>내 품목: <span class=\"hl-b\">[품목명 / 단위 / 안전재고를 줄마다 적기]</span><br>품목명은 한 글자도 바꾸지 말고 그대로 써 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>📌 그 밖의 오류는 작업일보 ④ 오류표와 같습니다</b>“Index 파일을 찾을 수 없음”, “시트 탭 이름 확인”, 휴대폰에서 “현재 파일을 열 수 없습니다”는 위 표의 해결 방법을 그대로 따릅니다. 코드를 고친 뒤에는 <b>새 버전으로 다시 배포</b>해야 반영됩니다.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 이어서 — 여기서 더 하고 싶다면<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">재고가 기록으로 쌓이면 <b>다음 단계</b>가 쉬워집니다.</div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>하고 싶은 일</th><th>쓰는 도구</th></tr></thead><tbody><tr><td class=\"pt-cat\">부족한 품목을 발주서 초안으로 만들기</td><td>젬·스킬 또는 오후 코덱스 시간</td></tr><tr><td class=\"pt-cat\">여러 곳에서 온 입고 엑셀을 한 번에 합치기</td><td>오후 코덱스 시간</td></tr><tr><td class=\"pt-cat\">입고 사진·거래명세서를 읽어 자동 입력</td><td>Gemini + 폼 (심화)</td></tr></tbody></table></div></div></li></ul></div></div><div class=\"block\"><div class=\"block-head\" onclick=\"toggleBlock(this)\"><span class=\"block-n\">맞춤사례 3</span><span class=\"block-t\">접수·진행 현황판 — 번호마다 마지막 줄이 현재 상태예요</span><span class=\"chev\">▾</span></div><div class=\"block-body\"><div class=\"concept\"><b>이 시간의 목표</b> — 접수한 건의 <b>진행 상태를 4칸 현황판</b>으로 보고, <b>납기 지연·임박</b>을 색으로 알게 만듭니다. <span class=\"game-hint\">(사전설문 응답을 반영한 사례)</span></div><ul class=\"block-ul\"><li class=\"item-detail coll coll-green open\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 무엇이 달라지나요? (약 3분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\"><b>접수한 건이 지금 어느 단계인지</b>를 한 화면에서 보고 싶을 때 쓰는 방법입니다. 시료 접수, 설비 수리 요청, 품질 검사 의뢰처럼 <b>“접수 → 처리 → 완료”로 흘러가는 일</b>이면 업종과 상관없이 같습니다.</div><div class=\"concept\"><b>핵심 아이디어</b> — 폼은 줄을 <b>쌓기만</b> 하고 고치지 못합니다. 그래서 상태를 고치지 않고, <b>상태가 바뀔 때마다 같은 접수번호로 한 줄 더 입력</b>합니다. 화면은 <b>번호마다 맨 아래 줄만 현재 상태</b>로 보여 줍니다.</div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>시트에 쌓인 줄</th><th>접수번호</th><th>진행 상태</th></tr></thead><tbody><tr><td class=\"pt-cat\">1번째 줄</td><td>R-001</td><td>접수</td></tr><tr><td class=\"pt-cat\">2번째 줄</td><td>R-001</td><td>진행중</td></tr><tr><td class=\"pt-cat\">3번째 줄</td><td>R-001</td><td>검토  ← 화면에는 이 줄만 현재 상태로 나옵니다</td></tr></tbody></table></div><p class=\"item-lead\">줄이 지워지지 않으니 <b>언제 어떤 단계였는지 이력</b>도 그대로 남습니다.</p><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th></th><th>지금 (엑셀·메모)</th><th>바꾼 뒤 (폼 + 시트 + 현황판)</th></tr></thead><tbody><tr><td class=\"pt-cat\">접수</td><td>엑셀에 한 줄 추가</td><td><b>폼에 입력</b> (진행 상태 = 접수)</td></tr><tr><td class=\"pt-cat\">단계가 바뀔 때</td><td>칸을 찾아 고침 (누가 바꿨는지 안 남음)</td><td><b>같은 번호로 폼 한 번 더</b> (줄이 쌓여 이력이 남음)</td></tr><tr><td class=\"pt-cat\">확인</td><td>“그 건 어디까지 갔지?” 물어봄</td><td><b>4칸 현황판</b>에서 한눈에, 납기 지연은 빨간색</td></tr></tbody></table></div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 구글 폼으로 접수·상태 입력 창구 만들기 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">접수할 때도, 단계가 바뀔 때도 <b>같은 폼</b>을 씁니다. 상태는 <b>목록에서 고르게</b> 해야 글자가 갈라지지 않습니다.</div><div class=\"ptbl-wrap\"><table class=\"ptbl\"><thead><tr><th>질문</th><th>질문 유형</th><th>입력 예</th></tr></thead><tbody><tr><td class=\"pt-cat\">접수일</td><td>날짜</td><td>2026-10-13</td></tr><tr><td class=\"pt-cat\">접수번호</td><td>단답형 (같은 건은 같은 번호)</td><td>R-001</td></tr><tr><td class=\"pt-cat\">구분</td><td><b>드롭다운</b></td><td>시료 분석 / 설비 수리 / 품질 검사 / 기타</td></tr><tr><td class=\"pt-cat\">내용</td><td>장문형</td><td>수질 시료 5건 분석 요청</td></tr><tr><td class=\"pt-cat\">담당자</td><td>단답형</td><td>김접수</td></tr><tr><td class=\"pt-cat\">납기일</td><td>날짜</td><td>2026-10-20</td></tr><tr><td class=\"pt-cat\">진행 상태</td><td><b>객관식</b></td><td>접수 / 진행중 / 검토 / 완료</td></tr><tr><td class=\"pt-cat\">비고</td><td>장문형 (선택)</td><td>특이사항</td></tr></tbody></table></div><p class=\"item-lead\"><b>폼의 Gemini에게 주는 프롬프트</b></p><div class=\"prompt-card\"><span class=\"prompt-num\">81</span><span class=\"prompt-text\">접수·진행 현황 기록 구글 폼을 만들어 줘. 제목은 <span class=\"hl-b\">“접수·진행 현황 기록”</span>.<br>질문은 ① 접수일(날짜) ② 접수번호(단답형, 예: R-001) ③ 구분(드롭다운: 시료 분석, 설비 수리, 품질 검사, 기타) ④ 내용(장문형) ⑤ 담당자(단답형) ⑥ 납기일(날짜) ⑦ 진행 상태(객관식: 접수, 진행중, 검토, 완료) ⑧ 비고(장문형, 선택)이야.<br>①~⑦은 필수로 해 줘. 사진 첨부는 넣지 마.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><ol class=\"steps\"><li>폼이 만들어지면 <b>응답 → Sheets에 연결</b>로 새 시트를 만듭니다.</li><li>시트의 열 순서는 <b>A 타임스탬프 · B 접수일 · C 접수번호 · D 구분 · E 내용 · F 담당자 · G 납기일 · H 진행 상태 · I 비고</b>여야 아래 코드가 맞게 읽습니다.</li></ol></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 연습 데이터 쌓기 (약 5분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">먼저 폼에 <b>직접 3건</b>을 입력합니다. 한 건은 <b>같은 번호로 상태를 바꿔 두 번</b> 입력해 보세요(접수 → 진행중). 그다음 시트의 Gemini로 연습 데이터를 채웁니다.</div><p class=\"item-lead\"><b>시트의 Gemini에게 주는 프롬프트</b></p><div class=\"prompt-card\"><span class=\"prompt-num\">82</span><span class=\"prompt-text\">왼쪽 표에 가상 데이터 16행을 채워 줘. 기존 응답은 그대로 두고 바로 아래 행부터.<br>접수번호 R-001 ~ R-008 8건을 만들고, 일부 건은 같은 번호로 상태가 바뀐 줄을 아래에 더 추가해 줘. 같은 번호는 접수, 진행중, 검토, 완료 순서로 아래로 이어지게 해 줘.<br>B열 접수일은 2026-10-01 ~ 10-13 사이로 하고, G열 납기일은 접수일보다 3 ~ 10일 뒤로 해 줘.<br>D열 구분은 시료 분석, 설비 수리, 품질 검사, 기타 중 하나만.<br>H열 진행 상태는 접수, 진행중, 검토, 완료 중 하나만.<br>F열 담당자는 김접수, 이정비, 박검사 중에서 써 줘.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"warn\"><b>⚠️ 채운 뒤 꼭 확인하세요</b>① 같은 번호의 <b>아래 줄이 나중 단계</b>인지(순서가 거꾸로면 화면이 틀린 상태를 보여 줍니다) ② 진행 상태가 네 단어 중 하나인지 ③ 날짜 범위가 맞는지 확인합니다. 그리고 <b>납기가 이미 지난 미완료 건이 1건 이상</b> 있어야 빨간 표시를 볼 수 있으니, 없으면 폼으로 납기를 과거 날짜로 1건 직접 입력하세요.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ 접수·진행 현황판 만들기 (약 15분)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">사례 1·2와 <b>같은 방법</b>입니다. 응답 시트에서 <b>확장 프로그램 → Apps Script</b>를 열어 코드를 붙여넣고 웹 앱으로 배포합니다.</div><ol class=\"steps\"><li>응답 시트에서 <b>확장 프로그램 → Apps Script</b>를 엽니다.</li><li>기본 내용을 지우고 <b>코드 ①</b>을 붙여넣습니다. 맨 위 <b>SHEET_NAME</b>을 내 시트 아래 탭 이름으로 바꿉니다.</li><li><b>＋ → HTML</b>로 파일을 만들어 이름을 <b>Index</b>(I 대문자)로 하고, 기본 내용을 지운 뒤 <b>코드 ②</b>를 붙여넣습니다.</li><li><b>배포 → 새 배포 → 웹 앱</b>(실행 사용자 나, 액세스 권한 나만)으로 배포합니다. 권한 확인 화면은 작업일보와 같습니다.</li><li>웹 앱 주소를 열어 <b>접수·진행중·검토·완료 4칸</b>에 카드가 나뉘는지 봅니다.</li></ol><p class=\"item-lead\"><b>코드 ①</b> — 번호마다 맨 아래 줄을 현재 상태로 고르고 납기를 계산하는 부분</p><div class=\"prompt-card\"><span class=\"prompt-num\">83</span><span class=\"prompt-text\">const SHEET_NAME = &#x27;설문지 응답 시트1&#x27;;<br>const STATUS = [&#x27;접수&#x27;, &#x27;진행중&#x27;, &#x27;검토&#x27;, &#x27;완료&#x27;];   // 폼의 &#x27;진행 상태&#x27; 선택지와 똑같이<br><br>function doGet() {<br>  return HtmlService.createHtmlOutputFromFile(&#x27;Index&#x27;)<br>    .setTitle(&#x27;접수·진행 현황판&#x27;)<br>    .addMetaTag(&#x27;viewport&#x27;, &#x27;width=device-width, initial-scale=1&#x27;);<br>}<br><br>function toYmd(v, tz) {<br>  return v instanceof Date ? Utilities.formatDate(v, tz, &#x27;yyyy-MM-dd&#x27;) : String(v).trim();<br>}<br><br>function dayNum(ymd) {                       // &#x27;yyyy-MM-dd&#x27; → 날짜 번호<br>  const p = String(ymd).split(&#x27;-&#x27;);<br>  if (p.length !== 3) return null;<br>  return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);<br>}<br><br>function getBoard() {<br>  const ss = SpreadsheetApp.getActiveSpreadsheet();<br>  const sheet = ss.getSheetByName(SHEET_NAME);<br>  if (!sheet) throw new Error(&#x27;시트 탭 이름을 확인하세요: &#x27; + SHEET_NAME);<br>  const tz = ss.getSpreadsheetTimeZone();<br>  const data = sheet.getDataRange().getValues();<br>  const today = dayNum(Utilities.formatDate(new Date(), tz, &#x27;yyyy-MM-dd&#x27;));<br><br>  // 같은 접수번호가 여러 줄이면 &#x27;맨 아래 줄&#x27;이 현재 상태입니다.<br>  const latest = {};<br>  const count = {};<br>  for (let i = 1; i &lt; data.length; i++) {<br>    const r = data[i];<br>    const no = String(r[2]).trim();<br>    if (!no) continue;<br>    latest[no] = r;<br>    count[no] = (count[no] || 0) + 1;<br>  }<br><br>  const items = Object.keys(latest).map(function (no) {<br>    const r = latest[no];<br>    const status = String(r[7]).trim();<br>    const due = toYmd(r[6], tz);<br>    const dn = dayNum(due);<br>    let dday = null;<br>    if (dn !== null) dday = dn - today;           // 음수면 납기 지남<br>    return { no: no, received: toYmd(r[1], tz), kind: String(r[3]), content: String(r[4]),<br>             manager: String(r[5]), due: due, status: status,<br>             dday: dday, updates: count[no], note: String(r[8] || &#x27;&#x27;) };<br>  });<br>  items.sort(function (a, b) { return (a.due || &#x27;9&#x27;).localeCompare(b.due || &#x27;9&#x27;); });<br>  return { statuses: STATUS, items: items };<br>}<br></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><p class=\"item-lead\"><b>코드 ②</b> — 4칸 현황판 화면 (파일 이름 <b>Index</b>)</p><div class=\"prompt-card\"><span class=\"prompt-num\">84</span><span class=\"prompt-text\">&lt;!DOCTYPE html&gt;<br>&lt;html lang=&quot;ko&quot;&gt;<br>&lt;head&gt;<br>&lt;meta charset=&quot;utf-8&quot;&gt;<br>&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;<br>&lt;style&gt;<br>body{font-family:sans-serif;margin:0;padding:16px;background:#f5f6f8;color:#222}<br>h1{font-size:20px;margin:0 0 4px}<br>.sub{font-size:13px;color:#666;margin-bottom:10px}<br>.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;font-size:13px}<br>.bar a{background:#1a73e8;color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:bold}<br>.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}<br>.col{background:#e8eaed;border-radius:10px;padding:8px;min-height:80px}<br>.col h2{font-size:14px;margin:2px 4px 8px;display:flex;justify-content:space-between}<br>.col h2 span{background:#fff;border-radius:10px;padding:0 8px;font-size:12px}<br>.card{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.15);border-left:5px solid #9aa0a6;font-size:13px}<br>.card.late{border-left-color:#d93025}<br>.card.soon{border-left-color:#f9ab00}<br>.no{font-weight:bold;font-size:14px}<br>.kind{display:inline-block;background:#e8f0fe;color:#174ea6;border-radius:8px;padding:1px 8px;font-size:11px;margin-left:6px}<br>.ct{margin:4px 0;color:#333}<br>.meta{color:#666;font-size:12px}<br>.dd{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:8px;font-size:12px;font-weight:bold;background:#f1f3f4;color:#555}<br>.late .dd{background:#fce8e6;color:#c5221f}<br>.soon .dd{background:#fef7e0;color:#b06000}<br>.done .dd{background:#e6f4ea;color:#137333}<br>@media (max-width:700px){.cols{grid-template-columns:1fr}}<br>&lt;/style&gt;<br>&lt;/head&gt;<br>&lt;body&gt;<br>&lt;h1&gt;📋 접수·진행 현황판&lt;/h1&gt;<br>&lt;div class=&quot;sub&quot; id=&quot;sum&quot;&gt;불러오는 중…&lt;/div&gt;<br>&lt;div class=&quot;bar&quot;&gt;<br>  &lt;a id=&quot;formLink&quot; href=&quot;#&quot; target=&quot;_blank&quot; style=&quot;display:none&quot;&gt;+ 접수·상태 입력하기&lt;/a&gt;<br>  &lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;onlyAlert&quot;&gt; 지연·임박만 보기&lt;/label&gt;<br>&lt;/div&gt;<br>&lt;div class=&quot;cols&quot; id=&quot;cols&quot;&gt;&lt;/div&gt;<br><br>&lt;script&gt;<br>// 입력 폼 주소를 넣으면 &#x27;접수·상태 입력하기&#x27; 버튼이 나타납니다. (비워 두면 숨김)<br>var FORM_URL = &#x27;&#x27;;<br>var SOON_DAYS = 2;      // 납기까지 이 일수 이하면 &#x27;임박&#x27;<br>var DATA = null;<br><br>function esc(s){ return String(s == null ? &#x27;&#x27; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, function(c){<br>  return {&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]; }); }<br><br>if (FORM_URL) { var a = document.getElementById(&#x27;formLink&#x27;); a.href = FORM_URL; a.style.display = &#x27;inline-block&#x27;; }<br>document.getElementById(&#x27;onlyAlert&#x27;).onchange = draw;<br><br>google.script.run<br>  .withSuccessHandler(function(d){ DATA = d; draw(); })<br>  .withFailureHandler(function(e){ document.getElementById(&#x27;sum&#x27;).textContent = &#x27;불러오기 실패: &#x27; + e.message; })<br>  .getBoard();<br><br>function level(x){<br>  if (x.status === &#x27;완료&#x27; || x.dday === null) return &#x27;&#x27;;<br>  if (x.dday &lt; 0) return &#x27;late&#x27;;<br>  if (x.dday &lt;= SOON_DAYS) return &#x27;soon&#x27;;<br>  return &#x27;&#x27;;<br>}<br>function ddText(x){<br>  if (x.dday === null) return &#x27;납기 미입력&#x27;;<br>  if (x.status === &#x27;완료&#x27;) return &#x27;납기 &#x27; + esc(x.due);<br>  if (x.dday &lt; 0) return &#x27;지연 &#x27; + (-x.dday) + &#x27;일&#x27;;<br>  if (x.dday === 0) return &#x27;오늘 납기&#x27;;<br>  return &#x27;D-&#x27; + x.dday;<br>}<br><br>function draw(){<br>  if (!DATA) return;<br>  var only = document.getElementById(&#x27;onlyAlert&#x27;).checked;<br>  var late = 0, soon = 0;<br>  DATA.items.forEach(function(x){ var l = level(x); if (l === &#x27;late&#x27;) late++; if (l === &#x27;soon&#x27;) soon++; });<br>  document.getElementById(&#x27;sum&#x27;).innerHTML = &#x27;전체 &#x27; + DATA.items.length + &#x27;건 · &lt;b style=&quot;color:#c5221f&quot;&gt;지연 &#x27; + late + &#x27;&lt;/b&gt; · &lt;b style=&quot;color:#b06000&quot;&gt;임박 &#x27; + soon + &#x27;&lt;/b&gt;&#x27;;<br>  var h = &#x27;&#x27;;<br>  DATA.statuses.forEach(function(st){<br>    var list = DATA.items.filter(function(x){ return x.status === st &amp;&amp; (!only || level(x)); });<br>    h += &#x27;&lt;div class=&quot;col&quot;&gt;&lt;h2&gt;&#x27; + esc(st) + &#x27;&lt;span&gt;&#x27; + list.length + &#x27;&lt;/span&gt;&lt;/h2&gt;&#x27;;<br>    list.forEach(function(x){<br>      var l = level(x);<br>      h += &#x27;&lt;div class=&quot;card &#x27; + l + (x.status === &#x27;완료&#x27; ? &#x27; done&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&lt;div&gt;&lt;span class=&quot;no&quot;&gt;&#x27; + esc(x.no) + &#x27;&lt;/span&gt;&lt;span class=&quot;kind&quot;&gt;&#x27; + esc(x.kind) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;<br>        + &#x27;&lt;div class=&quot;ct&quot;&gt;&#x27; + esc(x.content) + &#x27;&lt;/div&gt;&#x27;<br>        + &#x27;&lt;div class=&quot;meta&quot;&gt;담당 &#x27; + esc(x.manager) + &#x27; · 접수 &#x27; + esc(x.received) + &#x27;&lt;/div&gt;&#x27;<br>        + &#x27;&lt;span class=&quot;dd&quot;&gt;&#x27; + ddText(x) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27;;<br>    });<br>    h += &#x27;&lt;/div&gt;&#x27;;<br>  });<br>  var known = DATA.statuses;<br>  var etc = DATA.items.filter(function(x){ return known.indexOf(x.status) &lt; 0; });<br>  if (etc.length) {<br>    h += &#x27;&lt;div class=&quot;col&quot;&gt;&lt;h2&gt;상태 확인 필요&lt;span&gt;&#x27; + etc.length + &#x27;&lt;/span&gt;&lt;/h2&gt;&#x27;;<br>    etc.forEach(function(x){ h += &#x27;&lt;div class=&quot;card&quot;&gt;&lt;span class=&quot;no&quot;&gt;&#x27; + esc(x.no) + &#x27;&lt;/span&gt; · 상태: &#x27; + esc(x.status) + &#x27;&lt;/div&gt;&#x27;; });<br>    h += &#x27;&lt;/div&gt;&#x27;;<br>  }<br>  document.getElementById(&#x27;cols&#x27;).innerHTML = h;<br>}<br>&lt;/script&gt;<br>&lt;/body&gt;<br>&lt;/html&gt;<br></span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>🎨 화면이 이렇게 보입니다</b><b>빨간 카드</b> = 납기 지난 미완료 건 · <b>노란 카드</b> = 납기 2일 이내 · <b>초록 표시</b> = 완료 · 상태 글자가 네 개 말과 다르면 <b>“상태 확인 필요”</b> 칸에 따로 모입니다. “지연·임박만 보기”를 체크하면 급한 건만 남습니다.</div><div class=\"tip\"><b>📌 그 밖의 오류는 작업일보 ④ 오류표와 같습니다</b>Index 파일 없음, 시트 탭 이름 확인, 휴대폰에서 “현재 파일을 열 수 없습니다”도 같은 방법으로 해결합니다. 코드를 고친 뒤에는 <b>새 버전으로 다시 배포</b>해야 반영됩니다.</div></div></li></ul></div></div>", "setup": "<div class=\"setup-wrap\"><h2 class=\"s-title\">🛠️ 시작 전 환경 세팅</h2><p class=\"s-sub\">연수 당일, 계정 만드느라 첫 시간을 쓰지 않으려면.</p><p class=\"setup-intro\">실습에는 <b>크롬 브라우저</b>와 <b>구글 개인계정</b>이 필요합니다. 아래 <b>8단계</b>를 미리 마쳐 두시면 첫 시간부터 바로 실습에 들어갑니다.</p><div class=\"step\"><div class=\"step-badge\">STEP 1</div><div class=\"step-title\">크롬 브라우저가 없다면? 크롬 설치</div><p class=\"step-lead\">이 연수는 <b>크롬(Chrome)</b> 기준으로 진행합니다. 엣지에서는 실습 중 일부 기능이 <b>아예 나타나지 않아요.</b></p><a class=\"link-btn\" href=\"https://www.google.com/chrome/\" target=\"_blank\" rel=\"noopener\">⬇️ 크롬 설치하기</a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">다운로드한 뒤 설치하는 방법 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><ol><li>‘크롬 설치하기’ 버튼 → 열린 화면에서 <b>‘Chrome 다운로드’</b>를 누릅니다<img class=\"doc-img\" src=\"images/setup-chrome-1.jpg\" alt=\"크롬 다운로드 페이지에서 Chrome 다운로드 버튼 위치\" loading=\"lazy\" style=\"max-width:640px;margin:10px 0 6px;\"><p class=\"embed-note\" style=\"margin:0 0 14px\">빨간 네모 안의 파란 버튼을 누르세요</p></li><li>파일을 저장하는 창이 뜨면 이름은 그대로 두고 <b>‘저장’</b>을 누릅니다<img class=\"doc-img\" src=\"images/setup-chrome-2.jpg\" alt=\"ChromeSetup.exe 저장 창에서 저장 버튼 위치\" loading=\"lazy\" style=\"max-width:520px;margin:10px 0 6px;\"><p class=\"embed-note\" style=\"margin:0 0 14px\">이 창이 뜨지 않고 바로 다운로드되면 다음 단계로 넘어가세요</p></li><li>화면 오른쪽 위(또는 아래)에 뜨는 <b>다운로드 표시</b>에서 <b>ChromeSetup.exe</b>를 누릅니다<img class=\"doc-img\" src=\"images/setup-chrome-3.jpg\" alt=\"크롬 오른쪽 위 다운로드 아이콘과 ChromeSetup.exe 위치\" loading=\"lazy\" style=\"max-width:420px;margin:10px 0 6px;\"><p class=\"embed-note\" style=\"margin:0 0 14px\">오른쪽 위 <b>다운로드 아이콘(↓)</b>을 누르면 목록이 열려요. 안 보이면 파일 탐색기 → 다운로드 폴더에서 ChromeSetup을 더블클릭하세요</p></li><li>“이 앱이 디바이스를 변경할 수 있도록 허용하시겠어요?” 창이 뜨면 <b>‘예’</b></li><li>설치는 알아서 진행돼요. 잠시 기다리면 <b>크롬 창이 저절로</b> 열립니다</li><li>작업표시줄에 크롬이 없다면: 크롬이 열린 상태에서 아래 아이콘을 <b>마우스 오른쪽 클릭 → ‘작업 표시줄에 고정’</b></li></ol></div><div class=\"warn\" style=\"background:#F3FAF6;border-color:#CDEBDD;color:#245C48\">💡 <b>이미 크롬이 있는지 모르겠다면?</b> 윈도우 <b>시작 버튼</b>을 누르고 <b>chrome</b>을 입력해 보세요. ‘Google Chrome’이 나오면 설치할 필요가 없어요.</div></div><div class=\"step\"><div class=\"step-badge\">STEP 2</div><div class=\"step-title\">쓰시던 구글 개인계정에 로그인할 수 있는지 확인</div><p class=\"step-lead\">다음 단계에서 저장공간을 확인하려면 먼저 <b>쓰시던 개인계정으로 로그인</b>이 되어야 해요. 크롬에서 로그인이 되는지 확인해 주세요.</p><a class=\"link-btn\" href=\"https://docs.google.com/document/d/1_QaoP-NXLLwTEMxNYzS6BBeE23NgRc3zVpjamgeSRys/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\">🔑 기존 아이디·비밀번호 찾기</a><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">📷 찾는 방법 그림으로 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><img class=\"doc-img\" src=\"images/setup-account-find.jpg\" alt=\"구글 계정 아이디·비밀번호 찾는 방법 화면 안내\" loading=\"lazy\" style=\"max-width:760px;margin:10px 0 6px;\"></div><button class=\"mini-toggle\" style=\"margin-top:10px\" onclick=\"this.nextElementSibling.classList.toggle('show')\">📱 휴대전화 번호로 내 구글 계정(이메일) 찾기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>“이 번호로 만든 계정이 있었던 것 같은데…” 싶을 때, <b>구글 공식 방법</b>으로 찾을 수 있어요.</p><ol><li><b>이메일 찾기 페이지 열기</b> — 구글 로그인 화면의 아이디 입력칸 아래 <b>［이메일을 잊으셨나요?］</b>를 누르거나 아래 버튼을 누르세요.<br><a class=\"link-btn\" href=\"https://accounts.google.com/signin/v2/usernamerecovery\" target=\"_blank\" rel=\"noopener\">🔍 구글 이메일 찾기</a></li><li><b>휴대전화 번호 입력</b> — 계정에 연결했던 번호를 입력하고 <b>［다음］</b> <span style=\"color:#7D9288\">(국가 번호가 <b>+82</b>인지 확인)</span></li><li><b>인증 코드 입력</b> — 휴대전화 문자로 온 <b>6자리 코드</b>를 입력합니다.</li><li><b>이름 입력 → 계정 확인</b> — 계정에 등록했던 <b>성·이름</b>을 정확히 입력하면, 그 번호로 가입된 <b>구글 이메일 목록</b>이 나타나요.</li><li><b>비밀번호가 기억 안 나면</b> — 찾은 이메일로 로그인 화면에서 <b>［비밀번호 찾기］</b> → 휴대전화 인증 후 새 비밀번호를 설정하세요.<br><a class=\"link-btn\" href=\"https://accounts.google.com/signin/recovery\" target=\"_blank\" rel=\"noopener\">🔑 구글 비밀번호 찾기(계정 복구)</a></li></ol><p style=\"color:#7D9288\">💡 이름은 가입할 때 적은 그대로(성·이름 칸 구분)여야 찾아져요. 번호를 바꾼 뒤 계정에 새 번호를 등록하지 않았다면 이 방법으로는 찾기 어려워요.</p></div><div class=\"warn\">❌ <b>기관계정(goedu 등)</b>으로는 제미나이 등 일부 AI 실습이 막힐 수 있어요. 실습은 반드시 <b>개인계정</b>으로 진행합니다.</div></div><div class=\"step\"><div class=\"step-badge\">STEP 3</div><div class=\"step-title\">그 계정의 드라이브 저장공간 확인</div><div class=\"warn\">⚠️ <b>쓰시던 계정은 드라이브가 가득 찬 경우가 많아요.</b> 구글 포토에 휴대폰 사진이 자동 백업되면서 저장공간을 다 쓰면, 연수 중 실습이 <b>아예 되지 않습니다.</b></div><a class=\"link-btn\" href=\"https://drive.google.com/drive/u/0/quota\" target=\"_blank\" rel=\"noopener\">💾 내 저장공간 확인하기</a><div class=\"check-list\" style=\"margin:3em 0\"><div class=\"check-item\">✅ <b>여유가 넉넉하다면</b> — 대략 <b>5GB 이상</b> 남아 있으면 이 계정으로 실습하세요. STEP 4는 건너뛰세요.</div><div class=\"check-item\">🆕 <b>거의 다 찼다면</b> — STEP 4에서 <b>연수용 새 계정</b>을 하나 만들어 오세요. <b>사진은 지우지 않으셔도 됩니다.</b></div></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">드라이브가 꽉 차면 왜 실습이 안 되나요? · 사진 정리는?<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>휴대폰 사진이 구글 포토에 자동 백업되면서 저장공간(15GB)을 다 쓰고 계신 분이 많습니다. 저장공간이 없으면 연수에서 자료를 만드실 때 <b>에러</b>가 납니다. 사진을 지우실 필요 없이, <b>연수용 계정</b>을 하나 새로 만들어 오시면 됩니다.</p><p>💡 사진을 정리하고 싶으시다면 구글 포토에서만 지우고 휴대폰에는 남기는 방법이 있어요. 다만 <b>휴대폰 백업을 끈 상태</b>를 유지해야 하고, 백업을 다시 켜면 사진이 다시 올라가거나 휴대폰 사본이 지워질 수 있어요. 지운 사진은 휴지통에 30일간 남아 있어요. <b>연수 준비로 하실 필요는 없고</b>, 여유 있을 때 공식 안내를 보며 천천히 해 주세요.</p><a class=\"link-btn\" href=\"https://photos.google.com/storage\" target=\"_blank\" rel=\"noopener\">📸 구글 포토 저장용량 관리 — 사진 정리하기</a> <a class=\"link-btn\" href=\"https://support.google.com/photos/answer/6128858?co=GENIE.Platform%3Dandroid&oco=1\" target=\"_blank\" rel=\"noopener\">🔗 구글 포토 공식 안내: 사진 삭제하기</a></div></div><div class=\"step step-red\"><div class=\"step-badge\">STEP 4</div><div class=\"step-title\">저장공간이 부족한 분만 — 새 구글 계정 만들기</div><p class=\"step-lead\">STEP 3에서 <b>저장공간이 거의 다 찼던 분만</b> 해 주세요. 여유가 넉넉했다면 넘어가시면 됩니다.</p><div class=\"warn\">📅 <b>가입할 때 생년월일을 정확히</b> 입력해 주세요. 잘못 입력해 <b>미성년자로 등록되면 제미나이를 쓸 수 없고</b>, 되돌리려면 신분증 등으로 연령 확인을 해야 할 수 있어요.</div><a class=\"link-btn\" href=\"https://accounts.google.com/signup\" target=\"_blank\" rel=\"noopener\">✏️ 새로운 구글 계정 만들기</a><details class=\"cap-help signup-help\" style=\"margin-top:10px;\"><summary>📷 구글 계정 만들기 — 화면 따라 하기 (15단계)</summary><div class=\"cap-help-body\"><p style=\"margin:6px 0 10px\">위 버튼을 누르면 아래 화면이 차례대로 나옵니다. 눈에 보이는 대로만 따라오시면 돼요.</p><ol class=\"signup-ol\"><li><b>성·이름 입력</b> — 성은 <b>선택사항</b>이라 이름만 적어도 됩니다.<img class=\"doc-img\" src=\"images/signup-1.png\" alt=\"구글 계정 만들기 – 성과 이름 입력 화면\" loading=\"lazy\"></li><li><b>기본 정보</b> — 생년월일과 성별을 고릅니다. <b style=\"color:#C0392B\">생년월일은 꼭 정확하게!</b> 잘못 넣어 미성년자로 등록되면 제미나이를 쓸 수 없어요.<img class=\"doc-img\" src=\"images/signup-2.png\" alt=\"구글 계정 만들기 – 생년월일·성별 입력 화면\" loading=\"lazy\"></li><li><b>이메일 주소 만들기</b> — 구글이 <b>추천해 준 주소</b> 중 하나를 고르는 게 가장 편합니다.<img class=\"doc-img\" src=\"images/signup-3.png\" alt=\"구글 계정 만들기 – 추천 이메일 주소 선택 화면\" loading=\"lazy\"></li><li><b>직접 만들고 싶다면</b> — ［내 Gmail 주소 만들기］에 원하는 주소를 적습니다. 이미 있는 주소라고 나오면 <b>숫자를 바꿔 여러 번</b> 시도하면 됩니다.<img class=\"doc-img\" src=\"images/signup-4.png\" alt=\"구글 계정 만들기 – 직접 Gmail 주소 입력 화면\" loading=\"lazy\"></li><li><b>안전한 비밀번호 만들기</b> — <b>본인 이름 영어 + 숫자 + 기호</b> 조합이 쉬워요. (예: dldowls1234!) 아래 칸에 <b>똑같이 한 번 더</b> 입력합니다.<img class=\"doc-img\" src=\"images/signup-5.png\" alt=\"구글 계정 만들기 – 비밀번호 입력 화면\" loading=\"lazy\"></li><li><b>보안문자 입력</b> — 본인 <b>휴대전화 번호</b>를 넣고 ［다음］을 누릅니다.<img class=\"doc-img\" src=\"images/signup-6.png\" alt=\"구글 계정 만들기 – 휴대전화 번호 입력 화면\" loading=\"lazy\"></li><li><b>받은 코드 확인</b> — 문자로 온 <b>G- 뒤의 6자리 숫자</b>를 그대로 입력합니다.<img class=\"doc-img\" src=\"images/signup-7.png\" alt=\"구글 계정 만들기 – 인증 코드 입력 화면\" loading=\"lazy\"></li><li><b>복구 이메일 추가</b> — 기존에 쓰던 메일 주소를 적습니다. <b style=\"color:#C0392B\">건너뛰기도 가능합니다.</b><img class=\"doc-img\" src=\"images/signup-8.png\" alt=\"구글 계정 만들기 – 복구 이메일 추가 화면\" loading=\"lazy\"></li><li><b>복구 연락처 추가</b> — 앞에서 쓴 복구 이메일과 <b>같은 주소</b>를 써도 됩니다. <b style=\"color:#C0392B\">건너뛰기도 가능합니다.</b><img class=\"doc-img\" src=\"images/signup-9.png\" alt=\"구글 계정 만들기 – 복구 연락처 추가 화면\" loading=\"lazy\"></li><li><b>계정 정보 검토</b> — 만들어진 주소를 확인하고 ［다음］.<img class=\"doc-img\" src=\"images/signup-10.png\" alt=\"구글 계정 만들기 – 계정 정보 검토 화면\" loading=\"lazy\"></li><li><b>개인 정보 보호 및 약관</b> — 맨 아래 <b>체크 두 칸</b>을 누른 뒤 ［계정 만들기］를 누릅니다.<img class=\"doc-img\" src=\"images/signup-11.png\" alt=\"구글 계정 만들기 – 약관 동의 화면\" loading=\"lazy\"></li><li><b>완성!</b> — 계정 첫 화면입니다. 노란 박스의 ［복구 전화번호 추가］까지 해 두시면 비밀번호를 잊어도 안전해요.<img class=\"doc-img\" src=\"images/signup-12.png\" alt=\"구글 계정 만들기 – 계정 완성 후 첫 화면\" loading=\"lazy\"></li><li><b>(선택) 복구 옵션 더 채우기</b> — 앞 화면의 ［복구 전화번호 추가］를 누르면 <b>복구 옵션</b> 화면이 나옵니다. 복구 이메일 옆 <b>✏️</b>를 누르고 주소를 확인한 뒤 ［코드 전송］.<img class=\"doc-img\" src=\"images/signup-13.png\" alt=\"구글 계정 – 복구 옵션에서 복구 이메일 확인 창\" loading=\"lazy\"></li><li><b>코드 입력칸이 나타납니다</b> — 이메일로 받은 6자리 숫자를 여기에 넣으면 돼요. <b style=\"color:#C0392B\">건너뛰기도 가능합니다.</b><img class=\"doc-img\" src=\"images/signup-14.png\" alt=\"구글 계정 – 복구 이메일 인증 코드 입력창\" loading=\"lazy\"></li><li><b>Gmail에서 코드 확인</b> — 복구 이메일의 받은편지함에 온 「<b>복구 이메일 설정 코드</b>」 메일의 <b>6자리 숫자</b>를 그대로 옵겨 넣고 ［인증］을 누릅니다.<img class=\"doc-img\" src=\"images/signup-15.png\" alt=\"구글 계정 – Gmail에서 받은 복구 코드를 입력하기\" loading=\"lazy\"></li></ol><div class=\"warn\">📝 만드신 <b>아이디와 비밀번호는 꼭 종이에 적어</b> 연수 날 가져오세요.</div></div></details><p class=\"step-lead\" style=\"margin-top:10px\">만드는 데 <b>3~5분</b>이면 됩니다. <b>휴대폰 문자 인증</b>만 하시면 끝나요. 만드신 뒤에는 아이디와 비밀번호를 꼭 적어 두세요.</p><p class=\"setup-note\" style=\"margin-top:2.4em\">💡 계정이 두 개가 되면 연수 중 ‘크롬 프로필 분리’ 실습까지 해볼 수 있어요.</p><p class=\"setup-note\" style=\"margin-bottom:2.6em\">📱 한 전화번호로 인증할 수 있는 계정 수는 제한이 있어요. 막히면 아래 STEP 5 임시계정을 쓰세요.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 5</div><div class=\"step-title\">계정 준비가 어려운 분만 — 오늘만 쓰는 임시 구글계정</div><p class=\"step-lead\">위 방법으로도 계정 준비가 어려우시면, 아래 시트에서 오늘만 사용하는 임시 계정을 받아 쓰세요.</p><a class=\"link-btn\" href=\"https://docs.google.com/spreadsheets/d/16Ejg7lC9iv8r4w_Ljrz6BFD9gmMAhJOgXHiwb7i1PH0/edit?usp=sharing\" target=\"_blank\" rel=\"noopener\">📄 임시 구글계정 시트 열기</a> <span class=\"click-here\">👈 여기를 클릭!</span><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">임시계정 사용 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p>※ 화면에서 바로 보이지 않으면 위 ‘시트 열기’ 버튼으로 열어 주세요. (이름 작성은 시트를 직접 열어야 가능합니다.)</p><ul><li>시트의 <b>C열</b>에 본인 이름(또는 닉네임)을 적습니다.</li><li>그 줄의 아이디·비밀번호로 로그인해 사용합니다.</li></ul><div class=\"warn\">⚠️ 이 계정은 <b>기관 계정</b>이라, AI 활용 시 개인계정과 달리 일부 기능이 막힐 수 있습니다. 가능하면 <b>개인 구글계정</b> 사용을 권장합니다.</div></div><iframe class=\"sheet-embed\" src=\"https://docs.google.com/spreadsheets/d/16Ejg7lC9iv8r4w_Ljrz6BFD9gmMAhJOgXHiwb7i1PH0/preview?gid=0\" loading=\"lazy\" title=\"임시 구글계정 시트\"></iframe><p class=\"embed-note\">👀 아래에서 계정을 바로 확인할 수 있어요. <b>이름 작성·로그인은 위 ‘시트 열기’ 버튼</b>으로 직접 열어야 가능합니다.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 6</div><div class=\"step-title\">실습에 쓸 계정으로 제미나이 접속해 보기</div><p class=\"step-lead\">로그인한 뒤 질문을 하나 보내서 <b>답이 오는지</b> 확인해 주세요. 특히 <b>새로 만든 계정</b>은 가끔 제미나이가 열리지 않는 경우가 있어요. 연수 당일이 아니라 <b>지금 미리</b> 확인해 주세요.</p><img class=\"doc-img\" src=\"images/setup-gemini.jpg\" alt=\"제미나이 첫 화면: 입력창에 Gemini에게 물어보기가 보이는 모습\" loading=\"lazy\" style=\"max-width:620px;margin:10px 0 6px;\"><div class=\"warn\" style=\"background:#F3FAF6;border-color:#CDEBDD;color:#245C48\">✅ <b>이 화면이 보이면 성공</b>이에요. 입력창에 “안녕”이라고 보내 보고 답이 오는지 확인해 주세요.</div><a class=\"link-btn\" href=\"https://gemini.google.com/\" target=\"_blank\" rel=\"noopener\">✨ 제미나이 접속해 보기</a><p class=\"step-lead\" style=\"margin-top:10px\">👉 새 계정에서 제미나이가 안 되나요? <b>기존 개인계정</b>으로 실습하시면 됩니다. 기존 계정도 저장공간이 부족하다면 <span class=\"kko-ph\">카카오톡 오픈채팅 (문의 채널 입력 예정)</span>으로 미리 문의해 주세요.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 7</div><div class=\"step-title\">아이디와 비밀번호를 꼭 가지고 오세요</div><div class=\"check-list\"><div class=\"check-item\">🔑 <b>기존 개인계정</b> ID · 비밀번호 <b>(필수)</b></div><div class=\"check-item\">🆕 <b>새 개인계정</b> ID · 비밀번호 (만드신 경우)</div></div><p class=\"step-lead\">※ 비밀번호는 <b>종이나 휴대폰 메모</b>에 적어 오세요. 이 페이지에는 입력하지 마세요.</p></div><div class=\"step\"><div class=\"step-badge\">STEP 8</div><div class=\"step-title\">🖥️ 노트북 점검 — 윈도우 11 (선택사항)</div><div class=\"check-list\"><div class=\"check-item\">✅ <b>윈도우 11</b>로 업데이트되어 있나요? <span class=\"game-hint\">(윈도우 10으로도 연수는 가능해요)</span></div></div><button class=\"mini-toggle\" onclick=\"this.nextElementSibling.classList.toggle('show')\">윈도우 11 업데이트 방법 자세히 보기<span class=\"mchev\">▾</span></button><div class=\"mini-body\"><p><b>① 내 윈도우 버전 확인</b> — <kbd>⊞Win</kbd>+<kbd>R</kbd> → <b>winver</b> 입력 → Enter. (또는 설정 → 시스템 → 정보)</p><img class=\"doc-img\" src=\"images/winver.png\" alt=\"winver 실행 화면 — Windows 11 버전 확인\" style=\"max-width:460px;margin:12px 0 8px;\"><p style=\"margin-top:2.4em\"><b>② 윈도우 11로 업데이트</b> (윈도우 10이라면)</p><ul><li><kbd>⊞Win</kbd>+<kbd>I</kbd>로 <b>설정</b> → <b>업데이트 및 보안 → Windows 업데이트</b></li><li style=\"list-style:none;margin:8px 0 2px -1.2em;\"><img class=\"doc-img\" src=\"images/winupdate.png\" alt=\"Windows 업데이트 화면\" style=\"max-width:660px;margin:6px 0 4px;\"></li><li><b>업데이트 확인</b> → “Windows 11로 업그레이드” 안내가 뜨면 <b>다운로드 및 설치</b></li><li>안내가 없으면 <b>Windows 11 설치 도우미</b> 이용 → <a href=\"https://www.microsoft.com/software-download/windows11\" target=\"_blank\" rel=\"noopener\">microsoft.com/software-download/windows11</a></li><li>업데이트는 시간이 걸리니 <b>전원 연결 + 넉넉한 시간</b>에 미리 진행하세요</li></ul><div class=\"warn\">⚠️ PC 사양(TPM 2.0 · 지원 CPU 등)이 안 되면 윈도우 11 업데이트가 <b>불가</b>할 수 있어요. 그런 경우 윈도우 10 그대로 오셔도 되지만, <b>연수 전에 미리 알려</b> 주세요.</div></div><div class=\"warn\">⚠️ <b>윈도우 11 업데이트는 연수 당일에 절대 하지 마세요!</b> 한 시간 이상 걸리는 경우가 많아, 당일에 시작하면 연수에 참여하실 수 없어요. <b>늦어도 전날까지</b> 마쳐 주세요.</div><div class=\"warn\">🔌 업데이트 중에는 반드시 <b>전원(충전기)</b>을 연결해 두세요. 도중에 꺼지면 윈도우가 손상될 수 있어요.</div></div><div class=\"step\" style=\"border-style:dashed\"><div class=\"step-title\">📎 준비물</div><div class=\"check-list\"><div class=\"check-item\">🏫 <b>순천대 산학협력관 오픈랩</b> — <b>개인 노트북</b>(충전기·마우스) · <b>휴대폰</b>(인증·구글 렌즈 실습용)</div></div><p class=\"step-lead\" style=\"margin-top:10px\">준비하시다 막히면 <a href=\"https://open.kakao.com/o/sM6RgUxi\" target=\"_blank\" rel=\"noopener\">💬 카카오톡 오픈채팅방</a>에서 바로 물어보세요.</p></div></div>", "warmup": "<h2 class=\"s-title\">🔥 워밍업 게임</h2><p class=\"s-sub\">본격 시작 전, 가볍게 손을 푸는 시간! 게임 카드를 <b>뒤집어</b> 단축키를 재미있게 익혀요.</p><div class=\"game-flip\"><div class=\"game-cover cov1\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 1</div><div class=\"cover-emoji\">📋</div><div class=\"cover-title\">복사 붙여넣기 · 레벨 1</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 1</span><span class=\"arcade-title\">복사 붙여넣기 · 레벨 1</span><span class=\"arcade-keys\"><kbd>Ctrl</kbd>+<kbd>C</kbd> · <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><p class=\"game-desc\" id=\"g1desc\">문장을 <b>드래그 → Ctrl+C</b>로 복사하고, 칸을 클릭해 <b>Ctrl+V</b>! <b>5문제</b> 완성 🏁</p><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g1mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g1mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g1dots\"></span><span class=\"stage-label\" id=\"g1p\">STAGE 1 / 5</span></div><div class=\"g1-target\" id=\"g1t\">복사할 문장이 여기에!</div><div class=\"box-label\" id=\"g1srcL\">📋 원본 — 여기서 전체 복사</div><textarea class=\"g1-src\" id=\"g1src\" spellcheck=\"false\" oninput=\"g1srcinput()\"></textarea><button class=\"game-start hidden\" id=\"g1s\" onclick=\"g1start()\">🚩 5단계 도전 시작!</button><div class=\"box-label\" id=\"g1iL\">📥 붙여넣기 칸 — 여기에 Ctrl+V</div><textarea class=\"game-input g1-paste\" id=\"g1i\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" onpaste=\"g1paste(event)\" rows=\"2\" spellcheck=\"false\"></textarea><div class=\"game-result\" id=\"g1r\"></div><div class=\"best\" id=\"g1b\"></div></div></div></div><div class=\"game-flip\"><div class=\"game-cover cov3\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 2</div><div class=\"cover-emoji\">🅰️</div><div class=\"cover-title\">복사 붙여넣기 · 레벨 2</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 2</span><span class=\"arcade-title\">복사 붙여넣기 · 레벨 2</span><span class=\"arcade-keys\"><kbd>Ctrl</kbd>+<kbd>A</kbd> · <kbd>Ctrl</kbd>+<kbd>C</kbd> · <kbd>Ctrl</kbd>+<kbd>V</kbd> · <kbd>Delete</kbd></span></div><p class=\"game-desc\" id=\"g3desc\">원본 전체를 <b>Ctrl+A</b>로 선택해 <b>복사·붙여넣기</b> 하거나, <b>Ctrl+A → Delete</b>로 싹 지우기! <b>5문제</b> 완성 🏁</p><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g3mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g3mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g3dots\"></span><span class=\"stage-label\" id=\"g3p\">STAGE 1 / 5</span></div><div class=\"g1-target\" id=\"g3t\">복사할 문장이 여기에!</div><div class=\"box-label\" id=\"g3srcL\">📋 원본 — 여기서 전체 복사</div><textarea class=\"g1-src\" id=\"g3src\" spellcheck=\"false\" oninput=\"g3srcinput()\"></textarea><button class=\"game-start hidden\" id=\"g3s\" onclick=\"g3start()\">🚩 5단계 도전 시작!</button><div class=\"box-label\" id=\"g3iL\">📥 붙여넣기 칸 — 여기에 Ctrl+V</div><textarea class=\"game-input g1-paste\" id=\"g3i\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" onpaste=\"g3paste(event)\" rows=\"2\" spellcheck=\"false\"></textarea><div class=\"game-result\" id=\"g3r\"></div><div class=\"best\" id=\"g3b\"></div></div></div></div><
