div class=\"game-flip\"><div class=\"game-cover cov2\" onclick=\"this.parentElement.classList.add('flipped')\"><div class=\"cover-badge\">GAME 3</div><div class=\"cover-emoji\">📸</div><div class=\"cover-title\">화면 캡처</div><div class=\"cover-hint\">👆 카드를 뒤집어 시작!</div></div><div class=\"game-content\"><div class=\"game arcade\"><div class=\"arcade-top\"><span class=\"arcade-badge\">GAME 3</span><span class=\"arcade-title\">화면 캡처</span><span class=\"arcade-keys\"><kbd>⊞Win</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd></span></div><p class=\"game-desc\">아래 <b>이모지</b>를 캡처해서 칸에 <b>Ctrl+V</b>! 이모지가 바뀌며 <b>5장</b> 도전 📸 <span class=\"game-hint\">캡처 키는 브라우저가 못 봐서, 붙여넣기까지 해야 성공!</span></p><div class=\"cap-how\"><div class=\"cap-way\"><span class=\"cap-tag rec\">방법 1 · 추천</span><span><kbd class=\"kred\">⊞Win</kbd>+<kbd class=\"kred\">Shift</kbd>+<kbd class=\"kred\">S</kbd><br>→ 원하는 부분 드래그<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag alt\">방법 2 · 키보드가 안 될 때</span><span>시작<br>→ <kbd class=\"kred\">캡처 도구</kbd><br>→ <b>+ 새 캡처</b><br>→ 드래그<br>→ <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag warn\">방법 3 · PrtSc</span><span><kbd class=\"kred\">PrtSc</kbd><br>→ 전체화면 캡처<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd><br><b style=\"color:#C0392B\">(윈도우10은 안 돼요)</b></span></div><details class=\"cap-help\"><summary>PrtSc가 안 될 때 — 눌러서 펼치기</summary><div class=\"cap-help-body\"><p><b>① 윈도우11(최신)</b> : PrtSc를 누르면 <b>캡처도구</b>가 먼저 떠요 → 뜬 화면에서 <b>영역을 드래그</b>해야 복사돼요. <span class=\"cap-sub\">(설정 → 접근성 → 키보드 → “화면 캡처 키로 캡처 도구 열기” 끄면 예전처럼 전체화면 즉시 복사)</span></p><p><b>② 노트북</b> : PrtSc가 그냥 안 되면 <b>Fn + PrtSc</b>. <b>Insert</b>와 한 키에 있으면 Fn이 꼭 필요해요.</p><p><b>③ 그래도 안 되면</b> : OneDrive가 PrtSc를 가로챈 거예요 → OneDrive 설정 → 백업 → <b>“스크린샷 저장” 끄기</b>.</p><p class=\"cap-final\">→ 제일 확실한 건 그냥 <b>Win + Shift + S</b>!</p></div></details></div><img class=\"doc-img gkeys\" src=\"images/capture-keys.png\" alt=\"캡처 단축키 — 윈도우+Shift+S vs PrtSc\" loading=\"lazy\"><div class=\"mode-row\"><button class=\"mode-btn active\" onclick=\"g2mode(this,'practice')\">😌 연습</button><button class=\"mode-btn\" onclick=\"g2mode(this,'challenge')\">⏱️ 도전</button></div><div class=\"stage-row\"><span class=\"dots\" id=\"g2dots\"></span><span class=\"stage-label\" id=\"g2p\">STAGE 1 / 5</span></div><div class=\"cap-card cap-emoji-only\"><div class=\"cap-emoji\" id=\"g2emoji\">🌏</div></div><button class=\"game-start hidden\" id=\"g2s\" onclick=\"g2start()\">🚩 5장 도전 시작!</button><div class=\"paste-zone\" id=\"g2z\" contenteditable=\"true\" onpaste=\"g2paste(event)\">여기 클릭 → 캡처 이미지 Ctrl+V</div><div class=\"game-result\" id=\"g2r\"></div><div class=\"best\" id=\"g2b\"></div></div></div></div>", "c1": "<div class=\"c1x\"><h2 class=\"s-title\">오늘부터 나도 디지털 에이스</h2><p class=\"s-sub\">크롬·구글 꿀팁과 확장 프로그램 활용법</p><div class=\"block open\"><div class=\"block-body\"><ul class=\"block-ul\"><li class=\"item-detail coll coll-red\"><div class=\"item-label item-toggle\" style=\"color:#C0392B!important\" onclick=\"toggleItem(this)\">⓪ ⚙️ 시작 전 필수 — 크롬 최신으로<span class=\"hard-badge\">필수</span><span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"hard-note\"><b>🔴 이것부터 하고 시작합니다.</b> <b>「✨ 크롬 속 제미나이」</b> 기능은 <b>최신 크롬</b>에서만 나타나요.</div><div class=\"a3-subtt\">삼점 ⋮ → 도움말 → Chrome 정보 → 최신 버전 확인</div><img class=\"a3-img\" src=\"images/chrome-update-1.png\" alt=\"크롬 삼점 메뉴에서 도움말 → Chrome 정보로 들어가 업데이트 후 다시 시작을 누르는 화면\" loading=\"lazy\"><div class=\"warn\">🔴 <b>［다시 시작］까지 꼭 누르세요.</b></div><div style=\"height:2.6em\"></div><div class=\"a3-subtt\">삼점 ⋮ → 설정 → 기본 브라우저 → Chrome으로</div><img class=\"a3-img\" src=\"images/chrome-default-2.png\" alt=\"크롬 설정에서 기본 브라우저를 Chrome으로 지정한 화면\" loading=\"lazy\"><div class=\"warn\">🔴 <b>“Chrome이 기본 브라우저로 설정되어 있습니다”</b>가 보이면 됩니다.</div><div style=\"height:2.6em\"></div><div class=\"a3-subtt\">삼점 ⋮ → 설정 → 검색엔진 → Google로</div><img class=\"a3-img\" src=\"images/chrome-search-3a.png\" alt=\"크롬 설정 검색엔진 화면에서 변경 버튼을 누르는 모습\" loading=\"lazy\"><img class=\"a3-img\" src=\"images/chrome-search-3b.png\" alt=\"검색엔진 목록에서 Google을 고르고 기본값으로 설정하는 모습\" loading=\"lazy\"><div class=\"warn\">🔴 <b>Google</b>을 고르고 <b>［기본값으로 설정］</b>까지 누르세요.</div><div class=\"a3-btns\" style=\"margin-top:14px\"><a class=\"link-btn\" style=\"background:#C0392B !important;border-color:#C0392B !important;color:#fff !important;font-size:16.5px\" href=\"https://www.google.com/chrome/\" target=\"_blank\" rel=\"noopener\">⬇️ 크롬 최신 버전 내려받기 &nbsp;→</a></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">① 로그인 제대로 하기 — 개인계정 · 기관계정 프로필 분리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>기본 중의 기본이지만 놓치기 쉬운 부분 — <b>보안</b>과 자료 관리에서 중요합니다</li><li><b>준비물: 개인계정과 기관계정 2개</b>를 미리 준비해 오세요</li><li>크롬 오른쪽 위 <b>프로필 아이콘</b> → <b>‘크롬(Chrome) 프로필 추가’</b>로 계정별 프로필 만들기<img class=\"doc-img\" src=\"images/login-profile-add.png\" alt=\"크롬 프로필 추가 → 새 Chrome 프로필 설정 화면\" loading=\"lazy\"></li><li style=\"margin-top:4.2em\"><b>⭐ 로그인할 때 “동기화 사용”을 꼭 켜세요</b> — 북마크·비밀번호·방문기록·확장 프로그램이 <b>구글 계정에 저장</b>돼요. 그래서 ① 어느 PC·기기에서든 <b>로그인만 하면 내 환경이 그대로 따라오고</b>, ② 실수로 지우거나 기기가 바뀌어도 <b>다시 로그인하면 복구</b>됩니다. <span style=\"color:#7D9288\">(로그인 직후 “동기화 사용” 안내가 뜨면 <b>［사용］</b> 클릭 · 이미 로그인돼 있으면 <b>프로필 아이콘 → 동기화 사용 켜기</b>)</span></li><li>계정별 <b>프로필 사진 변경 / 테마 색상</b>으로 구분 → 어느 계정인지 한눈에<img class=\"doc-img\" src=\"images/login-taskbar.png\" alt=\"작업표시줄의 개인계정·기관계정 프로필 두 개\" loading=\"lazy\"><a class=\"link-btn faces-btn\" href=\"https://faces.notion.com/\" target=\"_blank\" rel=\"noopener\">🙂 프로필 사진 만들기 (Notion Faces)</a><details class=\"cap-help\" style=\"margin-top:10px;\"><summary>📷 Notion Faces 사용법 보기 — 얼굴 꾸미고 저장하기</summary><div class=\"cap-help-body\"><p style=\"margin:6px 0 4px\">왼쪽에서 <b>피부톤 · 눈 · 눈썹 · 안경 · 코 · 입 · 머리카락 · 액세서리</b>를 차례로 골라 꾸민 뒤, 오른쪽 위 <b>［저장］</b>을 누르면 이미지로 내려받아져요. <span style=\"color:#7D9288\">(🔀 버튼을 누르면 무작위로 바꿔 줘요)</span></p><img class=\"doc-img\" src=\"images/notion-faces.png\" alt=\"Notion Faces 화면 — 왼쪽 메뉴에서 얼굴 부위를 고르고 오른쪽 위 저장 버튼 누르기\" loading=\"lazy\" style=\"max-width:760px;margin:6px 0 4px;\"><p style=\"margin:4px 0 0;color:#7D9288\">💡 저장한 이미지는 크롬 프로필 사진·구글 계정 사진으로 올리면, 개인·기관 계정을 한눈에 구분할 수 있어요.</p></div></details></li><li style=\"margin-top:4.2em\">계정별 <b>바탕화면 바로가기</b> 만들기<img class=\"doc-img\" src=\"images/login-shortcut.png\" alt=\"프로필 맞춤설정 · 아바타 선택 · 바탕화면 바로가기 만들기 화면\" loading=\"lazy\"></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">② 초간단 즐겨찾기 + 파비콘 만들기<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>미션</b>: 웹교안 · 제미나이 · 내가 자주 가는 사이트를 즐겨찾기 하고 <b>아이콘(파비콘)만</b> 3개 남기기</li><li>주소창 오른쪽 <b>별표(☆)</b>로 즐겨찾기 대신 <b>추파춥스(?)</b> 활용하기!</li><li>북마크에 <b>마우스 우클릭 → 수정 → 이름 지우기</b> → 아이콘(파비콘)만 남아 깔끔하고 빠르게 접속</li></ol><img class=\"doc-img\" src=\"images/bookmark-favicon.png\" alt=\"즐겨찾기 Before/After — 이름을 지우고 파비콘만 남긴 북마크\" loading=\"lazy\"><div style=\"height:2.6em\"></div><div class=\"goldbox\"><details class=\"petog\"><summary class=\"a3-blocktt petog-sum\">🔎 즐겨찾기바가 안 보이면 — 네 가지 방법<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><ol class=\"steps\"><li><b>주소창에 붙여넣기 (가장 확실)</b> — 아래 주소를 주소창에 넣고 Enter → <b>［북마크바 표시］</b> 켜기<br><div class=\"prompt-card\" style=\"margin:10px 0 8px\"><span class=\"prompt-num\">🔗</span><span class=\"prompt-text\">chrome://settings/appearance</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><span style=\"color:#7D9288\">단축키도 메뉴 찾기도 필요 없어요.</span></li><li><b>새 탭 열어보기</b> — <kbd>Ctrl</kbd>+<kbd>T</kbd>. 크롬은 <b>새 탭 화면에서는 즐겨찾기바를 자동으로 보여줍니다.</b> 거기서 <b>우클릭 → ［북마크바 표시］</b>를 켜면 모든 화면에서 보여요</li><li><b>메뉴로</b> — 오른쪽 위 <b>⋮ → 북마크 및 목록 → ［북마크바 표시］</b><img class=\"doc-img\" src=\"images/bookmarkbar-menu.png\" alt=\"크롬 오른쪽 위 삼점 메뉴에서 북마크 및 목록을 거쳐 북마크바 표시를 누르는 화면\" loading=\"lazy\" style=\"max-width:720px;margin:10px 0 4px;\"><div style=\"color:#7D9288;font-size:14.5px\">▲ ① 오른쪽 위 <b>⋮</b> → ② <b>북마크 및 목록</b> → ③ <b>북마크바 표시</b> (빨간 네모 순서대로)</div></li><li><b>단축키</b> — <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd> <span style=\"color:#7D9288\">(갤럭시북에서는 안 될 수 있어요 — 아래 참고)</span></li></ol><div class=\"item-note\">💡 <b>\"안 보인다\"는 분의 절반은 그냥 일반 페이지에 계신 겁니다.</b> 새 탭부터 한번 열어보시게 하세요.</div><div style=\"height:2.6em\"></div><details class=\"tiptog\"><summary>⌨️ <b>Ctrl+Shift+B를 눌러도 안 될 때</b> — 삼성 갤럭시북이라면</summary><div class=\"tiptog-body\"><div class=\"item-lead\">갤럭시북에는 <b>삼성 앱이 이 단축키를 먼저 가져가는</b> 경우가 있어요. 눌러도 즐겨찾기바는 안 나오고 <b>엉뚱한 창이 뜨거나 아무 반응이 없다면</b> 이 경우입니다.</div><div class=\"a3-subtt\">✅ 급할 땐 이것만 — 단축키를 안 쓰면 됩니다</div><ol class=\"steps\"><li>주소창 <b>바로 아래 빈 곳</b>에서 <b>마우스 우클릭 → ［북마크바 표시］</b></li><li>또는 오른쪽 위 <b>⋮ → 북마크 및 목록 → ［북마크바 표시］</b></li></ol><div class=\"warn\">🔴 <b>이 방법은 어느 노트북에서든 됩니다.</b> 연수 중이라면 여기까지만 하고 넘어가세요. 아래는 <b>연수 끝나고</b> 천천히 하시면 됩니다.</div><div class=\"a3-subtt\">1단계 · 범인부터 확인 (빅스비 잠시 끄기)</div><ol class=\"steps\"><li style=\"color:#C0392B\">화면 <b>우측 하단 작업 표시줄</b>(시계 옆)에서 <b>∧ (숨겨진 아이콘 표시)</b> 화살표 클릭</li><li style=\"color:#C0392B\">파란색 <b>Bixby 아이콘</b>을 <b>마우스 오른쪽 버튼</b>으로 클릭 → <b>［종료］</b> 선택</li><li>크롬으로 돌아가 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>B</kbd>를 눌러 봅니다</li></ol><div class=\"item-note\">💡 <b>여기서 즐겨찾기바가 나왔다면 범인은 빅스비</b>입니다 → 2단계로 가세요.<br><b>그래도 안 되면 빅스비가 아닙니다.</b> 다른 삼성 앱일 수 있으니 붙들지 마시고 <b>위의 우클릭 방법</b>을 쓰세요.</div><div class=\"item-note\">💡 메뉴 이름이 <b>［종료］</b>가 아니라 <b>［끝내기］</b>로 보일 수도 있어요. 같은 뜻입니다.</div><div class=\"a3-subtt\">2단계 · 영구 해결 (시작 프로그램에서 제외)</div><ol class=\"steps\"><li><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Esc</kbd>를 눌러 <b>작업 관리자</b>를 엽니다</li><li>왼쪽 메뉴에서 <b>［시작 앱］</b> 탭을 클릭합니다 <span style=\"color:#7D9288\">(속도계 모양 아이콘)</span></li><li>목록에서 <b>Bixby</b>를 찾아 <b>우클릭 → ［사용 안 함］</b></li><li>PC를 <b>다시 시작</b>하면 그다음부터는 충돌이 없습니다</li></ol><div class=\"warn\">⚠️ <b>시작 앱에서 끄면 빅스비 음성 호출도 안 됩니다.</b> 빅스비를 쓰신다면 <b>1단계만</b> 하시고, 필요할 때마다 종료해 주세요.</div><div class=\"item-note\">💡 <b>업무용 PC라 설정이 잠겨 있다면</b> 맨 위의 <b>우클릭 방법</b>을 쓰세요. 결과는 똑같습니다.</div></div></details></div></details></div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">③ 즐겨찾기 폴더로 정리 (업무별로 묶기)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">매일 들어가는 곳은 정해져 있죠 — 그룹웨어, ERP·MES 같은 사내 시스템, 거래처 홈페이지. <b>즐겨찾기바에 업무별 폴더</b>를 만들어 두면 그 안에 다 들어갑니다. <b>한 번 만들면 계속</b> 쓰고, <b>로그인만 하면 다른 PC에서도</b> 따라옵니다.</div><div class=\"a3-subtt\">즐겨찾기바 빈 곳 우클릭 → 폴더 추가 → 이름 입력 → 저장</div><img class=\"a3-img\" src=\"images/bm-folder-1.png\" alt=\"즐겨찾기바에서 우클릭 후 폴더 추가를 눌러 예산 폴더를 만드는 화면\" loading=\"lazy\"><div class=\"warn\">🔴 저장 위치는 <b>［북마크바］</b>로 두세요. 그래야 화면 위에 바로 보입니다.</div><div style=\"height:1.3em\"></div><div class=\"item-lead\">이렇게 <b>즐겨찾기바에 폴더가 생깁니다.</b></div><img class=\"a3-img\" style=\"max-width:220px;margin-left:0\" src=\"images/bm-folder-2.png\" alt=\"즐겨찾기바에 업무별 폴더가 만들어진 모습 (예시)\" loading=\"lazy\"><div class=\"item-note\">▲ 이런 식으로 <b>업무별 폴더</b>를 나란히 만들어 두고, 그 안에 사이트를 넣으면 됩니다.</div><ol class=\"steps\"><li>같은 방법으로 내 업무에 맞는 폴더 <b>2~3개</b>를 만듭니다 <span style=\"color:#7D9288\">(예: 업무 · 복무·연수 · 자료)</span></li><li>자주 가는 사이트를 연 뒤 주소창 오른쪽 <b>★(별표)</b> 클릭 → <b>폴더를 골라</b> 저장</li><li>이미 있는 즐겨찾기는 <b>마우스로 끌어다</b> 폴더에 넣으면 됩니다</li><li>폴더를 누르면 <b>그 안의 사이트가 쭉</b> 펼쳐집니다</li></ol><div class=\"tip\"><b>➕ 이렇게 묶어 보세요</b><b>업무</b> — 그룹웨어 · ERP · MES · 거래처 홈페이지 · 내 직무에서 매일 쓰는 시스템<br><b>복무·연수</b> — 복무·취업규칙 자료 · 연수원 홈페이지 · 법제처<br><b>자료·AI</b> — 구글 드라이브 · 제미나이 · 오늘 연수 웹교안</div><div class=\"item-note\">💡 폴더 하나에 <b>10개 넘게</b> 들어가면 다시 찾기 어려워집니다. 많아지면 폴더 <b>안에 폴더</b>를 하나 더 만드세요.</div><div style=\"height:2.6em\"></div><details class=\"petog\"><summary class=\"a3-blocktt petog-sum\">📦 만든 즐겨찾기를 <b>다른 계정으로 옮기기</b> — 개인계정 ↔ 기관계정<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"dotbox\"><div class=\"item-lead\">즐겨찾기는 <b>계정마다 따로 놉니다.</b> ①에서 나눠 둔 <b>개인계정 프로필</b>과 <b>기관계정 프로필</b>은 서로 즐겨찾기가 안 보여요. <b>파일 하나로 통째로 옮기면</b> 됩니다.</div><div class=\"a3-subtt\">1단계 · 원래 계정에서 내보내기</div><ol class=\"steps\"><li>즐겨찾기가 있는 <b>그 프로필의 크롬</b>을 엽니다</li><li><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd> — <b>북마크 관리자</b>가 열립니다<br><span style=\"font-size:15px;color:#60736C\">(또는 ⋮ → 북마크 및 목록 → 북마크 관리자)</span></li><li>관리자 화면 <b>오른쪽 위 ⋮</b> → <b>［북마크 내보내기］</b></li><li><b>바탕화면</b>에 저장 — <b>bookmarks_2026….html</b> 파일이 생깁니다</li></ol><div class=\"item-note\">💡 이 HTML 파일 하나에 <b>폴더 구조까지 통째로</b> 들어 있어요. 메일로 보내거나 USB에 담아도 됩니다.</div><div class=\"a3-subtt\">2단계 · 받을 계정에서 가져오기</div><ol class=\"steps\"><li>오른쪽 위 <b>프로필 아이콘</b>을 눌러 <b>받을 계정의 프로필로 전환</b></li><li>다시 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>O</kbd> → <b>오른쪽 위 ⋮</b> → <b>［북마크 가져오기］</b></li><li>방금 저장한 <b>HTML 파일</b>을 고르면 끝</li></ol><div class=\"warn\">⚠️ <b>가져온 즐겨찾기는 「가져온 북마크」 폴더 안에 들어갑니다.</b> 즐겨찾기바에 바로 안 보인다고 당황하지 마세요 — 그 폴더를 열어 <b>마우스로 끌어다</b> 북마크바로 옮기시면 됩니다.</div><div class=\"item-note\">💡 <b>같은 계정</b>을 다른 PC에서 쓰는 거라면 이 과정이 필요 없어요. 그 PC 크롬에 <b>로그인만 하면</b> 즐겨찾기가 따라옵니다. 이건 <b>계정이 다를 때</b> 쓰는 방법이에요.</div><div class=\"item-note\">🧹 두 번 가져오면 <b>똑같은 게 두 벌</b>이 됩니다. 중복이 생기면 북마크 관리자에서 지워 주세요.</div></div></div></details></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">④ 한방에 큐알코드 만들기 (크롬 / 엣지 다 가능)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>아직도 네이버 큐알 쓰시나요? <b>한방에 큐알코드 만드는 2가지 방법</b></li><li><b>방법 ① 마우스 우클릭</b> — 페이지에서 우클릭 → ‘이 페이지의 QR 코드 만들기’ (크롬·엣지 기본 기능)</li><li><b>방법 ② 크롬 확장 프로그램</b> — QR Code Generator 설치 후 클릭 한 번<br><a class=\"link-btn\" href=\"https://chromewebstore.google.com/detail/qr-code-generator/afpbjjgbdimpioenaedcjgkaigggcdpp\" target=\"_blank\" rel=\"noopener\">🔳 QR Code Generator 설치</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤ 캡처, 이렇게 하세요<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"cap-how\"><div class=\"cap-way\"><span class=\"cap-tag rec\">방법 1 · 추천</span><span><kbd class=\"kred\">⊞Win</kbd>+<kbd class=\"kred\">Shift</kbd>+<kbd class=\"kred\">S</kbd><br>→ 원하는 부분 드래그<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag alt\">방법 2 · 키보드가 안 될 때</span><span>시작<br>→ <kbd class=\"kred\">캡처 도구</kbd><br>→ <b>+ 새 캡처</b><br>→ 드래그<br>→ <kbd>Ctrl</kbd>+<kbd>V</kbd></span></div><div class=\"cap-way\"><span class=\"cap-tag warn\">방법 3 · PrtSc</span><span><kbd class=\"kred\">PrtSc</kbd><br>→ 전체화면 캡처<br>→ 칸에 <kbd>Ctrl</kbd>+<kbd>V</kbd><br><b style=\"color:#C0392B\">(윈도우10은 안 돼요)</b></span></div></div><img class=\"doc-img\" src=\"images/capture-keys.png\" alt=\"캡처 단축키 — 윈도우+Shift+S vs PrtSc\" loading=\"lazy\" style=\"margin-top:14px;\"><ol class=\"steps\"><li>캡처 <b>도구로 텍스트 복사</b>가 되는 거 아세요? — 캡처한 이미지 속 글자를 바로 복사<div class=\"cap-practice-label\">📄 아래 안내문의 글자를 <b>캡처 도구</b>로 복사해 보세요!</div><img class=\"doc-img\" src=\"images/notice-sample.png\" alt=\"캡처 연습용 안내문\" loading=\"lazy\" style=\"max-width:720px;margin:8px 0 6px;\"><details class=\"cap-help\" style=\"margin-top:10px;\"><summary>📷 캡처 도구에서 “모든 텍스트 복사” 위치 보기</summary><div class=\"cap-help-body\"><img class=\"doc-img\" src=\"images/capture-text.png\" alt=\"캡처 도구 — 모든 텍스트 복사\" loading=\"lazy\" style=\"margin:6px 0 2px;\"><div class=\"cap-paste-label\">👇 복사한 텍스트를 여기에 붙여넣어 확인해 보세요</div><textarea class=\"cap-paste\" placeholder=\"여기 클릭 → Ctrl+V로 붙여넣기\" spellcheck=\"false\"></textarea></div></details></li><li>더 편한 방법? → 다음 항목 <b>구글 렌즈</b>로 이어집니다</li></ol><button class=\"warmup-link\" onclick=\"showTab('warmup')\">🔥 워밍업 게임에서 직접 연습하기 →</button><div style=\"height:2.4em\"></div><details class=\"cap-help\"><summary>PrtSc가 안 될 때 — 눌러서 펼치기</summary><div class=\"cap-help-body\"><p><b>① 윈도우11(최신)</b> : PrtSc를 누르면 <b>캡처도구</b>가 먼저 떠요 → 뜬 화면에서 <b>영역을 드래그</b>해야 복사돼요. <span class=\"cap-sub\">(설정 → 접근성 → 키보드 → “화면 캡처 키로 캡처 도구 열기” 끄면 예전처럼 전체화면 즉시 복사)</span></p><p><b>② 노트북</b> : PrtSc가 그냥 안 되면 <b>Fn + PrtSc</b>. <b>Insert</b>와 한 키에 있으면 Fn이 꼭 필요해요.</p><p><b>③ 그래도 안 되면</b> : OneDrive가 PrtSc를 가로챈 거예요 → OneDrive 설정 → 백업 → <b>“스크린샷 저장” 끄기</b>.</p><p class=\"cap-final\">→ 제일 확실한 건 그냥 <b>Win + Shift + S</b>!</p></div></details></div></li><li class=\"item-detail coll coll-red\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑤-1 (＋더 나아가기) 스크롤 캡처·편집이 편한 픽픽(PicPick)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">픽픽은 연수 중 <b>시간이 허락하면 설치해 실습</b>합니다.</div><ol class=\"steps\"><li>① <b>스크롤 캡처</b> — 긴 페이지를 한 장으로 쭉!</li><li>② <b>동영상 녹화</b> 가능</li><li>③ 캡처 이미지에 <b>모자이크 처리 · 번호 순서 자동 매기기</b> 등 다양한 편집 기능</li><li>설치 파일 내려받기 →<br><a class=\"link-btn\" href=\"https://picpick.app/ko/download/\" target=\"_blank\" rel=\"noopener\">🖼️ 픽픽(PicPick) 다운로드</a></li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑥ 구글 렌즈 — 화면 속 글자·이미지를 바로 활용 (엣지 X / 크롬 O)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"hook\">🔬 <b>생산·품질·설비 담당자께!</b> 부품 라벨·기기 모델명·원자재 표시 — <b>찍기만 하면</b> 뭔지 알려줘요.</div><div class=\"item-lead\">관련 내용(웹·이미지 등)을 <b>오른쪽 창</b>에서 바로 확인할 수 있어요.</div><div class=\"a3-subtt\">1. 텍스트 복사</div><p>화면 속 글자를 복사 → <b>doc.new</b>로 구글 독스를 열어 붙여넣어 잘 됐는지 확인</p><div class=\"a3-tip\">📄 <b>이 안내문의 글자를 캡처해서 복사해 보세요!</b></div><img class=\"a3-img\" src=\"images/lens-notice.png\" alt=\"실습용 가정통신문 — 교직원 회의 안내\" loading=\"lazy\"><div class=\"a3-btns\" style=\"margin:12px 0 4px\"><a class=\"link-btn\" href=\"https://docs.new\" target=\"_blank\" rel=\"noopener\">📝 새 구글 문서 열기 (doc.new) — 복사한 글 붙여넣기</a></div><div style=\"color:#7D9288;font-size:14.5px;margin-bottom:6px\">▲ 버튼을 누르면 새 탭에 빈 구글 문서가 열려요 → <kbd>Ctrl</kbd>+<kbd>V</kbd>로 붙여넣기</div><div class=\"a3-subtt\" style=\"margin-top:18px\">2. 이미지로 복사</div><p>복사한 이미지를 PPT·캔바 등 <b>어디든 붙여넣기</b>(캡처 불필요) → <b>slide.new</b>로 구글 슬라이드에서 확인</p><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://www.youtube.com/\" target=\"_blank\" rel=\"noopener\">▶ 유튜브 홈 열기</a></div><div class=\"a3-subtt\" style=\"margin-top:18px\">3. 번역</div><p>화면 속 외국어를 바로 번역</p><div class=\"a3-tip\">🌍 <b>이 외국어 간판을 캡처해서 번역해 보세요!</b></div><img class=\"a3-img\" src=\"images/lens-sign.png\" alt=\"실습용 외국어 간판 사진\" loading=\"lazy\"><div class=\"item-note\">안 읽히는 글자도 있어요. 그럴 땐 <b>결국 사람이 확인해야 한다</b>는 것도 함께 알아두세요.</div><div class=\"warn\" style=\"margin-top:18px\">💡 <b>구글 렌즈가 안 뜨면?</b> ① 크롬인지 확인(크롬만 됩니다, 엣지 X) · ② ⋮ → 도움말 → Chrome 정보 → 최신으로 업데이트 · ③ 그래도 안 되면 ⋮ → 설정 → 검색엔진을 ‘Google’로</div><div class=\"a3-btns\" style=\"margin-top:14px\"><a class=\"link-btn\" href=\"https://www.google.com/search?udm=2&amp;q=%EC%87%BC%ED%8C%8C\" target=\"_blank\" rel=\"noopener\">🔍 “쇼파” 이미지 검색 — 물품 구매 전 모양·사양 찾아보기</a></div><div class=\"a3-tip\" style=\"margin-top:14px\">📐 <b>이 수학 문제를 캡처해서 구글 렌즈·제미나이로 풀어보세요!</b><br><span style=\"font-size:13.5px;color:#7C8F86\">자녀가 가져온 문제도 이렇게 찍어서 풀이를 받아볼 수 있어요.</span></div><img class=\"a3-img\" src=\"images/lens-math.png\" alt=\"실습용 수학 문제 — 등차수열\" loading=\"lazy\"></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑦ 모바일 구글 렌즈<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"warn\" style=\"margin-top:0\">📱 <b>아래 화면은 갤럭시(삼성)폰 기준</b>이에요. <b>아이폰도 다 됩니다</b> — 들어가는 길만 조금 달라서, 맨 아래 <b>［🍎 아이폰에서는 이렇게］</b>에 따로 정리해 뒀어요.</div><ol class=\"steps\"><li>휴대폰 <b>구글 앱 · 크롬</b>에서 카메라/이미지로 글자·사물·번역을 바로 인식<details class=\"tiptog\" open><summary>📱 휴대폰에서 구글 렌즈 쓰는 법 보기</summary><div class=\"tiptog-body\"><img class=\"a3-img\" src=\"images/lens-mobile-1.png\" alt=\"휴대폰에서 구글 렌즈를 실행해 사진을 검색하고 AI 개요 결과를 보는 화면\" loading=\"lazy\"><div class=\"item-note\">▲ <b>카메라·사진에서 바로</b> — 구글 앱 검색창의 <b>렌즈 아이콘</b>을 누르고 찍거나 사진을 고르면, 그 자리에서 <b>AI 개요</b>로 무엇인지 알려줍니다.</div><div style=\"height:1.3em\"></div><img class=\"a3-img\" src=\"images/lens-mobile-2.png\" alt=\"앱 화면에서 하단 검색 버튼을 눌러 화면 속 이미지를 구글 렌즈로 검색하는 3단계\" loading=\"lazy\"><div class=\"item-note\">▲ <b>지금 보고 있는 화면 그대로</b> — 앱을 벗어나지 않고 하단 <b>검색(렌즈) 버튼</b>을 누르면 화면 속 사물을 바로 찾아줍니다. 캡처해서 옮길 필요가 없어요.</div></div></details></li><li><b>스마트폰으로 QR코드를 촬영해보자!</b><br>① <b>갤러리에서 이미지 꾹 눌러</b> 링크 들어가기<br>② <b>스마트폰에 저장된 QR 이미지</b>로 링크 들어가기<details class=\"tiptog\" open><summary>📷 QR 촬영해서 링크 여는 방법 보기</summary><div class=\"tiptog-body\"><img class=\"a3-img\" src=\"images/qr-scan.png\" alt=\"휴대폰 카메라로 QR을 찍고, 화면을 꾹 눌러 뜬 링크를 여는 3단계\" loading=\"lazy\"><div class=\"item-note\">▲ ① 카메라로 <b>QR을 찍고</b> → ② 화면을 <b>꾹 누르면</b> → ③ <b>［링크 열기］</b>가 떠요.</div></div></details></li><li>현장 사진 속 글자 추출, 실물 번역 등 밖에서도 그대로 활용</li></ol><div class=\"tip\"><b>➕ 현장에서 이렇게 씁니다</b>물품·기기 <b>라벨이나 부품 사진</b>을 찍어 무엇인지 찾기 · 외국어 <b>안내문·라벨 번역</b> · 종이 서류 속 글자를 찍어 <b>텍스트로 꺼내기</b></div><div style=\"height:2.6em\"></div><details class=\"petog\"><summary class=\"a3-blocktt petog-sum\">🍎 아이폰에서는 이렇게 — 구글 렌즈 쓰는 3가지 길<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"dotbox\"><div class=\"item-lead\">아이폰에는 <b>갤럭시의 “화면 그대로 검색”</b> 버튼이 없어요. 대신 <b>구글 앱</b>과 <b>크롬 앱</b>으로 똑같이 할 수 있습니다. <b>앱스토어에서 「Google」과 「Chrome」을 먼저 설치</b>해 두세요.</div><div class=\"a3-subtt\">① 카메라로 바로 — 가장 많이 씁니다</div><ol class=\"steps\"><li><b>Google 앱</b>을 엽니다</li><li>검색창 오른쪽 <b>렌즈 아이콘(📷)</b>을 누릅니다</li><li>비추고 <b>촬영</b> → 글자·사물·번역 결과가 바로 나옵니다</li></ol><div class=\"item-note\">💡 <b>홈 화면에 Google 위젯</b>을 올려 두면 앱을 열 필요 없이 위젯의 렌즈 아이콘을 바로 누를 수 있어요.</div><img class=\"a3-img\" src=\"images/iphone-lens-1.png\" alt=\"아이폰 구글 앱에서 검색창의 렌즈 아이콘을 눌러 카메라로 바로 검색하는 화면\" loading=\"lazy\"><div class=\"a3-subtt\">② 사진첩에 있는 사진으로</div><ol class=\"steps\"><li>같은 <b>렌즈 아이콘</b>을 누릅니다</li><li>화면 아래 <b>사진 선택 도구</b>를 눌러 사진첩에서 고릅니다</li><li>안내문·서류를 찍어 둔 사진에서 <b>글자만 뽑아</b> 쓸 수 있어요</li></ol><div class=\"item-note\">💡 <b>화면을 캡처해서 쓰면 “화면 검색”이 됩니다.</b> 아이폰은 <b>전원 버튼 + 볼륨 위</b>를 동시에 눌러 캡처 → 그 사진을 위 방법으로 불러오면 돼요.</div><img class=\"a3-img\" src=\"images/iphone-lens-2.png\" alt=\"아이폰 구글 렌즈에서 스크린샷을 골라 화면 속 이미지를 검색하고 AI 개요 결과를 보는 화면\" loading=\"lazy\"><div class=\"a3-subtt\">③ 웹에서 본 이미지 바로</div><div class=\"a3-tip\"><b>크롬 앱</b>으로 웹을 보다가 이미지를 <b>꾹 길게 누르면</b> <b>［Google로 이미지 검색］</b>이 뜹니다. 캡처할 필요 없이 그 자리에서 검색돼요.</div><div class=\"warn\">⚠️ <b>아이폰 기본 브라우저(사파리)에서는 안 됩니다.</b> 구글 렌즈는 <b>Google 앱</b>이나 <b>크롬 앱</b> 안에서만 동작해요. 설치가 안 돼 있으면 먼저 받아 주세요.</div><div class=\"a3-btns\"><a class=\"link-btn\" href=\"https://apps.apple.com/app/id284815942\" target=\"_blank\" rel=\"noopener\">🍎 Google 앱 설치</a> <a class=\"link-btn\" href=\"https://apps.apple.com/app/id535886823\" target=\"_blank\" rel=\"noopener\">🍎 Chrome 앱 설치</a></div></div></div></details></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">📱 제미나이 라이브 — 폰으로 실시간 대화·화면 공유<span class=\"ichev\">▾</span></div><div class=\"item-body\"><div class=\"item-lead\">제미나이 앱에서 <b>말로 실시간 대화</b>하고, <b>카메라를 켜서 눈앞의 물건·화면을 함께 보며</b> 물어볼 수 있어요. 타이핑 없이 대화하듯 쓰는 기능입니다.</div><ol class=\"steps\"><li><b>제미나이 앱</b>을 열고, 입력창 오른쪽 끝의 <b>라이브 아이콘(‖ 물결 모양)</b>을 누릅니다</li><li><b>“듣는 중…”</b> 상태에서 그냥 <b>말로 질문</b>하면 제미나이가 음성으로 답합니다</li><li>화면 아래 <b>카메라 버튼</b>을 켜면, 카메라로 비추는 <b>실물·서류·화면을 함께 보며</b> 대화할 수 있어요</li></ol><img class=\"a3-img\" src=\"images/gemini-live.png\" alt=\"제미나이 앱에서 라이브 아이콘을 눌러 음성으로 대화하고 카메라를 켜서 눈앞의 사물을 보며 질문하는 3단계 화면\" loading=\"lazy\"><div class=\"item-note\">💡 <b>이럴 때 좋아요</b> — 손이 바쁠 때 말로 묻기 · 복잡한 서류를 카메라로 비추며 “이거 무슨 서류야?” · 기기·오류 화면을 보여주며 “어떻게 해결해?”</div><div class=\"warn\">⚠️ 개인정보(이름·주민번호·연락처)가 담긴 화면·서류는 비추지 마세요.</div></div></li><li class=\"item-detail coll coll-green\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑧ 전체 글 가져오기 (복사 허용)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>구글 렌즈는 <b>일부 글만</b> 잡히고 <b>전체 글은 안 긁히는</b> 단점이 있어요</li><li><b>복사 허용(Allow Copy)</b> 확장 프로그램이면 복사가 막힌 사이트에서도 전체 글을 쏙 복사<br><a class=\"link-btn\" href=\"https://chromewebstore.google.com/detail/%EB%B3%B5%EC%82%AC-%ED%97%88%EC%9A%A9-+/ajhbdcgfhlhhmocddefknjjkejcfpbnj?hl=ko\" target=\"_blank\" rel=\"noopener\">📋 복사 허용 설치</a></li><li><b>여기서 직접 해보세요</b> — 아래 글을 열고 <b>먼저 그냥 복사</b>해 보세요. 그다음 확장을 켜고 <b>다시 복사</b>해 보면 차이가 바로 느껴집니다<br><a class=\"link-btn\" style=\"background:#03C75A !important;border-color:#03C75A !important;color:#fff !important\" href=\"https://blog.naver.com/ss2ppl/224397528114\" target=\"_blank\" rel=\"noopener\">📄 실습용 글 열기 — 네이버 블로그 &nbsp;→</a></li></ol><div class=\"item-note\">💡 <b>복사가 되는 글도 있고 안 되는 글도 있어요.</b> 막혀 있으면 <b>확장 아이콘을 눌러 켠 뒤</b> 새로고침하고 다시 시도하세요.</div><div class=\"warn\">⚠️ <b>가져온 글은 참고용입니다.</b> 남이 쓴 글을 그대로 옮겨 쓰면 안 되고, <b>출처를 밝히거나 내 문장으로 바꿔</b> 쓰셔야 합니다.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑨ 툴바 설정 (분할뷰 · 큐알코드 · 구글 렌즈 등)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>자주 쓰는 기능(분할뷰 · 큐알코드 · 구글 렌즈 등)을 <b>툴바에 꺼내두면</b> 클릭 한 번으로 사용</li><li>설정: 툴바 빈 곳 <b>우클릭 → 도구 모음 맞춤설정</b>(또는 ⋮ 메뉴)에서 원하는 도구 켜기</li></ol><img class=\"a3-img\" src=\"images/chrome-toolbar-menu.png\" alt=\"크롬 도구 모음 맞춤설정 패널 — 탐색·내 Chrome·도구 및 작업 항목을 켜고 끄는 화면\" loading=\"lazy\"><div class=\"item-note\">▲ <b>켜 두면 좋은 것 네 가지</b> — <b>분할 보기에서 열기</b>(자료 보며 문서 작성) · <b>Google 렌즈로 이 탭 검색</b> · <b>번역</b> · <b>QR 코드 만들기</b>. 나머지는 꺼 두면 툴바가 깔끔해요.</div><div class=\"tip\"><b>➕ 순서도 바꿀 수 있어요</b>맨 아래 안내처럼 <b>툴바의 버튼을 마우스로 끌어</b> 자주 쓰는 것을 왼쪽으로 옮겨 두세요.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑩ 탭 그룹 활용 (업무별 탭 정리)<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>여러 탭을 <b>업무별로 묶어</b> 색·이름으로 정리 — 예: ‘업무’ · ‘연수’ · ‘자료’ 그룹</li><li>만들기: 탭 <b>우클릭 → 새 그룹에 탭 추가</b> → 이름·색 지정</li><li>그룹을 <b>접으면</b> 화면이 깔끔, 다시 누르면 펼쳐져요 (저장 그룹으로 두면 창을 닫아도 유지)</li></ol></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑪ 시크릿 모드 vs 게스트 모드<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li><b>시크릿 모드 = ‘나’를 위한 보호</b> — 공용 PC에 내 흔적을 남기고 싶지 않을 때, 내가 만든 웹사이트 확인용</li><li><b>게스트 모드 = ‘남’을 위한 배려</b> — 내 컴퓨터를 동료·협력사 직원에게 잠시 빌려줄 때, 내 정보를 전혀 안 보여주고 빌려주기</li></ol><div class=\"a3-subtt\">🕵️ 시크릿 모드 — 내 흔적을 안 남긴다</div><img class=\"a3-img\" src=\"images/mode-secret.jpg\" alt=\"시크릿 모드를 투명 망토에 비유한 이미지\" loading=\"lazy\"><img class=\"a3-img\" src=\"images/secret-window-open.png\" alt=\"크롬 ⋮ 메뉴에서 새 시크릿 창을 여는 화면과 단축키 Ctrl+Shift+N\" loading=\"lazy\"><div class=\"item-note\">▲ <b>여는 법</b> — 오른쪽 위 <b>⋮</b> → <b>［새 시크릿 창］</b>. 단축키는 <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd> 입니다.</div><div class=\"tip\"><b>➕ 업무에서 이럴 때</b>공용 PC에서 잠깐 검색할 때 · 내가 만든 <b>공고문·홈페이지가 남들 눈에 어떻게 보이는지</b> 로그인 안 한 상태로 확인할 때 · 같은 사이트에 <b>계정 두 개</b>로 동시에 들어갈 때</div><div class=\"warn\">⚠️ <b>시크릿 모드가 “익명”은 아닙니다.</b> 내 PC에 기록이 안 남을 뿐, <b>기관 네트워크와 접속한 사이트에는 그대로 남습니다.</b></div><div style=\"height:2.6em\"></div><div class=\"a3-subtt\">👤 게스트 모드 — 남에게 잠깐 빌려줄 때</div><img class=\"a3-img\" src=\"images/mode-guest.jpg\" alt=\"게스트 모드를 임시 출입증에 비유한 이미지\" loading=\"lazy\"><img class=\"a3-img\" src=\"images/guest-profile-open.png\" alt=\"크롬 프로필 아이콘을 눌러 게스트 프로필 열기를 선택하는 화면\" loading=\"lazy\"><div class=\"item-note\">▲ <b>여는 법</b> — 툴바 오른쪽 <b>프로필 아이콘</b> 클릭 → <b>［게스트 프로필 열기］</b>. 내 <b>북마크·비밀번호·검색 기록이 전혀 안 보입니다.</b></div><div class=\"tip\"><b>➕ 둘의 차이 한 줄</b><b>시크릿</b>은 <b>내가</b> 쓰면서 흔적을 안 남기는 것, <b>게스트</b>는 <b>남이</b> 쓰게 하면서 내 것을 안 보여주는 것. 방문객·협력사 직원에게 잠깐 빌려줄 땐 <b>게스트</b>가 맞습니다.</div></div></li><li class=\"item-detail coll\"><div class=\"item-label item-toggle\" onclick=\"toggleItem(this)\">⑫ 내 계정 삭제 vs 원격으로 기기 관리<span class=\"ichev\">▾</span></div><div class=\"item-body\"><ol class=\"steps\"><li>상황: “내 컴퓨터가 아닌데 로그인하기가 꺼려져요” / “다른 기기 쓴 뒤 이 기기에서 제 아이디 완전 삭제해주세요”</li><li><b>내 계정 삭제</b>: 브라우저 프로필 → 크롬 프로필 관리 → <b>⋮(삼점)</b> → 삭제</li><li><b>원격으로 기기 관리</b>: 브라우저 프로필 → 구글 계정 관리 → 기기 → <b>로그아웃</b></li></ol><img class=\"a3-img\" src=\"images/profile-delete.png\" alt=\"크롬 프로필 아이콘 → Chrome 프로필 관리 → 프로필 카드의 삼점 메뉴 → 삭제 순서\" loading=\"lazy\"><div class=\"item-note\">▲ <b>순서</b> — 툴바 오른쪽 <b>프로필 아이콘</b> 클릭 → 맨 아래 <b>［Chrome 프로필 관리］</b> → 지울 프로필 카드의 <b>⋮</b> → <b>［삭제］</b></div><div class=\"warn\">⚠️ <b>삭제하면 그 프로필의 북마크·기록이 이 PC에서 사라집니다.</b> 동기화를 켜 두셨다면 계정에는 남아 있어 다시 로그인하면 돌아오지만, <b>동기화를 안 켰다면 복구되지 않습니다.</b> 지우기 전에 한 번 확인하세요.</div><div class=\"tip\"><b>➕ 남의 PC에서 썼다면 이게 더 확실합니다</b>그 PC에서 프로필을 지우는 것과 별개로, 내 폰이나 다른 기기에서 <b>구글 계정 관리 → 보안 → 내 기기</b>로 들어가 <b>원격 로그아웃</b>까지 해 두세요.</div><div style=\"height:2.6em\"></div><div class=\"a3-subtt\">📱 원격으로 기기 관리 — 화면으로 보기</div><img class=\"a3-img\" src=\"images/device-manage-1.png\" alt=\"구글 계정 화면에서 기기 버튼을 누르는 모습\" loading=\"lazy\"><div class=\"item-note\">① 프로필 → <b>［Google 계정 관리］</b> → 검색창 아래 <b>［기기］</b>를 누릅니다.</div><img class=\"a3-img\" src=\"images/device-manage-2.png\" alt=\"기기 상세 화면에서 로그아웃 버튼을 누르는 모습\" loading=\"lazy\"><div class=\"item-note\">② 로그인돼 있는 기기 목록이 나옵니다. 지울 기기를 고르고 <b>［로그아웃］</b>. 그 기기에서 <b>내 계정이 바로 빠집니다.</b></div><div class=\"tip\"><b>➕ 여기서 같이 보면 좋은 것</b>기기마다 <b>마지막 접속 위치·시각</b>이 표시됩니다. <b>모르는 기기</b>가 있으면 <b>［모르는 기기/세션인가요?］</b>를 눌러 바로 조치하세요. 연수 끝나고 <b>한 번은 훑어보시길</b> 권합니다.</div><div class=\"warn\">⚠️ <b>공용 PC를 쓰셨다면 이게 마지막 안전장치입니다.</b> 그 자리에서 로그아웃을 깜빡했어도, 내 폰에서 이 화면으로 들어가 끊어 버리면 됩니다.</div></div></li></ul></div></div></div>", "gift": "<h2 class=\"s-title\">🎁 작은 선물들</h2>\n<p class=\"s-sub\">연수에서 바로 써먹는 작은 선물들을 모았어요. 앞으로 자료가 더 추가됩니다.</p>\n\n<details class=\"giftsec\" open><summary class=\"giftsec-sum\"><span class=\"gs-t\">⌨️ 알아두면 편한 크롬 단축키</span><span class=\"gs-c\">10개</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><table class=\"gift-table\"><thead><tr><th>단축키</th><th>기능</th><th>활용 팁</th></tr></thead><tbody><tr><td><kbd>Ctrl + J</kbd></td><td>받은 파일 빨리 찾기</td><td><b>다운로드 목록</b>이 바로 열려요 — 폴더 뒤질 필요 없이 방금 받은 첨부파일·양식을 찾아요.</td></tr><tr><td><kbd>Ctrl + H</kbd></td><td>방문 기록(History) 열기</td><td>이전에 방문했던 사이트를 빠르게 찾을 때 유용해요.</td></tr><tr><td><kbd>Ctrl + Shift + T</kbd></td><td>닫은 탭 다시 열기</td><td>실수로 창을 닫았을 때 당황 금지! 여러 번 누르면 순차적으로 되살아나요.</td></tr><tr><td><kbd>Ctrl + Shift + B</kbd></td><td>북마크바 표시/숨기기</td><td>화면을 넓게 써야 할 때 숨기는 ‘화면 다이어트’ 필수 기능.</td></tr><tr><td><kbd>Ctrl + Shift + V</kbd></td><td>서식 없이 붙여넣기</td><td>웹사이트의 글꼴·색상을 무시하고 텍스트만 깔끔하게 붙여넣어요.</td></tr><tr><td><kbd>Shift + Enter</kbd></td><td>프롬프트 창 내 줄바꿈</td><td>전송하지 않고 다음 줄로 넘어갈 때 사용해요.</td></tr><tr><td><kbd>Ctrl + L</kbd></td><td>주소창으로 바로 이동</td><td>마우스 없이 커서를 주소창으로 옮겨 바로 입력해요.</td></tr><tr><td><kbd>Ctrl + F</kbd></td><td>페이지 안에서 찾기</td><td>긴 페이지에서 원하는 단어를 바로 찾아 이동해요.</td></tr><tr><td><kbd>Ctrl + P</kbd></td><td>웹페이지를 PDF로 저장·인쇄</td><td>인쇄창에서 대상을 <b>‘PDF로 저장’</b> 선택 → 보고서·증빙·신청완료 화면을 그대로 보관해요.</td></tr><tr><td><kbd>Ctrl + +</kbd> / <kbd>Ctrl + -</kbd></td><td>글자 크게 / 작게</td><td>화면 글자가 작을 때 크기 조절 (Ctrl + 0 = 원래대로).</td></tr></tbody></table></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">🪟 윈도우 · 터치패드 꿀팁</span><span class=\"gs-c\">13개</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><p class=\"gem-intro\">크롬 밖에서도 쓰는 것들이에요. <b>딱 세 개만 익혀도</b> 하루가 달라집니다 — <b>Win+V</b>, <b>Win+←/→</b>, <b>세 손가락</b>.</p>\n<div class=\"gem-note\" style=\"margin:0 0 14px\"><b>⌨️ Win 키</b>는 키보드 왼쪽 아래 <b>창문 모양 ⊞</b> 키예요. (Ctrl과 Alt 사이)</div>\n<table class=\"gift-table\"><thead><tr><th>단축키</th><th>기능</th><th>이럴 때 씁니다</th></tr></thead><tbody>\n<tr><td><kbd>⊞ Win + V</kbd></td><td><b>클립보드 기록</b> — 복사한 것들이 쌓여요</td><td><b>★ 오늘의 최고 꿀팁.</b> 문서 여기저기서 복사할 때, 하나 복사하면 앞엣것이 날아가던 스트레스가 사라집니다. 여러 개 복사해 두고 <b>골라서</b> 붙여넣으세요. (처음 한 번 “사용 설정” 클릭)</td></tr>\n<tr><td><kbd>⊞ Win + ←</kbd> / <kbd>→</kbd></td><td><b>창을 화면 반쪽에</b> 붙이기</td><td>왼쪽에 그룹웨어, 오른쪽에 한글 문서 — <b>보면서 옮겨 적는</b> 일에 딱. 위/아래 키까지 쓰면 4분할도 됩니다.</td></tr>\n<tr><td><kbd>⊞ Win + .</kbd></td><td>이모지·특수문자 창</td><td>‘ㅇ + 한자’로 ○△□ 찾던 것보다 훨씬 빨라요. <b>※ ☎ ▶ ✓</b> 같은 기호도 여기서.</td></tr>\n<tr><td><kbd>⊞ Win + L</kbd></td><td>화면 잠금</td><td><b>자리 비울 때 3초.</b> 공용 공간에서 내 화면을 지키는 가장 확실한 습관.</td></tr>\n<tr><td><kbd>⊞ Win + Shift + S</kbd></td><td>화면 일부 캡처</td><td>크롬·구글 꿀팁에서 배운 그 캡처예요. <b>캡처 후 글자 복사</b>도 됩니다.</td></tr>\n<tr><td><kbd>⊞ Win + E</kbd></td><td>파일 탐색기 열기</td><td>바탕화면 아이콘 찾아 헤맬 필요 없이 바로.</td></tr>\n<tr><td><kbd>⊞ Win + D</kbd></td><td>바탕화면 보기 / 되돌리기</td><td>창이 열 개쯤 쌓였을 때 한 번에 정리. 다시 누르면 원래대로.</td></tr>\n<tr><td><kbd>F2</kbd></td><td>파일·폴더 <b>이름 바꾸기</b></td><td>우클릭 메뉴를 찾을 필요 없이 바로. <b>여러 개를 한꺼번에</b> 바꾸는 것도 됩니다 → 아래 <b>［F2로 파일 100개 한 번에］</b> 참고</td></tr>\n\n<tr><td><kbd>Alt + Tab</kbd></td><td>열린 창 사이 전환</td><td>꾹 누른 채 Tab을 여러 번 누르면 원하는 창까지 갈 수 있어요.</td></tr>\n</tbody></table>\n<div class=\"gem-note\" style=\"margin-top:16px\">💡 <b>Win + V를 처음 누르면</b> “클립보드 기록을 사용 설정하시겠습니까?” 창이 떠요. <b>［사용 설정］</b>을 한 번만 눌러 주시면 그다음부터 계속 쌓입니다. <b>⚠️ 주민등록번호·비밀번호를 복사했다면</b> 기록에 남으니, 공용 PC에서는 클립보드 창의 <b>［모두 지우기］</b>를 눌러 주세요.</div>\n<details class=\"petog f2box\"><summary class=\"a3-blocktt petog-sum\">🗂️ F2로 파일 100개 이름 한 번에 바꾸기 — 스캔 파일 정리할 때<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"hook\">🖼️ <b>현장 사진·스캔 서류 100장 이름 바꾸기</b>, 10초면 끝.</div><div class=\"dotbox\"><div class=\"item-lead\">복합기로 스캔하면 <b>SCAN0001.jpg · SCAN0002.jpg …</b> 처럼 나오죠. 하나씩 고치면 30분, 이 방법이면 <b>10초</b>입니다.</div><div class=\"a3-subtt\">순서</div><ol class=\"steps\"><li>파일 탐색기(<kbd>⊞ Win</kbd>+<kbd>E</kbd>)에서 그 폴더를 엽니다</li><li>바꿀 파일을 <b>모두 선택</b> — 전부라면 <kbd>Ctrl</kbd>+<kbd>A</kbd>, 골라서라면 <kbd>Ctrl</kbd>을 누른 채 클릭</li><li><kbd>F2</kbd>를 누릅니다 — <b>맨 위 파일 이름만</b> 편집 상태가 됩니다 (정상이에요)</li><li>원하는 이름을 치고 <kbd>Enter</kbd> — 예: <b>2026설비점검_현장사진</b></li></ol><div class=\"a3-subtt\">결과</div><table class=\"gift-table\"><thead><tr><th>바꾸기 전</th><th>바꾼 뒤</th></tr></thead><tbody><tr><td>SCAN0001.jpg</td><td><b>2026설비점검_현장사진.jpg</b></td></tr><tr><td>SCAN0002.jpg</td><td><b>2026설비점검_현장사진 (1).jpg</b></td></tr><tr><td>SCAN0003.jpg</td><td><b>2026설비점검_현장사진 (2).jpg</b></td></tr><tr><td>SCAN0004.jpg</td><td><b>2026설비점검_현장사진 (3).jpg</b></td></tr></tbody></table><div class=\"item-note\">💡 <b>번호는 화면에 보이는 순서대로</b> 붙습니다. 날짜순으로 번호를 매기고 싶다면 <b>먼저 ［수정한 날짜］로 정렬</b>해 두고 F2를 누르세요. 확장자(.jpg·.pdf)는 <b>자동으로 그대로</b> 유지됩니다.</div><div class=\"a3-subtt\">한 개씩 빠르게 바꾸고 싶다면</div><div class=\"a3-tip\">파일 하나를 고르고 <kbd>F2</kbd> → 이름 입력 → <kbd>Tab</kbd>을 누르면 <b>저장되면서 바로 다음 파일</b>의 이름 편집으로 넘어갑니다. 마우스를 한 번도 안 잡고 쭉 바꿀 수 있어요.</div><div class=\"warn\">⚠️ <b>잘못 바꿨다면 당황하지 마세요</b> — <kbd>Ctrl</kbd>+<kbd>Z</kbd>를 누르면 <b>바꾼 이름 전부가 한 번에</b> 원래대로 돌아갑니다. (탐색기를 닫기 전에만 됩니다)</div></div></div></details></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">📝 한글(HWP) 실무 꿀팁 — 찾아 바꾸기 · 표 안 깨지게 붙이기</span><span class=\"gs-c\">2개</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><div class=\"hook\">📝 <b>모든 직종 공통!</b> 안내문 속 <b>이름·날짜 30군데</b>, 한 번에 바꾸세요.</div><details class=\"tiptog\"><summary>💡 꿀팁 — 한글 ‘찾아 바꾸기’로 반복 작업 한 번에 (익명화·일괄수정)</summary><div class=\"tiptog-body\"><p style=\"margin:0 0 8px\">여러 곳에 있는 같은 단어(이름·연도·회사명 등)를 <b>한 번에</b> 바꾸거나, 문서를 <b>익명화</b>할 때 아주 유용해요.</p><ol class=\"steps\"><li>한글에서 문서 열기 → <kbd>Ctrl</kbd>+<kbd>F2</kbd> (또는 <kbd>Ctrl</kbd>+<kbd>H</kbd>) = <b>찾아 바꾸기</b></li><li><b>찾을 내용</b>에 바꿀 단어, <b>바꿀 내용</b>에 새 단어 입력 → <b>모두 바꾸기</b></li><li>지울 것(전화·주소 등)은 <b>바꿀 내용을 비워두고</b> 모두 바꾸기 → 한 번에 삭제</li><li><b>파일 → 다른 이름으로 저장 → 파일 형식 PDF</b> — 어디서나 열리는 PDF 완성!</li></ol><div class=\"item-note\">예: 안내문·명단·작업지시서처럼 이름·날짜만 바뀌는 문서를 한 번에 수정!</div></div></details><div style=\"height:2.6em\"></div><details class=\"tiptog\"><summary>📄 제미나이로 만든 표·안내문을 <b>한글로 가져오기</b> — 표가 안 깨지게! (HTML 문서 붙이기)</summary><div class=\"tiptog-body\"><p style=\"margin:0 0 8px\">제미나이로 만든 결과를 <b>구글독스로 보내고 → 복사해서 → 한글에 붙여넣을 때</b>, 표가 깨지지 않게 하는 요령이에요.</p><ol class=\"steps\"><li>제미나이 답변 아래 ⋮ → <b>Docs로 내보내기</b></li><li>구글독스에서 <b>전체 선택·복사</b>(<kbd>Ctrl</kbd>+<kbd>A</kbd> → <kbd>Ctrl</kbd>+<kbd>C</kbd>)</li><li>한글에 붙여넣기(<kbd>Ctrl</kbd>+<kbd>V</kbd>) → <b>「HTML 문서 붙이기」 창</b>이 뜨면 <b>「원본 형식 유지」 선택 → [확인]</b></li></ol><div class=\"item-note\">✅ <b>「원본 형식 유지」</b>로 붙여야 <b>표가 안 깨져요.</b> (텍스트 형식으로 붙이면 표가 사라져요)</div><img class=\"a3-img\" style=\"max-width:520px\" src=\"images/pm-18.png\" alt=\"HTML 문서 붙이기 창\"><div style=\"height:2.6em\"></div><div class=\"a3-subtt\" style=\"margin-top:16px\">🔧 이 창이 안 뜨는 분은 — 다시 물어보게 설정</div><p style=\"margin:0 0 6px;font-size:13.5px;color:#5C7671\">전에 “기본 값으로 설정”을 눌러 창이 더는 안 뜨는 경우, 아래처럼 되돌리면 붙여넣을 때 다시 물어봐요.</p><ol class=\"steps\"><li>한글 상단 <b>[도구] → [환경 설정]</b> (단축키 <kbd>Alt</kbd>+<kbd>F2</kbd>)</li><li>환경 설정 창에서 <b>[코드 형식]</b> 탭 선택</li><li><b>[HTML 문서 붙이기]</b> 항목의 설정을 <b>체크 해제</b> → 이제 붙여넣을 때 다시 물어봐요</li></ol></div></details></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">🖐️ 노트북 터치패드 — 손가락 세 개면 됩니다</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><p class=\"gem-intro\">마우스를 안 챙긴 날, 이거 하나면 버팁니다. <b>터치패드 위에 손가락 세 개</b>를 올리고 쓸어보세요.</p>\n<div class=\"five-grid\">\n <div class=\"five-card\"><span class=\"five-b\">↑</span><div class=\"five-t\">세 손가락 위로</div><div class=\"five-d\"><b>열린 창 전부 보기</b><br>창이 잔뜩 쌓였을 때 한눈에 펼쳐서 고릅니다. (Win+Tab과 같아요)</div></div>\n <div class=\"five-card\"><span class=\"five-b\">↓</span><div class=\"five-t\">세 손가락 아래로</div><div class=\"five-d\"><b>바탕화면 보기</b><br>다시 아래로 쓸면 원래 창으로 돌아옵니다.</div></div>\n <div class=\"five-card\"><span class=\"five-b\">↔</span><div class=\"five-t\">세 손가락 좌·우로</div><div class=\"five-d\"><b>창 바꾸기</b><br>Alt+Tab을 손가락으로. 한글 ↔ 그룹웨어 오갈 때 제일 빨라요.</div></div>\n <div class=\"five-card\"><span class=\"five-b\">👆</span><div class=\"five-t\">세 손가락 톡 (탭)</div><div class=\"five-d\"><b>검색창 열기</b><br>파일이든 프로그램이든 이름만 치면 바로 찾아줍니다.</div></div>\n <div class=\"five-card\"><span class=\"five-b\">4</span><div class=\"five-t\">네 손가락 좌·우로</div><div class=\"five-d\"><b>가상 데스크톱 전환</b><br>업무용 화면과 자료 화면을 통째로 나눠 씁니다.<br><b style=\"color:#C0392B\">먼저 바탕화면을 하나 더 만들어야</b> 넘어갈 데가 생겨요 → 아래 설명</div></div>\n <div class=\"five-card\"><span class=\"five-b\">2</span><div class=\"five-t\">두 손가락</div><div class=\"five-d\"><b>스크롤 · 확대/축소</b><br>위아래로 쓸면 스크롤, 오므리고 벌리면 확대·축소.</div></div>\n</div>\n<details class=\"petog\" style=\"margin-top:16px\"><summary class=\"a3-blocktt petog-sum\">🖥️ 네 손가락이 아무 반응이 없다면? — 가상 데스크톱 만들기·문제 해결<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"a3-tip\" style=\"margin-top:16px\"><b>🖥️ 네 손가락이 아무 반응이 없다면</b> — 고장이 아니라, <b>넘어갈 바탕화면이 아직 없어서</b>일 때가 대부분이에요. 가상 데스크톱은 <b>내가 직접 만들어야</b> 생깁니다.<ol class=\"steps\"><li><kbd>⊞ Win</kbd>+<kbd>Ctrl</kbd>+<kbd>D</kbd> — <b>새 바탕화면 만들기</b> (화면이 휙 넘어가면 성공)</li><li>이제 <b>네 손가락으로 좌·우</b>를 쓸어 보세요. 키보드로는 <kbd>⊞ Win</kbd>+<kbd>Ctrl</kbd>+<kbd>←</kbd>/<kbd>→</kbd></li><li>지금 몇 개인지 보려면 <kbd>⊞ Win</kbd>+<kbd>Tab</kbd> — 화면 위에 바탕화면 목록이 뜹니다</li><li>필요 없어지면 <kbd>⊞ Win</kbd>+<kbd>Ctrl</kbd>+<kbd>F4</kbd> — <b>그 바탕화면만 닫히고 창은 옆으로 옮겨져요</b> (프로그램은 안 꺼집니다)</li></ol></div><div class=\"gem-note\" style=\"margin-top:14px\">💡 <b>그래도 제스처가 안 되면</b> — <b>설정 → Bluetooth 및 장치 → 터치패드</b>에서 <b>［세 손가락 제스처］·［네 손가락 제스처］</b>가 켜져 있는지, 동작이 다른 기능으로 바뀌어 있지 않은지 확인하세요. 거기서 <b>내 마음대로 바꿀 수도</b> 있어요.</div><div class=\"warn\" style=\"margin-top:14px\">⚠️ <b>제스처는 ‘정밀 터치패드’에서만 됩니다.</b> 오래된 노트북이나 제조사 전용 드라이버를 쓰는 기종은 설정을 켜도 안 될 수 있어요. 그럴 땐 <b>키보드 단축키</b>(<kbd>⊞ Win</kbd>+<kbd>Ctrl</kbd>+<kbd>←</kbd>/<kbd>→</kbd>)를 쓰시면 <b>똑같이 됩니다.</b></div></div></details>\n\n<details class=\"petog f2box\"><summary class=\"a3-blocktt petog-sum\">🚫 터치패드가 아예 안 움직인다면 — 다시 켜는 법<span class=\"petog-chev\">▾</span></summary><div class=\"petog-body\"><div class=\"dotbox\"><div class=\"item-lead\">고장이 아니라 <b>꺼져 있는</b> 경우가 대부분이에요. 손바닥이 자꾸 닿아서 꺼 두셨다가 잊으신 것일 수도 있고요. <b>쉬운 것부터</b> 해보세요.</div><div class=\"a3-subtt\">① 키보드 한 번 — 가장 흔한 원인</div><div class=\"a3-tip\">키보드 맨 윗줄 <kbd>F1</kbd>~<kbd>F12</kbd> 중에 <b>네모에 사선이 그어진 터치패드 그림</b>이 있는 키를 찾으세요. 그 키를 누르거나, <kbd>Fn</kbd>을 함께 누르세요.<br><b>삼성 갤럭시북·LG 그램</b>은 대개 <kbd>Fn</kbd>+<kbd>F5</kbd>, 기종에 따라 F6·F7일 수도 있어요.</div><div class=\"item-note\">💡 껐다 켰다 하는 키라 <b>한 번 더 누르면 다시 꺼집니다.</b> 화면에 잠깐 표시가 뜨는 노트북도 있어요.</div><div class=\"a3-subtt\">② 설정에서 켜기</div><ol class=\"steps\"><li><kbd>⊞ Win</kbd>+<kbd>I</kbd>로 <b>설정</b> 열기</li><li><b>Bluetooth 및 장치 → 터치패드</b></li><li>맨 위 <b>［터치패드］ 스위치를 «켬»</b>으로</li></ol><div class=\"a3-subtt\">③ 마우스를 꽂으면 꺼지는 설정</div><div class=\"a3-tip\">마우스를 연결했을 때만 안 된다면 이 설정 때문이에요.<br>같은 <b>터치패드</b> 화면에서 <b>［터치패드］ 옆 화살표(∨)</b>를 펼쳐 <b>「마우스가 연결되어 있을 때 터치패드 켜 놓기」에 체크</b>하세요.</div><div class=\"warn\">⚠️ <b>마우스도 없어서 클릭을 못 하신다면</b> — 키보드만으로 갑니다.<br><kbd>⊞ Win</kbd>을 누르고 <b>터치패드</b>라고 친 뒤 <kbd>Enter</kbd> → <kbd>Tab</kbd>·<b>방향키</b>로 이동, <kbd>Space</kbd>로 스위치를 켭니다.</div><div class=\"item-note\">🔧 위 셋으로도 안 되면 <b>드라이버 문제</b>일 수 있어요. 연수 중에 붙들지 마시고 <b>마우스로 진행</b>하신 뒤 나중에 제조사 지원센터에서 확인하세요.</div></div></div></details></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">⚡ 구글 “.new” 마법 주소 — 주소창에 치면 바로 새 문서</span><span class=\"gs-c\">8개</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><p class=\"gem-intro\">파일을 만들려고 드라이브 → 새로 만들기 → … 를 거칠 필요가 없어요. <b>주소창에 아래를 치고 Enter</b>만 하면 그 자리에서 새 문서가 열립니다. 오늘 배운 <b>form.new</b>·<b>doc.new</b>가 바로 이거예요.</p><div class=\"newgrid\"><div class=\"newcard\"><span class=\"nc-emoji\">📄</span><span class=\"nc-addr\">doc.new</span><span class=\"nc-desc\">새 구글 <b>문서</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">📊</span><span class=\"nc-addr\">sheet.new</span><span class=\"nc-desc\">새 구글 <b>시트</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">🖼️</span><span class=\"nc-addr\">slide.new</span><span class=\"nc-desc\">새 구글 <b>슬라이드</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">📝</span><span class=\"nc-addr\">form.new</span><span class=\"nc-desc\">새 구글 <b>설문</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">🌐</span><span class=\"nc-addr\">site.new</span><span class=\"nc-desc\">새 구글 <b>사이트</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">🗒️</span><span class=\"nc-addr\">keep.new</span><span class=\"nc-desc\">새 <b>킵 메모</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">📅</span><span class=\"nc-addr\">cal.new</span><span class=\"nc-desc\">새 <b>캘린더 일정</b></span></div><div class=\"newcard\"><span class=\"nc-emoji\">🎥</span><span class=\"nc-addr\">meet.new =\"_blank\" rel=\"noopener\">🤖 안드로이드 — Brave 설치</a><a class=\"link-btn\" href=\"https://apps.apple.com/app/id1052879175\" target=\"_blank\" rel=\"noopener\">🍎 아이폰(iOS) — Brave 설치</a></div></div></details><details class=\"giftsec\"><summary class=\"giftsec-sum\"><span class=\"gs-t\">🗒️ 구글킵 — 열기 · 앱 설치 · 협력업체 연락처</span><span class=\"gs-c\">2가지</span><span class=\"gs-chev\">▾</span></summary><div class=\"giftsec-body\"><h4>① 구글킵 열기 · 휴대폰 앱 설치</h4><div class=\"item-lead\"><b>구글킵(Google Keep)</b>은 구글 계정에 붙어 있는 <b>메모장</b>이에요. 현장에서 휴대폰으로 적고, 사무실 PC에서 바로 이어 봅니다 — <b>같은 계정이면 자동으로 동기화</b>.</div><ol class=\"steps\"><li>PC는 주소창에 <kbd>keep.new</kbd> → 새 메모가 바로 열려요 <span class=\"game-hint\">(keep.google.com 이 전체 화면)</span></li><li>휴대폰은 <b>Keep 앱</b> 설치 → 같은 구글 계정으로 로그인</li><li>지메일·구글문서 <b>오른쪽 사이드 패널</b>에도 킵이 있어요 — 메일 보면서 메모</li></ol><a class=\"link-btn\" href=\"https://keep.google.com\" target=\"_blank\" rel=\"noopener\">🗒️ 구글킵 열기</a><div style=\"display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:22px 0 8px\"><div style=\"flex:1 1 220px;max-width:280px;text-align:center;border:2px solid #E5D6A8;border-radius:16px;background:#fff;padding:16px 14px 14px\"><div style=\"font-weight:800;font-size:18px;color:#1F3A33;margin-bottom:8px\">🤖 안드로이드</div><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAUgAAAFICAIAAAC9dvBkAAAHLklEQVR4nO3dQXIkKRAAwdXa/v/Lsy+oA2OkASH3c0+p1dNhHFLAz58/f/4BWv49/QaA/YQNQcKGIGFDkLAhSNgQJGwIEjYECRuChA1BwoYgYUOQsCFI2BAkbAj6b/Uf/Pz8TLyP7Vb3mX/9Xl/PWX39LtOf/+rvu/qcVdOfc/X7bMWGIGFDkLAhSNgQJGwIEjYECRuClufYX06dT746h9w1r55+/ivnvd82T971eb7yff5ixYYgYUOQsCFI2BAkbAgSNgQJG4K2zbG/7JrLndrnXJ1vfz1/+vf6svo5vL4ffvp9WrEhSNgQJGwIEjYECRuChA1Bwoag8Tn266bnlrvmxrvcNlefPh++yooNQcKGIGFDkLAhSNgQJGwIEjYE/bo59vT9z6/vH55+/W+bJ59ixYYgYUOQsCFI2BAkbAgSNgQJG4LG59jVueX0vujVn3vq/udX9mnv8sr32YoNQcKGIGFDkLAhSNgQJGwIEjYEbZtjn5rrrpq+p/q2e7BX3TaXvu3vBV5hxYYgYUOQsCFI2BAkbAgSNgQJG4KW59iv7Ee9zfQ926de/2V63/ipz/MVVmwIEjYECRuChA1BwoYgYUOQsCHoZ3WO9/r+4el9trs+z+nnT+8nn/bK57xqV0dWbAgSNgQJG4 ass=\"prompt-card pc-lab\"><span class=\"lab-badge\">👉 이걸 복사해 킵에 붙여넣으세요</span><span class=\"prompt-text\">📞 협력업체 연락처 (우리 회사)<br><br>[집진·환기] ○○엔지니어링 · 김 과장 · 010-0000-0001 · 2라인 집진기 A/S<br>[전기공사] ○○전기 · 박 소장 · 010-0000-0002 · 분전반·차단기·정전 긴급<br>[지게차·중장비] ○○중장비 · 이 대리 · 010-0000-0003 · 정기점검 3개월 주기<br>[컨베이어·기계보전] ○○기공 · 최 부장 · 010-0000-0004 · 야간 긴급출동 가능<br>[계측기 교정] ○○시험원 · 정 선임 · 010-0000-0005 · 교정성적서 발급<br>[산업폐기물] ○○환경 · 강 팀장 · 010-0000-0006 · 수거 요일 화·금<br>[소방·안전점검] ○○소방 · 오 소장 · 010-0000-0007 · 연 1회 정기점검<br>[원자재 납품] ○○메탈 · 윤 과장 · 010-0000-0008 · 발주 후 3일 입고<br><br>— 사내 —<br>당직실 · 000-0000-0000<br>안전보건 담당 · 000-0000-0000<br>＊번호는 예시입니다. 우리 회사 번호로 바꿔서 저장하세요.</span><button class=\"pcopy\" onclick=\"copyPrompt(this)\">복사</button></div><div class=\"tip\"><b>💡 같이 되는 것들</b>메모에 <b>주소</b>를 적으면 탭 → <b>지도 길찾기</b>, <b>링크</b>를 적으면 탭 → 바로 열려요. 업체 <b>명함을 사진으로 찍어</b> 같은 메모에 붙여 두면 <b>이미지 텍스트 가져오기</b>로 번호까지 글자로 뽑을 수 있어요.</div><div class=\"warn\">⚠️ <b>개인 휴대번호</b>는 업무에 필요한 범위에서만. 공유 메모(공동작업자)에 올릴 땐 담당자 동의를 받고, 퇴사·변경 시 바로 지워 주세요.</div></div></details><h3 class=\"blk gift-blk\">🛡️ 안전하게 쓰기 — 이것만은 꼭</h3><div class=\"safe-grid\"><div class=\"safe-card sc-r\"><b>🔴 개인정보 입력 금지</b><span>직원·고객 이름·주민번호·연락처, 계좌·카드번호, 사내 기밀·도면은 AI에 넣지 않기</span></div><div class=\"safe-card sc-o\"><b>🟠 팩트체크</b><span>AI는 그럴듯하게 틀려요 — 금액·법령·날짜는 사람이 반드시 확인</span></div><div class=\"safe-card sc-y\"><b>🟡 저작권·중립</b><span>생성물 저작권 유의 · 정치적 중립·차별표현 조심</span></div></div><div class=\"safe-one\">💡 <b>한 문장 원칙</b> — 시스템 처리·최종 판단은 <b>사람</b>이, 읽고·쓰고·정리·계산은 <b>AI</b>가.</div>"};

function showTab(tab){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===String(tab)));
 document.getElementById('panel').innerHTML=P[tab]||'';
 if(tab==='warmup'&&window.initWarmup)initWarmup();
 applyBiz();applyMat();
 try{window.scrollTo(0,0);}catch(e){}
}
var BIZ='';

function pickBiz(b){var v=b.dataset.v;BIZ=(BIZ===v)?'':v;applyBiz();}
function typeBiz(i){BIZ=i.value.trim();applyBiz();}
var MAT='합성수지 원료(PP·ABS 펠릿)';
function applyMat(){var pre=false;document.querySelectorAll('.matbtn').forEach(function(x){var on=x.dataset.v===MAT;if(on)pre=true;x.classList.toggle('on',on);});document.querySelectorAll('.matv').forEach(function(e){e.textContent=MAT||'[찾는 원부자재·부품명]';});var i=document.querySelector('.matin');if(i&&document.activeElement!==i){i.value=pre?'':MAT;}if(i)i.classList.toggle('on',!pre&&!!MAT);}
function pickMat(b){var v=b.dataset.v;MAT=(MAT===v)?'':v;applyMat();}
function typeMat(i){MAT=i.value.trim();applyMat();}
function toggleBlock(head){head.parentElement.classList.toggle('open');}
function openCase(n){if(n===4){showTab('m5');var ls=document.querySelectorAll('li.item-detail');for(var k=0;k<ls.length;k++){var lb=ls[k].querySelector('.item-label');if(lb&&lb.textContent.indexOf('맞춤사례 4')>-1){ls[k].classList.add('open');lb.scrollIntoView({behavior:'smooth',block:'start'});}}return;}var hs=document.querySelectorAll('.block-head');for(var i=0;i<hs.length;i++){if(hs[i].textContent.indexOf('맞춤사례 '+n)>-1){if(!hs[i].parentElement.classList.contains('open'))hs[i].parentElement.classList.add('open');hs[i].scrollIntoView({behavior:'smooth',block:'start'});return;}}}

function fallbackCopy(t,done){try{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}catch(e){}}
function copyPrompt(btn){
 const t=btn.parentElement.querySelector('.prompt-text').innerText;
 const done=()=>{btn.textContent='복사됨 ✓';btn.classList.add('done');setTimeout(()=>{btn.textContent='복사';btn.classList.remove('done');},1500);};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));}
 else fallbackCopy(t,done);
}
function openLb(img){var l=document.getElementById('lb');l.querySelector('img').src=img.src;l.querySelector('img').alt=img.alt;l.classList.add('on');}
function closeLb(){document.getElementById('lb').classList.remove('on');}
function dlStatic(e,a){var u=a.getAttribute('href');var n=decodeURIComponent(u.split('/').pop());e.preventDefault();fetch(u).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(bl){var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([bl],{type:'application/octet-stream'}));l.download=n;document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(l.href);l.remove();},1500);}).catch(function(){window.open(u,'_blank');});return false;}

var G1={level:1,mode:'practice',tasks:[],idx:0,t0:0,started:false,best:null};
var G2={mode:'practice',cards:[],idx:0,t0:0,started:false,best:null};
var CHEERS=['✅ 좋아요!','👏 나이스!','🔥 대단해요!','💪 한 개 남았어요!'];
function fmt(ms){return (ms/1000).toFixed(2)+'초';}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function setBest(id,v){var e=document.getElementById(id);if(e)e.textContent=(v!=null)?('🏆 내 최고 기록: '+fmt(v)):'';}
function dots(id,idx){var e=document.getElementById(id);if(!e)return;var h='';for(var i=0;i<5;i++){h+='<span class="dot'+(i<idx?' done':(i===idx?' cur':''))+'"></span>';}e.innerHTML=h;}
function initWarmup(){
 G1.level=1;G1.mode='practice';G1.started=false;G2.mode='practice';G2.started=false;
 g1setup();g1show();var r=document.getElementById('g1r');if(r){r.textContent='';r.className='game-result';}
 var s=document.getElementById('g1s');if(s)s.classList.add('hidden');setBest('g1b',G1.best);
 g2setup();g2show();var r2=document.getElementById('g2r');if(r2){r2.textContent='';r2.className='game-result';}
 var s2=document.getElementById('g2s');if(s2)s2.classList.add('hidden');setBest('g2b',G2.best);
 g3setup();g3show();var r3=document.getElementById('g3r');if(r3){r3.textContent='';r3.className='game-result';}
 var s3=document.getElementById('g3s');if(s3)s3.classList.add('hidden');setBest('g3b',G3.best);
}
/* --- 게임1: 복사·붙여넣기 (레벨1: 한 문장 / 레벨2: Ctrl+A 콤보) --- */
function g1setup(){
 if(G1.level===1){G1.tasks=shuffle(G1_POOL).slice(0,5).map(function(s){return {type:'cv',text:s};});}
 else{var cp=shuffle(G1_COPY),cl=shuffle(G1_CLEAR),t=[],ci=0,ki=0;for(var i=0;i<5;i++){if(i%2===0)t.push({type:'copyall',text:cp[ci++]});else t.push({type:'clearall',text:cl[ki++]});}G1.tasks=t;}
 G1.idx=0;
}
function g1fields(showSrc,srcVal,srcRO,showInp){
 var t=document.getElementById('g1t'),src=document.getElementById('g1src'),i=document.getElementById('g1i');
 var sL=document.getElementById('g1srcL'),iL=document.getElementById('g1iL');
 if(sL)sL.style.display=showSrc?'block':'none';
 if(src){src.style.display=showSrc?'block':'none';if(showSrc){src.value=srcVal;src.readOnly=!!srcRO;src.style.height='auto';src.style.height=(src.scrollHeight+6)+'px';}}
 if(iL)iL.style.display=showInp?'block':'none';
 if(i){i.style.display=showInp?'block':'none';if(showInp){i.value='';i.style.height='auto';i.style.height=(i.scrollHeight+4)+'px';}}
}
function g1show(){
 var task=G1.tasks[G1.idx],t=document.getElementById('g1t'),p=document.getElementById('g1p'),sL=document.getElementById('g1srcL');
 if(p)p.textContent='STAGE '+(G1.idx+1)+' / 5';dots('g1dots',G1.idx);
 if(task.type==='cv'){t.className='g1-target';t.textContent=task.text;g1fields(false,'',false,true);}
 else if(task.type==='copyall'){t.className='g1-target g1-inst';t.innerHTML='📋 <span class="stepnum">①</span> 원본 클릭 → <span class="stepnum">②</span> Ctrl+A <small>(전체선택)</small> → <span class="stepnum">③</span> Ctrl+C <small>(복사)</small> → <span class="stepnum">④</span> 아래 칸에 Ctrl+V <small>(붙여넣기)</small>';if(sL)sL.textContent='📋 원본 — 여기서 전체 복사';g1fields(true,task.text,true,true);}
 else{t.className='g1-target g1-inst';t.innerHTML='🧹 <span class="stepnum">①</span> 이 칸 클릭 → <span class="stepnum">②</span> Ctrl+A <small>(전체선택)</small> → <span class="stepnum">③</span> Delete <small>(전부 지우기)</small>';if(sL)sL.textContent='🧹 이 칸 — 전체 선택 후 삭제';g1fields(true,task.text,false,false);}
}
function g1focus(){var task=G1.tasks[G1.idx];var el=document.getElementById(task.type==='cv'?'g1i':'g1src');if(el)el.focus();}
function g1desc(){var d=document.getElementById('g1desc');if(!d)return;d.innerHTML=(G1.level===1)?'문장을 <b>드래그 → Ctrl+C</b>로 복사하고, 칸을 클릭해 <b>Ctrl+V</b>! <b>5문제</b> 완성 🏁':'원본 전체를 <b>Ctrl+A</b>로 선택해 <b>복사·붙여넣기</b>하거나, <b>Ctrl+A → Delete</b>로 싹 지우기! <b>5문제</b> 완성 🏁';}
function g1level(btn,l){
 G1.level=l;G1.started=false;G1.await=false;G1.done=false;g1nextbtn(false);
 btn.parentElement.querySelectorAll('.level-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');
 g1desc();g1setup();
 var s=document.getElementById('g1s'),r=document.getElementById('g1r');r.textContent='';r.className='game-result';
 if(G1.mode==='challenge'){s.classList.remove('hidden');g1idle();}else{s.classList.add('hidden');g1show();}
}
function g1idle(){var t=document.getElementById('g1t');t.className='g1-target';t.textContent='‘도전 시작’을 누르면 출발! 🏁';g1fields(false,'',false,false);document.getElementById('g1p').textContent='STAGE - / 5';dots('g1dots',0);}
function g1mode(btn,m){
 G1.mode=m;G1.started=false;G1.await=false;G1.done=false;g1nextbtn(false);
 btn.parentElement.querySelectorAll('.mode-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');
 var s=document.getElementById('g1s'),r=document.getElementById('g1r');r.textContent='';r.className='game-result';g1setup();
 if(m==='challenge'){s.classList.remove('hidden');g1idle();}
 else{s.classList.add('hidden');g1show();}
}
function g1start(){g1setup();G1.await=false;G1.done=false;g1nextbtn(false);G1.started=true;G1.t0=performance.now();g1show();var r=document.getElementById('g1r');r.textContent='';r.className='game-result';g1focus();}
function g1nextbtn(show,label){
 var b=document.getElementById('g1nx');
 if(show){ if(!b){var r=document.getElementById('g1r'); b=document.createElement('button'); b.id='g1nx'; b.className='game-next'; b.onclick=g1next; r.parentNode.insertBefore(b,r.nextSibling);} b.textContent=label||'다음 미션 ▶'; b.style.display='inline-block'; }
 else if(b){ b.style.display='none'; }
}
function g1win(){
 if(G1.await)return; G1.await=true;
 var r=document.getElementById('g1r');
 if(G1.idx<4){
   dots('g1dots',G1.idx+1);
   r.className='game-result ok big';
   r.textContent='🎉 STAGE '+(G1.idx+1)+'/5 성공! '+CHEERS[G1.idx%CHEERS.length];
   g1nextbtn(true,'다음 미션 ▶');
 } else {
   dots('g1dots',5);
   if(G1.mode==='challenge'&&G1.started){var dt=performance.now()-G1.t0;G1.started=false;r.className='game-result ok big';r.textContent='🏆 5단계 완주! 총 '+fmt(dt);if(G1.best==null||dt<G1.best){G1.best=dt;setBest('g1b',G1.best);}}
   else{r.className='game-result ok big';r.textContent='🎉 5단계 완주! 정말 잘했어요 🎈';}
   var t=document.getElementById('g1t');t.className='g1-target';t.textContent='‘다시 시작’으로 한 판 더! 🔁';
   g1fields(false,'',false,false);
   document.getElementById('g1p').textContent='🏁 완주!';
   G1.done=true;
   g1nextbtn(true,'🔁 다시 시작');
 }
}
function g1next(){
 G1.await=false; g1nextbtn(false);
 var r=document.getElementById('g1r');r.textContent='';r.className='game-result';
 if(G1.done){ G1.done=false;
   if(G1.mode==='challenge'){var s=document.getElementById('g1s');if(s)s.classList.remove('hidden');g1idle();}
   else{g1setup();g1show();g1focus();}
   return;
 }
 G1.idx++;
 g1show();g1focus();
}
function g1norm(s){return (s||'').replace(/\r\n?/g,'\n').replace(/[ \t]+$/gm,'').trim();}
function g1paste(e){
 var task=G1.tasks[G1.idx];
 if(task.type!=='cv'&&task.type!=='copyall')return;
 if(G1.mode==='challenge'&&!G1.started)return;
 if(G1.await)return;
 e.preventDefault();
 var raw=(e.clipboardData||window.clipboardData).getData('text');
 var inp=document.getElementById('g1i');
 if(inp){inp.value=raw;inp.style.height='auto';inp.style.height=(inp.scrollHeight+4)+'px';}   // 붙여넣은 문장을 칸에 실제로 보여주기 + 높이 확장
 var txt=g1norm(raw);
 var expected=g1norm(task.type==='copyall'?document.getElementById('g1src').value:task.text);
 var r=document.getElementById('g1r');
 if(txt===expected){g1win();}
 else{r.className='game-result bad';r.textContent=(task.type==='copyall')?'❌ 전체가 안 됐어요! Ctrl+A로 전체 선택했는지 확인해요.':'❌ 앗, 문장이 달라요! 다시 복사해볼까요?';}
}
function g1srcinput(){
 var task=G1.tasks[G1.idx];if(!task||task.type!=='clearall')return;
 if(G1.mode==='challenge'&&!G1.started)return;
 if(G1.await)return;
 if(document.getElementById('g1src').value.trim()===''){g1win();}
}

function g2mode(btn,m){
 G2.mode=m;G2.started=false;
 btn.parentElement.querySelectorAll('.mode-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');
 var s=document.getElementById('g2s'),r=document.getElementById('g2r');r.textContent='';r.className='game-result';g2setup();g2show();
 if(m==='challenge'){s.classList.remove('hidden');document.getElementById('g2p').textContent='STAGE - / 5';dots('g2dots',0);}

function g2paste(e){
 e.preventDefault();
 var items=(e.clipboardData||window.clipboardData).items,img=null;
 for(var k=0;k<items.length;k++){if(items[k].type.indexOf('image')===0){img=items[k].getAsFile();break;}}
 var r=document.getElementById('g2r');
 if(!img){r.className='game-result bad';r.textContent='❌ 이미지가 없어요! 먼저 Win+Shift+S 또는 PrtSc로 캡처하세요.';return;}
 if(G2.mode==='challenge'&&!G2.started)return;
