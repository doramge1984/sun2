<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;margin:0;padding:16px;background:#f5f6f8;color:#222}
h1{font-size:20px;margin:0 0 4px}
.sub{font-size:13px;color:#666;margin-bottom:10px}
.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;font-size:13px}
.bar a{background:#1a73e8;color:#fff;text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:bold}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:start}
.col{background:#e8eaed;border-radius:10px;padding:8px;min-height:80px}
.col h2{font-size:14px;margin:2px 4px 8px;display:flex;justify-content:space-between}
.col h2 span{background:#fff;border-radius:10px;padding:0 8px;font-size:12px}
.card{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.15);border-left:5px solid #9aa0a6;font-size:13px}
.card.late{border-left-color:#d93025}
.card.soon{border-left-color:#f9ab00}
.no{font-weight:bold;font-size:14px}
.kind{display:inline-block;background:#e8f0fe;color:#174ea6;border-radius:8px;padding:1px 8px;font-size:11px;margin-left:6px}
.ct{margin:4px 0;color:#333}
.meta{color:#666;font-size:12px}
.dd{display:inline-block;margin-top:4px;padding:1px 8px;border-radius:8px;font-size:12px;font-weight:bold;background:#f1f3f4;color:#555}
.late .dd{background:#fce8e6;color:#c5221f}
.soon .dd{background:#fef7e0;color:#b06000}
.done .dd{background:#e6f4ea;color:#137333}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>📋 접수·진행 현황판</h1>
<div class="sub" id="sum">불러오는 중…</div>
<div class="bar">
  <a id="formLink" href="#" target="_blank" style="display:none">+ 접수·상태 입력하기</a>
  <label><input type="checkbox" id="onlyAlert"> 지연·임박만 보기</label>
</div>
<div class="cols" id="cols"></div>

<script>
// 입력 폼 주소를 넣으면 '접수·상태 입력하기' 버튼이 나타납니다. (비워 두면 숨김)
var FORM_URL = '';
var SOON_DAYS = 2;      // 납기까지 이 일수 이하면 '임박'
var DATA = null;

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

if (FORM_URL) { var a = document.getElementById('formLink'); a.href = FORM_URL; a.style.display = 'inline-block'; }
document.getElementById('onlyAlert').onchange = draw;

google.script.run
  .withSuccessHandler(function(d){ DATA = d; draw(); })
  .withFailureHandler(function(e){ document.getElementById('sum').textContent = '불러오기 실패: ' + e.message; })
  .getBoard();

function level(x){
  if (x.status === '완료' || x.dday === null) return '';
  if (x.dday < 0) return 'late';
  if (x.dday <= SOON_DAYS) return 'soon';
  return '';
}
function ddText(x){
  if (x.dday === null) return '납기 미입력';
  if (x.status === '완료') return '납기 ' + esc(x.due);
  if (x.dday < 0) return '지연 ' + (-x.dday) + '일';
  if (x.dday === 0) return '오늘 납기';
  return 'D-' + x.dday;
}

function draw(){
  if (!DATA) return;
  var only = document.getElementById('onlyAlert').checked;
  var late = 0, soon = 0;
  DATA.items.forEach(function(x){ var l = level(x); if (l === 'late') late++; if (l === 'soon') soon++; });
  document.getElementById('sum').innerHTML = '전체 ' + DATA.items.length + '건 · <b style="color:#c5221f">지연 ' + late + '</b> · <b style="color:#b06000">임박 ' + soon + '</b>';
  var h = '';
  DATA.statuses.forEach(function(st){
    var list = DATA.items.filter(function(x){ return x.status === st && (!only || level(x)); });
    h += '<div class="col"><h2>' + esc(st) + '<span>' + list.length + '</span></h2>';
    list.forEach(function(x){
      var l = level(x);
      h += '<div class="card ' + l + (x.status === '완료' ? ' done' : '') + '"><div><span class="no">' + esc(x.no) + '</span><span class="kind">' + esc(x.kind) + '</span></div>'
        + '<div class="ct">' + esc(x.content) + '</div>'
        + '<div class="meta">담당 ' + esc(x.manager) + ' · 접수 ' + esc(x.received) + '</div>'
        + '<span class="dd">' + ddText(x) + '</span></div>';
    });
    h += '</div>';
  });
  var known = DATA.statuses;
  var etc = DATA.items.filter(function(x){ return known.indexOf(x.status) < 0; });
  if (etc.length) {
    h += '<div class="col"><h2>상태 확인 필요<span>' + etc.length + '</span></h2>';
    etc.forEach(function(x){ h += '<div class="card"><span class="no">' + esc(x.no) + '</span> · 상태: ' + esc(x.status) + '</div>'; });
    h += '</div>';
  }
  document.getElementById('cols').innerHTML = h;
}
</script>
</body>
</html>
